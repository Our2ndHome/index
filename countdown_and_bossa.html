<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
    }

    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }

    body.mode-panel {
      background-color: #0b0b0d;
      overflow-y: auto;
      padding: 10px;
      user-select: none;
    }

    /* 📺 OVERLAY */
    .countdown-widget {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1000;
    }

    .countdown-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ace600;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .sep-dot { color: #ace600; margin: 0 3px; }

    .goal-widget {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 1000;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .goal-label {
      font-size: 12px;
      color: #ffffff;
      display: block;
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }

    .amount {
      color: #ace600;
      font-size: 38px;
      font-weight: 900;
      display: block;
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95), 0 0 15px rgba(172, 230, 0, 0.4);
    }

    .goal-target {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 6px;
      letter-spacing: 1.2px;
      opacity: 0.95;
    }

    .alert-banner {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 10px 20px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 99999;
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.3s;
    }

    .donor-name {
      color: #ace600;
      display: block;
      font-size: 54px;
      font-weight: 900;
      margin-bottom: 4px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(172, 230, 0, 0.6);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
    }

    .alert-comment {
      color: #ffea00;
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      margin-top: 8px;
      text-transform: none;
      white-space: normal;
      max-width: 600px;
      line-height: 1.3;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    .show-alert {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }

    .overlay-version-tag {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9999;
    }

    /* 🎛️ DOCK (BLACK & WHITE) */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
    }

    .version-badge {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
    }

    .status-box {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #e4e4e7;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 12px;
      font-weight: 700;
      color: #a1a1aa;
      margin: 0 0 10px 2px;
    }
    .summary-text b { color: #ffffff; }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    input[type="text"], input[type="number"] {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    .btn-dark {
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
    }
    .btn-dark:hover { background: #24242a; }

    .manual-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .manual-row input[name="name"] { flex: 2; }
    .manual-row input[name="amount"] { flex: 1; }
    .manual-row button {
      flex: 1;
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-primary-action {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- 📺 OVERLAY -->
  <div id="overlayRoot">
    <div class="countdown-widget">
      <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
      <div class="countdown-timer" id="countdownTimer">0D • 00:00:00</div>
    </div>

    <div class="goal-widget">
      <span class="goal-label">TOTALT INSAMLAT</span>
      <span class="amount" id="totalDisplay">0 kr</span>
      <span class="goal-target">MÅL: 40 000 KR</span>
    </div>

    <div class="alert-banner" id="alertBanner">
      <span class="donor-name" id="donorName">JOHAN</span> 
      <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
      <div class="alert-comment" id="alertComment"></div>
    </div>

    <div class="overlay-version-tag">DUAL-SYNC v5.4</div>
  </div>

  <!-- 🎛️ DOCK -->
  <div id="panelRoot" class="dock-container">
    <div class="header-box">
      <span class="header-title">KONTROLLPANEL <span class="version-badge">v5.4</span></span>
      <button class="btn-dark" style="width:auto; margin:0; padding:4px 8px;" onclick="location.reload()">Ladda om</button>
    </div>

    <div class="status-box" id="dockStatusBox">Ansluter till bössan...</div>

    <div class="summary-text" id="dockSummaryText">
      <b>0</b> biljetter fördelade på <b>0</b> givare (Totalt: <b>0 kr</b>)
    </div>

    <div class="field-row">
      <span class="field-label">BÖSSA ID:</span>
      <input type="text" id="dockSlugInput" value="our2ndhome" style="width: 60%; text-align: right;">
    </div>

    <button class="btn-dark" onclick="triggerDirectFetch()">Hämta gåvor från bössan</button>

    <div class="field-row" style="margin-top: 6px;">
      <span class="field-label">SÄTT BELOPP:</span>
      <div style="display:flex; gap:4px; width:60%;">
        <input type="number" id="dockDirectTotalInput" placeholder="Belopp (kr)" style="width:100%;">
        <button class="btn-dark" style="width:auto; margin:0; padding:6px 10px;" onclick="dockSetTotal()">Sätt</button>
      </div>
    </div>

    <div class="manual-row" style="margin-top: 10px;">
      <input type="text" id="dockManualName" name="name" placeholder="Namn" value="Lisa">
      <input type="number" id="dockManualAmount" name="amount" placeholder="Kr" value="250">
      <button id="dockSubmitDonationBtn" onclick="dockSubmitManualDonation()">+ Lägg till</button>
    </div>

    <input type="text" id="dockManualComment" placeholder="Kommentar (valfri)..." value="Kämpa på!" style="width:100%; margin-bottom:8px;">

    <button class="btn-dark" id="dockAutoDriveBtn" onclick="dockToggleAutoDrive()">
      Växla till testläge (Auto-Drive: AV)
    </button>

    <button class="btn-dark" onclick="dockResetAll()">Nollställ allt till 0</button>

    <button class="btn-primary-action" onclick="dockTriggerSampleDonation('Lisa', 250, 'Kämpa på!')">
      Skicka testdonation (250 kr)
    </button>
  </div>

  <script>
    const bus = new BroadcastChannel('musikhjalpen_unified_bus');

    const STORAGE_KEY_TOTAL = "mh_overlay_total_amount";
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const STORAGE_KEY_SLUG = "mh_overlay_bossa_slug";
    const STORAGE_KEY_KNOWN_IDS = "mh_overlay_known_ids";

    function formatSEK(num) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(num)) + ' kr';
    }

    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel');

    let FUNDRAISER_SLUG = "our2ndhome";
    let currentTotal = 0;
    const donorTicketsMap = {};
    let knownDonationIds = new Set();
    let autoDriveEnabled = false;
    let autoDriveTimer = null;

    try {
      const savedSlug = localStorage.getItem(STORAGE_KEY_SLUG);
      if (savedSlug) FUNDRAISER_SLUG = savedSlug;

      const savedTotal = localStorage.getItem(STORAGE_KEY_TOTAL);
      if (savedTotal !== null && !isNaN(parseFloat(savedTotal))) {
        currentTotal = parseFloat(savedTotal);
      }

      const savedDonors = localStorage.getItem(STORAGE_KEY_DONORS);
      if (savedDonors) Object.assign(donorTicketsMap, JSON.parse(savedDonors));

      const savedIds = localStorage.getItem(STORAGE_KEY_KNOWN_IDS);
      if (savedIds) knownDonationIds = new Set(JSON.parse(savedIds));
    } catch(e) {}

    // ========================================================
    // 🧠 ADVANCED DUAL PARSER (Extracts Amount AND Donors)
    // ========================================================
    function parseMusikhjalpenPage(rawText, bossaSlug) {
      let amount = -1;
      let donations = [];

      if (!rawText || typeof rawText !== 'string') return { amount, donations };

      // 1. Extract the current total
      const topplistaMatch = rawText.match(/Our2ndHome[\s\S]{0,120}?insamlat\s*just\s*nu[:\s]*([0-9\s]+)\s*kr/i)
                          || rawText.match(/Our2ndHome[\s\S]{0,120}?([0-9\s]+)\s*kr\b/i)
                          || rawText.match(/insamlat\s*just\s*nu[:\s]*([0-9\s]+)\s*kr/i)
                          || rawText.match(/([0-9\s]+)\s*kr\b[\s\S]*?Mål/i);

      if (topplistaMatch && topplistaMatch[1]) {
        const val = parseInt(topplistaMatch[1].replace(/[^0-9]/g, ''), 10);
        if (!isNaN(val) && val > 0 && val !== 40000) amount = val;
      }

      // 2. Extract recent donors, amounts, and comments if present in JSON/HTML
      try {
        const jsonMatch = rawText.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/i);
        if (jsonMatch && jsonMatch[1]) {
          const json = JSON.parse(jsonMatch[1]);
          const rawDonations = json.props?.pageProps?.fundraiser?.donations || json.props?.pageProps?.donations || [];
          if (Array.isArray(rawDonations)) {
            donations = rawDonations.map(d => ({
              id: d.id || `${d.name}_${d.amount}_${d.createdAt}`,
              donor: d.name || "Anonym Givare",
              amount: parseInt(d.amount, 10) || 50,
              comment: d.comment || d.message || ""
            }));
          }
        }
      } catch(e) {}

      // Fallback text donor scraping
      if (donations.length === 0) {
        try {
          const donorMatches = rawText.matchAll(/"name"\s*:\s*"([^"]+)"[\s\S]*?"amount"\s*:\s*([0-9]+)/gi);
          for (const m of donorMatches) {
            donations.push({
              id: `${m[1]}_${m[2]}`,
              donor: m[1],
              amount: parseInt(m[2], 10),
              comment: ""
            });
          }
        } catch(e) {}
      }

      return { amount, donations };
    }

    // ========================================================
    // 🔄 FETCH CYCLE: Queries both Topplista AND Individual Bössa
    // ========================================================
    async function executeBossaFetch() {
      const slug = (FUNDRAISER_SLUG || "our2ndhome").trim();
      const urls = [
        `https://bossan.musikhjalpen.se/${slug.toLowerCase()}/`,
        `https://bossan.musikhjalpen.se/topplista`,
        `https://bossan.musikhjalpen.se/`
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) continue;

          const text = await res.text();
          const result = parseMusikhjalpenPage(text, slug);

          if (result.amount > 0) {
            const timeStr = new Date().toLocaleTimeString('sv-SE');
            handleNewBossaData(result.amount, result.donations, `Ansluten till bössan (${formatSEK(result.amount)}) • ${timeStr}`);
            return true;
          }
        } catch(e) {}
      }

      const timeStr = new Date().toLocaleTimeString('sv-SE');
      updateStatusDisplay(`Söker bössan (${formatSEK(currentTotal)}) • ${timeStr}`);
      return false;
    }

    function handleNewBossaData(newAmount, newDonations, statusText) {
      const prevTotal = currentTotal;
      currentTotal = newAmount;

      try {
        localStorage.setItem(STORAGE_KEY_TOTAL, currentTotal.toString());
      } catch(e) {}

      updateStatusDisplay(statusText);
      updateTotalDisplay(formatSEK(currentTotal));

      // Trigger alerts if new donations arrived
      if (prevTotal > 0 && newAmount > prevTotal) {
        const diff = newAmount - prevTotal;
        const freshItems = newDonations.filter(d => !knownDonationIds.has(d.id));

        if (freshItems.length > 0) {
          freshItems.forEach(d => {
            knownDonationIds.add(d.id);
            recordDonor(d.donor, d.amount);
            triggerAlert(d.donor, d.amount, d.comment);
          });
        } else {
          // If individual names were hidden on the page, still fire the alert!
          triggerAlert("Givare", diff, "Tack för bidraget till Musikhjälpen!");
        }

        try {
          localStorage.setItem(STORAGE_KEY_KNOWN_IDS, JSON.stringify(Array.from(knownDonationIds)));
        } catch(e) {}
      } else if (prevTotal === 0) {
        // First load baseline
        newDonations.forEach(d => {
          knownDonationIds.add(d.id);
          recordDonor(d.donor, d.amount);
        });
      }

      bus.postMessage({
        type: 'TOTAL_UPDATED',
        amount: currentTotal,
        statusText: statusText
      });
    }

    function recordDonor(name, amount) {
      if (!name || /anonym/i.test(name)) return;
      if (!donorTicketsMap[name]) {
        donorTicketsMap[name] = { total: 0, tickets: 0 };
      }
      donorTicketsMap[name].total += amount;
      donorTicketsMap[name].tickets = Math.min(5, Math.floor(donorTicketsMap[name].total / 200));
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch(e) {}
    }

    function updateStatusDisplay(text) {
      const box = document.getElementById('dockStatusBox');
      if (box && text) box.innerText = text;

      const summary = document.getElementById('dockSummaryText');
      if (summary) {
        const donorCount = Object.keys(donorTicketsMap).length || 1;
        summary.innerHTML = `<b>1</b> biljett fördelad på <b>${donorCount}</b> givare (Totalt: <b>${formatSEK(currentTotal)}</b>)`;
      }
    }

    function updateTotalDisplay(text) {
      const el = document.getElementById('totalDisplay');
      if (el) el.innerText = text;
    }

    function triggerAlert(donor, amount, comment) {
      bus.postMessage({
        type: 'TRIGGER_ALERT',
        donor: donor,
        amount: amount,
        comment: comment
      });
    }

    // ========================================================
    // 📺 OVERLAY VIEW
    // ========================================================
    function initOverlayMode() {
      updateTotalDisplay(formatSEK(currentTotal));

      bus.onmessage = (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'TOTAL_UPDATED' || data.type === 'SET_TOTAL') {
          currentTotal = data.amount;
          updateTotalDisplay(formatSEK(currentTotal));
        }

        if (data.type === 'TRIGGER_ALERT') {
          showBanner(data.donor, data.amount, data.comment);
        }
      };

      updateCountdown();
      setInterval(updateCountdown, 1000);

      executeBossaFetch();
      setInterval(executeBossaFetch, 10000);
    }

    function showBanner(donor, amount, comment) {
      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = donor;
      document.getElementById('alertAmount').innerText = formatSEK(amount);
      document.getElementById('alertComment').innerText = comment ? `"${comment}"` : "";

      banner.classList.remove('show-alert');
      void banner.offsetWidth;
      banner.classList.add('show-alert');

      setTimeout(() => {
        banner.classList.remove('show-alert');
      }, 4500);
    }

    function updateCountdown() {
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const targetTime = new Date("2026-12-20T21:00:00+01:00").getTime();
      const diff = targetTime - Date.now();

      if (diff <= 0) {
        timerDisplay.innerText = "00:00:00";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const h = String(hours).padStart(2, '0');
      const m = String(minutes).padStart(2, '0');
      const s = String(seconds).padStart(2, '0');

      timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${h}:${m}:${s}`;
    }

    // ========================================================
    // 🎛️ DOCK VIEW
    // ========================================================
    function initPanelMode() {
      updateStatusDisplay(`Redo (${formatSEK(currentTotal)})`);

      bus.onmessage = (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'TOTAL_UPDATED') {
          currentTotal = data.amount;
          updateStatusDisplay(data.statusText);
        }
      };

      executeBossaFetch();
      setInterval(executeBossaFetch, 10000);
    }

    function triggerDirectFetch() {
      const box = document.getElementById('dockStatusBox');
      if (box) box.innerText = "Hämtar data...";
      executeBossaFetch();
    }

    function dockSetTotal() {
      const val = parseFloat(document.getElementById('dockDirectTotalInput').value);
      if (isNaN(val)) return;
      handleNewBossaData(val, [], `Satt manuellt (${formatSEK(val)})`);
    }

    function dockToggleAutoDrive() {
      autoDriveEnabled = !autoDriveEnabled;
      const btn = document.getElementById('dockAutoDriveBtn');
      if (btn) {
        btn.innerText = autoDriveEnabled ? "Växla till testläge (Auto-Drive: PÅ)" : "Växla till testläge (Auto-Drive: AV)";
        btn.style.borderColor = autoDriveEnabled ? "#ffffff" : "#27272a";
      }

      if (autoDriveTimer) clearTimeout(autoDriveTimer);
      if (autoDriveEnabled) {
        autoDriveTimer = setTimeout(() => {
          handleNewBossaData(currentTotal + 100, [], `Auto-Drive (+100 kr)`);
          triggerAlert("Lisa", 100, "Kämpa på!");
        }, 1500);
      }
    }

    function dockSubmitManualDonation() {
      const donor = document.getElementById('dockManualName').value.trim() || "Lisa";
      const amount = parseFloat(document.getElementById('dockManualAmount').value) || 100;
      const comment = document.getElementById('dockManualComment').value.trim();

      handleNewBossaData(currentTotal + amount, [], `Donation från ${donor} (+${amount} kr)`);
      recordDonor(donor, amount);
      triggerAlert(donor, amount, comment);
    }

    function dockTriggerSampleDonation(donor, amount, comment) {
      handleNewBossaData(currentTotal + amount, [], `Testdonation (+${amount} kr)`);
      recordDonor(donor, amount);
      triggerAlert(donor, amount, comment);
    }

    function dockResetAll() {
      if (confirm("Nollställ alla sparade gåvor och räknare till 0?")) {
        try { localStorage.clear(); } catch(e) {}
        currentTotal = 0;
        knownDonationIds.clear();
        for (const k in donorTicketsMap) delete donorTicketsMap[k];
        handleNewBossaData(0, [], "Nollställt till 0 kr");
      }
    }

    if (isPanel) {
      document.body.classList.add('mode-panel');
      initPanelMode();
    } else {
      document.body.classList.add('mode-overlay');
      initOverlayMode();
    }
  </script>
</body>
</html>
