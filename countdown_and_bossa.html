<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
    }

    /* ========================================================
       🔀 HASH ROUTER VISIBILITY (#overlay vs #panel)
       ======================================================== */
    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }

    body.mode-panel {
      background-color: #0b0b0d;
      overflow-y: auto;
      padding: 10px;
      user-select: none;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY STYLING (#overlay)
       ======================================================== */
    .countdown-widget {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1000;
    }

    .countdown-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ace600;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .sep-dot { color: #ace600; margin: 0 3px; }

    .goal-widget {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 1000;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .goal-label {
      font-size: 12px;
      color: #ffffff;
      display: block;
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }

    .amount {
      color: #ace600;
      font-size: 38px;
      font-weight: 900;
      display: block;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .goal-target {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 6px;
      letter-spacing: 1.2px;
      opacity: 0.9;
    }

    .alert-banner {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: rgba(0, 0, 0, 0.94);
      border: 2px solid #ace600;
      border-radius: 16px;
      padding: 24px 38px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 99999;
      box-shadow: 0 0 35px rgba(172, 230, 0, 0.4);
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.3s;
    }

    .donor-name {
      color: #ace600;
      display: block;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(172, 230, 0, 0.5);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
    }

    .alert-comment {
      color: #ffea00;
      font-size: 20px;
      font-weight: 800;
      font-style: italic;
      margin-top: 8px;
      text-transform: none;
      white-space: normal;
      max-width: 520px;
      line-height: 1.3;
    }

    .show-alert {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }

    /* Subtle version watermark in preview corner */
    .overlay-version-tag {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9999;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* ========================================================
       🎛️ 2. OBS DOCK (BLACK & WHITE THEME)
       ======================================================== */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 8px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .version-badge {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .btn-header {
      background: #1e1e24;
      border: 1px solid #333338;
      color: #ffffff;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-header:hover { background: #2c2c34; }

    .status-box {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #e4e4e7;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 12px;
      font-weight: 700;
      color: #a1a1aa;
      margin: 0 0 10px 2px;
    }
    .summary-text b { color: #ffffff; }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    input[type="text"], input[type="number"], select {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border 0.15s ease;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: #52525b;
    }

    .btn-dark {
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-dark:hover {
      background: #24242a;
      border-color: #3f3f46;
    }

    .manual-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .manual-row input[name="name"] { flex: 2; }
    .manual-row input[name="amount"] { flex: 1; }
    .manual-row button {
      flex: 1;
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .manual-row button:hover { background: #27272e; }

    .btn-primary-action {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 6px;
      transition: opacity 0.15s ease;
    }
    .btn-primary-action:hover { opacity: 0.9; }

    .btn-secondary-action {
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
    }
    .btn-secondary-action:hover { background: #24242a; }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay)
       ======================================================== -->
  <div id="overlayRoot">
    <div class="countdown-widget">
      <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
      <div class="countdown-timer" id="countdownTimer">0D • 00:00:00</div>
    </div>

    <div class="goal-widget">
      <span class="goal-label">TOTALT INSAMLAT</span>
      <span class="amount" id="totalDisplay">0 kr</span>
      <span class="goal-target">MÅL: 40 000 KR</span>
    </div>

    <div class="alert-banner" id="alertBanner">
      <span class="donor-name" id="donorName">JOHAN</span> 
      <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
      <div class="alert-comment" id="alertComment"></div>
    </div>

    <!-- Visible overlay watermark to verify cache reload -->
    <div class="overlay-version-tag" id="overlayVersionTag">v4.6</div>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS CONTROL DOCK (#panel - Black & White Style)
       ======================================================== -->
  <div id="panelRoot" class="dock-container">
    
    <!-- Top Header -->
    <div class="header-box">
      <div class="header-title-wrap">
        <span class="header-title">KONTROLLPANEL</span>
        <span class="version-badge" id="dockVersionBadge">v4.6</span>
      </div>
      <button class="btn-header" onclick="location.reload()">Ladda om</button>
    </div>

    <!-- Status Bar -->
    <div class="status-box" id="dockStatusBox">
      Laddar...
    </div>

    <!-- Stats Summary -->
    <div class="summary-text" id="dockSummaryText">
      <b>0</b> biljetter fördelade på <b>0</b> givare (Totalt: <b>0 kr</b>)
    </div>

    <!-- Campaign ID / Slug -->
    <div class="field-row">
      <span class="field-label">BÖSSA ID:</span>
      <input type="text" id="dockSlugInput" value="our2ndHome" style="width: 60%; text-align: right;">
    </div>

    <!-- Fetch from online Bössa button -->
    <button class="btn-dark" onclick="dockSyncSlug()">Hämta gåvor från bössan</button>

    <!-- Direct Total Override -->
    <div class="field-row" style="margin-top: 6px;">
      <span class="field-label">SÄTT BELOPP:</span>
      <div style="display:flex; gap:4px; width:60%;">
        <input type="number" id="dockDirectTotalInput" placeholder="Belopp (kr)" style="width:100%;">
        <button class="btn-dark" style="width:auto; margin:0; padding:6px 10px;" onclick="dockSetTotal()">Sätt</button>
      </div>
    </div>

    <!-- Manual Donation Row -->
    <div class="manual-row" style="margin-top: 10px;">
      <input type="text" id="dockManualName" name="name" placeholder="Namn" value="Lisa">
      <input type="number" id="dockManualAmount" name="amount" placeholder="Kr" value="250">
      <button id="dockSubmitDonationBtn" onclick="dockSubmitManualDonation()">+ Lägg till</button>
    </div>

    <!-- Optional Comment -->
    <input type="text" id="dockManualComment" placeholder="Kommentar (valfri)..." value="Kämpa på!" style="width:100%; margin-bottom:8px;">

    <!-- Toggle Auto-Drive (OFF by default) -->
    <button class="btn-dark" id="dockAutoDriveBtn" onclick="dockToggleAutoDrive()">
      Växla till testläge (Auto-Drive: AV)
    </button>

    <!-- Reset -->
    <button class="btn-dark" onclick="dockResetAll()">Nollställ allt till 0</button>

    <!-- Primary Action Buttons -->
    <button class="btn-primary-action" onclick="dockTriggerSampleDonation('Lisa', 250, 'Kämpa på!')">
      Skicka testdonation (250 kr)
    </button>
    
    <button class="btn-secondary-action" onclick="dockTestSound()">
      Provlyssna donationsljud
    </button>
  </div>

  <script>
    // 🏷️ CENTRAL VERSION DEFINITION
    const APP_VERSION = "v4.6";

    // Unified communication bus across OBS
    const bus = new BroadcastChannel('musikhjalpen_unified_bus');

    const STORAGE_KEY_TOTAL = "mh_overlay_total_amount";
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const STORAGE_KEY_SLUG = "mh_overlay_bossa_slug";
    const STORAGE_KEY_KNOWN_IDS = "mh_overlay_known_ids";

    function formatSEK(num) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(num)) + ' kr';
    }

    // Hash check
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel');

    console.log(`[Musikhjälpen] Running version ${APP_VERSION} in mode: ${isPanel ? 'PANEL' : 'OVERLAY'}`);

    if (isPanel) {
      document.body.classList.add('mode-panel');
      initPanelMode();
    } else {
      document.body.classList.add('mode-overlay');
      initOverlayMode();
    }

    // ========================================================
    // 📺 OVERLAY ENGINE (Stream graphics & sound)
    // ========================================================
    function initOverlayMode() {
      // Set the watermark version on the overlay
      const tag = document.getElementById('overlayVersionTag');
      if (tag) tag.innerText = APP_VERSION;

      let FUNDRAISER_SLUG = "our2ndHome";
      const CHECK_INTERVAL_SECONDS = 6;
      const MIN_ALERT_DISPLAY_MS = 4500;
      const TICKET_MILESTONE_KR = 200;
      const MAX_TICKETS_PER_USER = 5;

      const GITHUB_USERNAME = "Our2ndHome";
      const GITHUB_REPO = "index";
      const SOUNDS_FOLDER = "sounds";
      const SOUND_VOLUME = 0.8;
      const PAUSE_BETWEEN_ALERTS_SECONDS = 1.2;

      const BACKUP_SOUNDS = [
        'sounds/ssstik.io_1786298964532.mp3',
        'sounds/ssstik.io_1786298991426.mp3',
        'sounds/ssstik.io_1786299005161.mp3'
      ];

      let currentTotal = 0;
      let isInitialFetch = true;
      let soundFileList = [...BACKUP_SOUNDS];
      const donorTicketsMap = {};
      let knownDonationIds = new Set();
      const alertQueue = [];
      let isProcessingAlert = false;

      // Auto-drive OFF by default
      let autoDriveEnabled = false;
      let autoDriveTimer = null;

      function getStats() {
        let totalTickets = 0;
        const donorCount = Object.keys(donorTicketsMap).length;
        for (const name in donorTicketsMap) {
          totalTickets += donorTicketsMap[name].ticketsEarned || 0;
        }
        return { totalTickets, donorCount };
      }

      function broadcastState(syncStatusText = null) {
        const stats = getStats();
        bus.postMessage({
          type: 'STATUS_SYNC',
          version: APP_VERSION,
          total: currentTotal,
          slug: FUNDRAISER_SLUG,
          autoDrive: autoDriveEnabled,
          tickets: stats.totalTickets,
          donors: stats.donorCount,
          syncText: syncStatusText
        });
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY_TOTAL, currentTotal.toString());
          localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
          localStorage.setItem(STORAGE_KEY_SLUG, FUNDRAISER_SLUG);
          localStorage.setItem(STORAGE_KEY_KNOWN_IDS, JSON.stringify(Array.from(knownDonationIds)));
        } catch(e) {}
        broadcastState();
      }

      function loadState() {
        try {
          const savedTotal = localStorage.getItem(STORAGE_KEY_TOTAL);
          const savedDonors = localStorage.getItem(STORAGE_KEY_DONORS);
          const savedSlug = localStorage.getItem(STORAGE_KEY_SLUG);
          const savedIds = localStorage.getItem(STORAGE_KEY_KNOWN_IDS);

          if (savedSlug) FUNDRAISER_SLUG = savedSlug;
          if (savedTotal !== null && !isNaN(parseFloat(savedTotal))) {
            currentTotal = parseFloat(savedTotal);
            updateTotalDisplayDirect(formatSEK(currentTotal));
          }
          if (savedDonors) Object.assign(donorTicketsMap, JSON.parse(savedDonors));
          if (savedIds) {
            const parsed = JSON.parse(savedIds);
            if (Array.isArray(parsed)) knownDonationIds = new Set(parsed);
          }
        } catch(e) {}
      }

      function recordDonorDonation(donorName, donationAmount) {
        if (!donorName || !donorName.trim()) return;
        const cleanName = donorName.trim();
        if (/anonym/i.test(cleanName)) return;

        if (!donorTicketsMap[cleanName]) {
          donorTicketsMap[cleanName] = { totalAmount: 0, ticketsEarned: 0, ticketsActive: 0 };
        }
        const donorObj = donorTicketsMap[cleanName];
        donorObj.totalAmount += donationAmount;
        const rawTickets = Math.floor(donorObj.totalAmount / TICKET_MILESTONE_KR);
        const cappedTickets = Math.min(MAX_TICKETS_PER_USER, rawTickets);
        const added = cappedTickets - donorObj.ticketsEarned;
        if (added > 0) {
          donorObj.ticketsEarned += added;
          donorObj.ticketsActive += added;
        }
      }

      function enqueueAlert(donorName, diffAmount, newTotal, comment = "") {
        alertQueue.push({ donorName, diffAmount, newTotal, comment });
        processQueue();
      }

      function updateTotalDisplayDirect(txt) {
        const el = document.getElementById('totalDisplay');
        if (el) el.innerText = txt;
      }

      function updateTotalDisplaySmooth(txt) {
        const el = document.getElementById('totalDisplay');
        if (!el || el.innerText === txt) return;
        el.style.opacity = '0';
        setTimeout(() => {
          el.innerText = txt;
          el.style.opacity = '1';
        }, 300);
      }

      async function processQueue() {
        if (isProcessingAlert || alertQueue.length === 0) return;
        isProcessingAlert = true;
        const nextEvent = alertQueue.shift();

        const banner = document.getElementById('alertBanner');
        document.getElementById('donorName').innerText = nextEvent.donorName;
        document.getElementById('alertAmount').innerText = formatSEK(nextEvent.diffAmount);
        document.getElementById('alertComment').innerText = nextEvent.comment ? `"${nextEvent.comment}"` : "";

        updateTotalDisplaySmooth(formatSEK(nextEvent.newTotal));

        banner.classList.remove('show-alert');
        void banner.offsetWidth;
        banner.classList.add('show-alert');

        const soundPromise = playAlertSound();
        const minDisplayPromise = new Promise(resolve => setTimeout(resolve, MIN_ALERT_DISPLAY_MS));

        await Promise.all([soundPromise, minDisplayPromise]);
        banner.classList.remove('show-alert');

        setTimeout(() => {
          isProcessingAlert = false;
          processQueue();
        }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);
      }

      function playAlertSound() {
        return new Promise((resolve) => {
          if (!soundFileList || soundFileList.length === 0) return resolve();
          try {
            const audio = new Audio(soundFileList[Math.floor(Math.random() * soundFileList.length)]);
            audio.volume = SOUND_VOLUME;
            let finished = false;
            const done = () => { if (!finished) { finished = true; resolve(); } };
            audio.onended = done;
            audio.onerror = done;
            audio.play().catch(() => done());
            setTimeout(done, 8000);
          } catch(e) { resolve(); }
        });
      }

      async function loadSoundsAutomatically() {
        try {
          const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (res.ok) {
            const files = await res.json();
            const sounds = files.filter(f => f.name.match(/\.(mp3|wav|ogg)$/i)).map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);
            if (sounds.length > 0) soundFileList = sounds;
          }
        } catch(e) {}
      }

      function scheduleNextAutoDrive() {
        if (!autoDriveEnabled) return;
        if (autoDriveTimer) clearTimeout(autoDriveTimer);
        const delayMs = (Math.floor(Math.random() * 25) + 20) * 1000;
        autoDriveTimer = setTimeout(() => {
          if (autoDriveEnabled) {
            triggerAutoDriveDonation();
            scheduleNextAutoDrive();
          }
        }, delayMs);
      }

      function triggerAutoDriveDonation() {
        const donors = ["Sofia", "Marcus", "Elin", "Oscar", "Emma", "Viktor", "Lina", "Filip", "Agnes", "Lucas"];
        const amounts = [50, 100, 150, 200, 250, 300, 500];
        const comments = ["Kämpa på!", "Grymt initiativ ❤️", "För Musikhjälpen!", "Heja er!", ""];

        const donor = donors[Math.floor(Math.random() * donors.length)];
        const amount = amounts[Math.floor(Math.random() * amounts.length)];
        const comment = comments[Math.floor(Math.random() * comments.length)];

        currentTotal += amount;
        recordDonorDonation(donor, amount);
        saveState();
        enqueueAlert(donor, amount, currentTotal, comment);
      }

      function cleanSwedishAmount(val) {
        if (typeof val === 'number') return val;
        if (typeof val !== 'string') return 0;
        let cleanStr = val.replace(/,([0-9]{1,2})\b/g, '.$1').replace(/[^0-9.]/g, '');
        const num = parseFloat(cleanStr);
        return isNaN(num) ? 0 : num;
      }

      function parseFundraiserPayload(rawData) {
        let amount = -1, donations = [], success = false;
        if (!rawData) return { amount, donations, success };

        if (typeof rawData === 'string') {
          const nextDataMatch = rawData.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/i);
          if (nextDataMatch && nextDataMatch[1]) {
            try { rawData = JSON.parse(nextDataMatch[1]); } catch(e) {}
          }
        }

        if (typeof rawData === 'object' && rawData !== null) {
          const pageProps = rawData.props?.pageProps || rawData;
          const fundraiser = pageProps.fundraiser || pageProps;
          amount = cleanSwedishAmount(fundraiser.amount ?? fundraiser.raised ?? fundraiser.totalAmount);
          if (amount >= 0) success = true;

          const rawList = fundraiser.donations || pageProps.donations || [];
          if (Array.isArray(rawList)) {
            donations = rawList.map(d => ({
              id: d.id || `${d.name}_${d.amount}_${d.createdAt}`,
              donor: d.name || d.donorName || "Anonym Givare",
              amount: cleanSwedishAmount(d.amount),
              comment: d.comment || d.message || "",
              timestamp: d.createdAt || new Date().toISOString()
            }));
          }
        }
        return { amount, donations, success };
      }

      async function fetchMusikhjalpenData() {
        const targetUrl = `https://bossan.musikhjalpen.se/${FUNDRAISER_SLUG}/`;
        const proxyCandidates = [
          `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          targetUrl
        ];

        for (const url of proxyCandidates) {
          try {
            const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) continue;

            let rawData = url.includes('allorigins.win/get') ? (await res.json()).contents : await res.text();
            const parsed = parseFundraiserPayload(rawData);

            if (parsed.success) {
              const timeStr = new Date().toLocaleTimeString('sv-SE');
              broadcastState(`Ansluten till bössan (${formatSEK(parsed.amount)}) • ${timeStr}`);

              if (isInitialFetch) {
                isInitialFetch = false;
                if (parsed.amount > currentTotal) currentTotal = parsed.amount;
                updateTotalDisplayDirect(formatSEK(currentTotal));
                parsed.donations.forEach(d => { knownDonationIds.add(d.id); recordDonorDonation(d.donor, d.amount); });
                saveState();
                return;
              }

              if (parsed.amount > currentTotal) {
                const diff = parsed.amount - currentTotal;
                currentTotal = parsed.amount;
                const newItems = parsed.donations.filter(d => !knownDonationIds.has(d.id));

                if (newItems.length > 0) {
                  newItems.forEach(d => {
                    knownDonationIds.add(d.id);
                    recordDonorDonation(d.donor, d.amount);
                    enqueueAlert(d.donor, d.amount, currentTotal, d.comment);
                  });
                } else {
                  enqueueAlert("Anonym Givare", diff, currentTotal, "");
                }
                saveState();
              }
              return;
            }
          } catch(e) {}
        }
        broadcastState(`Kunde inte ansluta till bössan`);
      }

      function updateCountdown() {
        const label = document.getElementById('countdownLabel');
        const timerDisplay = document.getElementById('countdownTimer');
        const targetTime = new Date("2026-12-20T21:00:00+01:00").getTime();
        const diff = targetTime - Date.now();

        if (diff <= 0) {
          timerDisplay.innerText = "00:00:00";
          label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const h = String(hours).padStart(2, '0');
        const m = String(minutes).padStart(2, '0');
        const s = String(seconds).padStart(2, '0');

        timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${h}:${m}:${s}`;
      }

      bus.onmessage = (event) => {
        const data = event.data;
        if (!data || !data.type) return;

        switch (data.type) {
          case 'TRIGGER_DONATION':
            currentTotal += data.amount;
            recordDonorDonation(data.donor, data.amount);
            saveState();
            enqueueAlert(data.donor, data.amount, currentTotal, data.comment);
            break;

          case 'SET_TOTAL':
            currentTotal = data.amount;
            updateTotalDisplaySmooth(formatSEK(currentTotal));
            saveState();
            break;

          case 'TOGGLE_AUTODRIVE':
            autoDriveEnabled = data.enabled;
            if (autoDriveTimer) clearTimeout(autoDriveTimer);
            if (autoDriveEnabled) scheduleNextAutoDrive();
            saveState();
            break;

          case 'SET_SLUG':
            FUNDRAISER_SLUG = data.slug;
            saveState();
            fetchMusikhjalpenData();
            break;

          case 'PLAY_TEST_SOUND':
            playAlertSound();
            break;

          case 'RESET_ALL':
            currentTotal = 0;
            alertQueue.length = 0;
            knownDonationIds.clear();
            for (const key in donorTicketsMap) delete donorTicketsMap[key];
            updateTotalDisplayDirect('0 kr');
            try { localStorage.clear(); } catch(e) {}
            saveState();
            break;

          case 'REQUEST_STATE':
            broadcastState();
            break;
        }
      };

      loadState();
      loadSoundsAutomatically();
      fetchMusikhjalpenData();
      updateCountdown();

      setInterval(updateCountdown, 1000);
      setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
    }

    // ========================================================
    // 🎛️ DOCK CONTROLLER LOGIC
    // ========================================================
    let autoDriveIsActive = false;
    let isSubmitting = false;

    function initPanelMode() {
      // Set the version badge in the dock header
      const badge = document.getElementById('dockVersionBadge');
      if (badge) badge.innerText = APP_VERSION;

      const initTime = new Date().toLocaleTimeString('sv-SE');
      const statusBox = document.getElementById('dockStatusBox');
      if (statusBox) statusBox.innerText = `Laddat ${APP_VERSION} (${initTime}) • Söker overlay...`;

      bus.onmessage = (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'STATUS_SYNC') {
          if (data.slug) document.getElementById('dockSlugInput').value = data.slug;
          
          if (typeof data.tickets === 'number' && typeof data.donors === 'number') {
            document.getElementById('dockSummaryText').innerHTML = 
              `<b>${data.tickets}</b> biljetter fördelade på <b>${data.donors}</b> givare (Totalt: <b>${formatSEK(data.total || 0)}</b>)`;
          }

          if (data.syncText) {
            document.getElementById('dockStatusBox').innerText = data.syncText;
          }

          if (typeof data.autoDrive === 'boolean') {
            autoDriveIsActive = data.autoDrive;
            updateAutoDriveButtonUI();
          }
        }
      };

      // Query overlay
      bus.postMessage({ type: 'REQUEST_STATE' });
    }

    function dockSetTotal() {
      const val = parseFloat(document.getElementById('dockDirectTotalInput').value);
      if (isNaN(val)) return;
      bus.postMessage({ type: 'SET_TOTAL', amount: val });
    }

    function updateAutoDriveButtonUI() {
      const btn = document.getElementById('dockAutoDriveBtn');
      if (!btn) return;
      if (autoDriveIsActive) {
        btn.innerText = "Växla till testläge (Auto-Drive: PÅ)";
        btn.style.borderColor = "#ffffff";
      } else {
        btn.innerText = "Växla till testläge (Auto-Drive: AV)";
        btn.style.borderColor = "#27272a";
      }
    }

    function dockToggleAutoDrive() {
      autoDriveIsActive = !autoDriveIsActive;
      updateAutoDriveButtonUI();
      bus.postMessage({ type: 'TOGGLE_AUTODRIVE', enabled: autoDriveIsActive });
    }

    function dockSyncSlug() {
      const slug = document.getElementById('dockSlugInput').value.trim();
      if (!slug) return;
      document.getElementById('dockStatusBox').innerText = "Hämtar data för " + slug + "...";
      bus.postMessage({ type: 'SET_SLUG', slug });
    }

    function dockSubmitManualDonation() {
      if (isSubmitting) return; // Prevent double clicks
      isSubmitting = true;
      const btn = document.getElementById('dockSubmitDonationBtn');
      if (btn) btn.disabled = true;

      const donor = document.getElementById('dockManualName').value.trim() || "Lisa";
      const amount = parseFloat(document.getElementById('dockManualAmount').value) || 100;
      const comment = document.getElementById('dockManualComment').value.trim();

      bus.postMessage({ type: 'TRIGGER_DONATION', donor, amount, comment });

      setTimeout(() => {
        isSubmitting = false;
        if (btn) btn.disabled = false;
      }, 500);
    }

    function dockTriggerSampleDonation(donor, amount, comment) {
      bus.postMessage({ type: 'TRIGGER_DONATION', donor, amount, comment });
    }

    function dockTestSound() {
      bus.postMessage({ type: 'PLAY_TEST_SOUND' });
    }

    function dockResetAll() {
      if (confirm("Nollställ alla sparade gåvor, tickets och räknare?")) {
        bus.postMessage({ type: 'RESET_ALL' });
      }
    }
  </script>
