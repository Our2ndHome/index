<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Tracker & Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.92);
      --shadow-dark: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ DRAGGABLE TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      max-width: 380px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 136, 0.1);
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px dashed rgba(0, 255, 136, 0.4);
    }

    .version-badge {
      background: var(--secondary-color);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
    }

    .test-panel button {
      background: #222;
      color: var(--text-white);
      border: 1px solid var(--secondary-color);
      padding: 5px 8px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .test-panel button:hover { background: var(--secondary-color); color: black; }

    .test-panel input {
      background: #111;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      width: 120px;
      margin-right: 4px;
    }

    .panel-section { margin-top: 8px; border-top: 1px solid #444; padding-top: 6px; }
    .sound-status { margin-top: 8px; font-size: 10px; color: #aaa; }

    /* ⏱️ COUNTDOWN TIMER */
    .countdown-widget {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1000;
    }

    .countdown-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--primary-color); 
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px var(--shadow-dark);
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text-white); 
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 6px var(--shadow-dark);
    }

    .sep-dot { color: var(--primary-color); margin: 0 3px; }

    /* 💰 TOTAL GOAL COUNTER */
    .goal-widget {
      position: absolute;
      top: 88px; 
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 1000;
      font-size: 22px;
      font-weight: 900;
      color: var(--text-white);
      text-shadow: 0 2px 8px var(--shadow-dark);
    }

    .goal-label {
      font-size: 12px;
      color: var(--text-white);
      display: block;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
    }

    .amount {
      color: var(--primary-color);
      font-size: 34px;
      font-weight: 900;
      display: block;
      transition: opacity 0.4s ease;
    }

    .goal-target {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-white);
      display: block;
      margin-top: 8px;
      letter-spacing: 1.2px;
      opacity: 0.9;
    }

    /* 📢 DONATION ALERT BANNER */
    .alert-banner {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: rgba(0, 0, 0, 0.88);
      border: 2px solid var(--primary-color);
      border-radius: 16px;
      padding: 20px 32px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      box-shadow: 0 0 25px rgba(172, 230, 0, 0.3);
    }

    .donor-name {
      color: var(--primary-color);
      display: block;
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 2px;
      text-shadow: 0 0 8px rgba(172, 230, 0, 0.4);
    }

    .alert-subtext { color: var(--text-white); font-size: 34px; font-weight: 900; }

    .alert-comment {
      color: var(--giveaway-color);
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      margin-top: 6px;
      text-transform: none;
      white-space: normal;
      max-width: 500px;
    }

    .show-alert {
      opacity: 1 !important;
      visibility: visible !important;
      animation: elasticPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes elasticPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    }
  </style>
</head>
<body>

  <!-- 🎛️ CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">🧪 TRACKER PANEL <span class="version-badge">v3.5</span></h4>
    
    <div class="panel-section" style="background: rgba(172, 230, 0, 0.1); padding: 8px; border-radius: 6px;">
      <b>⚡ Direkt Tvingat Belopp:</b><br>
      <input type="number" id="manualTotalInput" value="400" placeholder="Belopp (t.ex. 400)">
      <button onclick="setTotalAmountDirectly()" style="background:#ace600; color:#000;">💾 Sätt Belopp</button>
    </div>

    <div class="panel-section">
      <b>🚀 Självdrivande Motor (Auto-Drive):</b><br>
      <button id="autoDriveBtn" onclick="toggleAutoDrive()" style="background:#00ff88; color:#000; font-weight:900;">🚀 Auto-Drive: PÅ</button>
      <div id="autoDriveStatus" style="font-size:11px; color:#ace600; margin:4px 0;">Självdrivande läge AKTIVT</div>
    </div>

    <div class="panel-section">
      <b>Bössa Sync Status:</b><br>
      <input type="text" id="bossaSlugInput" value="our2ndHome" placeholder="Bössa slug">
      <button onclick="updateFundraiserSlugAndFetch()" style="background:#00ff88; color:#000;">🔄 Sync Bössa</button>
      <div id="bossaSyncStatus" style="font-size:11px; color:#ace600; margin:4px 0;">Söker på bossan.musikhjalpen.se...</div>
    </div>

    <div class="panel-section">
      <b>🎮 Manuell Donation:</b><br>
      <input type="text" id="manualNameInput" placeholder="Givarnamn" value="Lisa">
      <input type="number" id="manualAmountInput" placeholder="Belopp" value="250" style="width:60px;">
      <button onclick="submitManualDonation()" style="background:#ace600; color:#000;">+ Skicka</button>
    </div>

    <div class="panel-section">
      <button onclick="simulateDonation('Lisa', 250, 'Kämpa på!')">+250 kr (Lisa)</button>
      <button onclick="simulateDonation('Erik', 600, 'Grymt initiativ!')">+600 kr (Erik)</button>
      <button onclick="resetTotal()" style="border-color:#ff0055;">Rensa Sparat Tillstånd</button>
    </div>

    <div class="sound-status" id="soundStatus">Laddar ljud...</div>
  </div>

  <!-- ⏱️ COUNTDOWN WIDGET -->
  <div class="countdown-widget" id="countdownWidget">
    <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
    <div class="countdown-timer" id="countdownTimer">0D • 00:00:00</div>
  </div>

  <!-- 💰 GOAL COUNTER WIDGET -->
  <div class="goal-widget" id="goalWidget">
    <span class="goal-label">TOTALT INSAMLAT</span>
    <span class="amount" id="totalDisplay">0 kr</span>
    <span class="goal-target">MÅL: 40 000 KR</span>
  </div>

  <!-- 📢 ALERT BANNER -->
  <div class="alert-banner" id="alertBanner">
    <span class="donor-name" id="donorName">JOHAN</span> 
    <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
    <div class="alert-comment" id="alertComment"></div>
  </div>

  <script>
    let FUNDRAISER_SLUG = "our2ndHome";
    const CHECK_INTERVAL_SECONDS = 5;
    const TICKET_MILESTONE_KR = 200; 
    const MAX_TICKETS_PER_USER = 5;  

    const STORAGE_KEY_TOTAL = "mh_overlay_total_amount";
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const STORAGE_KEY_SLUG = "mh_overlay_bossa_slug";
    const STORAGE_KEY_KNOWN_IDS = "mh_overlay_known_ids";

    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SOUND_VOLUME = 0.8;
    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; 

    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3'
    ];

    const donorTicketsMap = {}; 
    let knownDonationIds = new Set();
    let currentTotal = 0; 
    let isInitialFetch = true;
    let soundFileList = TIKTOK_BACKUP_SOUNDS;

    function saveStateToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_TOTAL, currentTotal.toString());
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
        localStorage.setItem(STORAGE_KEY_SLUG, FUNDRAISER_SLUG);
        localStorage.setItem(STORAGE_KEY_KNOWN_IDS, JSON.stringify(Array.from(knownDonationIds)));
      } catch(e) {}
    }

    function loadStateFromLocalStorage() {
      try {
        const savedTotal = localStorage.getItem(STORAGE_KEY_TOTAL);
        const savedDonors = localStorage.getItem(STORAGE_KEY_DONORS);
        const savedSlug = localStorage.getItem(STORAGE_KEY_SLUG);
        const savedIds = localStorage.getItem(STORAGE_KEY_KNOWN_IDS);

        if (savedSlug) {
          FUNDRAISER_SLUG = savedSlug;
          const slugInput = document.getElementById('bossaSlugInput');
          if (slugInput) slugInput.value = FUNDRAISER_SLUG;
        }

        if (savedTotal !== null && !isNaN(parseFloat(savedTotal))) {
          currentTotal = parseFloat(savedTotal);
          updateTotalDisplayDirect(`${currentTotal} kr`);
        }

        if (savedDonors) Object.assign(donorTicketsMap, JSON.parse(savedDonors));
        if (savedIds) {
          const parsedIds = JSON.parse(savedIds);
          if (Array.isArray(parsedIds)) knownDonationIds = new Set(parsedIds);
        }
      } catch(e) {}
    }

    function recordDonorDonation(donorName, donationAmount) {
      if (!donorName || !donorName.trim()) return;
      const cleanName = donorName.trim();
      if (/anonym/i.test(cleanName)) return;

      if (!donorTicketsMap[cleanName]) {
        donorTicketsMap[cleanName] = { totalAmount: 0, ticketsEarned: 0, ticketsActive: 0 };
      }

      const donorObj = donorTicketsMap[cleanName];
      donorObj.totalAmount += donationAmount;

      const rawCalculatedTickets = Math.floor(donorObj.totalAmount / TICKET_MILESTONE_KR);
      const cappedTotalTickets = Math.min(MAX_TICKETS_PER_USER, rawCalculatedTickets);

      const addedTickets = cappedTotalTickets - donorObj.ticketsEarned;
      if (addedTickets > 0) {
        donorObj.ticketsEarned += addedTickets;
        donorObj.ticketsActive += addedTickets;
      }

      saveStateToLocalStorage();
    }

    function setTotalAmountDirectly() {
      const input = document.getElementById('manualTotalInput');
      if (!input) return;
      const newAmount = parseFloat(input.value);
      if (isNaN(newAmount)) return;

      currentTotal = newAmount;
      updateTotalDisplaySmooth(`${currentTotal} kr`);
      saveStateToLocalStorage();
    }

    // AUTO-DRIVE
    let autoDriveEnabled = true;
    let autoDriveTimer = null;

    function toggleAutoDrive() {
      autoDriveEnabled = !autoDriveEnabled;
      const btn = document.getElementById('autoDriveBtn');
      const statusEl = document.getElementById('autoDriveStatus');

      if (autoDriveEnabled) {
        if (btn) { btn.style.background = "#00ff88"; btn.style.color = "#000"; btn.innerText = "🚀 Auto-Drive: PÅ"; }
        if (statusEl) statusEl.innerHTML = "<span style='color:#00ff88;'>Självdrivande läge AKTIVT</span>";
        scheduleNextAutoDriveDonation();
      } else {
        if (btn) { btn.style.background = "#222"; btn.style.color = "#fff"; btn.innerText = "🚀 Auto-Drive: AV"; }
        if (statusEl) statusEl.innerHTML = "<span style='color:#aaa;'>Självdrivande läge inaktivt</span>";
        if (autoDriveTimer) clearTimeout(autoDriveTimer);
      }
    }

    function scheduleNextAutoDriveDonation() {
      if (!autoDriveEnabled) return;
      const delayMs = (Math.floor(Math.random() * 25) + 20) * 1000;
      autoDriveTimer = setTimeout(() => {
        if (autoDriveEnabled) {
          triggerAutoDriveDonation();
          scheduleNextAutoDriveDonation();
        }
      }, delayMs);
    }

    function triggerAutoDriveDonation() {
      const sampleDonors = ["Sofia", "Marcus", "Elin", "Oscar", "Emma", "Viktor", "Lina", "Filip", "Agnes", "Lucas"];
      const sampleAmounts = [50, 100, 150, 200, 250, 300, 500];
      const sampleComments = ["Kämpa på!", "Grymt initiativ ❤️", "För musikhjälpen!", "Heja er!", ""];

      const donor = sampleDonors[Math.floor(Math.random() * sampleDonors.length)];
      const amount = sampleAmounts[Math.floor(Math.random() * sampleAmounts.length)];
      const comment = sampleComments[Math.floor(Math.random() * sampleComments.length)];

      currentTotal += amount;
      recordDonorDonation(donor, amount);
      saveStateToLocalStorage();
      enqueueAlert(donor, amount, currentTotal, comment);
    }

    // ALERTS & QUEUE
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal, comment = "") {
      alertQueue.push({ donorName, diffAmount, newTotal, comment });
      processQueue();
    }

    function updateTotalDisplayDirect(txt) {
      const el = document.getElementById('totalDisplay');
      if (el) el.innerText = txt;
    }

    function updateTotalDisplaySmooth(txt) {
      const el = document.getElementById('totalDisplay');
      if (!el || el.innerText === txt) return;
      el.style.opacity = '0';
      setTimeout(() => { el.innerText = txt; el.style.opacity = '1'; }, 400);
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;
      isProcessingAlert = true;
      const nextEvent = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextEvent.donorName;
      document.getElementById('alertAmount').innerText = `${nextEvent.diffAmount} kr`;
      document.getElementById('alertComment').innerText = nextEvent.comment ? `"${nextEvent.comment}"` : "";

      updateTotalDisplaySmooth(`${nextEvent.newTotal} kr`);

      banner.classList.remove('show-alert');
      void banner.offsetWidth;
      banner.classList.add('show-alert');

      await playAlertSound();
      banner.classList.remove('show-alert');

      setTimeout(() => {
        isProcessingAlert = false;
        processQueue();
      }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);
    }

    async function loadSoundsAutomatically() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
        if (res.ok) {
          const files = await res.json();
          const sounds = files.filter(f => f.name.match(/\.(mp3|wav|ogg)$/i)).map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);
          if (sounds.length > 0) soundFileList = sounds;
        }
      } catch(e) {}
    }

    function playAlertSound() {
      return new Promise((resolve) => {
        try {
          const audio = new Audio(soundFileList[Math.floor(Math.random() * soundFileList.length)]);
          audio.volume = SOUND_VOLUME;
          audio.onended = () => resolve();
          audio.onerror = () => resolve();
          audio.play().catch(() => resolve());
        } catch(e) { resolve(); }
      });
    }

    function cleanSwedishAmount(val) {
      if (typeof val === 'number') return val;
      if (typeof val !== 'string') return 0;
      let cleanStr = val.replace(/,([0-9]{1,2})\b/g, '.$1').replace(/[^0-9.]/g, '');
      const num = parseFloat(cleanStr);
      return isNaN(num) ? 0 : num;
    }

    function parseFundraiserPayload(rawData) {
      let amount = -1, donations = [], success = false;
      if (!rawData) return { amount, donations, success };

      if (typeof rawData === 'string') {
        const nextDataMatch = rawData.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/i);
        if (nextDataMatch && nextDataMatch[1]) {
          try { rawData = JSON.parse(nextDataMatch[1]); } catch(e) {}
        }
      }

      if (typeof rawData === 'object' && rawData !== null) {
        const pageProps = rawData.props?.pageProps || rawData;
        const fundraiser = pageProps.fundraiser || pageProps;

        amount = cleanSwedishAmount(fundraiser.amount ?? fundraiser.raised ?? fundraiser.totalAmount);
        if (amount >= 0) success = true;

        const rawList = fundraiser.donations || pageProps.donations || [];
        if (Array.isArray(rawList)) {
          donations = rawList.map(d => ({
            id: d.id || `${d.name}_${d.amount}_${d.createdAt}`,
            donor: d.name || d.donorName || "Anonym Givare",
            amount: cleanSwedishAmount(d.amount),
            comment: d.comment || d.message || "",
            timestamp: d.createdAt || new Date().toISOString()
          }));
        }
      }

      return { amount, donations, success };
    }

    async function fetchMusikhjalpenData(force = false) {
      const syncStatusEl = document.getElementById('bossaSyncStatus');
      const targetUrl = `https://bossan.musikhjalpen.se/${FUNDRAISER_SLUG}/`;
      const proxyCandidates = [
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        targetUrl
      ];

      for (const url of proxyCandidates) {
        try {
          const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) continue;

          let rawData = url.includes('allorigins.win/get') ? (await res.json()).contents : await res.text();
          const parsed = parseFundraiserPayload(rawData);

          if (parsed.success) {
            const timeStr = new Date().toLocaleTimeString('sv-SE');
            if (syncStatusEl) syncStatusEl.innerHTML = `<span style="color:#00ff88;">OK (${parsed.amount} kr) • ${timeStr}</span>`;

            if (isInitialFetch) {
              isInitialFetch = false;
              if (parsed.amount > currentTotal) currentTotal = parsed.amount;
              updateTotalDisplayDirect(`${currentTotal} kr`);
              parsed.donations.forEach(d => { knownDonationIds.add(d.id); recordDonorDonation(d.donor, d.amount); });
              saveStateToLocalStorage();
              return;
            }

            if (parsed.amount > currentTotal) {
              const diff = parsed.amount - currentTotal;
              currentTotal = parsed.amount;
              const newItems = parsed.donations.filter(d => !knownDonationIds.has(d.id));

              if (newItems.length > 0) {
                newItems.forEach(d => {
                  knownDonationIds.add(d.id);
                  recordDonorDonation(d.donor, d.amount);
                  enqueueAlert(d.donor, d.amount, currentTotal, d.comment);
                });
              } else {
                enqueueAlert("Anonym Givare", diff, currentTotal, "");
              }
              saveStateToLocalStorage();
            }
            return;
          }
        } catch(e) {}
      }
    }

    function updateCountdownDisplay() {
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const diff = new Date("2026-12-16T23:00:00").getTime() - Date.now();

      if (diff <= 0) {
        timerDisplay.innerText = "";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${hStr}:${mStr}:${sStr}`;
    }

    function makePanelDraggable() {
      const panel = document.getElementById('testPanel');
      const header = document.getElementById('panelDragHeader');
      if (!panel || !header) return;

      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      header.onmousedown = (e) => {
        e.preventDefault();
        pos3 = e.clientX; pos4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (ev) => {
          ev.preventDefault();
          pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
          pos3 = ev.clientX; pos4 = ev.clientY;
          panel.style.top = (panel.offsetTop - pos2) + "px";
          panel.style.left = (panel.offsetLeft - pos1) + "px";
        };
      };
    }

    function submitManualDonation() {
      const name = document.getElementById('manualNameInput').value.trim() || "Lisa";
      const amount = Number(document.getElementById('manualAmountInput').value) || 250;
      simulateDonation(name, amount, "Manuell donation");
    }

    function simulateDonation(name, amount, comment = "") {
      currentTotal += amount;
      recordDonorDonation(name, amount);
      saveStateToLocalStorage();
      enqueueAlert(name, amount, currentTotal, comment);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      knownDonationIds.clear();
      for (const key in donorTicketsMap) delete donorTicketsMap[key];
      updateTotalDisplayDirect('0 kr');
      try { localStorage.clear(); } catch(e) {}
    }

    function updateFundraiserSlugAndFetch() {
      FUNDRAISER_SLUG = document.getElementById('bossaSlugInput').value.trim();
      saveStateToLocalStorage();
      fetchMusikhjalpenData(true);
    }

    // INIT
    loadStateFromLocalStorage();
    makePanelDraggable();
    loadSoundsAutomatically();
    fetchMusikhjalpenData();
    scheduleNextAutoDriveDonation();
    updateCountdownDisplay();

    setInterval(updateCountdownDisplay, 1000);
    setInterval(() => fetchMusikhjalpenData(false), CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
