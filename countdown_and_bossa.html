<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
    }

    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }

    body.mode-panel {
      background-color: #0b0b0d;
      overflow-y: auto;
      padding: 6px;
      user-select: none;
    }

    /* 📺 OVERLAY CONTAINER */
    .widget-card {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.9);
      padding: 18px 36px 20px 36px;
      /* 🎯 16px bottom curvature for perfect sync with goal wings & sponsors */
      border-radius: 0 0 16px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1000;
    }

    .countdown-widget {
      text-align: center;
      margin-bottom: 2px;
    }

    .countdown-label {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ace600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sep-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #ace600;
      border-radius: 50%;
      margin: 0 10px;
      box-shadow: 0 0 8px rgba(172, 230, 0, 0.6);
    }

    .goal-widget {
      text-align: center;
      text-transform: uppercase;
    }

    .goal-label {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      display: block;
      margin-top: 12px;
      margin-bottom: 2px;
      letter-spacing: 1.5px;
    }

    .amount {
      color: #ace600;
      font-size: 40px;
      font-weight: 900;
      display: block;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 0 16px rgba(172, 230, 0, 0.25);
    }

    .progress-bar-container {
      width: 270px;
      height: 6px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      margin: 12px auto 8px auto;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #ace600;
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 8px rgba(172, 230, 0, 0.8);
    }

    .goal-target {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      display: block;
      letter-spacing: 1px;
    }

    /* 🎛️ 2. OBS DOCK */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 6px;
    }

    .header-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-pill.online {
      background: #143820;
      color: #00ff88;
      border: 1px solid #00ff88;
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.3);
    }
    .status-pill.syncing {
      background: #332d18;
      color: #ffea00;
      border: 1px solid #ffea00;
    }
    .status-pill.offline {
      background: #381414;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }

    .summary-text {
      font-size: 11px;
      font-weight: 700;
      color: #a1a1aa;
      margin: 0 0 8px 2px;
    }
    .summary-text b { color: #ffffff; }

    .btn-resync {
      background: #18181c;
      border: 1px solid #00ff88;
      color: #00ff88;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn-resync:hover { background: #00ff88; color: #000000; }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    input[type="text"], input[type="number"] {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 11px;
      outline: none;
    }

    .btn-dark {
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
    }
    .btn-dark:hover { background: #24242a; }

    .manual-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .manual-row input[name="name"] { flex: 2; }
    .manual-row input[name="amount"] { flex: 1; }
    .manual-row button {
      flex: 1;
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }
    .manual-row button:hover { background: #24242a; border-color: #ace600; color: #ace600; }

    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 6px;
    }

    .btn-test {
      background: #18181c;
      border: 1px solid #27272a;
      color: #efeff1;
      border-radius: 4px;
      padding: 8px 6px;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-test:hover {
      background: #27272f;
      border-color: #ace600;
      color: #ace600;
    }
    .btn-test:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <!-- 📺 1. STREAM OVERLAY VIEW -->
  <div id="overlayRoot">
    <div class="widget-card">
      <div class="countdown-widget">
        <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
        <div class="countdown-timer" id="countdownTimer">0D <span class="sep-dot"></span> 00:00:00</div>
      </div>

      <div class="goal-widget">
        <span class="goal-label">TOTALT INSAMLAT</span>
        <span class="amount" id="totalDisplay">0 KR</span>
        
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="goalProgressBar"></div>
        </div>

        <span class="goal-target" id="goalTargetText">MÅL: 40 000 KR (0.0%)</span>
      </div>
    </div>
  </div>

  <!-- 🎛️ 2. OBS DOCK CONTROLLER -->
  <div id="panelRoot" class="dock-container">
    
    <div class="header-box">
      <span class="header-title">
        💰 BÖSSA
        <span id="dockStatusPill" class="status-pill syncing">🟡 ANSLUTER...</span>
      </span>
    </div>

    <div class="summary-text" id="dockSummaryText">
      Totalt insamlat: <b>0 KR</b>
    </div>

    <button class="btn-resync" onclick="dockRequestResync()">
      🔄 Begär synk från bössan
    </button>

    <div class="field-row">
      <span class="field-label">SÄTT BELOPP:</span>
      <div style="display:flex; gap:4px; width:65%;">
        <input type="number" id="dockDirectTotalInput" min="0" step="1" placeholder="Belopp (kr)" style="width:100%;">
        <button class="btn-dark" style="width:auto; margin:0; padding:5px 8px;" onclick="dockSetTotal()">Sätt</button>
      </div>
    </div>

    <div class="manual-row" style="margin-top: 6px;">
      <input type="text" id="dockManualName" name="name" placeholder="Namn" value="Lisa">
      <input type="number" id="dockManualAmount" name="amount" min="1" step="1" placeholder="Kr" value="250">
      <button id="dockSubmitDonationBtn" onclick="dockSubmitManualDonation()">+ Lägg till</button>
    </div>

    <input type="text" id="dockManualComment" placeholder="Kommentar (valfri)..." value="Kämpa på!" style="width:100%; margin-bottom:8px;">

    <!-- 🎮 TEST ALERTS SECTION -->
    <div class="field-label" style="margin-bottom: 5px; color: #a1a1aa; border-top: 1px solid #27272a; padding-top: 6px;">
      TESTA ALERTS (SLUMPMÄSSIGT):
    </div>

    <div class="test-grid">
      <button class="btn-test" onclick="dockTriggerTestAlert('donation')">🎲 Donation</button>
      <button class="btn-test" onclick="dockTriggerTestAlert('raid')">🚀 Raid</button>
      <button class="btn-test" onclick="dockTriggerTestAlert('sub')">⭐ Sub</button>
      <button class="btn-test" onclick="dockTriggerTestAlert('bits')">💎 Bits</button>
      <button class="btn-test" onclick="dockTriggerTestAlert('follow')" style="grid-column: span 2;">👤 Följare</button>
    </div>
  </div>

  <script>
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    const WRITE_SECRET = "Our2ndHomeSecret2026!";
    const GOAL_TARGET_KR = 40000;

    const RANDOM_NAMES = ["Lisa", "Erik", "Maja", "Filip", "Klara", "Johan", "Astrid", "Oskar", "Emma", "William", "Alva", "Lucas", "Ebba", "Hugo", "Saga"];
    const RANDOM_AMOUNTS = [50, 100, 150, 200, 250, 300, 400, 500, 750, 1000];
    const RANDOM_COMMENTS = ["Kämpa på!", "För en god sak ❤️", "Heja er allihopa!", "Nu tar vi målet!", "Bästa streamen!", "Kärlek till Musikhjälpen!", "Hälsningar från soffan!", ""];
    const RANDOM_RAIDERS = ["SuperStreamer", "GamerPro", "PixelQueen", "SpeedyG", "VikingGamer", "NordicGamer", "KnatteLive"];
    const RANDOM_VIEWERS = [15, 34, 78, 125, 184, 250, 390, 520];
    const RANDOM_MONTHS = [1, 2, 3, 6, 9, 12, 18, 24];
    const RANDOM_BITS = [100, 200, 300, 500, 1000, 1500, 2500];

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function parseSafeNumber(val, fallback = 0) {
      const n = typeof val === 'number' ? val : parseFloat(String(val ?? '').replace(/\s+/g, '').replace(',', '.'));
      return Number.isFinite(n) ? n : fallback;
    }

    function formatSEK(num) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(parseSafeNumber(num, 0))) + ' KR';
    }

    let lastGeneratedAlertId = 0;
    function getUniqueAlertId() {
      lastGeneratedAlertId = Math.max(Date.now(), lastGeneratedAlertId + 1);
      return lastGeneratedAlertId;
    }

    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    let currentTotal = 0;
    let isFirebaseOnline = false;
    let isForceSyncing = false;
    let syncTimeoutTimer = null;
    let countdownTimer = null;

    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const dbRef = firebase.database().ref('bossa');
    const connectedRef = firebase.database().ref('.info/connected');

    connectedRef.on('value', (snap) => {
      isFirebaseOnline = Boolean(snap.val());
      updateStatusDisplay();
    });

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      isFirebaseOnline = true;

      if (!data) {
        updateTotalDisplaySmooth(0);
        updateStatusDisplay();
        return;
      }

      currentTotal = Math.max(0, parseSafeNumber(data.total, 0));
      isForceSyncing = Boolean(data.forceSync);

      if (!isForceSyncing && syncTimeoutTimer) {
        clearTimeout(syncTimeoutTimer);
        syncTimeoutTimer = null;
      }

      updateTotalDisplaySmooth(currentTotal);
      updateStatusDisplay();
    }, (error) => {
      console.error("❌ [Firebase] Read error:", error);
      isFirebaseOnline = false;
      updateStatusDisplay();
    });

    function updateTotalDisplaySmooth(num) {
      const safeNum = Math.max(0, parseSafeNumber(num, 0));
      const el = document.getElementById('totalDisplay');
      if (el) el.innerText = formatSEK(safeNum);

      const percent = Math.min(100, Math.max(0, (safeNum / GOAL_TARGET_KR) * 100));
      const bar = document.getElementById('goalProgressBar');
      if (bar) {
        bar.style.width = `${safeNum <= 0 ? 0 : Math.max(1, percent)}%`;
      }

      const targetText = document.getElementById('goalTargetText');
      if (targetText) {
        targetText.innerText = `MÅL: ${formatSEK(GOAL_TARGET_KR)} (${percent.toFixed(1)}%)`;
      }
    }

    function updateStatusDisplay() {
      const pill = document.getElementById('dockStatusPill');
      if (pill) {
        if (!isFirebaseOnline) {
          pill.innerText = "🔴 FRÅNKOPPLAD";
          pill.className = "status-pill offline";
        } else if (isForceSyncing) {
          pill.innerText = "⚡ SYNKAR BÖSSAN...";
          pill.className = "status-pill syncing";
        } else {
          pill.innerText = `🟢 LIVE ANSLUTEN (${formatSEK(currentTotal)})`;
          pill.className = "status-pill online";
        }
      }

      const summary = document.getElementById('dockSummaryText');
      if (summary) {
        summary.innerHTML = `Totalt insamlat: <b>${formatSEK(currentTotal)}</b>`;
      }
    }

    function dockRequestResync() {
      isForceSyncing = true;
      updateStatusDisplay();

      clearTimeout(syncTimeoutTimer);
      syncTimeoutTimer = setTimeout(() => {
        if (isForceSyncing) {
          console.warn("⚠️ Sync request timed out—check if Streamer.bot sync script is running.");
          isForceSyncing = false;
          updateStatusDisplay();
        }
      }, 10000);

      dbRef.update({
        forceSync: true,
        secret: WRITE_SECRET
      }).catch(err => {
        clearTimeout(syncTimeoutTimer);
        isForceSyncing = false;
        updateStatusDisplay();
        alert("Kunde inte begära synk: " + err.message);
      });
    }

    function dockSetTotal() {
      const inputEl = document.getElementById('dockDirectTotalInput');
      const val = parseSafeNumber(inputEl ? inputEl.value : '', NaN);
      if (!Number.isFinite(val) || val < 0) {
        alert("Ange ett giltigt belopp (0 eller högre).");
        return;
      }

      dbRef.transaction((currentData) => {
        const base = (currentData && typeof currentData === 'object') ? currentData : {};
        return Object.assign({}, base, {
          total: val,
          amount: val,
          diff: 0,
          donor: "",
          comment: "",
          alertId: 0,
          alerts: [],
          forceSync: false,
          secret: WRITE_SECRET
        });
      }).catch(err => {
        alert("Kunde inte sätta belopp: " + err.message);
      });
    }

    function dockSubmitManualDonation() {
      const donor = document.getElementById('dockManualName').value.trim() || "Lisa";
      const amount = parseSafeNumber(document.getElementById('dockManualAmount').value, NaN);
      const comment = document.getElementById('dockManualComment').value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("Ange ett giltigt donationsbelopp större än 0.");
        return;
      }

      const uniqueId = getUniqueAlertId();

      dbRef.transaction((currentData) => {
        const base = (currentData && typeof currentData === 'object') ? currentData : {};
        const latestTotal = Math.max(0, parseSafeNumber(base.total, currentTotal));
        const newTotal = latestTotal + amount;
        return Object.assign({}, base, {
          total: newTotal,
          amount: newTotal,
          diff: amount,
          donor: donor,
          comment: comment,
          type: 'donation',
          alertId: uniqueId,
          alerts: [{ type: 'donation', donor: donor, amount: amount, comment: comment }],
          forceSync: false,
          secret: WRITE_SECRET
        });
      }).catch(err => {
        alert("Kunde inte lägga till donation: " + err.message);
      });
    }

    function dockTriggerTestAlert(type) {
      const uniqueId = getUniqueAlertId();
      let alertObj = {};

      if (type === 'donation') {
        alertObj = {
          type: 'donation',
          donor: getRandomItem(RANDOM_NAMES),
          amount: getRandomItem(RANDOM_AMOUNTS),
          comment: getRandomItem(RANDOM_COMMENTS)
        };
      } else if (type === 'raid') {
        alertObj = { type: 'raid', donor: getRandomItem(RANDOM_RAIDERS), viewers: getRandomItem(RANDOM_VIEWERS) };
      } else if (type === 'sub') {
        alertObj = { type: 'sub', donor: getRandomItem(RANDOM_NAMES), months: getRandomItem(RANDOM_MONTHS) };
      } else if (type === 'bits') {
        alertObj = { type: 'bits', donor: getRandomItem(RANDOM_NAMES), bits: getRandomItem(RANDOM_BITS) };
      } else if (type === 'follow') {
        alertObj = { type: 'follow', donor: getRandomItem(RANDOM_NAMES) };
      }

      // Keeps real charity total untouched during alert tests
      dbRef.transaction((currentData) => {
        const base = (currentData && typeof currentData === 'object') ? currentData : {};
        const latestTotal = Math.max(0, parseSafeNumber(base.total, currentTotal));
        return Object.assign({}, base, {
          total: latestTotal,
          diff: 0,
          donor: "",
          comment: "",
          alertId: uniqueId,
          alerts: [alertObj],
          forceSync: false,
          secret: WRITE_SECRET
        });
      }).catch(err => {
        alert("Kunde inte skicka test-alert: " + err.message);
      });
    }

    const directTotalInput = document.getElementById('dockDirectTotalInput');
    if (directTotalInput) {
      directTotalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') dockSetTotal();
      });
    }

    ['dockManualName', 'dockManualAmount', 'dockManualComment'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') dockSubmitManualDonation();
        });
      }
    });

    function updateCountdown() {
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const targetTime = new Date("2026-12-06T20:00:00+01:00").getTime();
      const diff = targetTime - Date.now();

      if (diff <= 0) {
        timerDisplay.innerText = "00:00:00";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const h = String(hours).padStart(2, '0');
      const m = String(minutes).padStart(2, '0');
      const s = String(seconds).padStart(2, '0');

      timerDisplay.innerHTML = `${days}D <span class="sep-dot"></span> ${h}:${m}:${s}`;
    }

    updateTotalDisplaySmooth(0);

    if (isPanel) {
      document.body.classList.add('mode-panel');
    } else {
      document.body.classList.add('mode-overlay');
      updateCountdown();
      countdownTimer = setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
