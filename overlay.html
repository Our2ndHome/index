<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Master Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay or default)
       ======================================================== */
    body.mode-overlay {
      overflow: hidden;
      background-color: transparent;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* Layer Depth Order */
    #layerAlerts   { z-index: 5; }  /* Alerts & rain slide out from behind */
    #layerSchedule { z-index: 10; } /* Bottom sponsor & timeline bar in front */
    #layerGoals    { z-index: 15; } /* Top split milestone wings */
    #layerBossa    { z-index: 20; } /* Top countdown & goal bar in center */
    #layerGiveaway { z-index: 30; } /* Giveaway wheel pops over everything */

    /* ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW (#panel)
       ======================================================== */
    body.mode-panel {
      background-color: #0b0b0d;
      color: #ffffff;
      overflow-y: auto;
      padding: 8px 10px 24px 10px;
    }

    .dock-container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dock-master-header {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dock-master-title {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-hub {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* Simple, clean jump buttons like before */
    .dock-jump-nav {
      display: flex;
      gap: 6px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0b0b0d;
      padding: 2px 0 4px 0;
    }

    .jump-btn {
      flex: 1;
      background: #1e1e24;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 7px 6px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .jump-btn:hover { 
      background: #2b2b34; 
      border-color: #3f3f46; 
    }

    /* Clean Card Sections (Matches goals & giveaway styling) */
    .dock-card-section {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .dock-card-header {
      background: #111114;
      border-bottom: 1px solid #27272a;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a1a1aa;
    }

    .stacked-panel-frame {
      width: 100%;
      border: none;
      display: block;
      background: transparent;
      min-height: 520px;
      height: 540px;
      overflow: hidden;
    }

    #frameSchedule {
      min-height: 580px;
      height: 600px;
    }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW
       ======================================================== -->
  <div id="overlayContainer" style="display: none;">
    <iframe id="layerAlerts" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerSchedule" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGoals" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerBossa" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGiveaway" class="overlay-frame" allow="autoplay"></iframe>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW (CLEAN NATURAL CARDS)
       ======================================================== -->
  <div id="panelContainer" class="dock-container" style="display: none;">
    
    <div class="dock-master-header">
      <div class="dock-master-title">
        <span>KONTROLLPANEL</span>
        <span class="badge-hub">MASTER HUB</span>
      </div>
      <button class="jump-btn" style="flex:0; padding: 4px 8px;" onclick="location.reload()">Ladda om</button>
    </div>

    <!-- Quick Jump Navigation -->
    <div class="dock-jump-nav">
      <button class="jump-btn" onclick="scrollToSection('secBossa')">↓ Bössa</button>
      <button class="jump-btn" onclick="scrollToSection('secSchedule')">↓ Schema</button>
    </div>

    <!-- Section 1: Bössa & Countdown -->
    <div id="secBossa" class="dock-card-section">
      <div class="dock-card-header">
        <span>💰 BÖSSA & INSAMLINGSMÅL</span>
      </div>
      <iframe id="frameBossa" class="stacked-panel-frame" onload="autoResizeFrame(this)"></iframe>
    </div>

    <!-- Section 2: Schedule & Sponsors -->
    <div id="secSchedule" class="dock-card-section">
      <div class="dock-card-header">
        <span>📅 SCHEMA & SPONSORER</span>
      </div>
      <iframe id="frameSchedule" class="stacked-panel-frame" onload="autoResizeFrame(this)"></iframe>
    </div>

  </div>

  <script>
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    if (isPanel) {
      document.body.classList.add('mode-panel');
      document.getElementById('panelContainer').style.display = 'flex';

      document.getElementById('frameBossa').src = "countdown_and_bossa.html#panel";
      document.getElementById('frameSchedule').src = "schedule.html#panel";
    } else {
      document.body.classList.add('mode-overlay');
      document.getElementById('overlayContainer').style.display = 'block';

      document.getElementById('layerAlerts').src = "alerts.html";
      document.getElementById('layerSchedule').src = "schedule.html#overlay";
      document.getElementById('layerGoals').src = "goals.html#overlay";
      document.getElementById('layerBossa').src = "countdown_and_bossa.html#overlay";
      document.getElementById('layerGiveaway').src = "giveaway.html#overlay";
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Automatically adjusts height so cards fit smoothly without double scrollbars
    function autoResizeFrame(iframe) {
      try {
        if (iframe && iframe.contentWindow && iframe.contentWindow.document.body) {
          const h = iframe.contentWindow.document.body.scrollHeight;
          if (h > 150) {
            iframe.style.height = (h + 10) + 'px';
          }
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
