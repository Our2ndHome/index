<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Master Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay or default)
       ======================================================== */
    body.mode-overlay {
      overflow: hidden;
      background-color: transparent;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* Layer Depth Order */
    #layerAlerts    { z-index: 5; }
    #layerSchedule  { z-index: 10; }
    #layerGoals     { z-index: 15; }
    #layerBossa     { z-index: 20; }
    #layerUtmaning  { z-index: 25; }
    #layerGiveaway  { z-index: 30; }

    /* ========================================================
       🎛️ 2. OBS DOCK: ZERO DEAD SPACE FLEX ARCHITECTURE
       ======================================================== */
    body.mode-panel {
      background-color: #0b0b0d;
      color: #ffffff;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 6px;
    }

    .dock-container {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-sizing: border-box;
      flex: 1 1 auto;
    }

    .dock-master-header {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .dock-master-title {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-hub {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* ⚔️ UTMANING CONTROLLER IN MASTER HUB */
    .dock-utmaning-box {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .utmaning-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .utmaning-header-label {
      font-size: 10px;
      font-weight: 900;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-status {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      background: #27272a;
      color: #71717a;
    }

    .badge-status.active {
      background: #ff334b;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 51, 75, 0.6);
      animation: pulseBadge 1.2s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .utmaning-input-row {
      display: flex;
      gap: 6px;
    }

    .utmaning-input {
      flex: 1;
      background: #0b0b0d;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 11px;
      padding: 7px 10px;
      outline: none;
    }

    .utmaning-input:focus {
      border-color: #ace600;
    }

    .btn-utmaning {
      background: #ace600;
      color: #0b0b0d;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-utmaning:hover {
      background: #c3f524;
      transform: translateY(-1px);
    }

    .btn-utmaning.active {
      background: #ff334b !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(255, 51, 75, 0.6);
      animation: pulseBtn 1.2s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(0.98); }
    }

    /* 🎯 BÖSSA: Fits up to Följare with no scrollbar */
    #wrapperBossa {
      flex: 0 0 355px;
      height: 355px;
      width: 100%;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #141418;
      overflow: hidden;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* 🎯 SCHEMA: Automatically expands to fill all remaining height */
    #wrapperSchedule {
      flex: 1 1 auto;
      min-height: 360px;
      width: 100%;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #141418;
      overflow: hidden;
      box-sizing: border-box;
    }

    .stacked-panel-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW
       ======================================================== -->
  <div id="overlayContainer" style="display: none;">
    <iframe id="layerAlerts" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerSchedule" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGoals" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerBossa" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerUtmaning" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGiveaway" class="overlay-frame" allow="autoplay"></iframe>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW
       ======================================================== -->
  <div id="panelContainer" class="dock-container" style="display: none;">
    
    <!-- Header -->
    <div class="dock-master-header">
      <div class="dock-master-title">
        <span>KONTROLLPANEL</span>
        <span class="badge-hub">MASTER HUB</span>
      </div>
    </div>

    <!-- ⚔️ UTMANING QUICK CONTROLLER -->
    <div class="dock-utmaning-box">
      <div class="utmaning-top-row">
        <span class="utmaning-header-label">⚔️ UTMANING</span>
        <span id="utmaningStatusBadge" class="badge-status">AV</span>
      </div>
      <div class="utmaning-input-row">
        <input type="text" id="utmaningCustomText" class="utmaning-input" placeholder="Skriv utmaning (t.ex. Gör 20 squats)..." />
        <button id="btnToggleUtmaning" class="btn-utmaning" onclick="toggleUtmaning()">
          <span id="btnUtmaningIcon">⚔️</span>
          <span id="btnUtmaningText">STARTA UTMANING</span>
        </button>
      </div>
    </div>

    <!-- 🎯 Snug Bössa Box (Fits up to Följare with no scrollbar) -->
    <div id="wrapperBossa">
      <iframe id="frameBossa" class="stacked-panel-frame"></iframe>
    </div>

    <!-- 🎯 Full-Height Schedule Box -->
    <div id="wrapperSchedule">
      <iframe id="frameSchedule" class="stacked-panel-frame"></iframe>
    </div>

  </div>

  <script>
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    // ========================================================
    // 📡 FIREBASE SETUP FOR MASTER HUB
    // ========================================================
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const utmaningDbRef = firebase.database().ref('utmaning');
    let utmaningStateActive = false;

    // BroadcastChannel for instant local syncing
    let localChannel = null;
    try {
      localChannel = new BroadcastChannel('mh_utmaning_channel');
    } catch(e) {}

    function updateUtmaningUI(isActive) {
      utmaningStateActive = isActive;
      const btn = document.getElementById('btnToggleUtmaning');
      const badge = document.getElementById('utmaningStatusBadge');
      const icon = document.getElementById('btnUtmaningIcon');
      const text = document.getElementById('btnUtmaningText');

      if (!btn) return;

      if (isActive) {
        btn.classList.add('active');
        badge.classList.add('active');
        badge.textContent = "AKTIV";
        icon.textContent = "🛑";
        text.textContent = "AVSLUTA UTMANING";
      } else {
        btn.classList.remove('active');
        badge.classList.remove('active');
        badge.textContent = "AV";
        icon.textContent = "⚔️";
        text.textContent = "STARTA UTMANING";
      }
    }

    function toggleUtmaning() {
      const inputEl = document.getElementById('utmaningCustomText');
      const customText = inputEl ? inputEl.value.trim() : "";
      const nextActiveState = !utmaningStateActive;

      const payload = {
        active: nextActiveState,
        text: customText,
        timestamp: Date.now()
      };

      // 1. Update Firebase
      utmaningDbRef.set(payload);

      // 2. Broadcast locally
      if (localChannel) {
        localChannel.postMessage(payload);
      }

      updateUtmaningUI(nextActiveState);
    }

    // Listen to Firebase so dock stays updated across devices
    utmaningDbRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        updateUtmaningUI(Boolean(val.active));
        const inputEl = document.getElementById('utmaningCustomText');
        if (inputEl && val.text && !utmaningStateActive) {
          inputEl.value = val.text;
        }
      }
    });

    // ========================================================
    // 🚀 ROUTING: DOCK CONTROLLER VS OVERLAY VIEW
    // ========================================================
    if (isPanel) {
      document.body.classList.add('mode-panel');
      document.getElementById('panelContainer').style.display = 'flex';

      document.getElementById('frameBossa').src = "countdown_and_bossa.html#panel";
      document.getElementById('frameSchedule').src = "schedule.html#panel";
    } else {
      document.body.classList.add('mode-overlay');
      document.getElementById('overlayContainer').style.display = 'block';

      document.getElementById('layerAlerts').src = "alerts.html";
      document.getElementById('layerSchedule').src = "schedule.html#overlay";
      document.getElementById('layerGoals').src = "goals.html#overlay";
      document.getElementById('layerBossa').src = "countdown_and_bossa.html#overlay";
      document.getElementById('layerUtmaning').src = "utmaningar.html#overlay";
      document.getElementById('layerGiveaway').src = "giveaway.html#overlay";
    }
  </script>
</body>
</html>
