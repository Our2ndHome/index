<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Master Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay or default)
       ======================================================== */
    body.mode-overlay {
      overflow: hidden;
      background-color: transparent;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* Layer Depth Order */
    #layerAlerts   { z-index: 5; }
    #layerSchedule { z-index: 10; }
    #layerGoals    { z-index: 15; }
    #layerBossa    { z-index: 20; }
    #layerGiveaway { z-index: 30; }

    /* ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW (ZERO DEAD SPACE)
       ======================================================== */
    body.mode-panel {
      background-color: #0b0b0d;
      color: #ffffff;
      overflow-y: auto;
      padding: 4px;
    }

    .dock-container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dock-master-header {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 5px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dock-master-title {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-hub {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .btn-swap-order {
      background: #18181c;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-family: inherit;
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }
    .btn-swap-order:hover {
      background: #272730;
      color: #ffffff;
    }

    /* 🎯 Snug frames with ZERO artificial min-height */
    .stacked-panel-frame {
      width: 100%;
      border: none;
      display: block;
      background: transparent;
      height: 310px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #frameSchedule {
      height: 480px;
    }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW
       ======================================================== -->
  <div id="overlayContainer" style="display: none;">
    <iframe id="layerAlerts" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerSchedule" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGoals" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerBossa" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGiveaway" class="overlay-frame" allow="autoplay"></iframe>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW
       ======================================================== -->
  <div id="panelContainer" class="dock-container" style="display: none;">
    
    <div class="dock-master-header">
      <div class="dock-master-title">
        <span>KONTROLLPANEL</span>
        <span class="badge-hub">MASTER HUB</span>
      </div>
      <!-- 🎯 1-Click to swap whether Bössa or Schedule sits on top -->
      <button class="btn-swap-order" onclick="swapPanelOrder()">⇅ Byt ordning</button>
    </div>

    <!-- The 2 Dock Frames -->
    <iframe id="frameBossa" class="stacked-panel-frame"></iframe>
    <iframe id="frameSchedule" class="stacked-panel-frame"></iframe>

  </div>

  <script>
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    let isOrderSwapped = false;

    if (isPanel) {
      document.body.classList.add('mode-panel');
      document.getElementById('panelContainer').style.display = 'flex';

      document.getElementById('frameBossa').src = "countdown_and_bossa.html#panel";
      document.getElementById('frameSchedule').src = "schedule.html#panel";

      // 🎯 Dynamic auto-resizer: Snaps frames tight to their exact content height every 500ms
      setInterval(autoFitFrames, 500);
    } else {
      document.body.classList.add('mode-overlay');
      document.getElementById('overlayContainer').style.display = 'block';

      document.getElementById('layerAlerts').src = "alerts.html";
      document.getElementById('layerSchedule').src = "schedule.html#overlay";
      document.getElementById('layerGoals').src = "goals.html#overlay";
      document.getElementById('layerBossa').src = "countdown_and_bossa.html#overlay";
      document.getElementById('layerGiveaway').src = "giveaway.html#overlay";
    }

    function autoFitFrames() {
      ['frameBossa', 'frameSchedule'].forEach(id => {
        const frame = document.getElementById(id);
        if (frame && frame.contentWindow && frame.contentWindow.document.body) {
          const contentH = frame.contentWindow.document.body.scrollHeight;
          if (contentH > 60) {
            frame.style.height = (contentH + 2) + 'px';
          }
        }
      });
    }

    function swapPanelOrder() {
      const container = document.getElementById('panelContainer');
      const bossa = document.getElementById('frameBossa');
      const schedule = document.getElementById('frameSchedule');
      if (!container || !bossa || !schedule) return;

      isOrderSwapped = !isOrderSwapped;
      if (isOrderSwapped) {
        container.insertBefore(schedule, bossa);
      } else {
        container.insertBefore(bossa, schedule);
      }
    }
  </script>
</body>
</html>
