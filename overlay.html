<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Master Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay or default)
       ======================================================== */
    body.mode-overlay {
      overflow: hidden;
      background-color: transparent;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* Proper stacking order on stream */
    #layerAlerts   { z-index: 5; }  /* Alerts & Emote rain behind overlays */
    #layerSchedule { z-index: 10; } /* Bottom schedule & sponsor bar */
    #layerBossa    { z-index: 20; } /* Top countdown & goal */
    #layerGiveaway { z-index: 30; } /* Giveaway wheel modal */

    /* ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW (#panel)
       ======================================================== */
    body.mode-panel {
      background-color: #0b0b0d;
      color: #ffffff;
      overflow-y: auto;
      padding-bottom: 24px;
    }

    .dock-master-header {
      background: #111114;
      border-bottom: 1px solid #27272a;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10000;
    }

    .dock-master-title {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-hub {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .dock-jump-nav {
      position: sticky;
      top: 36px;
      z-index: 9999;
      display: flex;
      background: #141418;
      border-bottom: 1px solid #27272a;
      padding: 6px;
      gap: 6px;
    }

    .jump-btn {
      flex: 1;
      background: #1e1e24;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .jump-btn:hover { 
      background: #2b2b34; 
      border-color: #3f3f46; 
    }

    .panel-section-divider {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 6px 10px;
      margin: 12px 8px 6px 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a1a1aa;
      display: flex;
      justify-content: space-between;
    }

    .stacked-panel-frame {
      width: 100%;
      border: none;
      display: block;
      background: #0b0b0d;
      overflow: hidden;
    }

    #frameBossa    { height: 560px; }
    #frameGiveaway { height: 460px; }
    #frameSchedule { height: 400px; }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW
       ======================================================== -->
  <div id="overlayContainer" style="display: none;">
    <!-- src attributes are set dynamically via JS below -->
    <iframe id="layerAlerts" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerSchedule" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerBossa" class="overlay-frame" allow="autoplay"></iframe>
    <iframe id="layerGiveaway" class="overlay-frame" allow="autoplay"></iframe>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS DOCK CONTROLLER VIEW
       ======================================================== -->
  <div id="panelContainer" style="display: none;">
    
    <div class="dock-master-header">
      <div class="dock-master-title">
        <span>KONTROLLPANEL</span>
        <span class="badge-hub">MASTER HUB</span>
      </div>
      <button class="jump-btn" style="flex:0; padding: 4px 8px;" onclick="location.reload()">Ladda om</button>
    </div>

    <div class="dock-jump-nav">
      <button class="jump-btn" onclick="scrollToSection('secBossa')">↓ Bössa</button>
      <button class="jump-btn" onclick="scrollToSection('secGiveaway')">↓ Giveaway</button>
      <button class="jump-btn" onclick="scrollToSection('secSchedule')">↓ Schema</button>
    </div>

    <div id="secBossa" class="panel-section-divider">
      <span>💰 BÖSSA & INSAMLINGSMÅL</span>
    </div>
    <iframe id="frameBossa" class="stacked-panel-frame"></iframe>

    <div id="secGiveaway" class="panel-section-divider">
      <span>🎁 GIVEAWAY HJUL</span>
    </div>
    <iframe id="frameGiveaway" class="stacked-panel-frame"></iframe>

    <div id="secSchedule" class="panel-section-divider">
      <span>📅 SCHEMA & SPONSORER</span>
    </div>
    <iframe id="frameSchedule" class="stacked-panel-frame"></iframe>

  </div>

  <script>
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    if (isPanel) {
      // 🎛️ DOCK MODE: Only load the control panel iframes
      document.body.classList.add('mode-panel');
      document.getElementById('panelContainer').style.display = 'block';

      document.getElementById('frameBossa').src = "countdown_and_bossa.html#panel";
      document.getElementById('frameGiveaway').src = "giveaway.html#panel";
      document.getElementById('frameSchedule').src = "schedule.html#panel";
    } else {
      // 📺 OVERLAY MODE: Only load the stream overlay iframes
      document.body.classList.add('mode-overlay');
      document.getElementById('overlayContainer').style.display = 'block';

      document.getElementById('layerAlerts').src = "alerts.html";
      document.getElementById('layerSchedule').src = "schedule.html#overlay";
      document.getElementById('layerBossa').src = "countdown_and_bossa.html#overlay";
      document.getElementById('layerGiveaway').src = "giveaway.html#overlay";
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  </script>
</body>
</html>
