<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: none;
    }

    /* 🌧️ CSS EMOTE RAIN LAYER */
    .emote-rain-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 99990;
    }

    .falling-emote {
      position: absolute;
      top: -100px;
      will-change: transform, opacity;
      animation: fallDown linear forwards;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.95;
      }
      85% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(118vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* 🚨 MAIN ALERT BANNER (Donations & Raids) */
    .alert-banner {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent !important;
      border: none !important;
      padding: 10px 20px;
      max-width: 90vw;
      white-space: normal;
      word-wrap: break-word;
      pointer-events: none;
      z-index: 99999;
    }

    .pos-top {
      top: 40%;
    }

    .pos-bottom {
      top: calc(50% + 210px);
    }

    .highlight {
      color: #ace600 !important;
      text-shadow: 0 0 16px rgba(172, 230, 0, 0.6);
    }

    .donor-name {
      color: #ace600;
      display: block;
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 4px;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(172, 230, 0, 0.6);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
    }

    .alert-comment {
      color: #ffea00;
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      margin-top: 8px;
      text-transform: none;
      white-space: normal;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.3;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    /* 🌟 2-ROW SECONDARY ALERTS (Subs, Gift Subs, Bits, Follows) */
    .minor-alert-badge {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .minor-alert-name {
      font-size: 28px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 18px rgba(172, 230, 0, 0.5);
    }

    .minor-alert-detail {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.85);
    }

    /* 🎬 SMOOTH ANIMATIONS */
    .anim-top-in {
      animation: dropFromTopSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes dropFromTopSmooth {
      0% {
        top: -15%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-bottom-in {
      animation: riseFromBottomSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes riseFromBottomSmooth {
      0% {
        top: 115%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: calc(50% + 210px);
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-exit {
      visibility: visible !important;
      animation: alertExitSmooth 0.4s ease forwards !important;
    }

    @keyframes alertExitSmooth {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
    }
  </style>
</head>
<body>

  <div class="emote-rain-layer" id="emoteRainLayer"></div>
  <div class="alert-banner" id="alertBanner"></div>

  <script>
    (function () {
      try {
        const isSelfDock = window.location.hash.includes('panel') || window.location.hash.includes('dock');
        let isParentDock = false;
        try {
          if (window.parent && window.parent !== window) {
            isParentDock = window.parent.location.hash.includes('panel') || window.parent.location.hash.includes('dock');
          }
        } catch (e) {}

        if (isSelfDock || isParentDock) {
          console.log("Alerts disabled inside panel/dock.");
          return;
        }
      } catch (e) {}

      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // ========================================================
      // 🤖 STREAMER.BOT CHAT BOT CONNECTION (Action: "Send Twitch Message")
      // ========================================================
      const SB_WS_URL = "ws://127.0.0.1:8080/";
      let sbWs = null;
      let isSbConnected = false;
      let sbReconnectTimer = null;
      let sbHelloTimer = null;
      const pendingSbRequests = new Map();

      function scheduleSbReconnect() {
        if (sbReconnectTimer) return;
        sbReconnectTimer = setTimeout(() => {
          sbReconnectTimer = null;
          connectStreamerbot();
        }, 4000);
      }

      function connectStreamerbot() {
        if (sbWs && (sbWs.readyState === WebSocket.CONNECTING || sbWs.readyState === WebSocket.OPEN)) {
          return;
        }

        try {
          sbWs = new WebSocket(SB_WS_URL);
        } catch (e) {
          scheduleSbReconnect();
          return;
        }

        sbWs.onopen = () => {
          clearTimeout(sbHelloTimer);
          sbHelloTimer = setTimeout(() => {
            if (!isSbConnected && sbWs && sbWs.readyState === WebSocket.OPEN) {
              isSbConnected = true;
              console.log("🤖 [Streamer.bot Alerts Chat] Connected & Ready!");
            }
          }, 500);
        };

        sbWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.request === "Hello") {
              clearTimeout(sbHelloTimer);
              if (msg.authentication) {
                console.error("❌ [Streamer.bot] Authentication is enabled, but this script expects no password.");
                return;
              }
              isSbConnected = true;
              console.log("🤖 [Streamer.bot Alerts Chat] Connected & Ready to send messages!");
              return;
            }

            if (msg.id && pendingSbRequests.has(msg.id)) {
              const { resolve, timer } = pendingSbRequests.get(msg.id);
              clearTimeout(timer);
              pendingSbRequests.delete(msg.id);
              resolve(msg);
            }
          } catch (e) {}
        };

        sbWs.onclose = () => {
          clearTimeout(sbHelloTimer);
          isSbConnected = false;
          pendingSbRequests.forEach(({ reject, timer }) => {
            clearTimeout(timer);
            reject(new Error("Streamer.bot connection closed"));
          });
          pendingSbRequests.clear();
          scheduleSbReconnect();
        };

        sbWs.onerror = () => {
          try { sbWs.close(); } catch (e) {}
        };
      }

      async function sendStreamerbotChat(chatMessage) {
        const cleanMsg = String(chatMessage || "").replace(/[\r\n]+/g, " ").trim();
        if (!cleanMsg || !isSbConnected || !sbWs || sbWs.readyState !== WebSocket.OPEN) return;

        const reqId = "act-" + Math.random().toString(36).substring(2, 9);

        try {
          const res = await new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              if (pendingSbRequests.has(reqId)) {
                pendingSbRequests.delete(reqId);
                reject(new Error("Streamer.bot request timeout"));
              }
            }, 3000);

            pendingSbRequests.set(reqId, { resolve, reject, timer });

            try {
              sbWs.send(JSON.stringify({
                request: "DoAction",
                action: { name: "Send Twitch Message" },
                args: { message: cleanMsg },
                id: reqId
              }));
            } catch (err) {
              clearTimeout(timer);
              pendingSbRequests.delete(reqId);
              reject(err);
            }
          });

          if (res && res.status && res.status !== "ok") {
            console.warn("⚠️ [Streamer.bot] 'Send Twitch Message' returned non-ok:", res);
          }
        } catch (err) {
          console.warn("⚠️ [Streamer.bot] Chat message failed:", err.message);
        }
      }

      connectStreamerbot();

      // ========================================================
      // 🎛️ OBS WEBSOCKET & CAMERA CONTROL CONFIGURATION
      // ========================================================
      const OBS_WS_URL = "ws://127.0.0.1:4455";
      const SCENE_GAMING = "Musikhjälpen|Gaming Scene";
      const SCENE_INTERMISSION = "Musikhjälpen|Intermission Scene";

      const SOURCE_WEBCAM = "Webcam Source";
      const SOURCE_WEBCAM_SCENE = "Webcam Scene";

      // Shared lock keys to coordinate Intermission Scene with utmaningar.html
      const LOCK_KEY_ALERT = "mh_scene_lock_alert_ts";
      const LOCK_KEY_UTMANING = "mh_scene_lock_utmaning_ts";
      const LOCK_KEY_RETURN_SCENE = "mh_scene_lock_return_scene";

      try {
        localStorage.removeItem(LOCK_KEY_ALERT);
      } catch (e) {}

      function isLockActive(key, maxAgeMs = 120000) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return false;
          const ts = parseInt(raw, 10);
          return Number.isFinite(ts) && (Date.now() - ts) < maxAgeMs;
        } catch (e) {
          return false;
        }
      }

      let obsWs = null;
      let isObsConnected = false;
      let obsReconnectTimer = null;
      const pendingObsRequests = new Map();

      function scheduleObsReconnect() {
        if (obsReconnectTimer) return;
        obsReconnectTimer = setTimeout(() => {
          obsReconnectTimer = null;
          connectOBS();
        }, 4000);
      }

      function connectOBS() {
        if (obsWs && (obsWs.readyState === WebSocket.CONNECTING || obsWs.readyState === WebSocket.OPEN)) {
          return;
        }

        try {
          obsWs = new WebSocket(OBS_WS_URL);
        } catch (e) {
          scheduleObsReconnect();
          return;
        }

        obsWs.onopen = () => {};

        obsWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.op === 0) {
              if (msg.d && msg.d.authentication) {
                console.error("❌ [OBS WebSocket] Authentication is enabled in OBS, but this script expects no password.");
                return;
              }
              obsWs.send(JSON.stringify({
                op: 1,
                d: { rpcVersion: 1, eventSubscriptions: 1023 }
              }));
            }
            if (msg.op === 2) {
              isObsConnected = true;
              console.log("🔌 [OBS Alerts WebSocket] Connected & Ready!");
            }
            if (msg.op === 7) {
              const { requestId, requestStatus, responseData } = msg.d;
              if (pendingObsRequests.has(requestId)) {
                const { resolve, reject, timer } = pendingObsRequests.get(requestId);
                clearTimeout(timer);
                pendingObsRequests.delete(requestId);
                if (requestStatus && requestStatus.result) {
                  resolve(responseData || {});
                } else {
                  reject(new Error(requestStatus ? requestStatus.comment : "Request failed"));
                }
              }
            }
          } catch (e) {}
        };

        obsWs.onclose = () => {
          isObsConnected = false;
          pendingObsRequests.forEach(({ reject, timer }) => {
            clearTimeout(timer);
            reject(new Error("OBS Connection closed"));
          });
          pendingObsRequests.clear();
          scheduleObsReconnect();
        };

        obsWs.onerror = () => {
          try { obsWs.close(); } catch (e) {}
        };
      }

      function sendObsRequest(requestType, requestData = {}) {
        return new Promise((resolve, reject) => {
          if (!isObsConnected || !obsWs || obsWs.readyState !== WebSocket.OPEN) {
            return reject(new Error("OBS WebSocket not connected"));
          }
          const requestId = "req-" + Math.random().toString(36).substring(2, 9);
          const timer = setTimeout(() => {
            if (pendingObsRequests.has(requestId)) {
              pendingObsRequests.delete(requestId);
              reject(new Error("OBS request timeout"));
            }
          }, 3000);

          pendingObsRequests.set(requestId, { resolve, reject, timer });

          try {
            obsWs.send(JSON.stringify({
              op: 6,
              d: { requestType, requestId, requestData }
            }));
          } catch (err) {
            clearTimeout(timer);
            pendingObsRequests.delete(requestId);
            reject(err);
          }
        });
      }

      async function sendFilterTrigger(sourceName, filterName) {
        if (!isObsConnected) return;
        try {
          await sendObsRequest("SetSourceFilterEnabled", {
            sourceName,
            filterName,
            filterEnabled: false
          });
          await delay(25);
          await sendObsRequest("SetSourceFilterEnabled", {
            sourceName,
            filterName,
            filterEnabled: true
          });
        } catch (err) {
          console.warn(`⚠️ [OBS Filter] "${filterName}" on "${sourceName}" failed:`, err.message);
        }
      }

      async function triggerWebcamMove(direction) {
        if (direction === "in") {
          await Promise.all([
            sendFilterTrigger(SOURCE_WEBCAM, "Move Value in"),
            sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out")
          ]);
        } else {
          await Promise.all([
            sendFilterTrigger(SOURCE_WEBCAM, "Move Value out"),
            sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out")
          ]);
        }
      }

      function isMatchingScene(currentName, targetName) {
        if (!currentName || !targetName) return false;
        const cleanA = currentName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        const cleanB = targetName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        if (cleanA === cleanB) return true;

        const baseA = cleanA.split('|').pop().trim();
        const baseB = cleanB.split('|').pop().trim();
        return baseA === baseB;
      }

      async function getCurrentObsScene() {
        try {
          const res = await sendObsRequest("GetCurrentProgramScene");
          return res.sceneName || res.currentProgramSceneName || "";
        } catch (e) {
          return "";
        }
      }

      async function setObsScene(targetSceneName) {
        try {
          await sendObsRequest("SetCurrentProgramScene", { sceneName: targetSceneName });
          return true;
        } catch (e) {
          const altName = targetSceneName.includes(" | ")
            ? targetSceneName.replace(/\s*\|\s*/g, "|")
            : targetSceneName.replace(/\|/g, " | ");
          try {
            await sendObsRequest("SetCurrentProgramScene", { sceneName: altName });
            return true;
          } catch (e2) {
            console.warn(`⚠️ [OBS Scene] Could not switch to "${targetSceneName}":`, e2.message);
            return false;
          }
        }
      }

      connectOBS();

      // ========================================================
      // 📡 FIREBASE & ASSETS
      // ========================================================
      const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
      const EMOTES_FOLDER = "emotes";

      const CUSTOM_EMOTE_FILES = [
        "Our2ndHome-EmoteHype-500x500.png",
        "Our2ndHome-EmoteLove-500x500.png",
        "Our2ndHome-EmoteWoop-500x500.png",
        "Our2ndHome-IconLogo-512x512x.png",
        "DisgustingFoodMuseum_Sponsor.png",
        "ElinPK_Sponsor.png",
        "EscapeHouse_Sponsor.png",
        "RandomNerd_Sponsor.png"
      ];

      const EMBEDDED_FALLBACK_EMOTES = [
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,88 C50,88 10,55 10,32 C10,18 20,8 34,8 C42,8 50,15 50,15 C50,15 58,8 66,8 C80,8 90,18 90,32 C90,55 50,88 50,88 Z" fill="%23ace600" stroke="%237bb500" stroke-width="4"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,5 64,35 96,40 73,63 78,95 50,80 22,95 27,63 4,40 36,35" fill="%23ffd700" stroke="%23ff9900" stroke-width="4"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,8 90,36 50,92 10,36" fill="%2300e5ff" stroke="%23ffffff" stroke-width="3"/><polygon points="50,8 50,92 10,36" fill="%2300b0ff"/><polygon points="32,36 50,8 68,36 50,92" fill="%23ffffff" opacity="0.6"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 C55,25 75,35 75,55 C75,75 60,95 50,95 C40,95 25,75 25,55 C25,40 40,25 40,15 C40,15 35,30 50,5 Z" fill="%23ff4500"/><path d="M50,35 C53,45 62,52 62,65 C62,75 55,85 50,85 C45,85 38,75 38,65 C38,55 46,45 46,38 Z" fill="%23ffd700"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="15,75 85,75 95,30 68,55 50,20 32,55 5,30" fill="%23ffbb00" stroke="%23cc9900" stroke-width="4"/><circle cx="50" cy="20" r="6" fill="%23ace600"/><circle cx="95" cy="30" r="6" fill="%23ace600"/><circle cx="5" cy="30" r="6" fill="%23ace600"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M35,75 A15,12 0 1,1 20,63 L20,25 L75,15 L75,55 A15,12 0 1,1 60,43 L60,25 L35,30 Z" fill="%2300ffcc" stroke="%2300b399" stroke-width="3"/></svg>'
      ];

      const PAUSE_BETWEEN_ALERTS_MS = 1400;
      const MAX_EMOTE_NODES = 100;

      function getAlertDuration(type) {
        if (type === 'donation') return 30000;
        if (type === 'raid') return 20000;
        return 10000;
      }

      let emoteFileList = CUSTOM_EMOTE_FILES.map(f => `${EMOTES_FOLDER}/${encodeURIComponent(f)}`);
      let lastProcessedAlertId = null;
      let initialLoad = true;
      let localHoldingIntermission = false;

      const alertQueue = [];
      let isProcessingAlert = false;

      let soundChannel = null;
      try {
        soundChannel = new BroadcastChannel('mh_sound_bus');
      } catch (e) {}

      function parseAmount(val, fallback = 50) {
        if (typeof val === 'number' && Number.isFinite(val)) return val;
        if (typeof val === 'string') {
          const cleaned = val.replace(/\s+/g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
          const parsed = parseFloat(cleaned);
          if (Number.isFinite(parsed)) return parsed;
        }
        return fallback;
      }

      function formatSEK(num) {
        const safeNum = parseAmount(num, 50);
        return new Intl.NumberFormat('sv-SE').format(Math.round(safeNum)) + ' KR';
      }

      function escapeHTML(str) {
        return String(str || '').replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
      }

      function preloadImages(urls) {
        urls.forEach(url => {
          const img = new Image();
          img.onerror = () => {
            console.warn(`⚠️ Emote missing, removing from pool: ${url}`);
            emoteFileList = emoteFileList.filter(u => u !== url);
          };
          img.src = url;
        });
      }
      preloadImages(emoteFileList);

      function triggerEmoteRain(count = 8) {
        const list = (emoteFileList && emoteFileList.length > 0) ? emoteFileList : EMBEDDED_FALLBACK_EMOTES;
        const layer = document.getElementById('emoteRainLayer');
        if (!layer) return;

        for (let i = 0; i < count; i++) {
          if (layer.childElementCount >= MAX_EMOTE_NODES) {
            layer.firstElementChild.remove();
          }

          const img = document.createElement('img');
          img.className = 'falling-emote';

          img.onerror = function() {
            this.onerror = null;
            this.src = EMBEDDED_FALLBACK_EMOTES[i % EMBEDDED_FALLBACK_EMOTES.length];
          };

          img.src = list[Math.floor(Math.random() * list.length)];

          const size = Math.floor(Math.random() * 26) + 38;
          const left = Math.random() * 95;
          const duration = parseFloat((Math.random() * 2.0 + 4.2).toFixed(2));
          const delaySec = parseFloat((Math.random() * 0.7).toFixed(2));

          img.style.width = `${size}px`;
          img.style.height = `${size}px`;
          img.style.left = `${left}vw`;
          img.style.animationDuration = `${duration}s`;
          img.style.animationDelay = `${delaySec}s`;

          const cleanupTimer = setTimeout(() => {
            if (img.parentNode) img.remove();
          }, (duration + delaySec + 1) * 1000);

          img.addEventListener('animationend', () => {
            clearTimeout(cleanupTimer);
            img.remove();
          });

          layer.appendChild(img);
        }
      }

      // ========================================================
      // 🔊 CENTRAL AUDIO ENGINE ROUTER (DEFERRED TO OVERLAY.HTML)
      // ========================================================
      function playAlertSound(type, duration) {
        return new Promise((resolve) => {
          const soundType = (type === 'giftsub' || type === 'giftbomb') ? 'sub' : type;
          const triggerId = "alt-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7);

          let hasParent = false;
          try {
            hasParent = !!(window.parent && window.parent !== window);
          } catch (e) {
            hasParent = false;
          }

          if (hasParent) {
            window.parent.postMessage({ type: 'PLAY_SOUND', soundType, triggerId }, '*');
          } else {
            if (soundChannel) {
              try {
                soundChannel.postMessage({ type: 'PLAY_SOUND', soundType, triggerId });
              } catch (e) {}
            }

            try {
              let localFallback = '';
              if (soundType === 'raid') localFallback = "sounds/raid_alert.mp3";
              else if (soundType === 'sub' || soundType === 'bits' || soundType === 'follow') localFallback = "sounds/ping_alert.mp3";
              else localFallback = "sounds/0.mp3";

              const audio = new Audio(localFallback);
              audio.volume = 0.8;
              audio.play().catch(() => {});
            } catch (e) {}
          }

          setTimeout(resolve, Math.min(duration, 8000));
        });
      }

      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
      }
      const dbRef = firebase.database().ref('bossa');

      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();

        if (initialLoad) {
          lastProcessedAlertId = (data && data.alertId !== undefined) ? data.alertId : null;
          initialLoad = false;
          return;
        }

        if (!data) return;

        const hasValidAlertId = data.alertId !== undefined && data.alertId !== null && data.alertId !== '' && data.alertId !== 0;
        if (hasValidAlertId && data.alertId !== lastProcessedAlertId) {
          lastProcessedAlertId = data.alertId;

          const alertsArray = Array.isArray(data.alerts)
            ? data.alerts
            : (data.alerts && typeof data.alerts === 'object' ? Object.values(data.alerts) : []);

          if (alertsArray.length > 0) {
            alertsArray.forEach(item => {
              if (item && typeof item === 'object') enqueueAlert(item);
            });
          } else if (data.diff > 0 || data.donor) {
            const fallbackAmt = (data.diff !== undefined && data.diff !== null && data.diff > 0)
              ? data.diff
              : (data.amount !== undefined && data.amount !== null ? data.amount : 50);

            enqueueAlert({
              type: data.type || 'donation',
              donor: data.donor || "Givare",
              amount: fallbackAmt,
              comment: data.comment || ""
            });
          }
        }
      }, (error) => {
        console.error("❌ [Firebase] Listener error:", error);
      });

      function enqueueAlert(item) {
        alertQueue.push(item);
        processAlertQueue();
      }

      async function processAlertQueue() {
        if (isProcessingAlert || alertQueue.length === 0) return;
        isProcessingAlert = true;

        let rainInterval = null;
        const banner = document.getElementById('alertBanner');

        try {
          const item = alertQueue.shift();
          const type = String(item.type || 'donation').toLowerCase().trim();
          const supportedTypes = ['donation', 'raid', 'sub', 'giftsub', 'giftbomb', 'bits', 'follow'];

          if (!supportedTypes.includes(type)) {
            console.warn("⚠️ Skipping unknown alert type:", type, item);
            return;
          }

          const displayDuration = getAlertDuration(type);
          const isDonationOrRaid = (type === 'donation' || type === 'raid');

          // 🎬 SWITCH TO INTERMISSION SCENE (Coordinated with utmaningar.html)
          if (isDonationOrRaid && isObsConnected) {
            try { localStorage.setItem(LOCK_KEY_ALERT, String(Date.now())); } catch (e) {}

            if (!localHoldingIntermission) {
              const currentScene = await getCurrentObsScene();
              if (isMatchingScene(currentScene, SCENE_GAMING)) {
                await triggerWebcamMove("out");
                const switched = await setObsScene(SCENE_INTERMISSION);
                if (switched) {
                  localHoldingIntermission = true;
                  try { localStorage.setItem(LOCK_KEY_RETURN_SCENE, currentScene); } catch (e) {}
                  await delay(350);
                }
              } else if (isMatchingScene(currentScene, SCENE_INTERMISSION) && isLockActive(LOCK_KEY_UTMANING, 300000)) {
                localHoldingIntermission = true;
              }
            }
          }

          banner.className = 'alert-banner';
          let chatAnnouncement = "";

          // 🎯 1. DONATION ALERT
          if (type === 'donation') {
            const rawDonor = String(item.donor || item.name || '').trim();
            const rawComment = String(item.comment || item.message || '').trim();
            const amountFormatted = formatSEK(parseAmount(item.amount, 50));

            const isAnonDonor = /hemlig\s*hj[aä]lte|anonym/i.test(rawDonor) ||
                                !rawDonor ||
                                rawDonor.toLowerCase() === 'givare';
            const isBoilerplateHeroComment = /hemlig\s*hj[aä]lte\s*gav\s*en\s*g[aå]va/i.test(rawComment);
            const isSecretHero = isAnonDonor || isBoilerplateHeroComment;

            if (isSecretHero) {
              const cleanComment = isBoilerplateHeroComment ? '' : rawComment;

              banner.innerHTML = `
                <span class="donor-name">EN HEMLIG HJÄLTE</span>
                <div class="alert-subtext">GAV <span class="highlight">${amountFormatted}</span>!</div>
                ${cleanComment ? `<div class="alert-comment">"${escapeHTML(cleanComment)}"</div>` : ''}
              `;

              chatAnnouncement = `our2ndHomeL En hemlig hjälte gav ${amountFormatted}!${cleanComment ? ` "${cleanComment}"` : ''} our2ndHomeR`;
            } else {
              banner.innerHTML = `
                <span class="donor-name">${escapeHTML(rawDonor)}</span>
                <div class="alert-subtext">DONERADE <span class="highlight">${amountFormatted}</span>!</div>
                ${rawComment ? `<div class="alert-comment">"${escapeHTML(rawComment)}"</div>` : ''}
              `;

              chatAnnouncement = `our2ndHomeL ${rawDonor} donerade ${amountFormatted}!${rawComment ? ` "${rawComment}"` : ''} our2ndHomeR`;
            }

            void banner.offsetWidth;
            banner.classList.add('pos-top', 'anim-top-in');
          }
          // 🎯 2. RAID ALERT
          else if (type === 'raid') {
            const raider = String(item.donor || item.name || 'Raider').trim();
            const viewers = Math.max(1, parseInt(item.viewers, 10) || 1);
            banner.innerHTML = `
              <span class="donor-name">${escapeHTML(raider)}</span>
              <div class="alert-subtext">RAIDAR MED <span class="highlight">${viewers}</span> TITTARE!</div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-top', 'anim-top-in');

            chatAnnouncement = `our2ndHomeL ${raider} raidar med ${viewers} tittare! our2ndHomeR`;
          }
          // 🎯 3. SECONDARY ALERTS
          else if (type === 'sub') {
            const subber = String(item.donor || item.name || 'Tittare').trim();
            const months = Math.max(1, parseInt(item.months, 10) || 1);
            banner.innerHTML = `
              <div class="minor-alert-badge">
                <div class="minor-alert-name">${escapeHTML(subber)}</div>
                <div class="minor-alert-detail">PRENUMERERADE I <span class="highlight">${months} MÅN</span>!</div>
              </div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-bottom', 'anim-bottom-in');

            chatAnnouncement = `our2ndHomeL ${subber} prenumererade i ${months} mån! our2ndHomeR`;
          }
          else if (type === 'giftsub') {
            const gifter = String(item.donor || item.name || 'Tittare').trim();
            const recipient = String(item.recipient || 'Tittare').trim();
            banner.innerHTML = `
              <div class="minor-alert-badge">
                <div class="minor-alert-name">${escapeHTML(gifter)}</div>
                <div class="minor-alert-detail">GAV EN SUB TILL <span class="highlight">${escapeHTML(recipient)}</span>!</div>
              </div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-bottom', 'anim-bottom-in');

            chatAnnouncement = `our2ndHomeL ${gifter} gav en sub till ${recipient}! our2ndHomeR`;
          }
          else if (type === 'giftbomb') {
            const gifter = String(item.donor || item.name || 'Tittare').trim();
            const gifts = Math.max(1, parseInt(item.gifts || item.amount, 10) || 1);
            banner.innerHTML = `
              <div class="minor-alert-badge">
                <div class="minor-alert-name">${escapeHTML(gifter)}</div>
                <div class="minor-alert-detail">GAV BORT <span class="highlight">${gifts} ${gifts === 1 ? 'SUB' : 'SUBS'}</span>!</div>
              </div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-bottom', 'anim-bottom-in');

            chatAnnouncement = `our2ndHomeL ${gifter} gav bort ${gifts} ${gifts === 1 ? 'sub' : 'subs'}! our2ndHomeR`;
          }
          else if (type === 'bits') {
            const cheerer = String(item.donor || item.name || 'Tittare').trim();
            const bits = Math.max(1, parseInt(item.bits || item.amount, 10) || 100);
            banner.innerHTML = `
              <div class="minor-alert-badge">
                <div class="minor-alert-name">${escapeHTML(cheerer)}</div>
                <div class="minor-alert-detail">CHEERADE <span class="highlight">${bits} BITS</span>!</div>
              </div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-bottom', 'anim-bottom-in');

            chatAnnouncement = `our2ndHomeL ${cheerer} cheerade ${bits} bits! our2ndHomeR`;
          }
          else if (type === 'follow') {
            const follower = String(item.donor || item.name || 'Någon').trim();
            banner.innerHTML = `
              <div class="minor-alert-badge">
                <div class="minor-alert-name">${escapeHTML(follower)}</div>
                <div class="minor-alert-detail">FÖLJER KANALEN!</div>
              </div>
            `;
            void banner.offsetWidth;
            banner.classList.add('pos-bottom', 'anim-bottom-in');

            chatAnnouncement = `our2ndHomeL ${follower} började följa. our2ndHomeR`;
          }

          // 💬 Send automated message to Twitch chat via Streamer.bot
          if (chatAnnouncement) {
            sendStreamerbotChat(chatAnnouncement);
          }

          if (isDonationOrRaid) {
            triggerEmoteRain(35);
            rainInterval = setInterval(() => {
              triggerEmoteRain(8);
            }, 900);
          }

          await Promise.all([
            playAlertSound(type, displayDuration),
            delay(displayDuration)
          ]);

          if (rainInterval) {
            clearInterval(rainInterval);
            rainInterval = null;
          }

          banner.classList.remove('anim-top-in', 'anim-bottom-in');
          banner.classList.add('anim-exit');
          await delay(400);

          banner.className = 'alert-banner';
          banner.innerHTML = '';

          // 🎬 SWITCH BACK TO GAMING SCENE (unless another donation/raid or active Utmaning holds Intermission)
          const nextItem = alertQueue[0];
          const nextType = nextItem ? String(nextItem.type || 'donation').toLowerCase().trim() : '';
          const nextIsDonationOrRaid = nextType === 'donation' || nextType === 'raid';

          if (!nextIsDonationOrRaid) {
            try { localStorage.removeItem(LOCK_KEY_ALERT); } catch (e) {}

            if (localHoldingIntermission && !isLockActive(LOCK_KEY_UTMANING, 300000)) {
              let returnScene = "";
              try {
                returnScene = localStorage.getItem(LOCK_KEY_RETURN_SCENE) || "";
                localStorage.removeItem(LOCK_KEY_RETURN_SCENE);
              } catch (e) {}

              if (returnScene && isObsConnected) {
                const activeScene = await getCurrentObsScene();
                if (isMatchingScene(activeScene, SCENE_INTERMISSION)) {
                  await triggerWebcamMove("in");
                  await setObsScene(returnScene);
                  await delay(500);
                }
              }
            }
            localHoldingIntermission = false;
          }
        } catch (err) {
          console.error("❌ [Alert Queue] Unexpected error while processing alert:", err);
          if (banner) {
            banner.className = 'alert-banner';
            banner.innerHTML = '';
          }
          localHoldingIntermission = false;
          try { localStorage.removeItem(LOCK_KEY_ALERT); } catch (e) {}
        } finally {
          if (rainInterval) {
            clearInterval(rainInterval);
          }
          setTimeout(() => {
            isProcessingAlert = false;
            processAlertQueue();
          }, PAUSE_BETWEEN_ALERTS_MS);
        }
      }
    })();
  </script>
</body>
</html>
