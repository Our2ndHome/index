<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: none;
    }

    /* ========================================================
       🌧️ EMOTE RAIN LAYER
       ======================================================== */
    .emote-rain-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 99990;
    }

    .falling-emote {
      position: absolute;
      top: -100px;
      will-change: transform, opacity;
      animation: fallDown linear forwards;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.95;
      }
      85% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* ========================================================
       🚨 MAIN ALERT BANNER (Donations & Raids)
       ======================================================== */
    .alert-banner {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent !important;
      border: none !important;
      padding: 10px 20px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 99999;
    }

    .highlight {
      color: #ace600 !important;
      text-shadow: 0 0 16px rgba(172, 230, 0, 0.6);
    }

    .donor-name {
      color: #ace600;
      display: block;
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(172, 230, 0, 0.6);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
    }

    .alert-comment {
      color: #ffea00;
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      margin-top: 8px;
      text-transform: none;
      white-space: normal;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.3;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    /* ========================================================
       🌟 2-ROW SECONDARY ALERTS (Subs, Bits, Follows)
       ======================================================== */
    .minor-alert-badge {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    /* Upper Row: Name in #ace600 with soft glow */
    .minor-alert-name {
      font-size: 28px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 18px rgba(172, 230, 0, 0.5);
    }

    /* Lower Row: Action & Highlighted Value */
    .minor-alert-detail {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.85);
    }

    /* ========================================================
       🎬 SMOOTH ANIMATIONS
       ======================================================== */
    .anim-top-in {
      animation: dropFromTopSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes dropFromTopSmooth {
      0% {
        top: -15%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-bottom-in {
      animation: riseFromBottomSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes riseFromBottomSmooth {
      0% {
        top: 115%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: calc(50% + 210px);
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-exit {
      animation: alertExitSmooth 0.4s ease forwards !important;
    }

    @keyframes alertExitSmooth {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
    }
  </style>
</head>
<body>

  <!-- Falling Emote Layer -->
  <div class="emote-rain-layer" id="emoteRainLayer"></div>

  <!-- Main Alert Banner Container -->
  <div class="alert-banner" id="alertBanner"></div>

  <script>
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds";
    const EMOTES_FOLDER = "emotes";

    // ========================================================
    // 💡 100% RELIABLE CUSTOM EMOTES LIST
    // Type the filenames of your emotes here (case-sensitive!).
    // This bypasses GitHub API rate limits completely!
    // ========================================================
    const CUSTOM_EMOTE_FILES = [
      // Examples (add your actual filenames inside your "emotes" folder):
      // "pepe.png",
      // "cat.gif",
      // "heart.png"
      "Favicon-very-new.png",
      "Our2ndHome-EmoteHype-500x500.png",
      "Our2ndHome-EmoteLove-500x500.png",
      "Our2ndHome-EmoteWoop-500x500.png",
      "Our2ndHome-IconLogo-512x512.png",
      "SillySanta.png",
      "dfgdfgd-removebg-preview.png",
      "evighets-removebg-preview.png",
      "nordpuls-storlogo-smaller.png"
    ];

    // High-availability CDN Twitch backup emotes (always works 100% of the time)
    const BACKUP_EMOTES = [
      'https://static-cdn.jtvnw.net/emoticons/v2/emotesv2_5b2d2873130c497491d96096a60db2a4/default/dark/3.0', // LUL
      'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/3.0', // Kappa
      'https://static-cdn.jtvnw.net/emoticons/v2/305954156/default/dark/3.0', // PogChamp
      'https://static-cdn.jtvnw.net/emoticons/v2/88/default/dark/3.0', // PogChamp classic
      'https://static-cdn.jtvnw.net/emoticons/v2/emotesv2_dc2427a118844855928d395a1215b02b/default/dark/3.0' // Heart
    ];

    const SOUND_RAID = "https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"; 
    const SOUND_SUB_BITS_FOLLOW = "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"; 

    const SOUND_VOLUME_MAIN = 0.8;
    const SOUND_VOLUME_MINOR = 0.5;
    const MIN_ALERT_DISPLAY_MS = 4800;
    const PAUSE_BETWEEN_ALERTS_MS = 1400;

    const BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3'
    ];

    let soundFileList = [...BACKUP_SOUNDS];
    let emoteFileList = [];
    let lastProcessedAlertId = 0;
    let initialLoad = true;

    const alertQueue = [];
    let isProcessingAlert = false;

    function formatSEK(num) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(num)) + ' KR';
    }

    // Preloader: warms up images in browser memory so they appear instantly
    function preloadImages(urls) {
      urls.forEach(url => {
        const img = new Image();
        img.src = url;
      });
    }
    preloadImages(BACKUP_EMOTES);

    // Load assets
    async function loadAssets() {
      // 1. Build from manual array if provided (bypasses rate limit)
      if (CUSTOM_EMOTE_FILES.length > 0) {
        emoteFileList = CUSTOM_EMOTE_FILES.map(f => `${EMOTES_FOLDER}/${encodeURIComponent(f)}`);
        preloadImages(emoteFileList);
      }

      // 2. Fetch sounds
      try {
        const soundRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
        if (soundRes.ok) {
          const files = await soundRes.json();
          const sounds = files
            .filter(f => f.name.match(/\.(mp3|wav|ogg)$/i))
            .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);
          if (sounds.length > 0) soundFileList = sounds;
        }
      } catch(e) {}

      // 3. Fallback scan GitHub API for emotes if manual array was empty
      if (emoteFileList.length === 0) {
        try {
          const emoteRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${EMOTES_FOLDER}`);
          if (emoteRes.ok) {
            const files = await emoteRes.json();
            const emotes = files
              .filter(f => f.name.match(/\.(png|gif|webp|jpg|jpeg)$/i))
              .map(f => f.download_url || `${EMOTES_FOLDER}/${encodeURIComponent(f.name)}`);
            if (emotes.length > 0) {
              emoteFileList = emotes;
              preloadImages(emoteFileList);
            }
          }
        } catch(e) {}
      }
    }
    loadAssets();

    // Emote rain generator with automatic broken-image fallback
    function triggerEmoteRain(count = 35) {
      const list = emoteFileList.length > 0 ? emoteFileList : BACKUP_EMOTES;
      const layer = document.getElementById('emoteRainLayer');
      layer.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.className = 'falling-emote';
        img.src = list[Math.floor(Math.random() * list.length)];

        // Fail-safe: If any image 404s, replace it with a Twitch CDN emote immediately!
        img.onerror = function() {
          this.onerror = null;
          this.src = BACKUP_EMOTES[Math.floor(Math.random() * BACKUP_EMOTES.length)];
        };

        const size = Math.floor(Math.random() * 26) + 38;
        const left = Math.random() * 95;
        const duration = (Math.random() * 1.4 + 2.4).toFixed(2);
        const delay = (Math.random() * 0.9).toFixed(2);

        img.style.width = `${size}px`;
        img.style.height = `${size}px`;
        img.style.left = `${left}vw`;
        img.style.animationDuration = `${duration}s`;
        img.style.animationDelay = `${delay}s`;

        layer.appendChild(img);
      }

      setTimeout(() => {
        layer.innerHTML = '';
      }, 5000);
    }

    function playAlertSound(type) {
      return new Promise((resolve) => {
        let soundUrl = '';
        let volume = SOUND_VOLUME_MAIN;

        if (type === 'raid') {
          soundUrl = SOUND_RAID;
          volume = SOUND_VOLUME_MAIN;
        } else if (type === 'sub' || type === 'bits' || type === 'follow') {
          soundUrl = SOUND_SUB_BITS_FOLLOW;
          volume = SOUND_VOLUME_MINOR;
        } else {
          if (soundFileList.length > 0) {
            soundUrl = soundFileList[Math.floor(Math.random() * soundFileList.length)];
          }
        }

        if (!soundUrl) return resolve();

        try {
          const audio = new Audio(soundUrl);
          audio.volume = volume;
          let done = false;
          const finish = () => { if (!done) { done = true; resolve(); } };
          audio.onended = finish;
          audio.onerror = finish;
          audio.play().catch(() => done());
          setTimeout(finish, 6500);
        } catch(e) { resolve(); }
      });
    }

    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const dbRef = firebase.database().ref('bossa');

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (!initialLoad && data.alertId && data.alertId !== lastProcessedAlertId) {
        lastProcessedAlertId = data.alertId;

        if (Array.isArray(data.alerts) && data.alerts.length > 0) {
          data.alerts.forEach(item => enqueueAlert(item));
        } else if (data.diff > 0 || data.donor) {
          enqueueAlert({
            type: data.type || 'donation',
            donor: data.donor || "Givare",
            amount: data.diff || data.amount || 50,
            comment: data.comment || ""
          });
        }
      } else if (initialLoad) {
        lastProcessedAlertId = data.alertId || 0;
        initialLoad = false;
      }
    });

    function enqueueAlert(item) {
      alertQueue.push(item);
      processAlertQueue();
    }

    async function processAlertQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;
      isProcessingAlert = true;

      const item = alertQueue.shift();
      const banner = document.getElementById('alertBanner');
      const type = (item.type || 'donation').toLowerCase();

      banner.className = 'alert-banner';

      // 1. Upper Alerts (Donations & Raids)
      if (type === 'donation') {
        banner.innerHTML = `
          <span class="donor-name">${item.donor || item.name || 'Givare'}</span>
          <div class="alert-subtext">DONERADE <span class="highlight">${formatSEK(item.amount || 50)}</span>!</div>
          ${item.comment ? `<div class="alert-comment">"${item.comment}"</div>` : ''}
        `;
        banner.classList.add('anim-top-in');
      } 
      else if (type === 'raid') {
        banner.innerHTML = `
          <span class="donor-name">${item.donor || item.name || 'Raider'}</span>
          <div class="alert-subtext">RAIDAR MED <span class="highlight">${item.viewers || 1}</span> TITTARNA!</div>
        `;
        banner.classList.add('anim-top-in');
      } 

      // 2. Lower Secondary Alerts (Name in #ace600 on top, Action on bottom)
      else if (type === 'sub') {
        const months = item.months || 1;
        banner.innerHTML = `
          <div class="minor-alert-badge">
            <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
            <div class="minor-alert-detail">PRENUMERERADE I <span class="highlight">${months} MÅN</span>!</div>
          </div>
        `;
        banner.classList.add('anim-bottom-in');
      } 
      else if (type === 'bits') {
        const bits = item.bits || item.amount || 100;
        banner.innerHTML = `
          <div class="minor-alert-badge">
            <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
            <div class="minor-alert-detail">CHEERADE <span class="highlight">${bits} BITS</span>!</div>
          </div>
        `;
        banner.classList.add('anim-bottom-in');
      }
      else if (type === 'follow') {
        banner.innerHTML = `
          <div class="minor-alert-badge">
            <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
            <div class="minor-alert-detail">FÖLJER KANALEN!</div>
          </div>
        `;
        banner.classList.add('anim-bottom-in');
      }

      triggerEmoteRain(35);
      const soundPromise = playAlertSound(type);
      const displayPromise = new Promise(resolve => setTimeout(resolve, MIN_ALERT_DISPLAY_MS));

      await Promise.all([soundPromise, displayPromise]);

      banner.classList.remove('anim-top-in', 'anim-bottom-in');
      banner.classList.add('anim-exit');
      await new Promise(r => setTimeout(r, 400));

      banner.className = 'alert-banner';
      banner.innerHTML = '';

      setTimeout(() => {
        isProcessingAlert = false;
        processAlertQueue();
      }, PAUSE_BETWEEN_ALERTS_MS);
    }
  </script>
</body>
</html>
