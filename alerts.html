<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Stream Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      background-color: transparent;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: none;
    }

    /* 🌧️ HARDWARE-ACCELERATED EMOTE RAIN CANVAS */
    #emoteRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99990;
    }

    /* 🚨 MAIN ALERT BANNER (Donations & Raids) */
    .alert-banner {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent !important;
      border: none !important;
      padding: 10px 20px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 99999;
    }

    .highlight {
      color: #ace600 !important;
      text-shadow: 0 0 16px rgba(172, 230, 0, 0.6);
    }

    .donor-name {
      color: #ace600;
      display: block;
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(172, 230, 0, 0.6);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
    }

    .alert-comment {
      color: #ffea00;
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      margin-top: 8px;
      text-transform: none;
      white-space: normal;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.3;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95);
    }

    /* 🌟 2-ROW SECONDARY ALERTS (Subs, Bits, Follows) */
    .minor-alert-badge {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .minor-alert-name {
      font-size: 28px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 18px rgba(172, 230, 0, 0.5);
    }

    .minor-alert-detail {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.85);
    }

    /* 🎬 SMOOTH ANIMATIONS */
    .anim-top-in {
      animation: dropFromTopSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes dropFromTopSmooth {
      0% {
        top: -15%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-bottom-in {
      animation: riseFromBottomSmooth 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      visibility: visible !important;
    }

    @keyframes riseFromBottomSmooth {
      0% {
        top: 115%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }
      100% {
        top: calc(50% + 210px);
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .anim-exit {
      animation: alertExitSmooth 0.4s ease forwards !important;
    }

    @keyframes alertExitSmooth {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
    }
  </style>
</head>
<body>

  <!-- 🌧️ Continuous Canvas Rain Layer -->
  <canvas id="emoteRainCanvas"></canvas>

  <!-- Main Alert Banner Container -->
  <div class="alert-banner" id="alertBanner"></div>

  <script>
    (function () {
      // 🛡️ DOCK BLOCK: Never run alerts inside OBS Dock frames
      try {
        const isSelfDock = window.location.hash.includes('panel') || window.location.hash.includes('dock');
        let isParentDock = false;
        try {
          if (window.parent && window.parent !== window) {
            isParentDock = window.parent.location.hash.includes('panel') || window.parent.location.hash.includes('dock');
          }
        } catch (e) {}

        if (isSelfDock || isParentDock) {
          console.log("Alerts disabled inside panel/dock.");
          return;
        }
      } catch (e) {}

      // ========================================================
      // 🎛️ OBS WEBSOCKET v5 AUTOMATIC SCENE SWITCHER
      // ========================================================
      const OBS_WS_URL = "ws://127.0.0.1:4455";
      const SCENE_GAMING = "Musikhjälpen|Gaming Scene";
      const SCENE_INTERMISSION = "Musikhjälpen|Intermission Scene";

      let obsWs = null;
      let isObsConnected = false;
      const pendingObsRequests = new Map();

      function connectOBS() {
        try {
          obsWs = new WebSocket(OBS_WS_URL);
        } catch (e) {
          setTimeout(connectOBS, 5000);
          return;
        }

        obsWs.onopen = () => {};

        obsWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.op === 0) {
              obsWs.send(JSON.stringify({
                op: 1,
                d: { rpcVersion: 1, eventSubscriptions: 1023 }
              }));
            }
            if (msg.op === 2) {
              isObsConnected = true;
              console.log("🔌 [OBS WebSocket] Connected & Ready to Switch Scenes!");
            }
            if (msg.op === 7) {
              const { requestId, requestStatus, responseData } = msg.d;
              if (pendingObsRequests.has(requestId)) {
                const { resolve, reject } = pendingObsRequests.get(requestId);
                pendingObsRequests.delete(requestId);
                if (requestStatus && requestStatus.result) {
                  resolve(responseData);
                } else {
                  reject(new Error(requestStatus ? requestStatus.comment : "Request failed"));
                }
              }
            }
          } catch (e) {}
        };

        obsWs.onclose = () => {
          isObsConnected = false;
          pendingObsRequests.forEach(({ reject }) => reject(new Error("OBS Connection closed")));
          pendingObsRequests.clear();
          setTimeout(connectOBS, 4000);
        };

        obsWs.onerror = () => {
          try { obsWs.close(); } catch (e) {}
        };
      }

      function sendObsRequest(requestType, requestData = {}) {
        return new Promise((resolve, reject) => {
          if (!isObsConnected || !obsWs || obsWs.readyState !== WebSocket.OPEN) {
            return reject(new Error("OBS WebSocket not connected"));
          }
          const requestId = "req-" + Math.random().toString(36).substring(2, 9);
          pendingObsRequests.set(requestId, { resolve, reject });
          obsWs.send(JSON.stringify({
            op: 6,
            d: { requestType, requestId, requestData }
          }));

          setTimeout(() => {
            if (pendingObsRequests.has(requestId)) {
              pendingObsRequests.delete(requestId);
              reject(new Error("OBS request timeout"));
            }
          }, 3000);
        });
      }

      function isMatchingScene(currentName, targetName) {
        if (!currentName || !targetName) return false;
        const cleanA = currentName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        const cleanB = targetName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        return cleanA === cleanB;
      }

      async function getCurrentObsScene() {
        try {
          const res = await sendObsRequest("GetCurrentProgramScene");
          return res.currentProgramSceneName || "";
        } catch (e) {
          return "";
        }
      }

      async function setObsScene(targetSceneName) {
        try {
          await sendObsRequest("SetCurrentProgramScene", { sceneName: targetSceneName });
        } catch (e) {
          const altName = targetSceneName.includes(" | ")
            ? targetSceneName.replace(/\s*\|\s*/g, "|")
            : targetSceneName.replace(/\|/g, " | ");
          try {
            await sendObsRequest("SetCurrentProgramScene", { sceneName: altName });
          } catch (e2) {}
        }
      }

      connectOBS();

      // ========================================================
      // 📡 FIREBASE & ASSETS
      // ========================================================
      const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
      const SOUNDS_FOLDER = "sounds";
      const EMOTES_FOLDER = "emotes";

      const CUSTOM_SOUND_FILES = [
        "0.mp3", "1.mp3", "2.mp3", "3.mp3", "4.mp3",
        "5.mp3", "6.mp3", "7.mp3", "8.mp3", "9.mp3"
      ];

      const CUSTOM_EMOTE_FILES = [
        "Our2ndHome-EmoteHype-500x500.png",
        "Our2ndHome-EmoteLove-500x500.png",
        "Our2ndHome-EmoteWoop-500x500.png",
        "Our2ndHome-IconLogo-512x512x.png",
        "DisgustingFoodMuseum_Sponsor.png",
        "ElinPK_Sponsor.png",
        "EscapeHouse_Sponsor.png",
        "RandomNerd_Sponsor.png"
      ];

      const SOUND_RAID = "https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"; 
      const SOUND_SUB_BITS_FOLLOW = "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"; 

      const SOUND_VOLUME_MAIN = 0.8;
      const SOUND_VOLUME_MINOR = 0.5;

      // 🎯 HARDCODED: Exactly 30 seconds alert display
      const MIN_ALERT_DISPLAY_MS = 30000;
      const PAUSE_BETWEEN_ALERTS_MS = 1400;

      let soundFileList = CUSTOM_SOUND_FILES.map(f => `${SOUNDS_FOLDER}/${f}`);
      let lastProcessedAlertId = 0;
      let initialLoad = true;

      // 🎲 10-SOUND SHUFFLE BAG
      let soundPool = [];
      let lastPlayedSound = null;

      function getNextDonationSound() {
        if (!soundFileList || soundFileList.length === 0) return '';
        if (soundFileList.length === 1) return soundFileList[0];

        if (soundPool.length === 0) {
          soundPool = [...soundFileList];
          for (let i = soundPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [soundPool[i], soundPool[j]] = [soundPool[j], soundPool[i]];
          }
          if (soundPool[soundPool.length - 1] === lastPlayedSound && soundPool.length > 1) {
            [soundPool[soundPool.length - 1], soundPool[0]] = [soundPool[0], soundPool[soundPool.length - 1]];
          }
        }

        const nextSound = soundPool.pop();
        lastPlayedSound = nextSound;
        return nextSound;
      }

      function formatSEK(num) {
        return new Intl.NumberFormat('sv-SE').format(Math.round(num)) + ' KR';
      }

      // ========================================================
      // 🌧️ CONTINUOUS HARDWARE-ACCELERATED RAIN ENGINE (NO GAPS)
      // ========================================================
      const rainCanvas = document.getElementById('emoteRainCanvas');
      const rCtx = rainCanvas.getContext('2d');
      let loadedEmoteImages = [];
      let activeRainParticles = [];
      let isRaining = false;
      let rainAnimFrameId = null;

      function resizeRainCanvas() {
        if (!rainCanvas) return;
        rainCanvas.width = window.innerWidth;
        rainCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeRainCanvas);
      resizeRainCanvas();

      function preloadRainEmotes() {
        loadedEmoteImages = [];
        CUSTOM_EMOTE_FILES.forEach(filename => {
          const img = new Image();
          img.src = `${EMOTES_FOLDER}/${encodeURIComponent(filename)}`;
          img.onload = () => loadedEmoteImages.push(img);
        });
      }
      preloadRainEmotes();

      function preloadAudio(urls) {
        urls.forEach(url => {
          const audio = new Audio();
          audio.preload = 'auto';
          audio.src = url;
        });
      }
      preloadAudio(soundFileList);

      class RainParticle {
        constructor(spawnScattered = false) {
          this.init(spawnScattered);
        }

        init(spawnScattered = false) {
          const W = window.innerWidth;
          const H = window.innerHeight;
          this.x = Math.random() * W;
          // If scattered on start, fill the whole screen immediately so there is no gap!
          this.y = spawnScattered ? (Math.random() * H - 40) : (-50 - Math.random() * 80);
          this.vy = 3.6 + Math.random() * 4.6;
          this.vx = (Math.random() - 0.5) * 1.6;
          this.size = Math.floor(Math.random() * 24) + 38;
          this.rotation = Math.random() * 360;
          this.rotSpeed = (Math.random() - 0.5) * 3.5;
          this.sway = Math.random() * Math.PI * 2;
          this.swaySpeed = 0.02 + Math.random() * 0.03;
          this.opacity = 0.95;
          this.img = (loadedEmoteImages.length > 0)
            ? loadedEmoteImages[Math.floor(Math.random() * loadedEmoteImages.length)]
            : null;
        }

        update() {
          this.y += this.vy;
          this.sway += this.swaySpeed;
          this.x += Math.sin(this.sway) * 1.4 + this.vx;
          this.rotation += this.rotSpeed;

          // Fade out slightly near the very bottom
          if (this.y > window.innerHeight * 0.88) {
            this.opacity -= 0.025;
          }
        }
      }

      function startContinuousRain() {
        isRaining = true;
        activeRainParticles = [];

        // 1. Immediately scatter 40 drops so the screen is active from second 0
        for (let i = 0; i < 40; i++) {
          activeRainParticles.push(new RainParticle(true));
        }

        if (rainAnimFrameId) cancelAnimationFrame(rainAnimFrameId);
        runRainLoop();
      }

      function stopContinuousRain() {
        // Stops feeding new drops at the top; current drops fall away naturally
        isRaining = false;
      }

      function runRainLoop() {
        rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);

        // Continuous steady trickle (spawns 1-2 new drops every frame while raining)
        if (isRaining && activeRainParticles.length < 90) {
          if (Math.random() < 0.75) {
            activeRainParticles.push(new RainParticle(false));
          }
        }

        for (let i = activeRainParticles.length - 1; i >= 0; i--) {
          const p = activeRainParticles[i];
          p.update();

          // Render
          if (p.opacity > 0.02 && p.y < window.innerHeight + 80) {
            rCtx.save();
            rCtx.translate(p.x, p.y);
            rCtx.rotate((p.rotation * Math.PI) / 180);
            rCtx.globalAlpha = Math.max(0, Math.min(1, p.opacity));

            if (p.img && p.img.complete && p.img.naturalWidth > 0) {
              rCtx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
            } else {
              // Fallback gold star if image still caching
              rCtx.font = `${Math.round(p.size)}px sans-serif`;
              rCtx.textAlign = 'center';
              rCtx.textBaseline = 'middle';
              rCtx.fillText('⭐', 0, 0);
            }
            rCtx.restore();
          } else {
            // Remove drops that went off screen
            activeRainParticles.splice(i, 1);
          }
        }

        // Loop continues until all remaining drops fall off screen
        if (isRaining || activeRainParticles.length > 0) {
          rainAnimFrameId = requestAnimationFrame(runRainLoop);
        } else {
          rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
          rainAnimFrameId = null;
        }
      }

      function playAlertSound(type) {
        return new Promise((resolve) => {
          let soundUrl = '';
          let volume = SOUND_VOLUME_MAIN;

          if (type === 'raid') {
            soundUrl = SOUND_RAID;
            volume = SOUND_VOLUME_MAIN;
          } else if (type === 'sub' || type === 'bits' || type === 'follow') {
            soundUrl = SOUND_SUB_BITS_FOLLOW;
            volume = SOUND_VOLUME_MINOR;
          } else {
            soundUrl = getNextDonationSound();
          }

          if (!soundUrl) return resolve();

          try {
            const audio = new Audio(soundUrl);
            audio.volume = volume;
            let done = false;
            const finish = () => { if (!done) { done = true; resolve(); } };
            audio.onended = finish;
            audio.onerror = () => finish();
            audio.play().catch(() => finish());

            // 🎯 Safety timeout matches 32s for 30s audio
            setTimeout(finish, 32000);
          } catch (e) { resolve(); }
        });
      }

      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
      }
      const dbRef = firebase.database().ref('bossa');

      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (!initialLoad && data.alertId && data.alertId !== lastProcessedAlertId) {
          lastProcessedAlertId = data.alertId;

          if (Array.isArray(data.alerts) && data.alerts.length > 0) {
            data.alerts.forEach(item => enqueueAlert(item));
          } else if (data.diff > 0 || data.donor) {
            enqueueAlert({
              type: data.type || 'donation',
              donor: data.donor || "Givare",
              amount: data.diff || data.amount || 50,
              comment: data.comment || ""
            });
          }
        } else if (initialLoad) {
          lastProcessedAlertId = data.alertId || 0;
          initialLoad = false;
        }
      });

      const alertQueue = [];
      let isProcessingAlert = false;

      function enqueueAlert(item) {
        alertQueue.push(item);
        processAlertQueue();
      }

      async function processAlertQueue() {
        if (isProcessingAlert || alertQueue.length === 0) return;
        isProcessingAlert = true;

        const item = alertQueue.shift();
        const banner = document.getElementById('alertBanner');
        const type = (item.type || 'donation').toLowerCase();

        const isDonationOrRaid = (type === 'donation' || type === 'raid');
        let didSwitchScene = false;
        let originalSceneName = "";

        if (isDonationOrRaid && isObsConnected) {
          const currentScene = await getCurrentObsScene();
          if (isMatchingScene(currentScene, SCENE_GAMING)) {
            originalSceneName = currentScene;
            await setObsScene(SCENE_INTERMISSION);
            didSwitchScene = true;
            await new Promise(r => setTimeout(r, 350));
          }
        }

        banner.className = 'alert-banner';

        if (type === 'donation') {
          banner.innerHTML = `
            <span class="donor-name">${item.donor || item.name || 'Givare'}</span>
            <div class="alert-subtext">DONERADE <span class="highlight">${formatSEK(item.amount || 50)}</span>!</div>
            ${item.comment ? `<div class="alert-comment">"${item.comment}"</div>` : ''}
          `;
          banner.classList.add('anim-top-in');
        } 
        else if (type === 'raid') {
          banner.innerHTML = `
            <span class="donor-name">${item.donor || item.name || 'Raider'}</span>
            <div class="alert-subtext">RAIDAR MED <span class="highlight">${item.viewers || 1}</span> TITTARNA!</div>
          `;
          banner.classList.add('anim-top-in');
        } 
        else if (type === 'sub') {
          const months = item.months || 1;
          banner.innerHTML = `
            <div class="minor-alert-badge">
              <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
              <div class="minor-alert-detail">PRENUMERERADE I <span class="highlight">${months} MÅN</span>!</div>
            </div>
          `;
          banner.classList.add('anim-bottom-in');
        } 
        else if (type === 'bits') {
          const bits = item.bits || item.amount || 100;
          banner.innerHTML = `
            <div class="minor-alert-badge">
              <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
              <div class="minor-alert-detail">CHEERADE <span class="highlight">${bits} BITS</span>!</div>
            </div>
          `;
          banner.classList.add('anim-bottom-in');
        }
        else if (type === 'follow') {
          banner.innerHTML = `
            <div class="minor-alert-badge">
              <div class="minor-alert-name">${item.donor || item.name || 'Tittare'}</div>
              <div class="minor-alert-detail">FÖLJER KANALEN!</div>
            </div>
          `;
          banner.classList.add('anim-bottom-in');
        }

        // 🎯 Starts the smooth, uninterrupted 30-second rain stream
        startContinuousRain();

        const soundPromise = playAlertSound(type);
        const displayPromise = new Promise(resolve => setTimeout(resolve, MIN_ALERT_DISPLAY_MS));

        await Promise.all([soundPromise, displayPromise]);

        // Gently stops new drops at top so remaining drops exit smoothly
        stopContinuousRain();

        banner.classList.remove('anim-top-in', 'anim-bottom-in');
        banner.classList.add('anim-exit');
        await new Promise(r => setTimeout(r, 400));

        banner.className = 'alert-banner';
        banner.innerHTML = '';

        if (didSwitchScene && isObsConnected) {
          const activeScene = await getCurrentObsScene();
          if (isMatchingScene(activeScene, SCENE_INTERMISSION)) {
            await setObsScene(originalSceneName);
            await new Promise(r => setTimeout(r, 500));
          }
        }

        setTimeout(() => {
          isProcessingAlert = false;
          processAlertQueue();
        }, PAUSE_BETWEEN_ALERTS_MS);
      }
    })();
  </script>
</body>
</html>
