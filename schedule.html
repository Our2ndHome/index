<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Schedule & Sponsors Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-color: #ace600;
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00; /* Vibrant Yellow */
      --text-white: #ffffff;
      --text-dim: #a1a1aa;
      --dock-bg: #0b0b0d;
      --card-bg: #141418;
      --border: #27272a;
      --shadow-dark: rgba(0, 0, 0, 0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-white);
      user-select: none;
    }

    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }

    body.mode-panel {
      background-color: var(--dock-bg);
      overflow-y: auto;
      padding: 4px;
    }

    #overlayRoot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .rotator-wrapper {
      position: absolute;
      bottom: 125px;
      left: 50%;
      transform: translateX(-50%);
      perspective: 1200px;
      z-index: 1000;
      display: grid;
      place-items: center;
    }

    .sponsor-widget, .theme-widget {
      grid-area: 1 / 1;
      background: rgba(0, 0, 0, 0.9);
      border-radius: 16px;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backface-visibility: hidden;
      transform-origin: center center;
      transition: transform 0.75s cubic-bezier(0.34, 1.45, 0.64, 1),
                  opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.55s ease;
    }

    .card-active {
      opacity: 1;
      pointer-events: auto;
      transform: rotateX(0deg) translateY(0) scale(1);
      filter: blur(0px);
      visibility: visible;
    }

    .card-hidden {
      opacity: 0;
      pointer-events: none;
      transform: rotateX(75deg) translateY(26px) scale(0.82);
      filter: blur(8px);
      visibility: hidden;
    }

    .sponsor-widget {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px 14px 18px;
    }

    .sponsor-logo-container {
      width: 255px;
      height: 85px;
      max-width: 85vw;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.4s ease-in-out;
      opacity: 0;
      animation: elementFloat 3.5s ease-in-out infinite;
    }

    .sponsor-label {
      font-size: 13px;
      font-weight: 900;
      color: #ace600;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
    }

    .theme-widget {
      position: relative;
      width: 290px;
      height: 153px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 20px;
      overflow: hidden;
    }

    .theme-watermark-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130px;
      height: 130px;
      object-fit: contain;
      pointer-events: none;
      opacity: 0.50;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
    }

    .theme-content-box {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: elementFloat 3.5s ease-in-out infinite;
    }

    .theme-card-header {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .theme-card-sublabel {
      font-size: 11px;
      font-weight: 900;
      color: #ace600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .theme-card-title {
      font-size: 12.5px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.35;
      max-width: 245px;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    @keyframes elementFloat {
      0%, 100% {
        transform: translateY(0px);
        filter: drop-shadow(0 2px 4px var(--shadow-dark));
      }
      50% {
        transform: translateY(-4px);
        filter: drop-shadow(0 6px 12px var(--shadow-dark));
      }
    }

    .schedule-widget {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
      padding: 16px 30px 14px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
    }

    .timeline-container {
      position: relative;
      width: 100%;
      transition: opacity 0.8s ease-in-out;
      opacity: 1;
    }

    .timeline-container.fading { opacity: 0; }

    .timeline-line-bg {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
      z-index: 1;
    }

    .timeline-line-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 3px;
      background: var(--primary-color);
      transform: translateY(-50%);
      z-index: 2;
      width: 0%;
      transition: width 0.3s linear;
    }

    .timeline-cursor {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 12px;
      height: 12px;
      background: var(--primary-color);
      transform: translate(-50%, -50%);
      z-index: 5;
      border-radius: 50%;
      transition: left 0.3s linear;
    }

    .timeline-cursor::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border: 1.5px solid var(--primary-color);
      border-radius: 50%;
      animation: cursorSonar 1.8s infinite ease-out;
    }

    @keyframes cursorSonar {
      0% { transform: scale(0.5); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .timeline-nodes-row {
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 3;
    }

    .timeline-node {
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      align-items: center;
      text-align: center;
      padding: 0 4px;
    }

    .node-time {
      height: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .node-tick-wrapper {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .node-divider-tick {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      z-index: 4;
    }

    .node-streamer {
      height: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 0.8px;
      transition: color 0.2s ease;
    }

    .node-streamer.is-giveaway-text {
      color: var(--giveaway-color) !important;
      text-shadow: 0 0 10px rgba(255, 234, 0, 0.45);
    }

    .timeline-node.active .node-streamer {
      font-size: 16px;
      color: var(--primary-color);
    }

    .timeline-node.active .node-streamer.is-giveaway-text {
      color: var(--giveaway-color) !important;
      font-size: 16px;
      text-shadow: 0 0 16px rgba(255, 234, 0, 0.8);
    }

    /* ========================================================
       🎛️ 2. OBS DOCK: ULTRA-TIGHT SCHEDULE CONTROLLER
       ======================================================== */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 6px;
    }

    .header-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-pill.online {
      background: #143820;
      color: #00ff88;
      border: 1px solid #00ff88;
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.3);
    }
    .status-pill.error {
      background: #27272a;
      color: #ff453a;
      border: 1px solid #ff453a;
    }

    .card-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      display: block;
    }

    .day-pills-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 6px;
    }

    .day-pill-btn {
      background: #18181c;
      border: 1px solid var(--border);
      color: #a1a1aa;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 1px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .day-pill-btn:hover { background: #22222a; color: #ffffff; }
    .day-pill-btn.active {
      background: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
      color: #000000 !important;
      box-shadow: 0 0 8px rgba(172, 230, 0, 0.4);
    }

    .slots-list-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .slot-editor-card {
      background: #121215;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slot-editor-card:focus-within {
      border-color: #52525b;
    }

    .slot-card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .slot-num-badge {
      font-size: 9.5px;
      font-weight: 900;
      color: var(--primary-color);
      background: rgba(172, 230, 0, 0.12);
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .slot-time-input {
      flex: 1;
      background: #18181c;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      outline: none;
    }

    .btn-delete-slot {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 13px;
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 3px;
      transition: color 0.15s ease;
    }
    .btn-delete-slot:hover { color: #ff453a; }

    .slot-name-input {
      width: 100%;
      background: #18181c;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 7px;
      outline: none;
    }
    .slot-name-input:focus, .slot-time-input:focus, .slot-giveaway-input:focus {
      border-color: var(--primary-color);
    }

    .slot-giveaway-input {
      width: 100%;
      background: #18181c;
      border: 1px solid #332d18;
      border-radius: 4px;
      color: var(--giveaway-color);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 7px;
      outline: none;
    }

    .btn {
      background: #18181c;
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 4px;
    }

    .btn-primary-action {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .btn-primary-action:hover { opacity: 0.9; }

    .btn-danger {
      background: #18181c;
      border: 1px solid #ff453a;
      color: #ff453a;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
  </style>
</head>

    // 🎯 FORGIVING TIME PARSER: Handles 18-21, 18.00-21.00, 18:00 - 21:00 effortlessly
    function parseTimeRangeToDates(dayId, timeRangeStr) {
      const baseDateStr = DAY_BASE_DATES[dayId] || "2026-11-30";
      let clean = (timeRangeStr || '').replace(/\./g, ':').replace(/\s+/g, ' ').trim();
      
      // Auto-expand shortcut "18-21" or "18 - 21" to "18:00 - 21:00"
      clean = clean.replace(/\b([0-9]{1,2})\b(?!\:)/g, '$1:00');

      let match = clean.match(/([0-9]{1,2}:[0-9]{2})\s*[-–—]\s*([0-9]{1,2}:[0-9]{2})/);
      if (!match) {
        // Fallback safety: default 2-hour window so save never fails
        return {
          cleanTimeText: "20:00 - 22:00",
          start: `${baseDateStr} 20:00`,
          end: `${baseDateStr} 22:00`,
          isMidnight: false
        };
      }

      const startClock = match[1].padStart(5, '0');
      const endClock = match[2].padStart(5, '0');

      const startISO = `${baseDateStr} ${startClock}`;
      let endISO;
      const isMidnight = endClock === "00:00" || endClock === "24:00";

      if (isMidnight) {
        const parts = baseDateStr.split('-').map(Number);
        const baseD = new Date(parts[0], parts[1] - 1, parts[2]);
        baseD.setDate(baseD.getDate() + 1);
        const nextY = baseD.getFullYear();
        const nextM = String(baseD.getMonth() + 1).padStart(2, '0');
        const nextD = String(baseD.getDate()).padStart(2, '0');
        endISO = `${nextY}-${nextM}-${nextD} 00:00`;
      } else {
        endISO = `${baseDateStr} ${endClock}`;
      }

      return {
        cleanTimeText: `${startClock} - ${endClock}`,
        start: startISO,
        end: endISO,
        isMidnight: isMidnight
      };
    }

    function getActiveSchedule() {
      if (scheduleMode === 'test') {
        return generateTestSchedule();
      }
      if (!currentSchedule || currentSchedule.length === 0) return [];

      const now = new Date();
      const firstEvStart = parseDate(currentSchedule[0].start);
      const lastEvEnd = parseDate(currentSchedule[currentSchedule.length - 1].end);
      const isOutsideDates = now < firstEvStart || now > lastEvEnd;
      const dayOrder = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

      return currentSchedule.map(ev => {
        if (isOutsideDates) {
          const dayIndex = dayOrder.indexOf(ev.dayId);
          const [startStr, endStr] = ev.timeText.split(' - ').map(s => s.trim());
          const [sh, sm] = startStr.replace('.', ':').split(':').map(Number);
          const [eh, em] = endStr.replace('.', ':').split(':').map(Number);

          const baseDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (dayIndex !== -1 ? dayIndex : 0));
          const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), sh, sm, 0);
          let end = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), eh === 0 ? 24 : eh, em, 0);

          if (eh < sh && eh !== 0) {
            end = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + 1, eh, em, 0);
          }
          return { ...ev, start, end };
        }
        return { ...ev, start: parseDate(ev.start), end: parseDate(ev.end) };
      });
    }

    function updateScheduleDOM(activeDayId, schedule, now, isReset = false) {
      const eventsRowEl = document.getElementById('scheduleEventsRow');
      const fillLineEl = document.getElementById('timelineProgressFill');
      const cursorEl = document.getElementById('timelineCursor');
      if (!eventsRowEl) return;

      const dayEvents = schedule.filter(ev => ev.dayId === activeDayId);
      const totalDayCount = dayEvents.length;
      let activeSlotIndex = dayEvents.findIndex(ev => now >= ev.start && now < ev.end);

      if (totalDayCount > 0) {
        if (activeSlotIndex === -1) {
          activeSlotIndex = 0;
          if (isReset) {
            if (fillLineEl) fillLineEl.style.transition = 'none';
            if (cursorEl) cursorEl.style.transition = 'none';
          }
          if (fillLineEl) fillLineEl.style.width = `0%`;
          if (cursorEl) cursorEl.style.left = `0%`;
          if (isReset && fillLineEl) {
            void fillLineEl.offsetWidth;
            fillLineEl.style.transition = 'width 0.3s linear';
            if (cursorEl) cursorEl.style.transition = 'left 0.3s linear';
          }
        } else {
          const currentEv = dayEvents[activeSlotIndex];
          const startMs = currentEv.start.getTime();
          const endMs = currentEv.end.getTime();
          const nowMs = now.getTime();

          let slotFraction = (nowMs >= startMs && nowMs < endMs) ? (nowMs - startMs) / (endMs - startMs) : 0;
          slotFraction = Math.min(1, Math.max(0, slotFraction));
          const totalProgressPct = Math.min(100, Math.max(0, ((activeSlotIndex + slotFraction) / totalDayCount) * 100));

          if (isReset) {
            if (fillLineEl) fillLineEl.style.transition = 'none';
            if (cursorEl) cursorEl.style.transition = 'none';
          }
          if (fillLineEl) fillLineEl.style.width = `${totalProgressPct}%`;
          if (cursorEl) cursorEl.style.left = `${totalProgressPct}%`;
          if (isReset && fillLineEl) {
            void fillLineEl.offsetWidth;
            fillLineEl.style.transition = 'width 0.3s linear';
            if (cursorEl) cursorEl.style.transition = 'left 0.3s linear';
          }
        }
      }

      eventsRowEl.innerHTML = dayEvents.map((ev, index) => {
        const isLiveNow = now >= ev.start && now < ev.end;
        const hasGiveaway = Boolean(ev.giveaway && ev.giveaway.trim());
        const primaryText = escapeHTML(hasGiveaway ? ev.giveaway : ev.name);

        return `
          <div class="timeline-node ${isLiveNow ? 'active' : ''}">
            <div class="node-time">${escapeHTML(ev.timeText)}</div>
            <div class="node-tick-wrapper">
              ${index > 0 ? '<div class="node-divider-tick"></div>' : ''}
            </div>
            <div class="node-streamer ${hasGiveaway ? 'is-giveaway-text' : ''}">${primaryText}</div>
          </div>
        `;
      }).join('');
    }

    function renderSchedule() {

      const schedule = getActiveSchedule();

      const now = new Date();

      if (isSimulationLocked && currentDisplayedDayId) {
        updateScheduleDOM(currentDisplayedDayId, schedule, now, false);
        return;
      }

      let activeEv = schedule.find(ev => now >= ev.start && now < ev.end);
      let activeDayId = activeEv ? activeEv.dayId : null;

      if (!activeDayId) {
        let nextEv = schedule.find(ev => ev.start > now);
        activeDayId = nextEv ? nextEv.dayId : schedule[0].dayId;
      }

      if (currentDisplayedDayId !== null && currentDisplayedDayId !== activeDayId) {
        triggerDayTransition(activeDayId, schedule, now);
        return;
      }

      currentDisplayedDayId = activeDayId;
      updateScheduleDOM(activeDayId, schedule, now, false);
    }

    // 🎯 ROBUST SAVE: Never blocks or fails when streamer name is left blank
    function saveActiveDaySlots() {
      const slotsContainer = document.getElementById('slotsListContainer');
      if (!slotsContainer) return;

      const cards = Array.from(slotsContainer.querySelectorAll('.slot-editor-card'));
      const activeDayCfg = DAYS_CONFIG.find(d => d.id === activeEditingDayId);
      const updatedDaySlots = [];

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const timeVal = card.querySelector('.slot-time-input').value.trim();
        const rawNameVal = card.querySelector('.slot-name-input').value.trim();
        const giveawayVal = card.querySelector('.slot-giveaway-input').value.trim();

        // 🎯 Auto-fill name if empty so save NEVER fails!
        const finalName = rawNameVal || (giveawayVal ? giveawayVal : `Pass ${i + 1}`);

        const parsedTime = parseTimeRangeToDates(activeEditingDayId, timeVal);

        updatedDaySlots.push({
          day: activeDayCfg.full,
          dayId: activeEditingDayId,
          start: parsedTime.start,
          end: parsedTime.end,
          timeText: parsedTime.cleanTimeText,
          name: finalName,
          giveaway: giveawayVal
        });
      }

      const newSchedule = [];
      let replaced = false;

      for (let ev of currentSchedule) {
        if (ev.dayId === activeEditingDayId) {
          if (!replaced) {
            newSchedule.push(...updatedDaySlots);
            replaced = true;
          }
        } else {
          newSchedule.push(ev);
        }
      }

      if (!replaced) newSchedule.push(...updatedDaySlots);
      currentSchedule = newSchedule;

      // Immediately cache to localStorage so it never reverts!
      try {
        localStorage.setItem(STORAGE_KEY_SCHEDULE, JSON.stringify(currentSchedule));
      } catch(e) {}

      renderVisualScheduleEditor();
      renderSchedule();
      syncScheduleToFirebase(`✅ ${activeDayCfg.label} sparades!`);

      const saveBtn = document.getElementById('btnSaveSchedule');
      if (saveBtn) {
        const oldText = saveBtn.innerHTML;
        saveBtn.innerHTML = `✓ Sparat!`;
        saveBtn.style.background = "var(--primary-color)";
        setTimeout(() => {
          saveBtn.innerHTML = oldText;
          saveBtn.style.background = "#ffffff";
        }, 1200);
      }
    }

    function addNewSlotToActiveDay() {
      const activeDayCfg = DAYS_CONFIG.find(d => d.id === activeEditingDayId);
      const daySlots = currentSchedule.filter(ev => ev.dayId === activeEditingDayId);

      let newStartTime = "20:00";
      let newEndTime = "22:00";

      if (daySlots.length > 0) {
        const lastSlot = daySlots[daySlots.length - 1];
        const match = (lastSlot.timeText || '').match(/-\s*([0-9]{1,2}:[0-9]{2})/);
        if (match) {
          newStartTime = match[1];
          const [h, m] = newStartTime.split(':').map(Number);
          const nextH = (h + 2) % 24;
          newEndTime = `${String(nextH).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
      }

      const timeText = `${newStartTime} - ${newEndTime}`;
      const parsed = parseTimeRangeToDates(activeEditingDayId, timeText);

      const newSlot = {
        day: activeDayCfg.full,
        dayId: activeEditingDayId,
        start: parsed ? parsed.start : `${activeDayCfg.baseDate} 20:00`,
        end: parsed ? parsed.end : `${activeDayCfg.baseDate} 22:00`,
        timeText: timeText,
        name: "Ny Streamer",
        giveaway: ""
      };

      if (daySlots.length > 0) {
        const lastIdx = currentSchedule.lastIndexOf(daySlots[daySlots.length - 1]);
        currentSchedule.splice(lastIdx + 1, 0, newSlot);
      } else {
        currentSchedule.push(newSlot);
      }

      renderVisualScheduleEditor();
      syncScheduleToFirebase(`➕ Nytt pass: ${activeDayCfg.label}`);
    }

        sponsorCard.classList.add('card-hidden');
      }
      if (themeCard) {
        themeCard.classList.remove('card-hidden');
        themeCard.classList.add('card-active');
      }
    }

    function showSponsorCard() {
      isShowingTheme = false;
      const sponsorCard = document.getElementById('sponsorWidget');
      const themeCard = document.getElementById('themeWidget');
      if (themeCard) {
        themeCard.classList.remove('card-active');
        themeCard.classList.add('card-hidden');
      }
      if (sponsorCard) {
        sponsorCard.classList.remove('card-hidden');
        sponsorCard.classList.add('card-active');
      }
    }

    function runRotatorCycle() {
      if (isPanel) return;

      if (isShowingTheme) {
        currentSponsorIndex = 0;
        updateSponsorLogo();
        showSponsorCard();
        rotatorTimer = setTimeout(runRotatorCycle, SPONSOR_ROTATE_SECONDS * 1000);
      } else {
        if (sponsorFileList.length > 0) {
          const nextIndex = currentSponsorIndex + 1;

          if (nextIndex < sponsorFileList.length) {
            currentSponsorIndex = nextIndex;
            updateSponsorLogo();
            rotatorTimer = setTimeout(runRotatorCycle, SPONSOR_ROTATE_SECONDS * 1000);
          } else {
            showThemeCard();
            rotatorTimer = setTimeout(runRotatorCycle, THEME_SPOTLIGHT_SECONDS * 1000);
          }
        } else {
          showThemeCard();
          rotatorTimer = setTimeout(runRotatorCycle, THEME_SPOTLIGHT_SECONDS * 1000);
        }
      }
    }

    async function loadSponsorsAutomatically() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SPONSORS_FOLDER}?_t=${Date.now()}`);
        if (res.ok) {
          const files = await res.json();
          if (Array.isArray(files)) {
            const sponsorFiles = files.filter(f => {
              if (!f.name || !f.name.match(/\.(png|jpe?g|svg|webp)$/i)) return false;
              return !isMhLogo(f.name);
            });

            const mhLogoFile = files.find(f => f.name && isMhLogo(f.name));
            if (mhLogoFile) {
              const mhImg = document.getElementById('themeMhLogo');
              if (mhImg) {
                mhImg.src = mhLogoFile.download_url || `${SPONSORS_FOLDER}/${encodeURIComponent(mhLogoFile.name)}`;
              }
            }

            const apiSponsors = sponsorFiles.map(f => f.download_url || `${SPONSORS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSponsors.length > 0) {
              sponsorFileList = apiSponsors;
              try { localStorage.setItem(STORAGE_KEY_SPONSORS, JSON.stringify(apiSponsors)); } catch(e) {}

              dbScheduleRef.update({
                autoSponsors: apiSponsors,
                secret: WRITE_SECRET
              }).catch(() => {});

              updateSponsorLogo();
            }
          }
        }
      } catch(e) {}

      if (rotatorTimer) clearTimeout(rotatorTimer);
      rotatorTimer = setTimeout(runRotatorCycle, SPONSOR_ROTATE_SECONDS * 1000);
    }

    function updateSponsorLogo() {
      const img = document.getElementById('sponsorLogo');
      if (!img || sponsorFileList.length === 0) return;

      const targetSrc = sponsorFileList[currentSponsorIndex % sponsorFileList.length];
      if (!targetSrc) return;

      img.style.opacity = '0';
      setTimeout(() => {
        img.src = targetSrc;
        img.onload = () => { img.style.opacity = '1'; };
        if (img.complete && img.naturalWidth > 0) {
          img.style.opacity = '1';
        }
      }, 250);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    if (sponsorFileList.length > 0) {
      updateSponsorLogo();
    }

    loadSponsorsAutomatically();
    renderSchedule();
    setInterval(renderSchedule, 1000);

    if (isPanel) {
      renderVisualScheduleEditor();
    }
  </script>
</body>
</html>
