<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Master Overlay & Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY (#overlay) - ALL VISIBLE TOGETHER
       ======================================================== */
    body.mode-overlay {
      overflow: hidden;
      background-color: transparent;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: transparent;
      pointer-events: none; /* Mouse clicks pass right through */
    }

    /* Z-Index layer ordering */
    #layerSchedule { z-index: 10; } /* Bottom schedule bar */
    #layerBossa    { z-index: 20; } /* Top countdown & goal */
    #layerGiveaway { z-index: 30; } /* Center wheel popup */

    /* ========================================================
       🎛️ 2. OBS DOCK (#panel) - ALL 3 PANELS STACKED TOGETHER
       ======================================================== */
    body.mode-panel {
      background-color: #0b0b0d;
      color: #ffffff;
      overflow-y: auto; /* Scrollable window in OBS */
      padding-bottom: 20px;
    }

    /* Sticky quick-jump bar at the top */
    .dock-jump-nav {
      position: sticky;
      top: 0;
      z-index: 9999;
      display: flex;
      background: #111114;
      border-bottom: 1px solid #27272a;
      padding: 6px;
      gap: 6px;
    }

    .jump-btn {
      flex: 1;
      background: #18181c;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 4px;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      transition: background 0.15s ease;
    }
    .jump-btn:hover { background: #27272e; border-color: #3f3f46; }

    .panel-section-divider {
      background: #18181c;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 6px 10px;
      margin: 12px 8px 6px 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a1a1aa;
      display: flex;
      justify-content: space-between;
    }

    .stacked-panel-frame {
      width: 100%;
      border: none;
      display: block;
      background: #0b0b0d;
      overflow: hidden;
    }

    /* Height calibrated for each controller panel */
    #frameBossa    { height: 490px; }
    #frameGiveaway { height: 460px; }
    #frameSchedule { height: 400px; }
  </style>
</head>
<body>

  <!-- ========================================================
       📺 1. STREAM OVERLAY (All 3 live simultaneously)
       ======================================================== -->
  <div id="overlayContainer" style="display: none;">
    <!-- Bottom: Schedule bar -->
    <iframe id="layerSchedule" class="overlay-frame" src="schedule.html#overlay" allow="autoplay"></iframe>

    <!-- Top: Countdown & Goal + Center Alerts -->
    <iframe id="layerBossa" class="overlay-frame" src="countdown_and_bossa.html#overlay" allow="autoplay"></iframe>

    <!-- Center: Giveaway wheel modal -->
    <iframe id="layerGiveaway" class="overlay-frame" src="giveaway.html#overlay" allow="autoplay"></iframe>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS DOCK (All 3 stacked in one scrollable dock)
       ======================================================== -->
  <div id="panelContainer" style="display: none;">
    
    <!-- Quick-jump navigation bar -->
    <div class="dock-jump-nav">
      <button class="jump-btn" onclick="scrollToSection('secBossa')">↓ Bössa</button>
      <button class="jump-btn" onclick="scrollToSection('secGiveaway')">↓ Giveaway</button>
      <button class="jump-btn" onclick="scrollToSection('secSchedule')">↓ Schema</button>
    </div>

    <!-- Section 1: Bössa & Tracker -->
    <div id="secBossa" class="panel-section-divider">
      <span>💰 BÖSSA & INSAMLINGSMÅL</span>
    </div>
    <iframe id="frameBossa" class="stacked-panel-frame" src="countdown_and_bossa.html#panel"></iframe>

    <!-- Section 2: Giveaway Wheel -->
    <div id="secGiveaway" class="panel-section-divider">
      <span>🎁 GIVEAWAY HJUL</span>
    </div>
    <iframe id="frameGiveaway" class="stacked-panel-frame" src="giveaway.html#panel"></iframe>

    <!-- Section 3: Schedule & Sponsors -->
    <div id="secSchedule" class="panel-section-divider">
      <span>📅 SCHEMA & SPONSORER</span>
    </div>
    <iframe id="frameSchedule" class="stacked-panel-frame" src="schedule.html#panel"></iframe>

  </div>

  <script>
    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel');

    if (isPanel) {
      document.body.classList.add('mode-panel');
      document.getElementById('panelContainer').style.display = 'block';
    } else {
      document.body.classList.add('mode-overlay');
      document.getElementById('overlayContainer').style.display = 'block';
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  </script>
</body>
</html>
