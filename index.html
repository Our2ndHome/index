<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* 🎨 HTML5 CANVAS SANDSTORM OVERLAY */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 998;
    }

    /* TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 9999;
      max-width: 340px;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    .sound-status {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #444;
      font-size: 11px;
      line-height: 1.4;
    }

    /* ⏱️ COUNTDOWN TIMER WIDGET */
    .countdown-widget {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      z-index: 997;
    }

    .countdown-label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ace600; 
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(172, 230, 0, 0.5);
      transition: all 0.5s ease-in-out;
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff; 
      font-variant-numeric: tabular-nums;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9);
      transition: all 0.5s ease-in-out;
    }

    .sep-dot {
      color: #ace600;
      margin: 0 4px;
    }

    /* 🔥 FINAL 60 SECONDS DRAMATIC STATE */
    .countdown-widget.final-minute .countdown-label {
      font-size: 24px;
      color: #ace600; 
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(172, 230, 0, 0.9);
      animation: finalSecondPulse 1s infinite alternate;
    }

    .countdown-widget.final-minute .countdown-timer {
      font-size: 96px;
      color: #ffffff; 
      text-shadow: 
        0 0 15px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(255, 255, 255, 0.9),
        0 0 50px rgba(255, 255, 255, 1);
    }

    @keyframes finalSecondPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .timer-finished .countdown-label {
      color: #ace600;
      font-size: 26px;
      animation: pulseGlow 1.5s infinite alternate;
    }

    .timer-finished .countdown-timer {
      display: none;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(172, 230, 0, 0.5); }
      100% { text-shadow: 0 0 25px rgba(172, 230, 0, 1); }
    }

    /* 💎 CRISP VECTOR TEXT POPUP BANNER */
    .alert-banner {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent;
      padding: 10px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(255, 0, 128, 0.8);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
      z-index: 999;
    }

    body.is-final-minute .alert-banner {
      top: 185px; /* Shifted down during SISTA MINUTEN */
    }

    .donor-name {
      color: #ace600; /* Lime Green */
      display: block;
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(172, 230, 0, 0.8);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      white-space: nowrap;
    }

    .show-alert {
      opacity: 1;
      visibility: visible;
    }

    /* Total Raised Display */
    .goal-box {
      background: transparent;
      color: #ffffff;
      padding: 10px;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      z-index: 999;
    }

    .amount {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>Testpanel (OBS Interagera)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('En anonym givare', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color: #ff0055;">Nollställ Doneringar</button>
    
    <div style="margin-top: 8px; border-top: 1px solid #444; padding-top: 8px;">
      <b>Timer kontroller:</b><br>
      <button onclick="simulateEndGame()">Simulera Sista Minuten (60s)</button>
      <button onclick="resetEventTimer()">Återställ till 6 dec 20.00</button>
    </div>

    <div class="sound-status" id="soundStatus">Laddar ljud...</div>
  </div>

  <!-- ⏱️ COUNTDOWN TIMER WIDGET -->
  <div class="countdown-widget" id="countdownWidget">
    <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
    <div class="countdown-timer" id="countdownTimer">0D • 00:00:00</div>
  </div>

  <!-- 🎨 HTML5 CANVAS SANDSTORM OVERLAY -->
  <canvas id="particleCanvas"></canvas>

  <!-- 💎 CRISP VECTOR TEXT POPUP BANNER -->
  <div class="alert-banner" id="alertBanner">
    <span class="donor-name" id="donorName">JOHAN</span> 
    <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
  </div>

  <!-- Total Raised Display -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SOUND_VOLUME = 0.8;

    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; 

    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3',
      'sounds/ssstik.io_1786299022792.mp3',
      'sounds/ssstik.io_1786299034631.mp3',
      'sounds/ssstik.io_1786299046255.mp3',
      'sounds/ssstik.io_1786299057737.mp3',
      'sounds/ssstik.io_1786299068259.mp3',
      'sounds/ssstik.io_1786299079463.mp3',
      'sounds/ssstik.io_1786299092634.mp3',
      'sounds/ssstik.io_1786299206154.mp3',
      'sounds/ssstik.io_1786299216224.mp3'
    ];

    let soundFileList = TIKTOK_BACKUP_SOUNDS;
    let availableSoundsPool = []; 
    let currentTotal = 0; 
    let audioCtx = null;

    // =========================================================
    // 🌪️ HTML5 CANVAS HOURGLASS )( SANDSTORM ENGINE
    // =========================================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let isCanvasAnimating = false;
    let particleEnginePhase = 'IDLE'; 

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function sampleTextPixelTargets(donorName, amountText) {
      const offscreen = document.createElement('canvas');
      const offCtx = offscreen.getContext('2d');
      offscreen.width = 1200;
      offscreen.height = 400;

      offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      offCtx.font = '900 58px "Montserrat", Arial, sans-serif';
      offCtx.fillStyle = '#ace600';
      offCtx.fillText(donorName.toUpperCase(), offscreen.width / 2, 120);

      offCtx.font = '900 38px "Montserrat", Arial, sans-serif';
      offCtx.fillStyle = '#ffffff';
      offCtx.fillText(`DONERADE ${amountText.toUpperCase()}!`, offscreen.width / 2, 210);

      const imgData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
      const data = imgData.data;
      const targets = [];

      const step = 3; 
      const startX = (window.innerWidth - offscreen.width) / 2;
      const isFinal = document.body.classList.contains('is-final-minute');
      const startY = isFinal ? 185 : 120; 

      for (let y = 0; y < offscreen.height; y += step) {
        for (let x = 0; x < offscreen.width; x += step) {
          const index = (y * offscreen.width + x) * 4;
          if (data[index + 3] > 128) {
            targets.push({
              tx: startX + x,
              ty: startY + y,
              color: `rgb(${data[index]}, ${data[index + 1]}, ${data[index + 2]})`
            });
          }
        }
      }
      return targets;
    }

    function initParticleSandstorm(donorName, amountText) {
      const targets = sampleTextPixelTargets(donorName, amountText);
      particles = [];

      const spawnX = window.innerWidth / 2;
      const startY = document.body.classList.contains('is-final-minute') ? 165 : 35;
      const targetYCenter = document.body.classList.contains('is-final-minute') ? 220 : 130;

      const count = 1800; // 1,800 Dense Sandstorm Particles
      const colors = ['#ace600', '#ace600', '#ffea00', '#ffffff', '#00ff88'];

      for (let i = 0; i < count; i++) {
        const target = targets[i % targets.length];
        const side = i % 2 === 0 ? -1 : 1;

        particles.push({
          x: spawnX + (Math.random() - 0.5) * 160,
          y: startY + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 3,
          vy: 2.5 + Math.random() * 4,
          side: side,
          spreadFactor: 80 + Math.random() * 80,
          startY: startY,
          targetYCenter: targetYCenter,
          tx: target.tx,
          ty: target.ty,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 2.0 + Math.random() * 2.5,
          alpha: 0,
          delay: Math.random() * 25,
          friction: 0.88 + Math.random() * 0.06,
          springEase: 0.08 + Math.random() * 0.06,
          disperseVx: (Math.random() - 0.3) * 7,
          disperseVy: -(Math.random() * 5 + 1)
        });
      }

      particleEnginePhase = 'HOURGLASS';
      if (!isCanvasAnimating) {
        isCanvasAnimating = true;
        requestAnimationFrame(renderCanvasLoop);
      }
    }

    let frameCount = 0;
    function renderCanvasLoop() {
      if (!isCanvasAnimating) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      let activeParticles = 0;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        if (frameCount < p.delay) continue;

        if (particleEnginePhase === 'HOURGLASS') {
          p.y += p.vy;
          p.alpha = Math.min(1, p.alpha + 0.1);

          // Calculate Hourglass Curve )(
          const progress = Math.min(1, Math.max(0, (p.y - p.startY) / (p.targetYCenter - p.startY)));
          const waistPinch = Math.sin(progress * Math.PI); // 0 -> 1 -> 0
          const offsetX = p.side * p.spreadFactor * (1 - waistPinch * 0.85);

          p.x = (window.innerWidth / 2) + offsetX;

          if (progress >= 0.75) {
            particleEnginePhase = 'ASSEMBLE';
          }
        } 
        else if (particleEnginePhase === 'ASSEMBLE' || particleEnginePhase === 'HOLD') {
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;

          p.vx += dx * p.springEase;
          p.vy += dy * p.springEase;

          p.vx *= p.friction;
          p.vy *= p.friction;

          p.x += p.vx;
          p.y += p.vy;
          p.alpha = Math.min(1, p.alpha + 0.1);
        } 
        else if (particleEnginePhase === 'DISINTEGRATE') {
          p.x += p.disperseVx;
          p.y += p.disperseVy;
          p.disperseVx += (Math.random() - 0.4) * 0.5; // Wind turbulence
          p.alpha -= 0.03;
        }

        if (p.alpha > 0) {
          activeParticles++;
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
      }

      ctx.globalAlpha = 1;

      if (activeParticles > 0 || particleEnginePhase !== 'IDLE') {
        requestAnimationFrame(renderCanvasLoop);
      } else {
        isCanvasAnimating = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function triggerDisintegration() {
      particleEnginePhase = 'DISINTEGRATE';
    }

    // =========================================================
    // ⏱️ EVENT END COUNTDOWN TIMER ENGINE
    // =========================================================
    let countdownTargetTime = null;

    function getEventTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(`${targetYear}-12-06T20:00:00`);
      
      if (now > target) {
        target = new Date(`${targetYear + 1}-12-06T20:00:00`);
      }
      return target.getTime();
    }

    function initCountdown() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
      setInterval(updateCountdownDisplay, 1000);
    }

    function updateCountdownDisplay() {
      const widget = document.getElementById('countdownWidget');
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const now = Date.now();
      const diff = countdownTargetTime - now;

      if (diff <= 0) {
        timerDisplay.innerText = "00";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        widget.classList.remove('final-minute');
        widget.classList.add('timer-finished');
        document.body.classList.remove('is-final-minute');
        return;
      }

      widget.classList.remove('timer-finished');
      const totalSecondsRemaining = Math.floor(diff / 1000);

      if (totalSecondsRemaining <= 60) {
        document.body.classList.add('is-final-minute');
        widget.classList.add('final-minute');
        label.innerText = "SISTA MINUTEN!";
        timerDisplay.innerText = String(totalSecondsRemaining).padStart(2, '0');
        return;
      }

      document.body.classList.remove('is-final-minute');
      widget.classList.remove('final-minute');
      label.innerText = "INSAMLINGEN SLUTAR OM";

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      if (days > 0) {
        timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${hStr}:${mStr}:${sStr}`;
      } else {
        timerDisplay.innerHTML = `${hStr}:${mStr}:${sStr}`;
      }
    }

    function simulateEndGame() {
      countdownTargetTime = Date.now() + 60000;
      updateCountdownDisplay();
    }

    function resetEventTimer() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
    }

    // =========================================================
    // SHUFFLE SOUND POOL
    // =========================================================
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextShuffledSound() {
      if (!availableSoundsPool || availableSoundsPool.length === 0) {
        availableSoundsPool = shuffleArray(soundFileList);
      }
      return availableSoundsPool.pop();
    }

    async function loadSoundsAutomatically() {
      const statusElement = document.getElementById('soundStatus');
      let foundSounds = [];

      try {
        const txtRes = await fetch(`sounds/list.txt?_t=${Date.now()}`);
        if (txtRes.ok) {
          const text = await txtRes.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
          if (lines.length > 0) {
            foundSounds = lines.map(file => `sounds/${encodeURIComponent(file)}`);
          }
        }
      } catch (e) {}

      if (foundSounds.length === 0) {
        try {
          const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (response.ok) {
            const files = await response.json();
            const apiSounds = files
              .filter(f => f.type === 'file' && f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
              .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSounds.length > 0) {
              foundSounds = apiSounds;
            }
          }
        } catch (e) {}
      }

      if (foundSounds.length === 0) {
        foundSounds = TIKTOK_BACKUP_SOUNDS;
      }

      soundFileList = foundSounds;

      if (statusElement) {
        statusElement.innerHTML = `<b>${soundFileList.length} ljud redo!</b><br><span style="color:#00ff88;">Ljudfiler laddade framgångsrikt.</span>`;
      }
    }

    // Straight Vertical Bounce Sound Player
    function playAlertSound() {
      return new Promise((resolve) => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const banner = document.getElementById('alertBanner');

        if (soundFileList.length > 0) {
          const nextSoundPath = getNextShuffledSound();
          const audio = new Audio();
          audio.crossOrigin = "anonymous";
          audio.src = nextSoundPath;
          audio.volume = SOUND_VOLUME;
          window.currentAudio = audio;

          try {
            const source = audioCtx.createMediaElementSource(audio);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; 
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            let animFrameId;
            let smoothVolume = 0;

            function syncRhythm() {
              analyser.getByteFrequencyData(dataArray);

              let sum = 0;
              const bassBins = Math.floor(bufferLength * 0.4); 
              for (let i = 0; i < bassBins; i++) {
                sum += dataArray[i];
              }
              let avgVolume = sum / bassBins;

              smoothVolume += (avgVolume - smoothVolume) * 0.30;
              const normVol = smoothVolume / 255;

              let scale = 1 + normVol * 0.4;
              let jumpY = normVol * 15;

              if (banner && banner.classList.contains('show-alert')) {
                banner.style.transform = `translateX(-50%) translateY(${jumpY}px) scale(${scale})`;
              }

              if (!audio.paused && !audio.ended) {
                animFrameId = requestAnimationFrame(syncRhythm);
              }
            }

            audio.addEventListener('play', () => { syncRhythm(); });
            audio.addEventListener('ended', () => {
              cancelAnimationFrame(animFrameId);
            });

          } catch (e) {
            console.log("Audio Analyser note:", e);
          }

          audio.addEventListener('ended', () => {
            resolve(audio.duration || 3);
          });

          audio.addEventListener('error', (err) => {
            console.log("Error loading audio path:", nextSoundPath, err);
            resolve(3);
          });

          audio.play().catch(err => {
            console.log("Audio play error:", err);
            resolve(3);
          });

        } else {
          // Fallback Synthesizer sound
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          resolve(1.5);
        }
      });
    }

    // =========================================================
    // IN-SYNC ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;

      // 1. Start Hourglass Sandstorm Stream )(
      initParticleSandstorm(nextAlert.donorName, `${nextAlert.diffAmount} kr`);

      // 2. Play Audio
      const audioPromise = playAlertSound();

      // 3. Reveal Crisp Vector DOM Text as particles assemble (0.9s delay)
      setTimeout(() => {
        banner.classList.add('show-alert');
      }, 900);

      // 4. Wait for audio to finish
      await audioPromise;

      // 5. Hide Crisp Vector Text & Trigger Porsche Disintegration Dust Blast!
      banner.classList.remove('show-alert');
      triggerDisintegration();

      // 6. Break pause between queued alerts
      setTimeout(() => {
        isProcessingAlert = false;
        processQueue();
      }, 1200 + (PAUSE_BETWEEN_ALERTS_SECONDS * 1000));
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    // Initialize Timer and Live Data
    initCountdown();
    loadSoundsAutomatically();
    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
