<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Test Alert</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .alert-box {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      padding: 20px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: bold;
      text-transform: uppercase;
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="alert-box">
    <span id="alertText">🎉 ALERT TRIGGERED! 🎉</span>
  </div>

  <script>
    // Custom name from URL parameter ?name=Alex
    const urlParams = new URLSearchParams(window.location.search);
    const customName = urlParams.get('name');
    if (customName) {
      document.getElementById('alertText').innerText = `🎉 ${customName} TRIGGERED AN ALERT! 🎉`;
    }

    // Function to generate a random synthesized arcade chime sound
    function playRandomSynthSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Random frequencies for pitch
      const freqs = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C, E, G notes
      const randomFreq1 = freqs[Math.floor(Math.random() * freqs.length)];
      const randomFreq2 = freqs[Math.floor(Math.random() * freqs.length)];

      // Note 1
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(randomFreq1, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.3);

      // Note 2 (slightly delayed)
      setTimeout(() => {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(randomFreq2, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.4);
      }, 150);
    }

    // Trigger sound on load
    window.addEventListener('DOMContentLoaded', () => {
      playRandomSynthSound();
    });
  </script>
</body>
</html>
