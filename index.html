<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 9999;
      max-width: 340px;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    .sound-status {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #444;
      font-size: 11px;
      line-height: 1.4;
    }

    /* ⏱️ COMPACT & SLEEK COUNTDOWN TIMER WIDGET */
    .countdown-widget {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
      transition: all 0.5s ease-in-out;
    }

    /* Upper Label -> #ace600 */
    .countdown-label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ace600; 
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(172, 230, 0, 0.5);
      transition: all 0.5s ease-in-out;
    }

    /* Sleek & Compact Timer Numbers (34px) */
    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff; 
      font-variant-numeric: tabular-nums;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9);
      transition: all 0.5s ease-in-out;
    }

    /* 🔥 FINAL 60 SECONDS DRAMATIC STATE */
    .countdown-widget.final-minute .countdown-label {
      font-size: 24px;
      color: #ace600; 
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(172, 230, 0, 0.9);
      animation: finalSecondPulse 1s infinite alternate;
    }

    .countdown-widget.final-minute .countdown-timer {
      font-size: 96px; /* BIG centered seconds */
      color: #ffffff; 
      text-shadow: 
        0 0 15px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(255, 255, 255, 0.9),
        0 0 50px rgba(255, 255, 255, 1);
    }

    @keyframes finalSecondPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Timer Finished State */
    .timer-finished .countdown-label {
      color: #ace600;
      font-size: 24px;
      animation: pulseGlow 1.5s infinite alternate;
    }

    .timer-finished .countdown-timer {
      display: none;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(172, 230, 0, 0.5); }
      100% { text-shadow: 0 0 25px rgba(172, 230, 0, 1); }
    }

    /* Total Raised Display */
    .goal-box {
      background: transparent;
      color: #ffffff;
      padding: 10px;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(255, 255, 255, 0.6);
      white-space: nowrap;
    }

    .amount {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
    }

    /* Pop-up Alert Banner */
    .alert-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent;
      padding: 10px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(255, 0, 128, 0.8);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Upper Text -> #ace600 */
    .donor-name {
      color: #ace600; 
      display: block;
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(172, 230, 0, 0.8);
    }

    /* Subtext Line 2 -> White */
    .alert-subtext {
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* Smooth Elastic Pop Animation */
    .show-alert {
      opacity: 1;
      visibility: visible;
      animation: elasticPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes elasticPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.35);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.0);
      }
    }
  </style>
</head>
<body>

  <!-- TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>Testpanel (OBS Interagera)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('En anonym givare', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color: #ff0055;">Nollställ Doneringar</button>
    
    <div style="margin-top: 8px; border-top: 1px solid #444; padding-top: 8px;">
      <b>Timer kontroller:</b><br>
      <button onclick="simulateEndGame()">Simulera Sista Minuten (60s)</button>
      <button onclick="resetEventTimer()">Återställ till 6 dec 20.00</button>
    </div>

    <div class="sound-status" id="soundStatus">Laddar ljud...</div>
  </div>

  <!-- ⏱️ COMPACT COUNTDOWN TIMER WIDGET -->
  <div class="countdown-widget" id="countdownWidget">
    <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
    <div class="countdown-timer" id="countdownTimer">0d 00:00:00</div>
  </div>

  <!-- Donation Popup Banner -->
  <div class="alert-banner" id="alertBanner">
    <span class="donor-name" id="donorName">JOHAN</span> 
    <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
  </div>

  <!-- Total Raised Display -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    // GITHUB DETAILS
    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SOUND_VOLUME = 0.8;

    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; 

    // GUARANTEED BACKUP TIKTOK SOUNDS FROM SCREENSHOT
    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3',
      'sounds/ssstik.io_1786299022792.mp3',
      'sounds/ssstik.io_1786299034631.mp3',
      'sounds/ssstik.io_1786299046255.mp3',
      'sounds/ssstik.io_1786299057737.mp3',
      'sounds/ssstik.io_1786299068259.mp3',
      'sounds/ssstik.io_1786299079463.mp3',
      'sounds/ssstik.io_1786299092634.mp3',
      'sounds/ssstik.io_1786299206154.mp3',
      'sounds/ssstik.io_1786299216224.mp3'
    ];

    let soundFileList = TIKTOK_BACKUP_SOUNDS;
    let availableSoundsPool = []; 
    let currentTotal = 0; 
    let audioCtx = null;

    // =========================================================
    // ⏱️ COUNTDOWN TIMER ENGINE (INSAMLINGEN SLUTAR OM)
    // =========================================================
    let countdownTargetTime = null;

    function getEventTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(`${targetYear}-12-06T20:00:00`);
      
      if (now > target) {
        target = new Date(`${targetYear + 1}-12-06T20:00:00`);
      }
      return target.getTime();
    }

    function initCountdown() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
      setInterval(updateCountdownDisplay, 1000);
    }

    function updateCountdownDisplay() {
      const widget = document.getElementById('countdownWidget');
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const now = Date.now();
      const diff = countdownTargetTime - now;

      // When Event Ends
      if (diff <= 0) {
        timerDisplay.innerText = "00";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        widget.classList.remove('final-minute');
        widget.classList.add('timer-finished');
        return;
      }

      widget.classList.remove('timer-finished');
      const totalSecondsRemaining = Math.floor(diff / 1000);

      // 🔥 FINAL 60 SECONDS MODE
      if (totalSecondsRemaining <= 60) {
        widget.classList.add('final-minute');
        label.innerText = "SISTA MINUTEN!";
        timerDisplay.innerText = String(totalSecondsRemaining).padStart(2, '0');
        return;
      }

      // Normal Mode
      widget.classList.remove('final-minute');
      label.innerText = "INSAMLINGEN SLUTAR OM";

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      if (days > 0) {
        timerDisplay.innerText = `${days}d ${hStr}:${mStr}:${sStr}`;
      } else {
        timerDisplay.innerText = `${hStr}:${mStr}:${sStr}`;
      }
    }

    function simulateEndGame() {
      countdownTargetTime = Date.now() + 60000; // 60 seconds left
      updateCountdownDisplay();
    }

    function resetEventTimer() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
    }

    // =========================================================
    // SHUFFLE SOUND POOL
    // =========================================================
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextShuffledSound() {
      if (!availableSoundsPool || availableSoundsPool.length === 0) {
        availableSoundsPool = shuffleArray(soundFileList);
      }
      return availableSoundsPool.pop();
    }

    async function loadSoundsAutomatically() {
      const statusElement = document.getElementById('soundStatus');
      let foundSounds = [];

      try {
        const txtRes = await fetch(`sounds/list.txt?_t=${Date.now()}`);
        if (txtRes.ok) {
          const text = await txtRes.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
          if (lines.length > 0) {
            foundSounds = lines.map(file => `sounds/${encodeURIComponent(file)}`);
          }
        }
      } catch (e) {}

      if (foundSounds.length === 0) {
        try {
          const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (response.ok) {
            const files = await response.json();
            const apiSounds = files
              .filter(f => f.type === 'file' && f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
              .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSounds.length > 0) {
              foundSounds = apiSounds;
            }
          }
        } catch (e) {}
      }

      if (foundSounds.length === 0) {
        foundSounds = TIKTOK_BACKUP_SOUNDS;
      }

      soundFileList = foundSounds;

      if (statusElement) {
        statusElement.innerHTML = `<b>${soundFileList.length} ljud redo!</b><br><span style="color:#00ff88;">Ljudfiler laddade framgångsrikt.</span>`;
      }
    }

    // Straight Vertical Bounce Sound Player
    function playAlertSound() {
      return new Promise((resolve) => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const banner = document.getElementById('alertBanner');

        if (soundFileList.length > 0) {
          const nextSoundPath = getNextShuffledSound();
          const audio = new Audio();
          audio.crossOrigin = "anonymous";
          audio.src = nextSoundPath;
          audio.volume = SOUND_VOLUME;
          window.currentAudio = audio;

          try {
            const source = audioCtx.createMediaElementSource(audio);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; 
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            let animFrameId;
            let smoothVolume = 0;

            function syncRhythm() {
              analyser.getByteFrequencyData(dataArray);

              let sum = 0;
              const bassBins = Math.floor(bufferLength * 0.4); 
              for (let i = 0; i < bassBins; i++) {
                sum += dataArray[i];
              }
              let avgVolume = sum / bassBins;

              smoothVolume += (avgVolume - smoothVolume) * 0.30;
              const normVol = smoothVolume / 255;

              let scale = 1 + normVol * 0.5;
              let jumpY = -normVol * 25;

              if (banner && banner.classList.contains('show-alert')) {
                banner.style.transform = `translateX(-50%) translateY(${jumpY}px) scale(${scale})`;
              }

              if (!audio.paused && !audio.ended) {
                animFrameId = requestAnimationFrame(syncRhythm);
              } else {
                if (banner) banner.style.transform = `translateX(-50%) translateY(0px) scale(1)`;
              }
            }

            audio.addEventListener('play', () => { syncRhythm(); });
            audio.addEventListener('ended', () => {
              cancelAnimationFrame(animFrameId);
              if (banner) banner.style.transform = `translateX(-50%) translateY(0px) scale(1)`;
            });

          } catch (e) {
            console.log("Audio Analyser note:", e);
          }

          audio.addEventListener('ended', () => {
            if (banner) banner.style.transform = `translateX(-50%) translateY(0px) scale(1)`;
            resolve(audio.duration || 3);
          });

          audio.addEventListener('error', (err) => {
            console.log("Error loading audio path:", nextSoundPath, err);
            resolve(3);
          });

          audio.play().catch(err => {
            console.log("Audio play error:", err);
            resolve(3);
          });

        } else {
          // Fallback Synthesizer sound
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          if (banner) {
            banner.style.transform = `translateX(-50%) scale(1.2) translateY(-15px)`;
            setTimeout(() => { banner.style.transform = `translateX(-50%) scale(1) translateY(0px)`; }, 350);
          }

          resolve(1.5);
        }
      });
    }

    // =========================================================
    // IN-SYNC ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;

      // 1. Restart Elastic Pop In
      banner.classList.remove('show-alert');
      void banner.offsetWidth; // Force CSS reflow
      banner.classList.add('show-alert');

      // 2. Play Audio & Wait until audio finishes
      await playAlertSound();

      // 3. Smooth Fade Out when music ends
      banner.classList.remove('show-alert');

      // 4. 5-second break before next alert
      setTimeout(() => {
        isProcessingAlert = false;
        processQueue();
      }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    // Initialize Timer and Live Data
    initCountdown();
    loadSoundsAutomatically();
    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
