<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 9999;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    /* Total Raised Box */
    .goal-box {
      background: rgba(20, 20, 20, 0.9);
      border: 3px solid #00ff88;
      color: white;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      text-align: center;
    }

    .amount {
      color: #00ff88;
      font-size: 36px;
    }

    /* Pop-up Alert Banner */
    .alert-banner {
      position: absolute;
      top: 100px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      padding: 20px 45px;
      border-radius: 15px;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      text-align: center;
    }

    .donor-name {
      color: #ffea00;
      display: block;
      font-size: 38px;
    }

    .show-alert {
      display: block;
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>🧪 Testpanel (Klicka snabbt för att testa kön!)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('En anonym givare', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color: #ff0055;">Nollställ</button>
  </div>

  <!-- Donation Popup Banner -->
  <div class="alert-banner" id="alertBanner">
    🎉 <span class="donor-name" id="donorName">JOHAN</span> 
    DONERADE <span id="alertAmount">50 kr</span>! 🎉
  </div>

  <!-- Total Raised Box -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    let currentTotal = 0; 

    // =========================================================
    // ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    // Add an alert to the queue
    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    // Process queue items one by one
    function processQueue() {
      // If an alert is currently playing or queue is empty, wait
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;

      // Get next alert in line
      const nextAlert = alertQueue.shift();

      // 1. Play Sound
      playAlertSound();

      // 2. Update UI
      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      
      banner.classList.add('show-alert');
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;

      // 3. Keep alert on screen for 6 seconds
      setTimeout(() => {
        banner.classList.remove('show-alert');
        
        // 4. Brief 0.5s pause before starting the next queued alert
        setTimeout(() => {
          isProcessingAlert = false;
          processQueue(); // Check if more alerts are waiting
        }, 500);

      }, 6000);
    }

    // Play Alert Sound
    function playAlertSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0; // Clear queue
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    // Hide Test Panel if URL has ?live=1
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const response = await fetch(FUNDRAISER_API_URL);
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
