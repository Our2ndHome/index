<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Multi-Widget Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      color: #ffffff;
    }

    /* 🎛️ TEST CONTROL PANEL (Visible in OBS 'Interact') */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 99999;
      max-width: 360px;
      font-size: 12px;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 5px 8px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    .panel-section {
      margin-top: 8px;
      border-top: 1px solid #444;
      padding-top: 6px;
    }

    /* ⏱️ WIDGET 1: COUNTDOWN TIMER */
    .countdown-widget {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      transition: all 0.5s ease-in-out;
      z-index: 1000;
    }

    .countdown-label {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ace600; 
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff; 
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .sep-dot {
      color: #ace600;
      margin: 0 4px;
    }

    /* Final 60s Mode */
    .countdown-widget.final-minute .countdown-label {
      font-size: 24px;
      color: #ace600;
      animation: pulseGlow 1s infinite alternate;
    }

    .countdown-widget.final-minute .countdown-timer {
      font-size: 96px;
      color: #ffffff;
    }

    /* 📢 WIDGET 2: DONATION ALERT BANNER */
    .alert-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent;
      padding: 10px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      text-shadow: 0 0 15px rgba(0,0,0,0.9);
    }

    .donor-name {
      color: #ace600; /* Lime Green */
      display: block;
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 0 0 20px rgba(172, 230, 0, 0.8);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 38px;
      font-weight: 900;
    }

    .show-alert {
      opacity: 1;
      visibility: visible;
      animation: elasticPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes elasticPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    }

    /* 💰 WIDGET 3: TOTAL RAISED GOAL COUNTER */
    .goal-widget {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 1000;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 0 15px rgba(0,0,0,0.9);
    }

    .amount {
      color: #00ff88;
      font-size: 42px;
      font-weight: 900;
    }

    /* 🖼️ WIDGET 4: SPONSORSHIP LOGO ROTATOR */
    .sponsor-widget {
      position: absolute;
      bottom: 25px;
      right: 35px;
      text-align: center;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sponsor-label {
      font-size: 11px;
      font-weight: 800;
      color: #ace600;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 5px;
    }

    .sponsor-logo-container {
      width: 140px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
    }

    /* 📅 WIDGET 5: STREAMER SCHEDULE & GIVEAWAY DISPLAY */
    .schedule-widget {
      position: absolute;
      top: 110px;
      left: 35px;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #ace600;
      border-radius: 12px;
      padding: 15px 20px;
      width: 280px;
      z-index: 1000;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }

    .schedule-title {
      font-size: 14px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .schedule-item {
      margin-bottom: 10px;
      font-size: 12px;
    }

    .schedule-time {
      color: #00ff88;
      font-weight: 800;
      font-size: 11px;
    }

    .schedule-streamer {
      font-weight: 900;
      font-size: 14px;
      color: #ffffff;
    }

    .schedule-giveaway {
      color: #ffea00;
      font-size: 11px;
      font-weight: 800;
    }

    /* BRB Scene Mode Header */
    .brb-header {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(172, 230, 0, 0.8);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- 🎛️ TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>Testpanel (OBS Interagera)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('Anonym', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color:#ff0055;">Nollställ</button>
    
    <div class="panel-section">
      <b>Timer kontroller:</b><br>
      <button onclick="simulateEndGame()">Sista Minuten (60s)</button>
      <button onclick="resetEventTimer()">Återställ Timer</button>
    </div>

    <div class="panel-section">
      <b>Sponsor kontroller:</b><br>
      <button onclick="nextSponsor()">Nästa Sponsor</button>
    </div>

    <div class="panel-section">
      <b>Scenläge förhandsgranskning:</b><br>
      <button onclick="applySceneMode('game')">Spel Scen (?scene=game)</button>
      <button onclick="applySceneMode('starting')">Startar Om (?scene=starting)</button>
      <button onclick="applySceneMode('brb')">BRB / Paus (?scene=brb)</button>
      <button onclick="applySceneMode('all')">Visa Alla Widgets</button>
    </div>

    <div class="sound-status" id="soundStatus">Laddar...</div>
  </div>

  <!-- ⏱️ WIDGET 1: COUNTDOWN TIMER -->
  <div class="countdown-widget" id="countdownWidget">
    <div class="countdown-label" id="countdownLabel">INSAMLINGEN SLUTAR OM</div>
    <div class="countdown-timer" id="countdownTimer">0D • 00:00:00</div>
  </div>

  <!-- 📢 WIDGET 2: DONATION ALERT -->
  <div class="alert-banner" id="alertBanner">
    <span class="donor-name" id="donorName">JOHAN</span> 
    <div class="alert-subtext">DONERADE <span id="alertAmount">50 kr</span>!</div>
  </div>

  <!-- 💰 WIDGET 3: TOTAL RAISED GOAL COUNTER -->
  <div class="goal-widget" id="goalWidget">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <!-- 🖼️ WIDGET 4: SPONSORSHIP LOGO ROTATOR -->
  <div class="sponsor-widget" id="sponsorWidget">
    <span class="sponsor-label">STOLT SPONSOR</span>
    <div class="sponsor-logo-container">
      <img id="sponsorLogo" class="sponsor-logo" src="" alt="Sponsor Logo" />
    </div>
  </div>

  <!-- 📅 WIDGET 5: STREAMER SCHEDULE & GIVEAWAYS -->
  <div class="schedule-widget" id="scheduleWidget">
    <div class="schedule-title">📅 SCHEMA & GIVEAWAYS</div>
    <div id="scheduleContainer"></div>
  </div>

  <!-- BRB Header Text -->
  <div class="brb-header" id="brbHeader">STRAX TILLBAKA</div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SPONSORS_FOLDER = "sponsors";
    const SOUND_VOLUME = 0.8;
    const SPONSOR_ROTATE_SECONDS = 15; // Rotates sponsor logo every 15s

    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; 

    // BACKUP SOUNDS
    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3',
      'sounds/ssstik.io_1786299022792.mp3',
      'sounds/ssstik.io_1786299034631.mp3',
      'sounds/ssstik.io_1786299046255.mp3',
      'sounds/ssstik.io_1786299057737.mp3',
      'sounds/ssstik.io_1786299068259.mp3',
      'sounds/ssstik.io_1786299079463.mp3',
      'sounds/ssstik.io_1786299092634.mp3',
      'sounds/ssstik.io_1786299206154.mp3',
      'sounds/ssstik.io_1786299216224.mp3'
    ];

    // BACKUP SPONSOR LOGOS
    const DEFAULT_SPONSORS = [
      'https://via.placeholder.com/140x50/111/ace600?text=SPONSOR+A',
      'https://via.placeholder.com/140x50/111/00ff88?text=SPONSOR+B',
      'https://via.placeholder.com/140x50/111/ffea00?text=SPONSOR+C'
    ];

    // EVENT SCHEDULE CONFIGURATION
    const SCHEDULE_DATA = [
      { time: "12:00 - 14:00", streamer: "Streamer One", giveaway: "🎁 Gamer Headset" },
      { time: "14:00 - 16:00", streamer: "Streamer Two", giveaway: "🎁 Presentkort 500kr" },
      { time: "16:00 - 18:00", streamer: "Streamer Three", giveaway: "🎁 Musikhjälpen T-Shirt" },
      { time: "18:00 - 20:00", streamer: "Slutspurt & Final!", giveaway: "🏆 STORA VINSTEN" }
    ];

    let soundFileList = TIKTOK_BACKUP_SOUNDS;
    let sponsorFileList = DEFAULT_SPONSORS;
    let availableSoundsPool = []; 
    let currentSponsorIndex = 0;
    let currentTotal = 0; 
    let audioCtx = null;

    // =========================================================
    // 🎛️ SCENE MODE SWITCHER ENGINE (?scene=game / starting / brb)
    // =========================================================
    function applySceneMode(forcedMode) {
      const urlParams = new URLSearchParams(window.location.search);
      const scene = forcedMode || urlParams.get('scene') || 'all';

      const countdownWidget = document.getElementById('countdownWidget');
      const scheduleWidget = document.getElementById('scheduleWidget');
      const sponsorWidget = document.getElementById('sponsorWidget');
      const goalWidget = document.getElementById('goalWidget');
      const brbHeader = document.getElementById('brbHeader');

      // Hide all by default
      countdownWidget.style.display = 'block';
      scheduleWidget.style.display = 'block';
      sponsorWidget.style.display = 'block';
      goalWidget.style.display = 'block';
      brbHeader.style.display = 'none';

      if (scene === 'game' || scene === 'overlay') {
        // IN-GAME MODE: Keep screen clean!
        countdownWidget.style.display = 'none';
        scheduleWidget.style.display = 'none';
      } 
      else if (scene === 'starting') {
        // STARTING SOON MODE: Show Countdown + Schedule + Sponsors + Goal
        // All visible
      } 
      else if (scene === 'brb' || scene === 'paus') {
        // BRB MODE: Show "STRAX TILLBAKA" + Schedule + Sponsors
        countdownWidget.style.display = 'none';
        brbHeader.style.display = 'block';
      }
    }

    // =========================================================
    // 📅 SCHEDULE RENDERER
    // =========================================================
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!container) return;

      container.innerHTML = SCHEDULE_DATA.map(item => `
        <div class="schedule-item">
          <div class="schedule-time">${item.time}</div>
          <div class="schedule-streamer">${item.streamer}</div>
          <div class="schedule-giveaway">${item.giveaway}</div>
        </div>
      `).join('');
    }

    // =========================================================
    // 🖼️ SPONSORSHIP LOGO ROTATOR
    // =========================================================
    async function loadSponsorsAutomatically() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SPONSORS_FOLDER}`);
        if (response.ok) {
          const files = await response.json();
          const apiSponsors = files
            .filter(f => f.type === 'file' && f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i))
            .map(f => `${SPONSORS_FOLDER}/${encodeURIComponent(f.name)}`);

          if (apiSponsors.length > 0) {
            sponsorFileList = apiSponsors;
          }
        }
      } catch (e) {}

      updateSponsorLogo();
      setInterval(nextSponsor, SPONSOR_ROTATE_SECONDS * 1000);
    }

    function updateSponsorLogo() {
      const img = document.getElementById('sponsorLogo');
      if (!img || sponsorFileList.length === 0) return;

      img.style.opacity = '0';
      setTimeout(() => {
        img.src = sponsorFileList[currentSponsorIndex];
        img.style.opacity = '1';
      }, 600);
    }

    function nextSponsor() {
      if (sponsorFileList.length === 0) return;
      currentSponsorIndex = (currentSponsorIndex + 1) % sponsorFileList.length;
      updateSponsorLogo();
    }

    // =========================================================
    // ⏱️ COUNTDOWN TIMER ENGINE
    // =========================================================
    let countdownTargetTime = null;

    function getEventTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(`${targetYear}-12-06T20:00:00`);
      if (now > target) {
        target = new Date(`${targetYear + 1}-12-06T20:00:00`);
      }
      return target.getTime();
    }

    function initCountdown() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
      setInterval(updateCountdownDisplay, 1000);
    }

    function updateCountdownDisplay() {
      const widget = document.getElementById('countdownWidget');
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const now = Date.now();
      const diff = countdownTargetTime - now;

      if (diff <= 0) {
        timerDisplay.innerText = "00";
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        widget.classList.remove('final-minute');
        widget.classList.add('timer-finished');
        return;
      }

      widget.classList.remove('timer-finished');
      const totalSecondsRemaining = Math.floor(diff / 1000);

      if (totalSecondsRemaining <= 60) {
        widget.classList.add('final-minute');
        label.innerText = "SISTA MINUTEN!";
        timerDisplay.innerText = String(totalSecondsRemaining).padStart(2, '0');
        return;
      }

      widget.classList.remove('final-minute');
      label.innerText = "INSAMLINGEN SLUTAR OM";

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      if (days > 0) {
        timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${hStr}:${mStr}:${sStr}`;
      } else {
        timerDisplay.innerHTML = `${hStr}:${mStr}:${sStr}`;
      }
    }

    function simulateEndGame() {
      countdownTargetTime = Date.now() + 60000;
      updateCountdownDisplay();
    }

    function resetEventTimer() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
    }

    // =========================================================
    // 📢 SOUND SHUFFLE POOL & ALERT ENGINE
    // =========================================================
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextShuffledSound() {
      if (!availableSoundsPool || availableSoundsPool.length === 0) {
        availableSoundsPool = shuffleArray(soundFileList);
      }
      return availableSoundsPool.pop();
    }

    async function loadSoundsAutomatically() {
      const statusElement = document.getElementById('soundStatus');
      let foundSounds = [];

      try {
        const txtRes = await fetch(`sounds/list.txt?_t=${Date.now()}`);
        if (txtRes.ok) {
          const text = await txtRes.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
          if (lines.length > 0) {
            foundSounds = lines.map(file => `sounds/${encodeURIComponent(file)}`);
          }
        }
      } catch (e) {}

      if (foundSounds.length === 0) {
        try {
          const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (response.ok) {
            const files = await response.json();
            const apiSounds = files
              .filter(f => f.type === 'file' && f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
              .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSounds.length > 0) {
              foundSounds = apiSounds;
            }
          }
        } catch (e) {}
      }

      if (foundSounds.length === 0) {
        foundSounds = TIKTOK_BACKUP_SOUNDS;
      }

      soundFileList = foundSounds;

      if (statusElement) {
        statusElement.innerHTML = `<b>${soundFileList.length} ljud redo!</b><br><span style="color:#00ff88;">Ljudfiler laddade framgångsrikt.</span>`;
      }
    }

    function playAlertSound() {
      return new Promise((resolve) => {
        const onEnded = () => { resolve(); };

        if (soundFileList.length > 0) {
          const nextSoundPath = getNextShuffledSound();
          const audio = new Audio(nextSoundPath);
          audio.volume = SOUND_VOLUME;
          window.currentAudio = audio;

          audio.addEventListener('ended', onEnded);
          audio.addEventListener('error', onEnded);

          audio.play().catch(err => {
            console.log("Audio play error:", err);
            onEnded();
          });
        } else {
          // Fallback Synth
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          setTimeout(resolve, 2500);
        }
      });
    }

    // =========================================================
    // IN-SYNC ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;

      // 1. Restart Elastic Pop In
      banner.classList.remove('show-alert');
      void banner.offsetWidth; // Force CSS reflow
      banner.classList.add('show-alert');

      // 2. Play Audio
      await playAlertSound();

      // 3. Fade Out when music ends
      banner.classList.remove('show-alert');

      // 4. Break pause between queued alerts
      setTimeout(() => {
        isProcessingAlert = false;
        processQueue();
      }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    // Hide Test Panel if live URL has ?live=1
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    // Initialize All Widgets
    applySceneMode();
    renderSchedule();
    initCountdown();
    loadSponsorsAutomatically();
    loadSoundsAutomatically();
    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
