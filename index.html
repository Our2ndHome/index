<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* Total Raised Box */
    .goal-box {
      background: rgba(20, 20, 20, 0.9);
      border: 3px solid #00ff88;
      color: white;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      text-align: center;
    }

    .amount {
      color: #00ff88;
      font-size: 36px;
    }

    /* Pop-up Alert Banner */
    .alert-banner {
      position: absolute;
      top: 100px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      padding: 20px 45px;
      border-radius: 15px;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      text-align: center;
    }

    .donor-name {
      color: #ffea00; /* Yellow highlight for the name */
      display: block;
      font-size: 38px;
    }

    .show-alert {
      display: block;
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Donation Popup Banner -->
  <div class="alert-banner" id="alertBanner">
    🎉 <span class="donor-name" id="donorName">JOHAN</span> 
    DONERADE <span id="alertAmount">50 kr</span>! 🎉
  </div>

  <!-- Total Raised Box -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // Change this URL when the new Musikhjälpen site opens!
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    let currentTotal = null; 

    // Play Alert Chime Sound
    function playAlertSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Note C5
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // Note A5
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // Trigger Alert Popup with Donor Name + Amount
    function triggerAlert(donorName, diffAmount, newTotal) {
      playAlertSound();

      const banner = document.getElementById('alertBanner');
      
      document.getElementById('donorName').innerText = donorName;
      document.getElementById('alertAmount').innerText = `${diffAmount} kr`;
      
      banner.classList.add('show-alert');

      // Update total display
      document.getElementById('totalDisplay').innerText = `${newTotal} kr`;

      // Hide popup after 6 seconds
      setTimeout(() => {
        banner.classList.remove('show-alert');
      }, 6000);
    }

    // Fetch live data from Musikhjälpen
    async function fetchMusikhjalpenData() {
      try {
        const response = await fetch(FUNDRAISER_API_URL);
        if (!response.ok) return;

        const data = await response.json();
        
        let amount = Number(data.amount || 0);

        // Get latest donor name if available
        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        // First run on load: set current total quietly
        if (currentTotal === null) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        // If total increased: Trigger Alert!
        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          triggerAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen...", err);
      }
    }

    // Check automatically every 5 seconds
    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);


    // =========================================================
    // DEMO TRIGGER (Simulates a donation from "Kalle" after 3 seconds)
    // =========================================================
    setTimeout(() => {
      triggerAlert("Kalle", 100, 100);
      currentTotal = 100;
    }, 3000);
  </script>
</body>
</html>
