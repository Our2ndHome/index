<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Multi-Widget Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      color: #ffffff;
    }

    /* 🎛️ DRAGGABLE TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 99999;
      max-width: 360px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 136, 0.1);
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px dashed rgba(0, 255, 136, 0.4);
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 5px 8px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    .panel-section {
      margin-top: 8px;
      border-top: 1px solid #444;
      padding-top: 6px;
    }

    /* ⏱️ WIDGET 1: COMPACT COUNTDOWN TIMER */
    .countdown-widget {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      transition: all 0.5s ease-in-out;
      z-index: 1000;
    }

    .countdown-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ace600; 
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      transition: all 0.5s ease-in-out;
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff; 
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      transition: all 0.5s ease-in-out;
    }

    .sep-dot {
      color: #ace600;
      margin: 0 3px;
    }

    /* 🔥 FINAL 60 SECONDS DRAMATIC STATE */
    .countdown-widget.final-minute .countdown-label {
      font-size: 16px;
      color: #ace600;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(172, 230, 0, 0.8);
      animation: finalSecondPulse 1s infinite alternate;
    }

    .countdown-widget.final-minute .countdown-timer {
      font-size: 48px;
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(255, 255, 255, 0.9);
    }

    @keyframes finalSecondPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Timer Finished State */
    .timer-finished .countdown-label {
      color: #ace600;
      font-size: 24px;
      animation: pulseGlow 1.5s infinite alternate;
    }

    .timer-finished .countdown-timer {
      display: none !important;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(172, 230, 0, 0.5); }
      100% { text-shadow: 0 0 25px rgba(172, 230, 0, 1); }
    }

    /* 💰 WIDGET 3: TOTAL RAISED GOAL COUNTER */
    .goal-widget {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 1000;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      transition: top 0.4s ease-in-out, opacity 0.4s ease-in-out;
    }

    /* Reduced gap during SISTA MINUTEN mode (top: 98px) */
    body.is-final-minute .goal-widget {
      top: 98px;
    }

    /* Pure Crisp White Header Label */
    .goal-label {
      font-size: 12px;
      color: #ffffff; /* Pure Crisp White */
      display: block;
      margin-bottom: 2px;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
    }

    .amount {
      color: #ace600;
      font-size: 34px;
      font-weight: 900;
      text-shadow: 0 0 15px rgba(172, 230, 0, 0.5);
      transition: opacity 0.4s ease-in-out;
      display: inline-block;
    }

    /* 📢 WIDGET 2: DONATION ALERT BANNER */
    .alert-banner {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      text-align: center;
      background: transparent;
      padding: 10px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      text-shadow: 0 3px 15px rgba(0,0,0,0.95);
    }

    .donor-name {
      color: #ace600; /* Lime Green */
      display: block;
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(172, 230, 0, 0.5);
    }

    .alert-subtext {
      color: #ffffff;
      font-size: 38px;
      font-weight: 900;
    }

    .show-alert {
      opacity: 1 !important;
      visibility: visible !important;
      animation: elasticPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes elasticPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    }

    /* 🖼️ WIDGET 4: CENTERED SPONSORSHIP LOGO ROTATOR */
    .sponsor-widget {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1000;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sponsor-logo-container {
      width: 140px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.9));
    }

    .sponsor-label {
      font-size: 11px;
      font-weight: 900;
      color: #ace600; /* #ace600 Lime Green */
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-top: 4px; /* Placed UNDER the image */
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    }

    /* 📅 WIDGET 5: NO-BACKGROUND TIMELINE SCHEDULE BAR */
    .schedule-widget {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 96vw;
      background: transparent;
      padding: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }

    .timeline-container {
      position: relative;
      width: 100%;
    }

    .timeline-line-bg {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
      z-index: 1;
    }

    .timeline-line-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 3px;
      background: #ace600;
      box-shadow: 0 0 8px rgba(172, 230, 0, 0.6);
      transform: translateY(-50%);
      z-index: 2;
      width: 0%;
      transition: width 1s linear;
    }

    /* 🟡 REAL-TIME GLOWING BALL CURSOR */
    .timeline-cursor {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      background: #ace600;
      box-shadow: 0 0 10px #ace600, 0 0 18px #ace600;
      transform: translate(-50%, -50%);
      z-index: 5;
      border-radius: 50%;
      transition: left 1s linear;
    }

    .timeline-nodes-row {
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 3;
    }

    /* DAY BADGE (Floats ABOVE the line) */
    .timeline-day-badge {
      position: absolute;
      top: -22px;
      background: rgba(172, 230, 0, 0.18);
      border: 1px solid #ace600;
      color: #ace600;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 0 10px rgba(172, 230, 0, 0.3);
      z-index: 10;
    }

    .timeline-node {
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      transition: all 0.3s ease;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .timeline-node.first-node {
      align-items: flex-start;
      text-align: left;
    }

    .timeline-node.middle-node {
      align-items: center;
      text-align: center;
    }

    .timeline-node.last-node {
      align-items: flex-end;
      text-align: right;
    }

    .node-tick {
      width: 3px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      margin: 3px 0;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .node-time {
      font-size: 11px;
      font-weight: 800;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }

    .node-streamer {
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
    }

    .node-streamer.is-giveaway-text {
      color: #ffea00;
    }

    /* 🔴 ACTIVE LIVE TIMELINE NODE */
    .timeline-node.active .node-tick {
      width: 4px;
      height: 18px;
      background: #ace600;
      box-shadow: 0 0 10px rgba(172, 230, 0, 0.8);
    }

    .timeline-node.active .node-streamer {
      font-size: 17px;
      font-weight: 900;
      color: #ace600;
      text-shadow: 0 0 10px rgba(172, 230, 0, 0.8);
    }

    .timeline-node.active .node-streamer.is-giveaway-text {
      color: #ffea00;
      font-size: 17px;
      text-shadow: 0 0 12px rgba(255, 234, 0, 0.9);
    }

    .timeline-node.active .node-time {
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
    }

    /* BRB Scene Mode Header */
    .brb-header {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      font-weight: 900;
      color: #ace600;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(172, 230, 0, 0.6);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- ⏱️ WIDGET 1: COMPACT COUNTDOWN TIMER -->

  <!-- 🖼️ WIDGET 4: CENTERED SPONSORSHIP LOGO ROTATOR -->
  <div class="sponsor-widget" id="sponsorWidget">

      <img id="sponsorLogo" class="sponsor-logo" src="" alt="Sponsor Logo" />
    </div>
    <span class="sponsor-label">SPONSORER</span>
  </div>

  <!-- 📅 WIDGET 5: NO-BACKGROUND TIMELINE SCHEDULE BAR -->
  <div class="schedule-widget" id="scheduleWidget">
    <div class="timeline-container">
      <div class="timeline-line-bg"></div>
      <div class="timeline-line-fill" id="timelineProgressFill"></div>
      <div class="timeline-cursor" id="timelineCursor"></div>
      
      <div class="timeline-nodes-row" id="scheduleEventsRow"></div>
    </div>
  </div>

  <!-- BRB Header Text -->
  <div class="brb-header" id="brbHeader">STRAX TILLBAKA</div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SPONSORS_FOLDER = "sponsors";
    const SOUND_VOLUME = 0.8;
    const SPONSOR_ROTATE_SECONDS = 15;

    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; 

    // BACKUP SOUNDS
    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3',
      'sounds/ssstik.io_1786299022792.mp3',
      'sounds/ssstik.io_1786299034631.mp3',
      'sounds/ssstik.io_1786299046255.mp3',
      'sounds/ssstik.io_1786299057737.mp3',
      'sounds/ssstik.io_1786299068259.mp3',
      'sounds/ssstik.io_1786299079463.mp3',
      'sounds/ssstik.io_1786299092634.mp3',
      'sounds/ssstik.io_1786299206154.mp3',
      'sounds/ssstik.io_1786299216224.mp3'
    ];

    // BACKUP SPONSOR LOGOS
    const DEFAULT_SPONSORS = [
      'https://via.placeholder.com/140x50/111/ace600?text=SPONSOR+A',
      'https://via.placeholder.com/140x50/111/00ff88?text=SPONSOR+B',
      'https://via.placeholder.com/140x50/111/ffea00?text=SPONSOR+C'
    ];

    // 📅 SCHEDULE DATA
    const ALL_SCHEDULE_EVENTS = [
      { id: 0, dayName: "MÅNDAG", start: "2026-12-14T18:00:00", end: "2026-12-14T20:00:00", timeText: "18:00 - 20:00", name: "Streamer One", giveaway: "" },
      { id: 1, dayName: "MÅNDAG", start: "2026-12-14T20:00:00", end: "2026-12-14T21:00:00", timeText: "20:00 - 21:00", name: "Streamer Two", giveaway: "" },
      { id: 2, dayName: "MÅNDAG", start: "2026-12-14T21:00:00", end: "2026-12-14T21:30:00", timeText: "21:00 - 21:30", name: "Streamer Three", giveaway: "🎁 GIVEAWAY!" },
      { id: 3, dayName: "MÅNDAG", start: "2026-12-14T21:30:00", end: "2026-12-14T23:00:00", timeText: "21:30 - 23:00", name: "Streamer Four", giveaway: "" },
      
      { id: 4, dayName: "TISDAG", start: "2026-12-15T18:00:00", end: "2026-12-15T20:00:00", timeText: "18:00 - 20:00", name: "Streamer Five", giveaway: "" },
      { id: 5, dayName: "TISDAG", start: "2026-12-15T20:00:00", end: "2026-12-15T21:00:00", timeText: "20:00 - 21:00", name: "Streamer Six", giveaway: "" },
      { id: 6, dayName: "TISDAG", start: "2026-12-15T21:00:00", end: "2026-12-15T21:30:00", timeText: "21:00 - 21:30", name: "Streamer Seven", giveaway: "🎁 GIVEAWAY!" },
      { id: 7, dayName: "TISDAG", start: "2026-12-15T21:30:00", end: "2026-12-15T23:00:00", timeText: "21:30 - 23:00", name: "Streamer Eight", giveaway: "" },
      
      { id: 8, dayName: "ONSDAG", start: "2026-12-16T18:00:00", end: "2026-12-16T20:00:00", timeText: "18:00 - 20:00", name: "Streamer Nine", giveaway: "" },
      { id: 9, dayName: "ONSDAG", start: "2026-12-16T20:00:00", end: "2026-12-16T20:30:00", timeText: "20:00 - 20:30", name: "FINAL GIVEAWAY", giveaway: "🏆 GIVEAWAY!" },
      { id: 10, dayName: "ONSDAG", start: "2026-12-16T20:30:00", end: "2026-12-16T23:00:00", timeText: "20:30 - 23:00", name: "SLUTSPURT & FINAL!", giveaway: "" }
    ];

    let soundFileList = TIKTOK_BACKUP_SOUNDS;
    let sponsorFileList = DEFAULT_SPONSORS;
    let availableSoundsPool = []; 
    let currentSponsorIndex = 0;
    let currentTotal = 0; 
    let testForcedEventId = -1; 

    // =========================================================
    // 🖐️ DRAGGABLE PANEL ENGINE
    // =========================================================
    function makePanelDraggable() {
      const panel = document.getElementById('testPanel');
      const header = document.getElementById('panelDragHeader');
      if (!panel || !header) return;

      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      header.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        panel.style.top = (panel.offsetTop - pos2) + "px";
        panel.style.left = (panel.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    // =========================================================
    // 🎛️ SCENE MODE SWITCHER ENGINE (?scene=game / starting / brb)
    // =========================================================
    function applySceneMode(forcedMode) {
      const urlParams = new URLSearchParams(window.location.search);
      const scene = forcedMode || urlParams.get('scene') || 'all';

      const countdownWidget = document.getElementById('countdownWidget');
      const scheduleWidget = document.getElementById('scheduleWidget');
      const sponsorWidget = document.getElementById('sponsorWidget');
      const goalWidget = document.getElementById('goalWidget');
      const brbHeader = document.getElementById('brbHeader');

      countdownWidget.style.display = 'block';
      scheduleWidget.style.display = 'flex';
      sponsorWidget.style.display = 'flex';
      goalWidget.style.display = 'block';
      brbHeader.style.display = 'none';

      if (scene === 'game' || scene === 'overlay') {
        countdownWidget.style.display = 'none';
        scheduleWidget.style.display = 'none';
      } 
      else if (scene === 'starting') {
        // Show Countdown + Schedule + Sponsors + Goal
      } 
      else if (scene === 'brb' || scene === 'paus') {
        countdownWidget.style.display = 'none';
        brbHeader.style.display = 'block';
      }
    }

    // =========================================================
    // 📅 OPTION A: ROLLING 5-EVENT TIMELINE
    // =========================================================
    function renderSchedule() {
      const eventsRowEl = document.getElementById('scheduleEventsRow');
      const fillLineEl = document.getElementById('timelineProgressFill');
      const cursorEl = document.getElementById('timelineCursor');

      if (!eventsRowEl) return;

      const now = new Date();

      // 1. Find Active Event Index
      let activeIndex = 0;

      if (testForcedEventId !== -1) {
        const found = ALL_SCHEDULE_EVENTS.findIndex(ev => ev.id === testForcedEventId);
        if (found !== -1) activeIndex = found;
      } else {
        const found = ALL_SCHEDULE_EVENTS.findIndex(ev => {
          const start = new Date(ev.start);
          const end = new Date(ev.end);
          return now >= start && now < end;
        });

        if (found !== -1) {
          activeIndex = found;
        } else {
          const upcoming = ALL_SCHEDULE_EVENTS.findIndex(ev => new Date(ev.start) > now);
          if (upcoming !== -1) activeIndex = upcoming;
        }
      }

      // Slice 5 events starting from activeIndex
      let visibleEvents = ALL_SCHEDULE_EVENTS.slice(activeIndex, activeIndex + 5);
      if (visibleEvents.length < 5 && ALL_SCHEDULE_EVENTS.length >= 5) {
        const startPad = Math.max(0, ALL_SCHEDULE_EVENTS.length - 5);
        visibleEvents = ALL_SCHEDULE_EVENTS.slice(startPad, ALL_SCHEDULE_EVENTS.length);
      }

      const totalVisible = visibleEvents.length;

      // 2. Real-time Progress Fill for the visible 5-event window
      if (totalVisible > 0) {
        const windowStart = new Date(visibleEvents[0].start).getTime();
        const windowEnd = new Date(visibleEvents[totalVisible - 1].end).getTime();
        const currentTime = now.getTime();

        let progressPct = 0;
        if (currentTime >= windowEnd) {
          progressPct = 100;
        } else if (currentTime > windowStart) {
          progressPct = ((currentTime - windowStart) / (windowEnd - windowStart)) * 100;
        }

        if (fillLineEl) fillLineEl.style.width = `${progressPct}%`;
        if (cursorEl) cursorEl.style.left = `${progressPct}%`;
      }

      // 3. Render 5 Events + Day Badges (NO BADGES FOR CURRENT / PAST DAYS)
      const currentActiveDay = visibleEvents[0] ? visibleEvents[0].dayName : "";
      let lastSeenDay = currentActiveDay;

      eventsRowEl.innerHTML = visibleEvents.map((ev, index) => {
        const startTime = new Date(ev.start);
        const endTime = new Date(ev.end);
        
        const isLiveNow = (testForcedEventId === ev.id) || 
                          (testForcedEventId === -1 && now >= startTime && now < endTime);

        const isPastEvent = (testForcedEventId === -1 && now >= endTime) || 
                            (testForcedEventId !== -1 && ev.id < testForcedEventId);

        let alignClass = "middle-node";
        if (index === 0) alignClass = "first-node";
        else if (index === totalVisible - 1) alignClass = "last-node";

        const liveClass = isLiveNow ? "active" : "inactive";

        const hasGiveaway = ev.giveaway && ev.giveaway.trim().length > 0;
        const primaryText = hasGiveaway ? ev.giveaway : ev.name;
        const streamerClass = hasGiveaway ? "node-streamer is-giveaway-text" : "node-streamer";

        let dayBadgeHtml = "";
        if (ev.dayName !== currentActiveDay && ev.dayName !== lastSeenDay) {
          if (!isPastEvent) {
            dayBadgeHtml = `<div class="timeline-day-badge">${ev.dayName}</div>`;
          }
          lastSeenDay = ev.dayName;
        } else {
          lastSeenDay = ev.dayName;
        }

        return `
          ${dayBadgeHtml}
          <div class="timeline-node ${alignClass} ${liveClass}">
            <div class="node-time">${ev.timeText}</div>
            <div class="node-tick"></div>
            <div class="${streamerClass}">${primaryText}</div>
          </div>
        `;
      }).join('');
    }

    function testLiveHighlight(eventId) {
      testForcedEventId = eventId;
      renderSchedule();
    }

    // =========================================================
    // 🖼️ SPONSORSHIP LOGO ROTATOR
    // =========================================================
    async function loadSponsorsAutomatically() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SPONSORS_FOLDER}`);
        if (response.ok) {
          const files = await response.json();
          const apiSponsors = files
            .filter(f => f.type === 'file' && f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i))
            .map(f => `${SPONSORS_FOLDER}/${encodeURIComponent(f.name)}`);

          if (apiSponsors.length > 0) {
            sponsorFileList = apiSponsors;
          }
        }
      } catch (e) {}

      updateSponsorLogo();
      setInterval(nextSponsor, SPONSOR_ROTATE_SECONDS * 1000);
    }

    function updateSponsorLogo() {
      const img = document.getElementById('sponsorLogo');
      if (!img || sponsorFileList.length === 0) return;

      img.style.opacity = '0';
      setTimeout(() => {
        img.src = sponsorFileList[currentSponsorIndex];
        img.style.opacity = '1';
      }, 600);
    }

    function nextSponsor() {
      if (sponsorFileList.length === 0) return;
      currentSponsorIndex = (currentSponsorIndex + 1) % sponsorFileList.length;
      updateSponsorLogo();
    }

    // =========================================================
    // ⏱️ COUNTDOWN TIMER ENGINE (Hides '00' on Event Finish)
    // =========================================================
    let countdownTargetTime = null;

    function getEventTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(`${targetYear}-12-06T20:00:00`);
      if (now > target) {
        target = new Date(`${targetYear + 1}-12-06T20:00:00`);
      }
      return target.getTime();
    }

    function initCountdown() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
      setInterval(updateCountdownDisplay, 1000);
    }

    function updateCountdownDisplay() {
      const widget = document.getElementById('countdownWidget');
      const label = document.getElementById('countdownLabel');
      const timerDisplay = document.getElementById('countdownTimer');
      const now = Date.now();
      const diff = countdownTargetTime - now;

      if (diff <= 0) {
        timerDisplay.innerText = ""; 
        label.innerText = "INSAMLINGEN ÄR AVSLUTAD!";
        widget.classList.remove('final-minute');
        widget.classList.add('timer-finished');
        document.body.classList.remove('is-final-minute');
        return;
      }

      widget.classList.remove('timer-finished');
      const totalSecondsRemaining = Math.floor(diff / 1000);

      if (totalSecondsRemaining <= 60) {
        document.body.classList.add('is-final-minute');
        widget.classList.add('final-minute');
        label.innerText = "SISTA MINUTEN!";
        timerDisplay.innerText = String(totalSecondsRemaining).padStart(2, '0');
        return;
      }

      document.body.classList.remove('is-final-minute');
      widget.classList.remove('final-minute');
      label.innerText = "INSAMLINGEN SLUTAR OM";

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      if (days > 0) {
        timerDisplay.innerHTML = `${days}D <span class="sep-dot">•</span> ${hStr}:${mStr}:${sStr}`;
      } else {
        timerDisplay.innerHTML = `${hStr}:${mStr}:${sStr}`;
      }
    }

    function simulateEndGame() {
      countdownTargetTime = Date.now() + 60000;
      updateCountdownDisplay();
    }

    function resetEventTimer() {
      countdownTargetTime = getEventTargetDate();
      updateCountdownDisplay();
    }

    // =========================================================
    // 📢 SOUND SHUFFLE POOL & ALERT ENGINE
    // =========================================================
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextShuffledSound() {
      if (!availableSoundsPool || availableSoundsPool.length === 0) {
        availableSoundsPool = shuffleArray(soundFileList);
      }
      return availableSoundsPool.pop();
    }

    async function loadSoundsAutomatically() {
      const statusElement = document.getElementById('soundStatus');
      let foundSounds = [];

      try {
        const txtRes = await fetch(`sounds/list.txt?_t=${Date.now()}`);
        if (txtRes.ok) {
          const text = await txtRes.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
          if (lines.length > 0) {
            foundSounds = lines.map(file => `sounds/${encodeURIComponent(file)}`);
          }
        }
      } catch (e) {}

      if (foundSounds.length === 0) {
        try {
          const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (response.ok) {
            const files = await response.json();
            const apiSounds = files
              .filter(f => f.type === 'file' && f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
              .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSounds.length > 0) {
              foundSounds = apiSounds;
            }
          }
        } catch (e) {}
      }

      if (foundSounds.length === 0) {
        foundSounds = TIKTOK_BACKUP_SOUNDS;
      }

      soundFileList = foundSounds;

      if (statusElement) {
        statusElement.innerHTML = `<b>${soundFileList.length} ljud redo!</b><br><span style="color:#00ff88;">Ljudfiler laddade framgångsrikt.</span>`;
      }
    }

    // 100% UN-CRASHABLE AUDIO PLAYER (4s guaranteed display timer!)
    function playAlertSound() {
      return new Promise((resolve) => {
        let isDone = false;

        const finish = () => {
          if (!isDone) {
            isDone = true;
            resolve();
          }
        };

        const hardTimeout = setTimeout(finish, 4000);

        try {
          if (soundFileList && soundFileList.length > 0) {
            const nextSoundPath = getNextShuffledSound();
            const audio = new Audio(nextSoundPath);
            audio.volume = SOUND_VOLUME;
            window.currentAudio = audio;

            audio.addEventListener('ended', () => { clearTimeout(hardTimeout); finish(); }, { once: true });
            audio.addEventListener('error', () => { clearTimeout(hardTimeout); finish(); }, { once: true });

            audio.play().catch(err => {
              console.log("Audio play caught:", err);
            });
          } else {
            clearTimeout(hardTimeout);
            setTimeout(finish, 2000);
          }
        } catch (e) {
          clearTimeout(hardTimeout);
          finish();
        }
      });
    }

    // =========================================================
    // IN-SYNC ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function updateTotalDisplaySmooth(newTotalText) {
      const display = document.getElementById('totalDisplay');
      if (!display) return;
      if (display.innerText === newTotalText) return;

      display.style.opacity = '0';
      setTimeout(() => {
        display.innerText = newTotalText;
        display.style.opacity = '1';
      }, 400);
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;

      updateTotalDisplaySmooth(`${nextAlert.newTotal} kr`);

      // 1. Show Alert Banner
      banner.classList.remove('show-alert');
      void banner.offsetWidth; // Force CSS reflow
      banner.classList.add('show-alert');

      // 2. Play Audio in background
      await playAlertSound();

      // 3. Hide Alert Banner
      banner.classList.remove('show-alert');

      // 4. Break pause between queued alerts
      setTimeout(() => {
        isProcessingAlert = false;
        processQueue();
      }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      updateTotalDisplaySmooth('0 kr');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          updateTotalDisplaySmooth(`${currentTotal} kr`);
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    // Initialize All Widgets
    makePanelDraggable();
    applySceneMode();
    renderSchedule();
    initCountdown();
    loadSponsorsAutomatically();
    loadSoundsAutomatically();
    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
    setInterval(renderSchedule, 5000);
  </script>
