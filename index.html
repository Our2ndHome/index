<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 9999;
      max-width: 320px;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    .sound-status {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #444;
      font-size: 11px;
      line-height: 1.4;
    }

    /* Total Raised Display */
    .goal-box {
      background: transparent;
      color: #ffffff;
      padding: 10px;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(0, 255, 136, 0.6);
    }

    .amount {
      color: #00ff88;
      font-size: 42px;
      font-weight: 900;
    }

    /* Pop-up Alert Banner - FADE IN / FADE OUT & DANCE ANIMATION */
    .alert-banner {
      position: absolute;
      top: 120px;
      background: transparent;
      color: #ffffff;
      padding: 10px;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      
      /* Smooth Fade In and Fade Out */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease-in-out, transform 0.08s ease-out;
      transform-origin: center bottom;

      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(255, 0, 128, 0.8);
    }

    /* Donor Name - New Color #ace600 */
    .donor-name {
      color: #ace600;
      display: block;
      font-size: 52px;
      font-weight: 900;
      text-shadow: 
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(172, 230, 0, 0.8);
    }

    /* Active visible state for Fade In */
    .show-alert {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

  <!-- TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>Testpanel (OBS Interagera)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('En anonym givare', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color: #ff0055;">Nollställ</button>
    
    <div class="sound-status" id="soundStatus">Laddar ljud...</div>
  </div>

  <!-- Donation Popup Banner -->
  <div class="alert-banner" id="alertBanner">
    <span class="donor-name" id="donorName">JOHAN</span> 
    DONERADE <span id="alertAmount">50 kr</span>!
  </div>

  <!-- Total Raised Display -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    // GITHUB DETAILS
    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SOUNDS_FOLDER = "sounds"; 
    const SOUND_VOLUME = 0.8;

    const PAUSE_BETWEEN_ALERTS_SECONDS = 5; // Break time between alerts

    // GUARANTEED BACKUP TIKTOK SOUNDS FROM SCREENSHOT
    const TIKTOK_BACKUP_SOUNDS = [
      'sounds/ssstik.io_1786298964532.mp3',
      'sounds/ssstik.io_1786298991426.mp3',
      'sounds/ssstik.io_1786299005161.mp3',
      'sounds/ssstik.io_1786299022792.mp3',
      'sounds/ssstik.io_1786299034631.mp3',
      'sounds/ssstik.io_1786299046255.mp3',
      'sounds/ssstik.io_1786299057737.mp3',
      'sounds/ssstik.io_1786299068259.mp3',
      'sounds/ssstik.io_1786299079463.mp3',
      'sounds/ssstik.io_1786299092634.mp3',
      'sounds/ssstik.io_1786299206154.mp3',
      'sounds/ssstik.io_1786299216224.mp3'
    ];

    let soundFileList = TIKTOK_BACKUP_SOUNDS;
    let currentTotal = 0; 
    let audioCtx = null;

    // 3-STAGE RELIABLE SOUND LOADER
    async function loadSoundsAutomatically() {
      const statusElement = document.getElementById('soundStatus');
      let foundSounds = [];

      try {
        const txtRes = await fetch(`sounds/list.txt?_t=${Date.now()}`);
        if (txtRes.ok) {
          const text = await txtRes.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
          if (lines.length > 0) {
            foundSounds = lines.map(file => `sounds/${encodeURIComponent(file)}`);
          }
        }
      } catch (e) {}

      if (foundSounds.length === 0) {
        try {
          const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SOUNDS_FOLDER}`);
          if (response.ok) {
            const files = await response.json();
            const apiSounds = files
              .filter(f => f.type === 'file' && f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
              .map(f => `${SOUNDS_FOLDER}/${encodeURIComponent(f.name)}`);

            if (apiSounds.length > 0) {
              foundSounds = apiSounds;
            }
          }
        } catch (e) {}
      }

      if (foundSounds.length === 0) {
        foundSounds = TIKTOK_BACKUP_SOUNDS;
      }

      soundFileList = foundSounds;

      if (statusElement) {
        statusElement.innerHTML = `<b>${soundFileList.length} ljud redo!</b><br><span style="color:#00ff88;">Ljudfiler laddade framgångsrikt.</span>`;
      }
      console.log("Active sound list:", soundFileList);
    }

    // HIGH-ENERGY RHYTHM DANCE ENGINE
    function playAlertSound() {
      return new Promise((resolve) => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const banner = document.getElementById('alertBanner');

        if (soundFileList.length > 0) {
          const randomSoundPath = soundFileList[Math.floor(Math.random() * soundFileList.length)];
          const audio = new Audio(randomSoundPath);
          audio.volume = SOUND_VOLUME;
          window.currentAudio = audio;

          try {
            const source = audioCtx.createMediaElementSource(audio);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; 
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            let animFrameId;
            let smoothVolume = 0;

            // 🕺 HIGH ENERGY DANCE ANIMATION LOOP 🕺
            function syncRhythm() {
              analyser.getByteFrequencyData(dataArray);

              let sum = 0;
              const bassBins = Math.floor(bufferLength * 0.4); 
              for (let i = 0; i < bassBins; i++) {
                sum += dataArray[i];
              }
              let avgVolume = sum / bassBins; // 0 to 255

              // Fast-reacting Lerp for snappy beats
              smoothVolume += (avgVolume - smoothVolume) * 0.35;
              const normVol = smoothVolume / 255;

              // 1. Scale up to 1.7x (70% bigger on heavy beats)
              let scale = 1 + normVol * 0.7;
              
              // 2. Vertical Jump up to -35px on beat hits
              let jumpY = -normVol * 35;
              
              // 3. Gentle rhythmic side-to-side sway
              let tilt = Math.sin(Date.now() / 120) * (normVol * 6);

              if (banner && banner.classList.contains('show-alert')) {
                banner.style.transform = `scale(${scale}) translateY(${jumpY}px) rotate(${tilt}deg)`;
              }

              if (!audio.paused && !audio.ended) {
                animFrameId = requestAnimationFrame(syncRhythm);
              } else {
                if (banner) banner.style.transform = `scale(1) translateY(0px) rotate(0deg)`;
              }
            }

            audio.addEventListener('play', () => { syncRhythm(); });
            audio.addEventListener('ended', () => {
              cancelAnimationFrame(animFrameId);
              if (banner) banner.style.transform = `scale(1) translateY(0px) rotate(0deg)`;
            });

          } catch (e) {
            console.log("Audio Analyser note:", e);
          }

          // Resolve immediately when music ends
          audio.addEventListener('ended', () => {
            if (banner) banner.style.transform = `scale(1) translateY(0px) rotate(0deg)`;
            resolve(audio.duration || 3);
          });

          audio.addEventListener('error', (err) => {
            console.log("Error loading audio path:", randomSoundPath, err);
            resolve(3);
          });

          audio.play().catch(err => {
            console.log("Audio play error:", err);
            resolve(3);
          });

        } else {
          // Fallback Synthesizer sound
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          if (banner) {
            banner.style.transform = `scale(1.3) translateY(-20px)`;
            setTimeout(() => { banner.style.transform = `scale(1) translateY(0px)`; }, 350);
          }

          resolve(1.5);
        }
      });
    }

    loadSoundsAutomatically();

    // =========================================================
    // ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;

      // 1. Fade IN
      banner.classList.add('show-alert');

      // 2. Play sound and wait for it to finish
      const soundDuration = await playAlertSound();

      // Ensure at least 2.5s display time for very short sounds
      const remainingDisplayTime = Math.max(0, (2.5 - soundDuration) * 1000);

      setTimeout(() => {
        // 3. Fade OUT right when the music finishes!
        banner.classList.remove('show-alert');
        
        // 4. Wait for fade out transition (0.5s) + 5-second break pause
        setTimeout(() => {
          isProcessingAlert = false;
          processQueue();
        }, 500 + (PAUSE_BETWEEN_ALERTS_SECONDS * 1000));

      }, remainingDisplayTime);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
