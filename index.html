<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Musikhjälpen Bössan Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* TEST CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff88;
      padding: 12px;
      border-radius: 10px;
      color: white;
      z-index: 9999;
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .test-panel button {
      background: #222;
      color: white;
      border: 1px solid #00ff88;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .test-panel button:hover {
      background: #00ff88;
      color: black;
    }

    /* Total Raised Box */
    .goal-box {
      background: rgba(20, 20, 20, 0.9);
      border: 3px solid #00ff88;
      color: white;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      text-align: center;
    }

    .amount {
      color: #00ff88;
      font-size: 36px;
    }

    /* Pop-up Alert Banner */
    .alert-banner {
      position: absolute;
      top: 100px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      padding: 20px 45px;
      border-radius: 15px;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      text-align: center;
      transition: transform 0.05s ease-out; /* Smooth 60fps movement */
      transform-origin: center center;
    }

    .donor-name {
      color: #ffea00;
      display: block;
      font-size: 38px;
    }

    .show-alert {
      display: block;
      animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- TEST CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4>🧪 Testpanel (OBS Interagera)</h4>
    <button onclick="simulateDonation('Anna', 50)">+50 kr (Anna)</button>
    <button onclick="simulateDonation('Erik', 200)">+200 kr (Erik)</button>
    <button onclick="simulateDonation('En anonym givare', 100)">+100 kr (Anonym)</button>
    <button onclick="resetTotal()" style="border-color: #ff0055;">Nollställ</button>
  </div>

  <!-- Donation Popup Banner -->
  <div class="alert-banner" id="alertBanner">
    🎉 <span class="donor-name" id="donorName">JOHAN</span> 
    DONERADE <span id="alertAmount">50 kr</span>! 🎉
  </div>

  <!-- Total Raised Box -->
  <div class="goal-box">
    INSAMLAT: <span class="amount" id="totalDisplay">0 kr</span>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const FUNDRAISER_API_URL = "https://musikhjalpen-franceska.herokuapp.com/server/fundraisers/6ScUK7SzaLDgMSesIjAYA8?fields%5B%5D=amount&fields%5B%5D=donations";
    const CHECK_INTERVAL_SECONDS = 5;

    const SOUNDS_FOLDER = "sounds"; 
    const SOUND_VOLUME = 0.8;
    const MINIMUM_ALERT_DURATION_SECONDS = 5; 
    const PAUSE_BETWEEN_ALERTS_SECONDS = 5;    

    let soundFileList = [];
    let currentTotal = 0; 
    let audioCtx = null;

    // Auto-detect GitHub username and repo name
    function getGitHubDetails() {
      let username = "";
      let repo = "";
      if (window.location.hostname.endsWith(".github.io")) {
        username = window.location.hostname.split('.')[0];
        const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
        repo = pathParts.length > 0 ? pathParts[0] : `${username}.github.io`;
      }
      return { username, repo };
    }

    async function loadSoundsFromGitHubFolder() {
      const { username, repo } = getGitHubDetails();
      if (!username || !repo) return;

      try {
        const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${SOUNDS_FOLDER}`);
        if (!response.ok) throw new Error("Folder fetch failed");

        const files = await response.json();
        soundFileList = files
          .filter(f => f.name.match(/\.(mp3|wav|ogg)$/i))
          .map(f => f.download_url || f.path);

        console.log(`Loaded ${soundFileList.length} sounds from GitHub folder.`);
      } catch (err) {
        console.log("No custom sounds found in 'sounds' folder yet. Using synthesizer fallback.", err);
      }
    }

    // REAL-TIME AUDIO ANALYSER (Rhythm Sync Engine)
    function playAlertSound() {
      return new Promise((resolve) => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const banner = document.getElementById('alertBanner');

        if (soundFileList.length > 0) {
          const randomSound = soundFileList[Math.floor(Math.random() * soundFileList.length)];
          const audio = new Audio();
          audio.crossOrigin = "anonymous";
          audio.src = randomSound;
          audio.volume = SOUND_VOLUME;
          window.currentAudio = audio;

          // Connect audio to AnalyserNode to read real-time volume/frequencies
          const source = audioCtx.createMediaElementSource(audio);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64; 
          const bufferLength = analyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);

          source.connect(analyser);
          analyser.connect(audioCtx.destination);

          let animFrameId;

          // 60FPS animation loop reading rhythm levels
          function syncRhythm() {
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
              sum += dataArray[i];
            }
            let avgVolume = sum / bufferLength; // 0 to 255

            // Calculate scale (pulse size) and shake offsets
            let scale = 1 + (avgVolume / 255) * 0.35; // Expands up to 35% larger on beats
            let shakeX = (Math.random() - 0.5) * (avgVolume / 12); // Vibrates X
            let shakeY = (Math.random() - 0.5) * (avgVolume / 12); // Vibrates Y
            let rotate = (Math.random() - 0.5) * (avgVolume / 25); // Slight tilt

            if (banner && banner.classList.contains('show-alert')) {
              banner.style.transform = `scale(${scale}) translate(${shakeX}px, ${shakeY}px) rotate(${rotate}deg)`;
            }

            if (!audio.paused && !audio.ended) {
              animFrameId = requestAnimationFrame(syncRhythm);
            } else {
              if (banner) banner.style.transform = `scale(1) translate(0px, 0px) rotate(0deg)`;
            }
          }

          audio.addEventListener('play', () => {
            syncRhythm();
          });

          audio.addEventListener('ended', () => {
            cancelAnimationFrame(animFrameId);
            if (banner) banner.style.transform = `scale(1) translate(0px, 0px) rotate(0deg)`;
            resolve(audio.duration || MINIMUM_ALERT_DURATION_SECONDS);
          });

          audio.addEventListener('error', (err) => {
            console.log("Audio play error:", err);
            resolve(MINIMUM_ALERT_DURATION_SECONDS);
          });

          audio.play().catch(err => {
            console.log("Audio play blocked/error:", err);
            resolve(MINIMUM_ALERT_DURATION_SECONDS);
          });

        } else {
          // Fallback Synthesizer sound with pulse effect
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          // Pulse banner manually on synth beat
          if (banner) {
            banner.style.transform = `scale(1.2) rotate(2deg)`;
            setTimeout(() => { banner.style.transform = `scale(1) rotate(0deg)`; }, 300);
          }

          resolve(1.5);
        }
      });
    }

    loadSoundsFromGitHubFolder();

    // =========================================================
    // ALERT QUEUE SYSTEM
    // =========================================================
    const alertQueue = [];
    let isProcessingAlert = false;

    function enqueueAlert(donorName, diffAmount, newTotal) {
      alertQueue.push({ donorName, diffAmount, newTotal });
      processQueue();
    }

    async function processQueue() {
      if (isProcessingAlert || alertQueue.length === 0) return;

      isProcessingAlert = true;
      const nextAlert = alertQueue.shift();

      const banner = document.getElementById('alertBanner');
      document.getElementById('donorName').innerText = nextAlert.donorName;
      document.getElementById('alertAmount').innerText = `${nextAlert.diffAmount} kr`;
      document.getElementById('totalDisplay').innerText = `${nextAlert.newTotal} kr`;
      banner.classList.add('show-alert');

      const soundDuration = await playAlertSound();
      const bannerDurationMs = Math.max(soundDuration, MINIMUM_ALERT_DURATION_SECONDS) * 1000;

      setTimeout(() => {
        banner.classList.remove('show-alert');
        banner.style.transform = `scale(1) translate(0px, 0px) rotate(0deg)`;
        
        setTimeout(() => {
          isProcessingAlert = false;
          processQueue();
        }, PAUSE_BETWEEN_ALERTS_SECONDS * 1000);

      }, bannerDurationMs);
    }

    // =========================================================
    // MANUAL TEST BUTTONS
    // =========================================================
    function simulateDonation(name, amount) {
      currentTotal += amount;
      enqueueAlert(name, amount, currentTotal);
    }

    function resetTotal() {
      currentTotal = 0;
      alertQueue.length = 0;
      document.getElementById('totalDisplay').innerText = `0 kr`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('live') === '1') {
      document.getElementById('testPanel').style.display = 'none';
    }

    // =========================================================
    // LIVE API POLLING WITH ANTI-CACHE
    // =========================================================
    async function fetchMusikhjalpenData() {
      try {
        const cacheBusterUrl = FUNDRAISER_API_URL + '&_t=' + Date.now();
        const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        let amount = Number(data.amount || 0);

        let latestDonorName = "En anonym givare"; 
        if (data.donations && data.donations.length > 0) {
          const lastDonation = data.donations[0];
          if (lastDonation.name && lastDonation.name.trim() !== "") {
            latestDonorName = lastDonation.name;
          }
        }

        if (currentTotal === 0 && amount > 0) {
          currentTotal = amount;
          document.getElementById('totalDisplay').innerText = `${currentTotal} kr`;
          return;
        }

        if (amount > currentTotal) {
          const donationDiff = amount - currentTotal;
          currentTotal = amount;
          enqueueAlert(latestDonorName, donationDiff, currentTotal);
        }

      } catch (err) {
        console.log("Connecting to Musikhjälpen API...", err);
      }
    }

    fetchMusikhjalpenData();
    setInterval(fetchMusikhjalpenData, CHECK_INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
