<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Schedule & Sponsors Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.92);
      --shadow-dark: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ CONTROL PANEL & VERSION BADGE */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      max-width: 340px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: move;
      user-select: none;
    }

    .panel-header h4 {
      margin: 0;
      font-size: 12px;
      color: var(--secondary-color);
      text-transform: uppercase;
    }

    .version-badge {
      background: var(--primary-color);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .test-panel button {
      background: #222;
      color: var(--text-white);
      border: 1px solid var(--secondary-color);
      padding: 6px 10px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .test-panel button:hover {
      background: var(--secondary-color);
      color: #000;
    }

    .test-panel button.active {
      background: var(--primary-color);
      color: #000;
      border-color: var(--primary-color);
    }

    /* 🖼️ SPONSOR ROTATOR */
    .sponsor-widget {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sponsor-logo-container {
      width: 140px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
      filter: drop-shadow(0 2px 5px var(--shadow-dark));
    }

    .sponsor-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--primary-color);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
      text-shadow: 0 2px 5px var(--shadow-dark);
    }

    /* 📅 SCHEDULE TIMELINE BAR */
    .schedule-widget {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 96vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }

    .timeline-container {
      position: relative;
      width: 100%;
    }

    .timeline-line-bg {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
      z-index: 1;
    }

    .timeline-line-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 3px;
      background: var(--primary-color);
      box-shadow: 0 0 8px rgba(172, 230, 0, 0.7);
      transform: translateY(-50%);
      z-index: 2;
      width: 0%;
      transition: width 0.2s linear;
    }

    /* 🎯 100% ACCURATE PROGRESS DOT */
    .timeline-cursor {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 12px;
      height: 12px;
      background: var(--primary-color);
      box-shadow: 0 0 8px var(--primary-color);
      transform: translate(-50%, -50%);
      z-index: 5;
      border-radius: 50%;
      transition: left 0.2s linear;
    }

    .timeline-cursor::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border: 1.5px solid var(--primary-color);
      border-radius: 50%;
      animation: cursorSonar 1.8s infinite ease-out;
    }

    @keyframes cursorSonar {
      0% { transform: scale(0.5); opacity: 0.9; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    .timeline-nodes-row {
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 3;
    }

    .timeline-node {
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      align-items: center;
      text-align: center;
      padding: 0 2px;
      text-shadow: 0 2px 6px var(--shadow-dark);
    }

    .node-time {
      height: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #e0e0e0;
      white-space: nowrap;
    }

    .node-tick-wrapper {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .node-divider-tick {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      z-index: 4;
    }

    .node-streamer {
      height: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--text-white);
      white-space: nowrap;
    }

    .node-streamer.is-giveaway-text { color: var(--giveaway-color); }

    .timeline-node.active .node-divider-tick {
      background: var(--primary-color);
      height: 16px;
      width: 3px;
    }

    .timeline-node.active .node-streamer {
      font-size: 16px;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <!-- 🎛️ CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <div class="panel-header" id="panelDragHeader">
      <h4>📅 SCHEMA & SPONSOR PANEL</h4>
      <span class="version-badge">v2.0.0</span>
    </div>
    <div>
      <button id="btnReal" class="active" onclick="setMode('real')">📅 SKARPT (30 nov - 6 dec)</button>
      <button id="btnTest" onclick="setMode('test')">⚡ TEST (Realtid)</button>
      <button onclick="nextSponsor()">Nästa Sponsor</button>
    </div>
  </div>

  <!-- 🖼️ SPONSOR ROTATOR -->
  <div class="sponsor-widget" id="sponsorWidget">
    <div class="sponsor-logo-container">
      <img id="sponsorLogo" class="sponsor-logo" src="" alt="Sponsor Logo" />
    </div>
    <span class="sponsor-label">SPONSORER</span>
  </div>

  <!-- 📅 SCHEDULE TIMELINE BAR -->
  <div class="schedule-widget" id="scheduleWidget">
    <div class="timeline-container">
      <div class="timeline-line-bg"></div>
      <div class="timeline-line-fill" id="timelineProgressFill"></div>
      <div class="timeline-cursor" id="timelineCursor"></div>
      <div class="timeline-nodes-row" id="scheduleEventsRow"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ✏️ 2. SUPER SIMPLE SCHEDULE EDITING
    // Edit schedule here easily: "YYYY-MM-DD HH:MM"
    // ==========================================
    const SKARPT_EVENT_SCHEDULE = [
      // MÅNDAG 30 NOV
      { start: "2026-11-30 12:00", end: "2026-11-30 15:00", name: "Invigning & Morgongänget", giveaway: "" },
      { start: "2026-11-30 15:00", end: "2026-11-30 18:00", name: "PixelPionjärerna", giveaway: "" },
      { start: "2026-11-30 18:00", end: "2026-11-30 21:00", name: "KaffeKungen", giveaway: "🎁 GIVEAWAY: Gaming Mus" },
      { start: "2026-11-30 21:00", end: "2026-12-01 00:00", name: "Nattstreamers", giveaway: "" },

      // TISDAG 1 DEC
      { start: "2026-12-01 00:00", end: "2026-12-01 06:00", name: "Nattpatrullen", giveaway: "" },
      { start: "2026-12-01 06:00", end: "2026-12-01 12:00", name: "Morgonsolen", giveaway: "" },
      { start: "2026-12-01 12:00", end: "2026-12-01 16:00", name: "ZeldaMästaren", giveaway: "" },
      { start: "2026-12-01 16:00", end: "2026-12-01 20:00", name: "RetroSpelaren", giveaway: "🎁 GIVEAWAY: Headset" },
      { start: "2026-12-01 20:00", end: "2026-12-02 00:00", name: "KvällsShowen", giveaway: "" },

      // ONSDAG 2 DEC
      { start: "2026-12-02 00:00", end: "2026-12-02 08:00", name: "NattUggan", giveaway: "" },
      { start: "2026-12-02 08:00", end: "2026-12-02 14:00", name: "Förmiddagsmys", giveaway: "" },
      { start: "2026-12-02 14:00", end: "2026-12-02 18:00", name: "Speedrunners", giveaway: "" },
      { start: "2026-12-02 18:00", end: "2026-12-02 22:00", name: "Svenska Eliten", giveaway: "🎁 GIVEAWAY: Tangentbord" },
      { start: "2026-12-02 22:00", end: "2026-12-03 00:00", name: "Nattchatt & Musik", giveaway: "" },

      // TORSDAG 3 DEC
      { start: "2026-12-03 00:00", end: "2026-12-03 08:00", name: "Nattladdningen", giveaway: "" },
      { start: "2026-12-03 08:00", end: "2026-12-03 14:00", name: "MH-Special Live", giveaway: "" },
      { start: "2026-12-03 14:00", end: "2026-12-03 19:00", name: "Gäster & Turnering", giveaway: "" },
      { start: "2026-12-03 19:00", end: "2026-12-03 23:00", name: "Stora Samlingen", giveaway: "🎁 MEGA GIVEAWAY!" },
      { start: "2026-12-03 23:00", end: "2026-12-04 00:00", name: "Late Night Gaming", giveaway: "" },

      // FREDAG 4 DEC
      { start: "2026-12-04 00:00", end: "2026-12-04 09:00", name: "Fredagsnatt", giveaway: "" },
      { start: "2026-12-04 09:00", end: "2026-12-04 15:00", name: "Helgstarten", giveaway: "" },
      { start: "2026-12-04 15:00", end: "2026-12-04 20:00", name: "Fredagsmys & Esport", giveaway: "" },
      { start: "2026-12-04 20:00", end: "2026-12-05 00:00", name: "FredagsGalan", giveaway: "🎁 GIVEAWAY: Konsol" },

      // LÖRDAG 5 DEC
      { start: "2026-12-05 00:00", end: "2026-12-05 10:00", name: "Lördagsnatt", giveaway: "" },
      { start: "2026-12-05 10:00", end: "2026-12-05 16:00", name: "LördagsSatsningen", giveaway: "" },
      { start: "2026-12-05 16:00", end: "2026-12-05 21:00", name: "Kändisduellen", giveaway: "🎁 VIP GIVEAWAY!" },
      { start: "2026-12-05 21:00", end: "2026-12-06 00:00", name: "Lördagsparty", giveaway: "" },

      // SÖNDAG 6 DEC
      { start: "2026-12-06 00:00", end: "2026-12-06 10:00", name: "Sista Natten", giveaway: "" },
      { start: "2026-12-06 10:00", end: "2026-12-06 15:00", name: "Spurt-Inlägget", giveaway: "" },
      { start: "2026-12-06 15:00", end: "2026-12-06 20:00", name: "Stora Finalen", giveaway: "🎁 SLUT-GIVEAWAY!" },
      { start: "2026-12-06 20:00", end: "2026-12-06 23:59", name: "Avslutning & Tack!", giveaway: "" }
    ];

    // ==========================================
    // CONFIGURATION & SPONSORS
    // ==========================================
    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SPONSORS_FOLDER = "sponsors";
    const SPONSOR_ROTATE_SECONDS = 15;

    const DEFAULT_SPONSORS = [
      'https://via.placeholder.com/140x50/111/ace600?text=SPONSOR+A',
      'https://via.placeholder.com/140x50/111/00ff88?text=SPONSOR+B',
      'https://via.placeholder.com/140x50/111/ffea00?text=SPONSOR+C'
    ];

    let sponsorFileList = DEFAULT_SPONSORS;
    let currentSponsorIndex = 0;
    let scheduleMode = 'real'; // 'real' or 'test'

    // Parse simple string date ("YYYY-MM-DD HH:MM")
    function parseDate(dateStr) {
      if (dateStr instanceof Date) return dateStr;
      return new Date(dateStr.replace(' ', 'T') + ':00');
    }

    // Format HH:MM from Date
    function formatTime(date) {
      const pad = n => String(n).padStart(2, '0');
      return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // Get Swedish Day Name
    function getDayName(date) {
      const days = ["SÖNDAG", "MÅNDAG", "TISDAG", "ONSDAG", "TORSDAG", "FREDAG", "LÖRDAG"];
      return days[date.getDay()];
    }

    // ⚡ 4. REAL-TIME DYNAMIC TEST SCHEDULE GENERATOR
    function generateTestSchedule() {
      const now = new Date();
      const events = [];
      
      // Build relative slots relative to right now so test is always live
      for (let i = -1; i < 7; i++) {
        const start = new Date(now.getTime() + i * 2 * 3600000);
        const end = new Date(now.getTime() + (i + 1) * 2 * 3600000);
        events.push({
          start: start,
          end: end,
          name: i === 0 ? "LIVE JUST NU!" : `Streamer #${i + 2}`,
          giveaway: i === 1 ? "🎁 GIVEAWAY TEST" : ""
        });
      }
      return events;
    }

    function getActiveSchedule() {
      if (scheduleMode === 'test') {
        return generateTestSchedule();
      }
      return SKARPT_EVENT_SCHEDULE.map(ev => ({
        ...ev,
        start: parseDate(ev.start),
        end: parseDate(ev.end)
      }));
    }

    // 🎯 3. 100% ACCURATE REAL-TIME PROGRESS CALCULATION & RENDER
    function renderSchedule() {
      const eventsRowEl = document.getElementById('scheduleEventsRow');
      const fillLineEl = document.getElementById('timelineProgressFill');
      const cursorEl = document.getElementById('timelineCursor');
      if (!eventsRowEl) return;

      const schedule = getActiveSchedule();
      const now = new Date();

      // Find current active event or next upcoming event
      let activeIndex = schedule.findIndex(ev => now >= ev.start && now < ev.end);
      if (activeIndex === -1) {
        activeIndex = schedule.findIndex(ev => ev.start > now);
        if (activeIndex === -1) activeIndex = 0;
      }

      // Display 5 visible node slots
      const visibleCount = 5;
      const visibleEvents = schedule.slice(activeIndex, activeIndex + visibleCount);
      const totalVisible = visibleEvents.length;

      if (totalVisible > 0) {
        const currentEv = visibleEvents[0];
        const startMs = currentEv.start.getTime();
        const endMs = currentEv.end.getTime();
        const nowMs = now.getTime();

        // Fraction elapsed inside current active event (0.0 to 1.0)
        let slotFraction = 0;
        if (nowMs >= startMs && nowMs < endMs) {
          slotFraction = (nowMs - startMs) / (endMs - startMs);
        } else if (nowMs >= endMs) {
          slotFraction = 1;
        }

        // Exact timeline progress percentage calculation across total visible slots
        // Each node takes exactly (100 / totalVisible) percentage width
        const totalProgressPct = Math.min(100, Math.max(0, (slotFraction / totalVisible) * 100));

        if (fillLineEl) fillLineEl.style.width = `${totalProgressPct}%`;
        if (cursorEl) cursorEl.style.left = `${totalProgressPct}%`;
      }

      // Render timeline HTML nodes
      eventsRowEl.innerHTML = visibleEvents.map((ev, index) => {
        const isLiveNow = now >= ev.start && now < ev.end;
        const timeText = `${formatTime(ev.start)} - ${formatTime(ev.end)}`;
        const hasGiveaway = Boolean(ev.giveaway && ev.giveaway.trim());
        const primaryText = escapeHTML(hasGiveaway ? ev.giveaway : ev.name);

        return `
          <div class="timeline-node ${isLiveNow ? 'active' : ''}">
            <div class="node-time">${timeText}</div>
            <div class="node-tick-wrapper"><div class="node-divider-tick"></div></div>
            <div class="node-streamer ${hasGiveaway ? 'is-giveaway-text' : ''}">${primaryText}</div>
          </div>
        `;
      }).join('');
    }

    // MODE TOGGLING
    function setMode(mode) {
      scheduleMode = mode;
      document.getElementById('btnReal').classList.toggle('active', mode === 'real');
      document.getElementById('btnTest').classList.toggle('active', mode === 'test');
      renderSchedule();
    }

    // SPONSOR ROTATOR
    async function loadSponsorsAutomatically() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SPONSORS_FOLDER}`);
        if (res.ok) {
          const files = await res.json();
          const apiSponsors = files.filter(f => f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i))
                                   .map(f => `${SPONSORS_FOLDER}/${encodeURIComponent(f.name)}`);
          if (apiSponsors.length > 0) sponsorFileList = apiSponsors;
        }
      } catch(e) {}

      updateSponsorLogo();
      setInterval(nextSponsor, SPONSOR_ROTATE_SECONDS * 1000);
    }

    function updateSponsorLogo() {
      const img = document.getElementById('sponsorLogo');
      if (!img || sponsorFileList.length === 0) return;
      img.style.opacity = '0';
      setTimeout(() => {
        img.src = sponsorFileList[currentSponsorIndex];
        img.style.opacity = '1';
      }, 600);
    }

    function nextSponsor() {
      currentSponsorIndex = (currentSponsorIndex + 1) % sponsorFileList.length;
      updateSponsorLogo();
    }

    // DRAGGABLE PANEL
    function makePanelDraggable() {
      const panel = document.getElementById('testPanel');
      const header = document.getElementById('panelDragHeader');
      if (!panel || !header) return;

      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      header.onmousedown = (e) => {
        e.preventDefault();
        pos3 = e.clientX; pos4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (ev) => {
          ev.preventDefault();
          pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
          pos3 = ev.clientX; pos4 = ev.clientY;
          panel.style.top = (panel.offsetTop - pos2) + "px";
          panel.style.left = (panel.offsetLeft - pos1) + "px";
        };
      };
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // INIT
    makePanelDraggable();
    loadSponsorsAutomatically();
    renderSchedule();
    setInterval(renderSchedule, 1000);
  </script>
</body>
</html>
