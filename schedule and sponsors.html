<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Schedule & Sponsors</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.92);
      --shadow-dark: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      max-width: 360px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 136, 0.1);
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px dashed rgba(0, 255, 136, 0.4);
    }

    .version-badge {
      background: var(--secondary-color);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .test-panel button {
      background: #222;
      color: var(--text-white);
      border: 1px solid var(--secondary-color);
      padding: 5px 8px;
      margin: 2px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .test-panel button:hover { background: var(--secondary-color); color: black; }

    .refresh-btn {
      background: #ffea00 !important;
      color: #000 !important;
      font-weight: 900 !important;
      border-color: #ffea00 !important;
      margin-top: 6px !important;
      width: 100%;
    }

    .panel-section { margin-top: 6px; border-top: 1px solid #444; padding-top: 6px; }

    /* 🖼️ SPONSOR ROTATOR (ORIGINAL LAYOUT) */
    .sponsor-widget {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sponsor-logo-container {
      width: 140px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
      filter: drop-shadow(0 2px 5px var(--shadow-dark));
    }

    .sponsor-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--primary-color);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
      text-shadow: 0 2px 5px var(--shadow-dark);
    }

    /* 📅 SCHEDULE TIMELINE BAR (ORIGINAL LAYOUT) */
    .schedule-widget {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 96vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }

    .timeline-container {
      position: relative;
      width: 100%;
    }

    .timeline-line-bg {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
      z-index: 1;
    }

    .timeline-line-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 3px;
      background: var(--primary-color);
      box-shadow: 0 0 6px rgba(172, 230, 0, 0.5);
      transform: translateY(-50%);
      z-index: 2;
      width: 0%;
      transition: width 0.3s linear;
    }

    .timeline-cursor {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      background: var(--primary-color);
      box-shadow: 0 0 6px var(--primary-color);
      transform: translate(-50%, -50%);
      z-index: 5;
      border-radius: 50%;
      transition: left 0.3s linear;
    }

    .timeline-cursor::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border: 1.5px solid var(--primary-color);
      border-radius: 50%;
      animation: cursorSonar 1.8s infinite ease-out;
    }

    @keyframes cursorSonar {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .timeline-nodes-row {
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 3;
    }

    .timeline-day-badge {
      background: rgba(172, 230, 0, 0.12);
      border: 1px solid rgba(172, 230, 0, 0.6);
      backdrop-filter: blur(4px);
      color: var(--primary-color);
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 12px;
      align-self: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .timeline-node {
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1;
      align-items: center;
      text-align: center;
      padding: 0 2px;
      transition: all 0.3s ease;
      text-shadow: 0 2px 6px var(--shadow-dark);
    }

    .node-time {
      height: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #e0e0e0;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .node-tick-wrapper {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .node-divider-tick {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1px;
      transition: all 0.3s ease;
      z-index: 4;
    }

    .timeline-node.last-node .node-tick-wrapper::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1px;
      transition: all 0.3s ease;
      z-index: 4;
    }

    .node-streamer {
      height: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--text-white);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .node-streamer.is-giveaway-text {
      color: var(--giveaway-color);
    }

    .timeline-node.active .node-divider-tick {
      background: var(--primary-color);
      height: 16px;
      width: 3px;
      box-shadow: 0 0 6px rgba(172, 230, 0, 0.6);
    }

    .timeline-node.active .node-streamer {
      font-size: 17px;
      font-weight: 900;
      color: var(--primary-color);
      text-shadow: 0 0 8px rgba(172, 230, 0, 0.5);
    }

    .timeline-node.active .node-streamer.is-giveaway-text {
      color: var(--giveaway-color);
      font-size: 17px;
      text-shadow: 0 0 8px rgba(255, 234, 0, 0.6);
    }

    .timeline-node.active .node-time {
      color: var(--text-white);
      font-size: 12px;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- 🎛️ CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">📅 SCHEMA & SPONSOR <span class="version-badge">v4.0</span></h4>
    
    <div>
      <button onclick="nextSponsor()">Nästa Sponsor</button>
      <button onclick="switchTestDate('AUTO')">⚡ Auto (Nu)</button>
    </div>

    <div class="panel-section">
      <b>Testa Dag (30 Nov – 6 Dec):</b><br>
      <button onclick="switchTestDate('2026-11-30')">Mån 30 Nov</button>
      <button onclick="switchTestDate('2026-12-01')">Tis 1 Dec</button>
      <button onclick="switchTestDate('2026-12-02')">Ons 2 Dec</button>
      <button onclick="switchTestDate('2026-12-03')">Tor 3 Dec</button>
      <button onclick="switchTestDate('2026-12-04')">Fre 4 Dec</button>
      <button onclick="switchTestDate('2026-12-05')">Lör 5 Dec</button>
      <button onclick="switchTestDate('2026-12-06')">Sön 6 Dec</button>
    </div>

    <button class="refresh-btn" onclick="location.reload()">🔄 Refresh Overlay</button>
  </div>

  <!-- 🖼️ SPONSOR ROTATOR -->
  <div class="sponsor-widget" id="sponsorWidget">
    <div class="sponsor-logo-container">
      <img id="sponsorLogo" class="sponsor-logo" src="" alt="Sponsor Logo" />
    </div>
    <span class="sponsor-label">SPONSORER</span>
  </div>

  <!-- 📅 SCHEDULE TIMELINE BAR -->
  <div class="schedule-widget" id="scheduleWidget">
    <div class="timeline-container">
      <div class="timeline-line-bg"></div>
      <div class="timeline-line-fill" id="timelineProgressFill"></div>
      <div class="timeline-cursor" id="timelineCursor"></div>
      <div class="timeline-nodes-row" id="scheduleEventsRow"></div>
    </div>
  </div>

  <script>
    // =========================================================
    // 📅 MUSIKHJÄLPEN 24/7 EVENT WEEK SCHEDULE (30 NOV - 6 DEC 2026)
    // Edit streamer names, time ranges (timeText), and giveaways here!
    // =========================================================
    const EVENT_WEEK_SCHEDULE = [
      // 🗓️ MÅNDAG 30 NOV 2026
      { date: "2026-11-30", dayName: "MÅNDAG 30 NOV", timeText: "12:00 - 15:00", start: "2026-11-30T12:00:00", end: "2026-11-30T15:00:00", name: "MorgonSolen" },
      { date: "2026-11-30", dayName: "MÅNDAG 30 NOV", timeText: "15:00 - 18:00", start: "2026-11-30T15:00:00", end: "2026-11-30T18:00:00", name: "PixelPionjären" },
      { date: "2026-11-30", dayName: "MÅNDAG 30 NOV", timeText: "18:00 - 21:00", start: "2026-11-30T18:00:00", end: "2026-11-30T21:00:00", name: "KaffeKungen" },
      { date: "2026-11-30", dayName: "MÅNDAG 30 NOV", timeText: "21:00 - 00:00", start: "2026-11-30T21:00:00", end: "2026-12-01T00:00:00", name: "NattUgglan", giveaway: "🎁 PREMIÄR GIVEAWAY!" },

      // 🗓️ TISDAG 1 DEC 2026
      { date: "2026-12-01", dayName: "TISDAG 1 DEC", timeText: "00:00 - 06:00", start: "2026-12-01T00:00:00", end: "2026-12-01T06:00:00", name: "NattLiret" },
      { date: "2026-12-01", dayName: "TISDAG 1 DEC", timeText: "06:00 - 12:00", start: "2026-12-01T06:00:00", end: "2026-12-01T12:00:00", name: "MorgonGänget" },
      { date: "2026-12-01", dayName: "TISDAG 1 DEC", timeText: "12:00 - 18:00", start: "2026-12-01T12:00:00", end: "2026-12-01T18:00:00", name: "RetroSpelaren" },
      { date: "2026-12-01", dayName: "TISDAG 1 DEC", timeText: "18:00 - 00:00", start: "2026-12-01T18:00:00", end: "2026-12-02T00:00:00", name: "KvällsGänget" },

      // 🗓️ ONSDAG 2 DEC 2026
      { date: "2026-12-02", dayName: "ONSDAG 2 DEC", timeText: "00:00 - 08:00", start: "2026-12-02T00:00:00", end: "2026-12-02T08:00:00", name: "NattUgglan" },
      { date: "2026-12-02", dayName: "ONSDAG 2 DEC", timeText: "08:00 - 16:00", start: "2026-12-02T08:00:00", end: "2026-12-02T16:00:00", name: "Dagspass Squad" },
      { date: "2026-12-02", dayName: "ONSDAG 2 DEC", timeText: "16:00 - 20:00", start: "2026-12-02T16:00:00", end: "2026-12-02T20:00:00", name: "ZeldaMästaren" },
      { date: "2026-12-02", dayName: "ONSDAG 2 DEC", timeText: "20:00 - 00:00", start: "2026-12-02T20:00:00", end: "2026-12-03T00:00:00", name: "Midweek Special", giveaway: "🎁 MIDVECKAGIVEAWAY!" },

      // 🗓️ TORSDAG 3 DEC 2026
      { date: "2026-12-03", dayName: "TORSDAG 3 DEC", timeText: "00:00 - 08:00", start: "2026-12-03T00:00:00", end: "2026-12-03T08:00:00", name: "Nattskiftet" },
      { date: "2026-12-03", dayName: "TORSDAG 3 DEC", timeText: "08:00 - 16:00", start: "2026-12-03T08:00:00", end: "2026-12-03T16:00:00", name: "FikaGänget" },
      { date: "2026-12-03", dayName: "TORSDAG 3 DEC", timeText: "16:00 - 00:00", start: "2026-12-03T16:00:00", end: "2026-12-04T00:00:00", name: "SpelExperten" },

      // 🗓️ FREDAG 4 DEC 2026
      { date: "2026-12-04", dayName: "FREDAG 4 DEC", timeText: "00:00 - 08:00", start: "2026-12-04T00:00:00", end: "2026-12-04T08:00:00", name: "NattSpelarna" },
      { date: "2026-12-04", dayName: "FREDAG 4 DEC", timeText: "08:00 - 14:00", start: "2026-12-04T08:00:00", end: "2026-12-04T14:00:00", name: "FredagsMorgon" },
      { date: "2026-12-04", dayName: "FREDAG 4 DEC", timeText: "14:00 - 19:00", start: "2026-12-04T14:00:00", end: "2026-12-04T19:00:00", name: "HelgLaddningen" },
      { date: "2026-12-04", dayName: "FREDAG 4 DEC", timeText: "19:00 - 00:00", start: "2026-12-04T19:00:00", end: "2026-12-05T00:00:00", name: "FredagsMys", giveaway: "🎁 HELGGIVEAWAY!" },

      // 🗓️ LÖRDAG 5 DEC 2026
      { date: "2026-12-05", dayName: "LÖRDAG 5 DEC", timeText: "00:00 - 08:00", start: "2026-12-05T00:00:00", end: "2026-12-05T08:00:00", name: "HelgNatt" },
      { date: "2026-12-05", dayName: "LÖRDAG 5 DEC", timeText: "08:00 - 14:00", start: "2026-12-05T08:00:00", end: "2026-12-05T14:00:00", name: "LördagsGänget" },
      { date: "2026-12-05", dayName: "LÖRDAG 5 DEC", timeText: "14:00 - 20:00", start: "2026-12-05T14:00:00", end: "2026-12-05T20:00:00", name: "CozyStreamers" },
      { date: "2026-12-05", dayName: "LÖRDAG 5 DEC", timeText: "20:00 - 00:00", start: "2026-12-05T20:00:00", end: "2026-12-06T00:00:00", name: "LördagsShowen", giveaway: "🏆 STOR LÖRDAGSGIVEAWAY!" },

      // 🗓️ SÖNDAG 6 DEC 2026
      { date: "2026-12-06", dayName: "SÖNDAG 6 DEC", timeText: "00:00 - 08:00", start: "2026-12-06T00:00:00", end: "2026-12-06T08:00:00", name: "Sista Natten" },
      { date: "2026-12-06", dayName: "SÖNDAG 6 DEC", timeText: "08:00 - 14:00", start: "2026-12-06T08:00:00", end: "2026-12-06T14:00:00", name: "SöndagsSpurten" },
      { date: "2026-12-06", dayName: "SÖNDAG 6 DEC", timeText: "14:00 - 19:00", start: "2026-12-06T14:00:00", end: "2026-12-06T19:00:00", name: "Slutspurt Squad" },
      { date: "2026-12-06", dayName: "SÖNDAG 6 DEC", timeText: "19:00 - 23:00", start: "2026-12-06T19:00:00", end: "2026-12-06T23:00:00", name: "GRANDE FINALE", giveaway: "🏆 FINAL DRAGNING!" }
    ];

    const GITHUB_USERNAME = "Our2ndHome";
    const GITHUB_REPO = "index";
    const SPONSORS_FOLDER = "sponsors";
    const SPONSOR_ROTATE_SECONDS = 15;

    const DEFAULT_SPONSORS = [
      'https://via.placeholder.com/140x40/111/ace600?text=SPONSOR+A',
      'https://via.placeholder.com/140x40/111/00ff88?text=SPONSOR+B',
      'https://via.placeholder.com/140x40/111/ffea00?text=SPONSOR+C'
    ];

    let sponsorFileList = DEFAULT_SPONSORS;
    let currentSponsorIndex = 0;
    let forcedTestDate = "AUTO";

    function switchTestDate(dateStr) {
      forcedTestDate = dateStr;
      renderSchedule();
    }

    // RENDER BALANCED SCHEDULE WITH ORIGINAL TURN 9 LAYOUT & REALTIME CURSOR
    function renderSchedule() {
      const eventsRowEl = document.getElementById('scheduleEventsRow');
      const fillLineEl = document.getElementById('timelineProgressFill');
      const cursorEl = document.getElementById('timelineCursor');
      if (!eventsRowEl) return;

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const todayDateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

      let activeDate = forcedTestDate === "AUTO" ? todayDateStr : forcedTestDate;

      // Filter events for the selected date
      let dayEvents = EVENT_WEEK_SCHEDULE.filter(ev => ev.date === activeDate);
      if (dayEvents.length === 0) {
        // Fallback to first day (30 Nov) if outside event week
        activeDate = "2026-11-30";
        dayEvents = EVENT_WEEK_SCHEDULE.filter(ev => ev.date === activeDate);
      }

      const totalNodes = dayEvents.length;
      const nowMs = now.getTime();

      // Find active live event index
      let activeIndex = dayEvents.findIndex(ev => {
        return nowMs >= new Date(ev.start).getTime() && nowMs < new Date(ev.end).getTime();
      });

      if (activeIndex === -1) activeIndex = 0;

      // Calculate exact realtime progress so dot lands precisely on divider ticks
      const currentEv = dayEvents[activeIndex];
      const startMs = new Date(currentEv.start).getTime();
      const endMs = new Date(currentEv.end).getTime();

      let slotProgress = 0;
      if (nowMs >= endMs) {
        slotProgress = 1.0;
      } else if (nowMs > startMs) {
        slotProgress = (nowMs - startMs) / (endMs - startMs);
      }

      const totalProgressPct = Math.min(100, Math.max(0, ((activeIndex + slotProgress) / totalNodes) * 100));

      if (fillLineEl) fillLineEl.style.width = `${totalProgressPct}%`;
      if (cursorEl) cursorEl.style.left = `${totalProgressPct}%`;

      const dayBadgeText = dayEvents[0] ? dayEvents[0].dayName : "MUSIKHJÄLPEN";

      // Render Day Badge + Nodes with full timeText (12:00 - 15:00)
      let html = `<div class="timeline-day-badge">${escapeHTML(dayBadgeText)}</div>`;

      html += dayEvents.map((ev, index) => {
        const isLive = (index === activeIndex) && (nowMs >= startMs && nowMs < endMs);
        const hasGiveaway = Boolean(ev.giveaway && ev.giveaway.trim());
        const primaryText = escapeHTML(hasGiveaway ? ev.giveaway : ev.name);
        const isLastNode = (index === totalNodes - 1);

        return `
          <div class="timeline-node ${isLastNode ? 'last-node' : ''} ${isLive ? 'active' : ''}">
            <div class="node-time">${escapeHTML(ev.timeText)}</div>
            <div class="node-tick-wrapper">
              <div class="node-divider-tick"></div>
            </div>
            <div class="node-streamer ${hasGiveaway ? 'is-giveaway-text' : ''}">${primaryText}</div>
          </div>
        `;
      }).join('');

      eventsRowEl.innerHTML = html;
    }

    // SPONSOR ROTATOR
    async function loadSponsorsAutomatically() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${SPONSORS_FOLDER}`);
        if (res.ok) {
          const files = await res.json();
          const apiSponsors = files.filter(f => f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i))
                                   .map(f => `${SPONSORS_FOLDER}/${encodeURIComponent(f.name)}`);
          if (apiSponsors.length > 0) sponsorFileList = apiSponsors;
        }
      } catch(e) {}

      updateSponsorLogo();
      setInterval(nextSponsor, SPONSOR_ROTATE_SECONDS * 1000);
    }

    function updateSponsorLogo() {
      const img = document.getElementById('sponsorLogo');
      if (!img || sponsorFileList.length === 0) return;
      img.style.opacity = '0';
      setTimeout(() => {
        img.src = sponsorFileList[currentSponsorIndex];
        img.style.opacity = '1';
      }, 600);
    }

    function nextSponsor() {
      currentSponsorIndex = (currentSponsorIndex + 1) % sponsorFileList.length;
      updateSponsorLogo();
    }

    function makePanelDraggable() {
      const panel = document.getElementById('testPanel');
      const header = document.getElementById('panelDragHeader');
      if (!panel || !header) return;

      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      header.onmousedown = (e) => {
        e.preventDefault();
        pos3 = e.clientX; pos4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (ev) => {
          ev.preventDefault();
          pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
          pos3 = ev.clientX; pos4 = ev.clientY;
          panel.style.top = (panel.offsetTop - pos2) + "px";
          panel.style.left = (panel.offsetLeft - pos1) + "px";
        };
      };
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    makePanelDraggable();
    loadSponsorsAutomatically();
    renderSchedule();
    setInterval(renderSchedule, 1000);
