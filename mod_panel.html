<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Mod Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }

    /* 🎨 CUSTOM SLEEK DARK SCROLLBAR */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0d;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ace600;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #0b0b0d;
      color: #ffffff;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow-y: auto !important;
      overflow-x: hidden;
    }

    /* 🧱 MAIN WRAPPER */
    .panel-wrapper {
      padding: 8px 8px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* TOP HEADER */
    .mod-header {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
    }

    .mod-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-group {
      display: flex;
      gap: 6px;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1c381c;
      color: #ace600;
      border: 1px solid rgba(172, 230, 0, 0.4);
    }

    .status-pill.offline {
      background: #27272a;
      color: #71717a;
      border-color: #3f3f46;
    }

    /* 🔄 FLUID ADAPTIVE LAYOUT (DRAG VERTICAL OR HORIZONTAL) */
    .dashboard-layout {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .schema-column {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 💻 WIDE WINDOW (HORIZONTAL DOCK): 2 COLUMNS */
    @media (min-width: 700px) {
      .dashboard-layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .controls-column {
        flex: 1 1 350px;
      }
      .schema-column {
        flex: 1 1 370px;
      }
    }

    /* 🖥️ ULTRA-WIDE WINDOW (BOTTOM DOCK): 3 COLUMNS */
    @media (min-width: 1080px) {
      .controls-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        flex: 2 1 650px;
      }
      .schema-column {
        flex: 1 1 380px;
      }
    }

    /* CARDS */
    .mod-card {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      height: fit-content;
    }

    .card-title {
      font-size: 11px;
      font-weight: 900;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    /* INPUTS & BUTTONS */
    input, select, textarea {
      width: 100%;
      background: #0b0b0d;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 11px;
      padding: 7px 9px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ace600;
    }

    .btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s ease;
      white-space: nowrap;
    }

    .btn-lime {
      background: #ace600;
      color: #0b0b0d;
    }
    .btn-lime:hover { background: #c2f524; }

    .btn-red {
      background: #ff334b;
      color: #ffffff;
    }
    .btn-red:hover { background: #ff5266; }

    .btn-dark {
      background: #27272a;
      color: #ffffff;
    }
    .btn-dark:hover { background: #3f3f46; }

    /* TWITCH MOD ROW */
    .duration-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }

    .pill-btn {
      flex: 1;
      font-size: 9px;
      padding: 5px 4px;
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #d4d4d8;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }
    .pill-btn.active {
      background: #ace600;
      color: #0b0b0d;
      border-color: #ace600;
    }

    /* SOUNDBOARD GRID */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 5px;
    }

    .sound-pad {
      background: #1f1f23;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      padding: 8px 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
    }
    .sound-pad:hover { border-color: #ace600; background: #27272a; }
    .sound-pad:active { transform: scale(0.97); }

    /* 📅 SCHEMA FRAME */
    .schedule-native-frame {
      width: 100%;
      min-height: 520px;
      height: 840px;
      border: none;
      background: transparent;
      display: block;
      overflow: hidden;
    }

    /* TOAST ALERT */
    #modToast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #ace600;
      color: #0b0b0d;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 99999;
    }
  </style>
</head>
<body>

  <div class="panel-wrapper">

    <!-- HEADER -->
    <div class="mod-header">
      <div class="mod-title">
        <span>🛡️ MODERATORPANEL</span>
        <div class="status-group">
          <span id="badgeStreamerbot" class="status-pill offline">STREAMER.BOT: OFF</span>
          <span class="status-pill">ONLINE</span>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 800; color: #a1a1aa;">MUSIKHJÄLPEN</div>
    </div>

    <!-- 🔄 RESPONSIVE DASHBOARD LAYOUT -->
    <div class="dashboard-layout">

      <!-- COLUMN 1: INTERACTION & STREAM CONTROLS -->
      <div class="controls-column">

        <!-- 1. UTMANING & SKIPPA LÅT -->
        <div class="mod-card">
          <div class="card-title">
            <span>⚔️ UTMANING & STRÖM</span>
            <span id="badgeUtmaning" class="status-pill" style="background:#27272a; color:#a1a1aa; border:none;">AV</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="inputUtmaning" placeholder="Skriv utmaning..." />
            <button id="btnUtmaning" class="btn btn-lime" onclick="toggleUtmaning()">STARTA</button>
          </div>
          <button class="btn btn-dark" style="width: 100%;" onclick="skipSong()">⏭️ SKIPPA LÅT</button>
        </div>

        <!-- 2. TWITCH MODERATION -->
        <div class="mod-card">
          <div class="card-title">
            <span>🔨 TWITCH MOD</span>
            <span id="modModeLabel" style="font-size: 9px; color: #71717a;">KLIPPBOARD</span>
          </div>
          <input type="text" id="twitchUser" placeholder="@användarnamn..." />
          <input type="text" id="twitchReason" placeholder="Anledning (valfritt)..." />
          
          <div class="duration-pills">
            <button class="pill-btn" onclick="setDuration(1, this)">1s</button>
            <button class="pill-btn active" onclick="setDuration(600, this)">10m</button>
            <button class="pill-btn" onclick="setDuration(3600, this)">1h</button>
            <button class="pill-btn" onclick="setDuration(86400, this)">24h</button>
          </div>

          <div style="display: flex; gap: 6px;">
            <button class="btn btn-dark" style="flex: 1;" onclick="executeModAction('timeout')">⏱️ TIMEOUT</button>
            <button class="btn btn-red" style="flex: 1;" onclick="executeModAction('ban')">🔨 BAN</button>
          </div>
        </div>

        <!-- 3. MANUELL DONATION -->
        <div class="mod-card">
          <div class="card-title">
            <span>💰 MANUELL DONATION</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="donDonor" placeholder="Givare" style="flex: 2;" />
            <input type="number" id="donAmount" placeholder="SEK" style="flex: 1;" />
          </div>
          <input type="text" id="donComment" placeholder="Kommentar..." />
          <button class="btn btn-lime" onclick="sendManualDonation()">🚀 SKICKA DONATION</button>
        </div>

        <!-- 4. SOUNDBOARD -->
        <div class="mod-card">
          <div class="card-title">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span>🔊 LJUDBRÄDA</span>
              <input type="range" id="soundVol" min="0" max="1" step="0.05" value="0.8" style="width: 60px; height: 14px;" />
            </div>
          </div>
          <div class="sound-grid">
            <button class="sound-pad" onclick="playSound('horns')"><span>🎺</span><span>Fanfar</span></button>
            <button class="sound-pad" onclick="playSound('applause')"><span>👏</span><span>Applåder</span></button>
            <button class="sound-pad" onclick="playSound('drumroll')"><span>🥁</span><span>Trumma</span></button>
            <button class="sound-pad" onclick="playSound('airhorn')"><span>📯</span><span>Airhorn</span></button>
            <button class="sound-pad" onclick="playSound('fail')"><span>❌</span><span>Fail</span></button>
            <button class="sound-pad" onclick="playSound('laugh')"><span>😂</span><span>Skratt</span></button>
            <button class="sound-pad" onclick="playSound('ding')"><span>🔔</span><span>Ding</span></button>
            <button class="sound-pad" onclick="playSound('boom')"><span>💥</span><span>Boom</span></button>
          </div>
        </div>

      </div>

      <!-- COLUMN 2: SCHEMA CONTROLLER -->
      <div class="schema-column">
        <iframe id="frameSchedule" class="schedule-native-frame" src="schedule.html#panel" scrolling="no"></iframe>
      </div>

    </div>

  </div>

  <div id="modToast">Status</div>

  <script>
    // ========================================================
    // 📏 AUTO-FIT HEIGHT & MOUSE-WHEEL FORWARDING
    // ========================================================
    function adjustScheduleHeight() {
      const frame = document.getElementById('frameSchedule');
      if (!frame) return;

      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.body) return;

        const container = doc.getElementById('panelRoot') || doc.body.firstElementChild || doc.body;
        const measuredH = container.scrollHeight || container.offsetHeight || 0;

        if (measuredH > 200) {
          // Extra buffer ensures "Återställ standardschema" is never cut off
          frame.style.height = (measuredH + 24) + 'px';
        }
      } catch (e) {
        frame.style.height = '840px';
      }
    }

    function setupIframeWheelForwarding() {
      const frame = document.getElementById('frameSchedule');
      if (!frame) return;

      try {
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        if (frameDoc) {
          // Forwards wheel scrolling inside iframe to the parent window
          frameDoc.addEventListener('wheel', (e) => {
            window.scrollBy({ top: e.deltaY, behavior: 'auto' });
          }, { passive: true });
        }
      } catch(e) {}
    }

    const frameSchedule = document.getElementById('frameSchedule');
    if (frameSchedule) {
      frameSchedule.addEventListener('load', () => {
        adjustScheduleHeight();
        setupIframeWheelForwarding();

        try {
          if (frameSchedule.contentDocument) {
            frameSchedule.contentDocument.addEventListener('click', () => {
              setTimeout(adjustScheduleHeight, 150);
            });
          }
        } catch (e) {}
      });
    }

    window.addEventListener('resize', adjustScheduleHeight);

    // ========================================================
    // 📡 FIREBASE REALTIME SETUP
    // ========================================================
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const db = firebase.database();

    function showToast(msg) {
      const toast = document.getElementById('modToast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ========================================================
    // 🤖 STREAMER.BOT DIRECT WEBSOCKET CONNECTION
    // ========================================================
    const SB_WS_URL = "ws://127.0.0.1:8080/";
    let sbWs = null;
    let isSbConnected = false;

    function connectStreamerbot() {
      try {
        sbWs = new WebSocket(SB_WS_URL);
      } catch(e) {
        setTimeout(connectStreamerbot, 5000);
        return;
      }

      sbWs.onopen = () => {
        isSbConnected = true;
        const badge = document.getElementById('badgeStreamerbot');
        const modeLabel = document.getElementById('modModeLabel');
        if (badge) {
          badge.className = "status-pill";
          badge.textContent = "STREAMER.BOT: ON";
        }
        if (modeLabel) {
          modeLabel.textContent = "DIREKTLÄGE";
          modeLabel.style.color = "#ace600";
        }
      };

      sbWs.onclose = () => {
        isSbConnected = false;
        const badge = document.getElementById('badgeStreamerbot');
        const modeLabel = document.getElementById('modModeLabel');
        if (badge) {
          badge.className = "status-pill offline";
          badge.textContent = "STREAMER.BOT: OFF";
        }
        if (modeLabel) {
          modeLabel.textContent = "KLIPPBOARD";
          modeLabel.style.color = "#71717a";
        }
        setTimeout(connectStreamerbot, 4000);
      };

      sbWs.onerror = () => {
        try { sbWs.close(); } catch(e) {}
      };
    }

    connectStreamerbot();

    function sendToStreamerbot(actionName, args) {
      if (!isSbConnected || !sbWs || sbWs.readyState !== WebSocket.OPEN) return false;

      sbWs.send(JSON.stringify({
        request: "DoAction",
        action: { name: actionName },
        args: args,
        id: "mod-" + Math.random().toString(36).substring(2, 9)
      }));
      return true;
    }

    // ========================================================
    // 🔨 TWITCH TIMEOUT & BAN EXECUTION
    // ========================================================
    let selectedDuration = 600;

    function setDuration(sec, btn) {
      selectedDuration = sec;
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function executeModAction(type) {
      const rawUser = document.getElementById('twitchUser').value.trim();
      const user = rawUser.replace(/^@/, '');
      const reason = document.getElementById('twitchReason').value.trim();

      if (!user) {
        alert("Fyll i ett användarnamn!");
        return;
      }

      let chatCommand = "";
      if (type === 'timeout') {
        chatCommand = `/timeout ${user} ${selectedDuration} ${reason}`.trim();
      } else {
        chatCommand = `/ban ${user} ${reason}`.trim();
      }

      let sentDirectly = false;
      if (isSbConnected) {
        if (type === 'timeout') {
          sentDirectly = sendToStreamerbot("Twitch Timeout", {
            user: user,
            duration: selectedDuration,
            reason: reason || "Timeout via Mod Panel",
            command: chatCommand
          });
        } else {
          sentDirectly = sendToStreamerbot("Twitch Ban", {
            user: user,
            reason: reason || "Banned via Mod Panel",
            command: chatCommand
          });
        }
      }

      navigator.clipboard.writeText(chatCommand).catch(() => {});

      db.ref('moderation/actions').push({
        type: type,
        user: user,
        duration: selectedDuration,
        reason: reason,
        command: chatCommand,
        executedByStreamerbot: sentDirectly,
        timestamp: Date.now()
      });

      if (sentDirectly) {
        showToast(`⚡ Streamer.bot utförde: ${type.toUpperCase()} på ${user}!`);
      } else {
        showToast(`📋 Kopierade: ${chatCommand}`);
      }

      document.getElementById('twitchUser').value = "";
      document.getElementById('twitchReason').value = "";
    }

    // ========================================================
    // ⚔️ UTMANING LOGIC
    // ========================================================
    let isUtmaningActive = false;
    const utmRef = db.ref('utmaning');

    function updateUtmaningUI(active) {
      isUtmaningActive = active;
      const btn = document.getElementById('btnUtmaning');
      const badge = document.getElementById('badgeUtmaning');
      if (!btn) return;

      if (active) {
        btn.textContent = "AVSLUTA";
        btn.className = "btn btn-red";
        badge.textContent = "AKTIV";
        badge.style.background = "#ff334b";
        badge.style.color = "#ffffff";
      } else {
        btn.textContent = "STARTA";
        btn.className = "btn btn-lime";
        badge.textContent = "AV";
        badge.style.background = "#27272a";
        badge.style.color = "#a1a1aa";
      }
    }

    function toggleUtmaning() {
      const text = document.getElementById('inputUtmaning').value.trim();
      const next = !isUtmaningActive;
      utmRef.set({
        active: next,
        text: text,
        timestamp: Date.now()
      });
      try {
        new BroadcastChannel('mh_utmaning_channel').postMessage({ active: next, text: text });
      } catch(e) {}
    }

    utmRef.on('value', snap => {
      const val = snap.val();
      if (val) updateUtmaningUI(Boolean(val.active));
    });

    // ========================================================
    // ⏭️ SKIPPA LÅT
    // ========================================================
    function skipSong() {
      if (isSbConnected) {
        sendToStreamerbot("Skip Song", {});
      }
      db.ref('music/skip').set({ timestamp: Date.now() });
      showToast("⏭️ Begärde att skippa låt!");
    }

    // ========================================================
    // 💰 MANUELL DONATION TILL ALERTS
    // ========================================================
    function sendManualDonation() {
      const donor = document.getElementById('donDonor').value.trim() || "Givare";
      const amount = parseFloat(document.getElementById('donAmount').value) || 50;
      const comment = document.getElementById('donComment').value.trim();

      db.ref('bossa').update({
        alertId: Date.now(),
        donor: donor,
        amount: amount,
        diff: amount,
        comment: comment,
        type: 'donation'
      }).then(() => {
        showToast("🚀 Donation skickad till stream!");
        document.getElementById('donDonor').value = "";
        document.getElementById('donAmount').value = "";
        document.getElementById('donComment').value = "";
      });
    }

    // ========================================================
    // 🔊 SOUNDBOARD SYSTEM
    // ========================================================
    function playSound(key) {
      const vol = parseFloat(document.getElementById('soundVol').value) || 0.8;

      db.ref('soundboard/trigger').set({
        sound: key,
        volume: vol,
        timestamp: Date.now()
      });

      try {
        new BroadcastChannel('mh_sound_bus').postMessage({
          type: 'PLAY_SOUND',
          soundType: 'soundboard',
          soundKey: key,
          volume: vol
        });
      } catch(e) {}

      showToast(`Spelar ljud: ${key.toUpperCase()}`);
    }
  </script>
</body>
</html>
