<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Mod Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }

    /* 🎨 CUSTOM SLEEK DARK SCROLLBAR */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0d;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ace600;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #0b0b0d;
      color: #ffffff;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow-y: auto !important;
      overflow-x: hidden;
    }

    /* 🧱 MAIN WRAPPER */
    .panel-wrapper {
      padding: 8px 8px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* TOP HEADER */
    .mod-header {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
    }

    .mod-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-group {
      display: flex;
      gap: 6px;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1c381c;
      color: #ace600;
      border: 1px solid rgba(172, 230, 0, 0.4);
    }

    .status-pill.offline {
      background: #27272a;
      color: #71717a;
      border-color: #3f3f46;
    }

    /* 🔄 FLUID ADAPTIVE LAYOUT (DRAG VERTICAL OR HORIZONTAL) */
    .dashboard-layout {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .schema-column {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 💻 WIDE WINDOW (HORIZONTAL DOCK): 2 COLUMNS */
    @media (min-width: 700px) {
      .dashboard-layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .controls-column {
        flex: 1 1 350px;
      }
      .schema-column {
        flex: 1 1 370px;
      }
    }

    /* 🖥️ ULTRA-WIDE WINDOW (BOTTOM DOCK): 3 COLUMNS */
    @media (min-width: 1080px) {
      .controls-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        flex: 2 1 650px;
      }
      .schema-column {
        flex: 1 1 380px;
      }
    }

    /* CARDS */
    .mod-card {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      height: fit-content;
    }

    .card-title {
      font-size: 11px;
      font-weight: 900;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    /* 🎚️ PIXEL-PERFECT CUSTOM RANGE SLIDER */
    .vol-slider-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"].custom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 5px;
      background: linear-gradient(to right, #ace600 0%, #ace600 80%, #27272a 80%, #27272a 100%);
      border-radius: 999px;
      outline: none;
      border: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
      vertical-align: middle;
    }

    input[type="range"].custom-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      cursor: pointer;
      border-radius: 999px;
      border: none;
    }

    input[type="range"].custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ace600;
      cursor: pointer;
      margin-top: -4px;
      box-shadow: 0 0 6px rgba(172, 230, 0, 0.6);
      border: 1.5px solid #0b0b0d;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    input[type="range"].custom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(172, 230, 0, 0.9);
    }

    .vol-percentage-label {
      font-size: 10px;
      font-weight: 900;
      color: #ace600;
      min-width: 30px;
      text-align: right;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    /* INPUTS & BUTTONS */
    input, select, textarea {
      width: 100%;
      background: #0b0b0d;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 11px;
      padding: 7px 9px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ace600;
    }

    .btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s ease;
      white-space: nowrap;
    }

    .btn-lime {
      background: #ace600;
      color: #0b0b0d;
    }
    .btn-lime:hover { background: #c2f524; }

    .btn-red {
      background: #ff334b;
      color: #ffffff;
    }
    .btn-red:hover { background: #ff5266; }

    .btn-dark {
      background: #27272a;
      color: #ffffff;
    }
    .btn-dark:hover { background: #3f3f46; }

    /* TWITCH MOD ROW */
    .duration-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }

    .pill-btn {
      flex: 1;
      font-size: 9px;
      padding: 5px 4px;
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #d4d4d8;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }
    .pill-btn.active {
      background: #ace600;
      color: #0b0b0d;
      border-color: #ace600;
    }

    /* SOUNDBOARD GRID */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 6px;
    }

    .sound-pad {
      background: #1f1f23;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #ffffff;
      padding: 10px 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .sound-pad:hover { border-color: #ace600; background: #27272a; }
    .sound-pad:active { transform: scale(0.97); }

    /* 📅 SCHEMA FRAME */
    .schedule-native-frame {
      width: 100%;
      min-height: 480px;
      height: 560px;
      border: none;
      background: transparent;
      display: block;
    }

    /* TOAST ALERT */
    #modToast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #ace600;
      color: #0b0b0d;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 99999;
    }
  </style>
</head>
<body>

  <div class="panel-wrapper">

    <!-- HEADER -->
    <div class="mod-header">
      <div class="mod-title">
        <span>🛡️ MODERATORPANEL</span>
        <div class="status-group">
          <span id="badgeStreamerbot" class="status-pill offline">STREAMER.BOT: OFF</span>
          <span id="badgeFirebase" class="status-pill offline">ANSLUTER...</span>
        </div>
      </div>
      <div style="font-size: 10px; font-weight: 800; color: #a1a1aa;">MUSIKHJÄLPEN</div>
    </div>

    <!-- 🔄 RESPONSIVE DASHBOARD LAYOUT -->
    <div class="dashboard-layout">

      <!-- COLUMN 1: INTERACTION & STREAM CONTROLS -->
      <div class="controls-column">

        <!-- 1. UTMANING & SKIPPA LÅT -->
        <div class="mod-card">
          <div class="card-title">
            <span>⚔️ UTMANING & STRÖM</span>
            <span id="badgeUtmaning" class="status-pill" style="background:#27272a; color:#a1a1aa; border:none;">AV</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="inputUtmaning" placeholder="Skriv utmaning..." />
            <button id="btnUtmaning" class="btn btn-lime" onclick="toggleUtmaning()">STARTA</button>
          </div>
          <button class="btn btn-dark" style="width: 100%;" onclick="skipSong()">⏭️ SKIPPA LÅT</button>
        </div>

        <!-- 2. TWITCH MODERATION -->
        <div class="mod-card">
          <div class="card-title">
            <span>🔨 TWITCH MOD</span>
            <span id="modModeLabel" style="font-size: 9px; color: #71717a;">KLIPPBOARD</span>
          </div>
          <input type="text" id="twitchUser" placeholder="@användarnamn..." />
          <input type="text" id="twitchReason" placeholder="Anledning (valfritt)..." />
          
          <div class="duration-pills">
            <button class="pill-btn" onclick="setDuration(1, this)">1s</button>
            <button class="pill-btn active" onclick="setDuration(600, this)">10m</button>
            <button class="pill-btn" onclick="setDuration(3600, this)">1h</button>
            <button class="pill-btn" onclick="setDuration(86400, this)">24h</button>
          </div>

          <div style="display: flex; gap: 6px;">
            <button class="btn btn-dark" style="flex: 1;" onclick="executeModAction('timeout')">⏱️ TIMEOUT</button>
            <button class="btn btn-red" style="flex: 1;" onclick="executeModAction('ban')">🔨 BAN</button>
          </div>
        </div>

        <!-- 3. MANUELL DONATION -->
        <div class="mod-card">
          <div class="card-title">
            <span>💰 MANUELL DONATION</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="donDonor" placeholder="Givare" style="flex: 2;" />
            <input type="number" id="donAmount" min="1" step="1" placeholder="SEK" style="flex: 1;" />
          </div>
          <input type="text" id="donComment" placeholder="Kommentar..." />
          <button class="btn btn-lime" onclick="sendManualDonation()">🚀 SKICKA DONATION</button>
        </div>

        <!-- 4. SOUNDBOARD (7 PURE CUSTOM SOUNDS) -->
        <div class="mod-card">
          <div class="card-title">
            <span>🔊 LJUDBRÄDA</span>
            <div class="vol-slider-wrapper">
              <input 
                type="range" 
                id="soundVol" 
                class="custom-slider"
                min="0" 
                max="1" 
                step="0.05" 
                value="0.8" 
                oninput="onSoundVolChange(this.value)" 
              />
              <span id="soundVolText" class="vol-percentage-label">80%</span>
            </div>
          </div>
          <div class="sound-grid">
            <button class="sound-pad" onclick="playSound('knocking')"><span>🚪</span><span>Knackning</span></button>
            <button class="sound-pad" onclick="playSound('scary')"><span>👻</span><span>Läskigt</span></button>
            <button class="sound-pad" onclick="playSound('discord')"><span>💬</span><span>Discord</span></button>
            <button class="sound-pad" onclick="playSound('homer_bart')"><span>🍩</span><span>Homer & Bart</span></button>
            <button class="sound-pad" onclick="playSound('applause')"><span>👏</span><span>Applåder</span></button>
            <button class="sound-pad" onclick="playSound('mrb_magic')"><span>✨</span><span>Magic</span></button>
            <button class="sound-pad" onclick="playSound('mrb_ohno')"><span>😱</span><span>Oh No</span></button>
          </div>
        </div>

      </div>

      <!-- COLUMN 2: SCHEMA CONTROLLER -->
      <div class="schema-column">
        <iframe id="frameSchedule" class="schedule-native-frame" src="schedule.html#panel" scrolling="auto"></iframe>
      </div>

    </div>

  </div>

  <div id="modToast">Status</div>

  <script>
    // ========================================================
    // 📡 FIREBASE REALTIME SETUP
    // ========================================================
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    const WRITE_SECRET = "Our2ndHomeSecret2026!";

    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const db = firebase.database();

    let soundBus = null;
    let utmaningBus = null;
    try { soundBus = new BroadcastChannel('mh_sound_bus'); } catch (e) {}
    try { utmaningBus = new BroadcastChannel('mh_utmaning_channel'); } catch (e) {}

    let toastTimer = null;
    function showToast(msg, isError = false) {
      const toast = document.getElementById('modToast');
      if (!toast) return;
      toast.textContent = msg;
      toast.style.background = isError ? "#ff334b" : "#ace600";
      toast.style.color = isError ? "#ffffff" : "#0b0b0d";
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    db.ref('.info/connected').on('value', (snap) => {
      const badge = document.getElementById('badgeFirebase');
      if (!badge) return;
      if (snap.val()) {
        badge.className = "status-pill";
        badge.textContent = "ONLINE";
      } else {
        badge.className = "status-pill offline";
        badge.textContent = "OFFLINE";
      }
    });

    // ========================================================
    // 🔊 SOUNDBOARD VOLUME CONTROLLER & STORAGE
    // ========================================================
    let volumeDebounceTimer = null;

    function updateVolumeUI(vol) {
      const safeVol = isNaN(vol) ? 0.8 : Math.max(0, Math.min(1, vol));
      const pct = Math.round(safeVol * 100);
      const slider = document.getElementById('soundVol');
      const label = document.getElementById('soundVolText');

      if (slider) {
        slider.value = safeVol;
        slider.style.background = `linear-gradient(to right, #ace600 0%, #ace600 ${pct}%, #27272a ${pct}%, #27272a 100%)`;
      }
      if (label) label.textContent = pct + '%';
    }

    function onSoundVolChange(val) {
      const num = parseFloat(val);
      const vol = isNaN(num) ? 0.8 : Math.max(0, Math.min(1, num));
      updateVolumeUI(vol);

      try {
        localStorage.setItem('mh_soundboard_volume', vol.toString());
      } catch (e) {}

      clearTimeout(volumeDebounceTimer);
      volumeDebounceTimer = setTimeout(() => {
        db.ref('soundboard/volume').set({
          volume: vol,
          secret: WRITE_SECRET
        }).catch(err => showToast("Kunde inte spara volym: " + err.message, true));
      }, 150);
    }

    try {
      const savedVol = localStorage.getItem('mh_soundboard_volume');
      const v = (savedVol !== null) ? parseFloat(savedVol) : 0.8;
      updateVolumeUI(v);
    } catch (e) {}

    db.ref('soundboard/volume').on('value', (snap) => {
      const raw = snap.val();
      const val = (raw && typeof raw === 'object') ? raw.volume : raw;
      if (typeof val === 'number' && !isNaN(val)) {
        const slider = document.getElementById('soundVol');
        if (!slider || document.activeElement !== slider) {
          updateVolumeUI(val);
        }
      }
    });

    // ========================================================
    // 📏 AUTO-FIT HEIGHT & MOUSE-WHEEL FORWARDING
    // ========================================================
    function adjustScheduleHeight() {
      const frame = document.getElementById('frameSchedule');
      if (!frame) return;

      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.body) return;

        const container = doc.getElementById('panelRoot') || doc.body.firstElementChild || doc.body;
        const measuredH = container.scrollHeight || container.offsetHeight || 0;

        if (measuredH > 150) {
          frame.style.height = (measuredH + 16) + 'px';
        }
      } catch (e) {
        frame.style.height = '560px';
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SCHEDULE_HEIGHT' && typeof event.data.height === 'number') {
        const frame = document.getElementById('frameSchedule');
        if (frame && event.data.height > 150) {
          frame.style.height = (event.data.height + 16) + 'px';
        }
      }
    });

    function setupIframeWheelForwarding() {
      const frame = document.getElementById('frameSchedule');
      if (!frame) return;

      try {
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        if (frameDoc) {
          frameDoc.addEventListener('wheel', (e) => {
            window.scrollBy({ top: e.deltaY, behavior: 'auto' });
          }, { passive: true });
        }
      } catch (e) {}
    }

    const frameSchedule = document.getElementById('frameSchedule');
    if (frameSchedule) {
      frameSchedule.addEventListener('load', () => {
        adjustScheduleHeight();
        setupIframeWheelForwarding();

        try {
          if (frameSchedule.contentDocument) {
            frameSchedule.contentDocument.addEventListener('click', () => {
              setTimeout(adjustScheduleHeight, 150);
            });
          }
        } catch (e) {}
      });
    }

    window.addEventListener('resize', adjustScheduleHeight);

    // ========================================================
    // 🤖 STREAMER.BOT DIRECT WEBSOCKET CONNECTION
    // ========================================================
    const SB_WS_URL = "ws://127.0.0.1:8080/";
    let sbWs = null;
    let isSbConnected = false;
    let sbReconnectTimer = null;
    let sbHelloTimer = null;
    const pendingSbRequests = new Map();

    function setStreamerbotUI(connected) {
      const badge = document.getElementById('badgeStreamerbot');
      const modeLabel = document.getElementById('modModeLabel');
      if (badge) {
        badge.className = connected ? "status-pill" : "status-pill offline";
        badge.textContent = connected ? "STREAMER.BOT: ON" : "STREAMER.BOT: OFF";
      }
      if (modeLabel) {
        modeLabel.textContent = connected ? "DIREKTLÄGE" : "KLIPPBOARD";
        modeLabel.style.color = connected ? "#ace600" : "#71717a";
      }
    }

    function scheduleSbReconnect() {
      if (sbReconnectTimer) return;
      sbReconnectTimer = setTimeout(() => {
        sbReconnectTimer = null;
        connectStreamerbot();
      }, 4000);
    }

    function connectStreamerbot() {
      if (sbWs && (sbWs.readyState === WebSocket.CONNECTING || sbWs.readyState === WebSocket.OPEN)) {
        return;
      }

      try {
        sbWs = new WebSocket(SB_WS_URL);
      } catch (e) {
        scheduleSbReconnect();
        return;
      }

      sbWs.onopen = () => {
        clearTimeout(sbHelloTimer);
        sbHelloTimer = setTimeout(() => {
          if (!isSbConnected && sbWs && sbWs.readyState === WebSocket.OPEN) {
            isSbConnected = true;
            setStreamerbotUI(true);
          }
        }, 500);
      };

      sbWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.request === "Hello") {
            clearTimeout(sbHelloTimer);
            if (msg.authentication) {
              console.error("❌ [Streamer.bot] Authentication is enabled, but Mod Panel expects no password.");
              return;
            }
            isSbConnected = true;
            setStreamerbotUI(true);
            return;
          }

          if (msg.id && pendingSbRequests.has(msg.id)) {
            const { resolve, timer } = pendingSbRequests.get(msg.id);
            clearTimeout(timer);
            pendingSbRequests.delete(msg.id);
            resolve(msg);
          }
        } catch (e) {}
      };

      sbWs.onclose = () => {
        clearTimeout(sbHelloTimer);
        isSbConnected = false;
        setStreamerbotUI(false);
        pendingSbRequests.forEach(({ reject, timer }) => {
          clearTimeout(timer);
          reject(new Error("Connection closed"));
        });
        pendingSbRequests.clear();
        scheduleSbReconnect();
      };

      sbWs.onerror = () => {
        try { sbWs.close(); } catch (e) {}
      };
    }

    connectStreamerbot();

    function sendToStreamerbot(actionName, args) {
      return new Promise((resolve) => {
        if (!isSbConnected || !sbWs || sbWs.readyState !== WebSocket.OPEN) {
          return resolve(false);
        }

        const id = "mod-" + Math.random().toString(36).substring(2, 9);
        const timer = setTimeout(() => {
          if (pendingSbRequests.has(id)) {
            pendingSbRequests.delete(id);
            resolve(false);
          }
        }, 2500);

        pendingSbRequests.set(id, {
          resolve: (res) => resolve(Boolean(res && (!res.status || res.status === "ok"))),
          reject: () => resolve(false),
          timer
        });

        try {
          sbWs.send(JSON.stringify({
            request: "DoAction",
            action: { name: actionName },
            args: args,
            id: id
          }));
        } catch (e) {
          clearTimeout(timer);
          pendingSbRequests.delete(id);
          resolve(false);
        }
      });
    }

    // ========================================================
    // 🔨 TWITCH TIMEOUT & BAN EXECUTION
    // ========================================================
    let selectedDuration = 600;

    function setDuration(sec, btn) {
      selectedDuration = sec;
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function executeModAction(type) {
      const rawUser = document.getElementById('twitchUser').value.trim();
      const user = rawUser.replace(/^@/, '');
      const reason = document.getElementById('twitchReason').value.trim();

      if (!user) {
        alert("Fyll i ett användarnamn!");
        return;
      }

      const chatCommand = (type === 'timeout')
        ? `/timeout ${user} ${selectedDuration} ${reason}`.trim()
        : `/ban ${user} ${reason}`.trim();

      let sentDirectly = false;
      if (isSbConnected) {
        if (type === 'timeout') {
          sentDirectly = await sendToStreamerbot("Twitch Timeout", {
            user: user,
            duration: selectedDuration,
            reason: reason || "Timeout via Mod Panel",
            command: chatCommand
          });
        } else {
          sentDirectly = await sendToStreamerbot("Twitch Ban", {
            user: user,
            reason: reason || "Banned via Mod Panel",
            command: chatCommand
          });
        }
      }

      db.ref('moderation/actions').push({
        type: type,
        user: user,
        duration: selectedDuration,
        reason: reason,
        command: chatCommand,
        executedByStreamerbot: sentDirectly,
        timestamp: Date.now(),
        secret: WRITE_SECRET
      }).catch(() => {});

      if (sentDirectly) {
        showToast(`⚡ Streamer.bot utförde: ${type.toUpperCase()} på ${user}!`);
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(chatCommand)
          .then(() => showToast(`📋 Kopierade: ${chatCommand}`))
          .catch(() => showToast(`⚠️ Kunde inte kopiera kommando: ${chatCommand}`, true));
      } else {
        showToast(`⚠️ Streamer.bot offline: ${chatCommand}`, true);
      }

      document.getElementById('twitchUser').value = "";
      document.getElementById('twitchReason').value = "";
    }

    // ========================================================
    // ⚔️ UTMANING LOGIC
    // ========================================================
    let isUtmaningActive = false;
    const utmRef = db.ref('utmaning');

    function updateUtmaningUI(active) {
      isUtmaningActive = active;
      const btn = document.getElementById('btnUtmaning');
      const badge = document.getElementById('badgeUtmaning');
      if (!btn || !badge) return;

      if (active) {
        btn.textContent = "AVSLUTA";
        btn.className = "btn btn-red";
        badge.textContent = "AKTIV";
        badge.style.background = "#ff334b";
        badge.style.color = "#ffffff";
      } else {
        btn.textContent = "STARTA";
        btn.className = "btn btn-lime";
        badge.textContent = "AV";
        badge.style.background = "#27272a";
        badge.style.color = "#a1a1aa";
      }
    }

    function toggleUtmaning() {
      const inputEl = document.getElementById('inputUtmaning');
      const text = inputEl ? inputEl.value.trim() : "";
      const next = !isUtmaningActive;

      if (next && !text) {
        showToast("⚠️ Skriv en utmaning först!", true);
        if (inputEl) inputEl.focus();
        return;
      }

      const payload = {
        active: next,
        text: text,
        timestamp: Date.now(),
        secret: WRITE_SECRET
      };

      utmRef.set(payload).catch(err => {
        showToast("❌ Kunde inte uppdatera utmaning: " + err.message, true);
      });

      if (utmaningBus) {
        try { utmaningBus.postMessage(payload); } catch (e) {}
      }
    }

    utmRef.on('value', snap => {
      const val = snap.val();
      if (val) {
        updateUtmaningUI(Boolean(val.active));
        const inputEl = document.getElementById('inputUtmaning');
        if (inputEl && document.activeElement !== inputEl && typeof val.text === 'string') {
          inputEl.value = val.text;
        }
      }
    }, err => {
      console.warn("⚠️ Firebase utmaning read error:", err.message);
    });

    // ========================================================
    // ⏭️ SKIPPA LÅT (UNIFIED /spotify_control PATH)
    // ========================================================
    let lastSkipTs = 0;
    function skipSong() {
      lastSkipTs = Math.max(Date.now(), lastSkipTs + 1);
      db.ref('spotify_control').set({
        action: 'skip',
        timestamp: lastSkipTs,
        secret: WRITE_SECRET
      }).then(() => {
        showToast("⏭️ Begärde att skippa låt!");
      }).catch(err => {
        showToast("❌ Kunde inte skippa låt: " + err.message, true);
      });
    }

    // ========================================================
    // 💰 MANUELL DONATION TILL ALERTS
    // ========================================================
    let lastAlertTs = 0;
    function sendManualDonation() {
      const donor = document.getElementById('donDonor').value.trim() || "Givare";
      const amount = parseFloat(String(document.getElementById('donAmount').value).replace(',', '.'));
      const comment = document.getElementById('donComment').value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        showToast("⚠️ Ange ett giltigt belopp större än 0!", true);
        return;
      }

      lastAlertTs = Math.max(Date.now(), lastAlertTs + 1);

      db.ref('bossa').transaction((currentData) => {
        const base = (currentData && typeof currentData === 'object') ? currentData : {};
        return Object.assign({}, base, {
          alertId: lastAlertTs,
          donor: donor,
          amount: amount,
          diff: amount,
          comment: comment,
          type: 'donation',
          alerts: [{ type: 'donation', donor: donor, amount: amount, comment: comment }],
          secret: WRITE_SECRET
        });
      }).then(() => {
        showToast("🚀 Donation skickad till stream!");
        document.getElementById('donDonor').value = "";
        document.getElementById('donAmount').value = "";
        document.getElementById('donComment').value = "";
      }).catch(err => {
        showToast("❌ Kunde inte skicka donation: " + err.message, true);
      });
    }

    // ========================================================
    // 🔊 SOUNDBOARD SYSTEM (TRIGGERS IN OVERLAY.HTML)
    // ========================================================
    function playSound(key) {
      const slider = document.getElementById('soundVol');
      const rawVol = slider ? parseFloat(slider.value) : 0.8;
      const vol = isNaN(rawVol) ? 0.8 : Math.max(0, Math.min(1, rawVol));
      const triggerId = "sb-" + Date.now() + "-" + Math.random().toString(36).substring(2, 6);

      db.ref('soundboard/trigger').set({
        sound: key,
        volume: vol,
        triggerId: triggerId,
        timestamp: Date.now(),
        secret: WRITE_SECRET
      }).catch(err => {
        showToast("❌ Kunde inte spela ljud: " + err.message, true);
      });

      if (soundBus) {
        try {
          soundBus.postMessage({
            type: 'PLAY_SOUND',
            soundType: 'soundboard',
            soundKey: key,
            volume: vol,
            triggerId: triggerId
          });
        } catch (e) {}
      }

      showToast(`Spelar: ${key.toUpperCase()} (${Math.round(vol * 100)}%)`);
    }
  </script>
</body>
</html>
