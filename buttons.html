<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Button Deck</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #111114;
            color: #efeff1;
            font-family: 'Inter', sans-serif;
            padding: 10px;
            overflow-y: auto;
        }

        /* Top Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #eb0400; /* Red when offline */
        }

        .dot.connected {
            background-color: #00ff88; /* Green when ready */
            box-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
        }

        /* Section Titles */
        .section-title {
            font-size: 9px;
            font-weight: 800;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* ✏️ Standard Input Row */
        .input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        /* 👥 Combined Same-Row Container for Streamer 2 & Webcam 2 */
        .dual-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
            margin-bottom: 8px;
        }

        .dual-row .input-sub-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .deck-input {
            flex: 1;
            background: #18181c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 10px;
            outline: none;
            user-select: auto;
            transition: border-color 0.15s ease;
        }

        .deck-input:focus {
            border-color: #00ff88;
        }

        .deck-submit-btn {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #00ff88;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            padding: 8px 14px;
            cursor: pointer;
            transition: all 0.12s ease;
            white-space: nowrap;
        }

        .deck-submit-btn:hover {
            background: #272730;
            border-color: #00ff88;
        }

        .deck-submit-btn:active {
            transform: translateY(1px);
        }

        /* Grids */
        .grid {
            display: grid;
            gap: 6px;
        }

        .grid-webcam {
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 12px;
        }

        .grid-scenes {
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 12px;
        }

        .grid-props {
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 14px;
        }

        /* Stream-Deck Style Buttons */
        .deck-btn {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #efeff1;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.12s ease;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Same-row webcam button styling */
        .dual-row .deck-btn {
            width: 115px;
            flex-shrink: 0;
            padding: 6px 4px;
        }

        .deck-btn:hover {
            background: #272730;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .deck-btn:active {
            transform: translateY(1px);
            border-bottom-width: 1px;
        }

        .deck-btn .tag {
            width: 18px;
            height: 3px;
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }

        .btn-sub {
            font-size: 8px;
            color: #71717a;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: -2px;
        }

        /* Active Scene Highlight */
        .deck-btn.active-scene {
            background: #1e2922 !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3) !important;
        }

        .deck-btn.active-scene .btn-sub {
            color: #00ff88 !important;
        }

        .deck-btn.webcam-is-hidden {
            border-color: rgba(0, 255, 136, 0.35);
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <span>OBS Kontrollpanel</span>
        <div class="status-indicator">
            <span class="dot" id="dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </div>

    <!-- ✏️ ROW 1: STREAMER 1 NAME -->
    <div class="section-title">Streamer 1 Namn (Textkälla)</div>
    <div class="input-row">
        <input type="text" id="streamer-name-input" class="deck-input" placeholder="Namn för Streamer 1..." />
        <button class="deck-submit-btn" id="streamer-submit-btn" onclick="submitStreamerName()">Sätt</button>
    </div>

    <!-- 📷 ROW 2: WEBCAM 1 CONTROLS -->
    <div class="section-title">Webcam Kontroller</div>
    <div class="grid grid-webcam" id="webcam-grid"></div>

    <!-- 🎬 ROW 3: SCENES -->
    <div class="section-title">Scener</div>
    <div class="grid grid-scenes" id="scene-grid"></div>

    <!-- ⚙️ ROW 4: ÄNDRA DESSA (SOURCE PROPERTIES) -->
    <div class="section-title">Ändra dessa:</div>
    <div class="grid grid-props" id="props-grid"></div>

    <!-- 👥 ROW 5: STREAMER 2 & WEBCAM 2 (ALL THE WAY DOWN, SAME ROW) -->
    <div class="section-title" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
      Streamer 2 & Extra Webcam (Valfri)
    </div>
    <div class="dual-row">
        <div class="input-sub-group">
            <input type="text" id="streamer-name-input-2" class="deck-input" placeholder="Streamer 2 namn..." />
            <button class="deck-submit-btn" id="streamer-submit-btn-2" onclick="submitStreamerName2()">Sätt</button>
        </div>
        <button id="btn-webcam-2-toggle" class="deck-btn" onclick="handleWebcam2Click()">
            <div class="tag" style="background-color: #f2711c"></div>
            <span class="btn-label">Göm Webcam 2</span>
        </button>
    </div>

    <script>
        // ================= CONFIGURATION =================
        const TEXT_SOURCE_NAME = "Streamer - Name Source";
        const TEXT_SOURCE_NAME_2 = "Streamer - Name Source 2";

        // Exact sources for Move filters
        const SOURCE_WEBCAM = "Webcam Source";
        const SOURCE_WEBCAM_SCENE = "Webcam Scene";

        const FILTER_MOVE_OUT = "Move Value out";
        const FILTER_MOVE_IN = "Move Value in";

        // Webcam 1 Buttons
        const WEBCAM_BUTTONS = [
            {
                label: "Webcam Vänster",
                color: "#9146FF",
                actions: [
                    { source: "Musikhjälpen|Gaming Scene", filter: "Move Webcam Source Left" },
                    { source: "Html Files", filter: "Move Chat Source Right" }
                ]
            },
            {
                label: "Webcam Höger",
                color: "#00b5ad",
                actions: [
                    { source: "Musikhjälpen|Gaming Scene", filter: "Move Webcam Source Right" },
                    { source: "Html Files", filter: "Move Chat Source Left" }
                ]
            },
            {
                id: "btn-webcam-toggle",
                label: "Göm Webcam 1",
                color: "#f2711c",
                isToggle1: true,
                scene: "Musikhjälpen | Gaming Scene",
                source: "Webcam Scene"
            }
        ];

        // 🎬 4 SCENE BUTTONS
        const SCENE_BUTTONS = [
            {
                label: "Start",
                sublabel: "Scene",
                color: "#eab308",
                sceneName: "Musikhjälpen|Starting Scene"
            },
            {
                label: "Gaming",
                sublabel: "Scene",
                color: "#00ff88",
                sceneName: "Musikhjälpen|Gaming Scene"
            },
            {
                label: "Intermission",
                sublabel: "Scene",
                color: "#3b82f6",
                sceneName: "Intermission Scene"
            },
            {
                label: "Ending",
                sublabel: "Scene",
                color: "#ef4444",
                sceneName: "Ending Scene"
            }
        ];

        // ⚙️ 4 SOURCE PROPERTIES BUTTONS
        const PROPERTIES_BUTTONS = [
            {
                label: "Spotify",
                sublabel: "Audio",
                color: "#1db954",
                source: "Spotify Audio Source"
            },
            {
                label: "Game",
                sublabel: "Capture",
                color: "#a855f7",
                source: "Game Capture"
            },
            {
                label: "Display",
                sublabel: "Capture",
                color: "#06b6d4",
                source: "Display Capture"
            },
            {
                label: "Webcam",
                sublabel: "Source",
                color: "#f97316",
                source: "Webcam Source"
            }
        ];
        // =================================================

        let ws = null;
        let isConnected = false;
        const pendingRequests = new Map();
        let currentActiveScene = "";
        let lastAutoFilteredScene = "";

        // Tracked scene item IDs for reliable syncing
        let webcam1ItemId = null;
        let webcam2ItemId = null;

        function connectOBS() {
            ws = new WebSocket('ws://127.0.0.1:4455');

            ws.onopen = () => {};

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.op === 0) {
                    ws.send(JSON.stringify({
                        op: 1,
                        d: { rpcVersion: 1 }
                    }));
                }

                if (msg.op === 2) {
                    isConnected = true;
                    document.getElementById('dot').classList.add('connected');
                    document.getElementById('status-text').textContent = "Ready";

                    // Fetch active scene
                    sendRequest("GetCurrentProgramScene").then(res => {
                        if (res && res.currentProgramSceneName) {
                            updateActiveSceneUI(res.currentProgramSceneName);
                            handleSceneAutoFilters(res.currentProgramSceneName);
                        }
                    }).catch(() => {});

                    // Fetch both streamer text inputs
                    fetchCurrentText(TEXT_SOURCE_NAME, 'streamer-name-input');
                    fetchCurrentText(TEXT_SOURCE_NAME_2, 'streamer-name-input-2');

                    // Sync initial visibility for Webcam 1 and Webcam 2
                    syncWebcamItem("Musikhjälpen | Gaming Scene", "Webcam Scene", (id) => webcam1ItemId = id, updateWebcamToggleUI);
                    syncWebcamItem("Musikhjälpen | Gaming Scene", "Webcam Scene 2", (id) => webcam2ItemId = id, updateWebcam2ToggleUI);
                }

                // Scene change broadcast from OBS
                if (msg.op === 5 && msg.d && msg.d.eventType === "CurrentProgramSceneChanged") {
                    const newScene = msg.d.eventData.sceneName;
                    updateActiveSceneUI(newScene);
                    handleSceneAutoFilters(newScene);
                }

                // Accurate Scene Item Enable State Listener via unique item IDs
                if (msg.op === 5 && msg.d && msg.d.eventType === "SceneItemEnableStateChanged") {
                    const { sceneItemId, sceneItemEnabled } = msg.d.eventData;
                    if (sceneItemId === webcam1ItemId) {
                        updateWebcamToggleUI(sceneItemEnabled);
                    } else if (sceneItemId === webcam2ItemId) {
                        updateWebcam2ToggleUI(sceneItemEnabled);
                    }
                }

                if (msg.op === 7) {
                    const { requestId, requestStatus, responseData } = msg.d;
                    if (pendingRequests.has(requestId)) {
                        const { resolve, reject } = pendingRequests.get(requestId);
                        pendingRequests.delete(requestId);

                        if (requestStatus && requestStatus.result) {
                            resolve(responseData);
                        } else {
                            reject(new Error(requestStatus ? requestStatus.comment : "Request failed"));
                        }
                    }
                }
            };

            ws.onclose = () => {
                isConnected = false;
                pendingRequests.forEach(({ reject }) => reject(new Error("Connection lost")));
                pendingRequests.clear();
                document.getElementById('dot').classList.remove('connected');
                document.getElementById('status-text').textContent = "Offline";
                setTimeout(connectOBS, 3000);
            };

            ws.onerror = () => ws.close();
        }

        function sendRequest(requestType, requestData = {}) {
            return new Promise((resolve, reject) => {
                if (!isConnected || !ws) {
                    return reject(new Error("Not connected to OBS"));
                }
                const requestId = "req-" + Math.random().toString(36).substring(2, 9);
                pendingRequests.set(requestId, { resolve, reject });
                ws.send(JSON.stringify({
                    op: 6,
                    d: {
                        requestType,
                        requestId,
                        requestData
                    }
                }));
            });
        }

        // ========================================================
        // 🎬 MOVE VALUE AUTOMATION ON SCENE CHANGE
        // ========================================================
        function handleSceneAutoFilters(sceneName) {
            if (isMatchingScene(sceneName, lastAutoFilteredScene)) return;
            lastAutoFilteredScene = sceneName;

            // 1. MASK FILTER (Target: Webcam Source)
            if (isMatchingScene(sceneName, "Gaming Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM, "Move Value in");
            } else if (isMatchingScene(sceneName, "Starting Scene") ||
                       isMatchingScene(sceneName, "Ending Scene") ||
                       isMatchingScene(sceneName, "Intermission Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM, "Move Value out");
            }

            // 2. BLUR FILTER (Target: Webcam Scene)
            if (isMatchingScene(sceneName, "Starting Scene") || isMatchingScene(sceneName, "Ending Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value in");
            } else if (isMatchingScene(sceneName, "Gaming Scene") || isMatchingScene(sceneName, "Intermission Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out");
            }

            setTimeout(() => { lastAutoFilteredScene = ""; }, 600);
        }

        function sendFilterTrigger(sourceName, filterName) {
            if (!isConnected) return;

            ws.send(JSON.stringify({
                op: 6,
                d: {
                    requestType: "SetSourceFilterEnabled",
                    requestId: "req-" + Math.random(),
                    requestData: {
                        sourceName: sourceName,
                        filterName: filterName,
                        filterEnabled: false
                    }
                }
            }));

            setTimeout(() => {
                ws.send(JSON.stringify({
                    op: 6,
                    d: {
                        requestType: "SetSourceFilterEnabled",
                        requestId: "req-" + Math.random(),
                        requestData: {
                            sourceName: sourceName,
                            filterName: filterName,
                            filterEnabled: true
                        }
                    }
                }));
            }, 20);
        }

        // ========================================================
        // 🎬 SCENE ACTIONS
        // ========================================================
        function isMatchingScene(currentName, targetName) {
            if (!currentName || !targetName) return false;
            const cleanA = currentName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
            const cleanB = targetName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
            if (cleanA === cleanB) return true;

            const baseA = cleanA.split('|').pop().trim();
            const baseB = cleanB.split('|').pop().trim();
            return baseA === baseB;
        }

        async function switchScene(sceneName) {
            if (!isConnected) return;

            handleSceneAutoFilters(sceneName);
            updateActiveSceneUI(sceneName);

            try {
                await sendRequest("SetCurrentProgramScene", { sceneName });
            } catch (err) {
                const prefix1 = "Musikhjälpen|" + sceneName;
                const prefix2 = "Musikhjälpen | " + sceneName;
                try {
                    await sendRequest("SetCurrentProgramScene", { sceneName: prefix1 });
                } catch (e1) {
                    try {
                        await sendRequest("SetCurrentProgramScene", { sceneName: prefix2 });
                    } catch (e2) {
                        console.error("Could not switch to scene:", sceneName);
                    }
                }
            }
        }

        function updateActiveSceneUI(activeSceneName) {
            currentActiveScene = activeSceneName;
            const buttons = document.querySelectorAll('#scene-grid .deck-btn');

            buttons.forEach((btnEl, idx) => {
                const sceneBtn = SCENE_BUTTONS[idx];
                if (sceneBtn && isMatchingScene(activeSceneName, sceneBtn.sceneName)) {
                    btnEl.classList.add('active-scene');
                } else {
                    btnEl.classList.remove('active-scene');
                }
            });
        }

        // ========================================================
        // 📷 WEBCAM 1 & 2 DYNAMIC TOGGLES
        // ========================================================
        function updateWebcamToggleUI(isVisible) {
            const btnEl = document.getElementById('btn-webcam-toggle');
            if (!btnEl) return;
            const labelEl = btnEl.querySelector('.btn-label');
            const tagEl = btnEl.querySelector('.tag');

            if (isVisible) {
                if (labelEl) labelEl.textContent = "Göm Webcam 1";
                if (tagEl) tagEl.style.backgroundColor = "#f2711c";
                btnEl.classList.remove('webcam-is-hidden');
            } else {
                if (labelEl) labelEl.textContent = "Visa Webcam 1";
                if (tagEl) tagEl.style.backgroundColor = "#00ff88";
                btnEl.classList.add('webcam-is-hidden');
            }
        }

        function updateWebcam2ToggleUI(isVisible) {
            const btnEl = document.getElementById('btn-webcam-2-toggle');
            if (!btnEl) return;
            const labelEl = btnEl.querySelector('.btn-label');
            const tagEl = btnEl.querySelector('.tag');

            if (isVisible) {
                if (labelEl) labelEl.textContent = "Göm Webcam 2";
                if (tagEl) tagEl.style.backgroundColor = "#f2711c";
                btnEl.classList.remove('webcam-is-hidden');
            } else {
                if (labelEl) labelEl.textContent = "Visa Webcam 2";
                if (tagEl) tagEl.style.backgroundColor = "#00ff88";
                btnEl.classList.add('webcam-is-hidden');
            }
        }

        async function syncWebcamItem(sceneName, sourceName, setItemIdCallback, updateUICallback) {
            try {
                let targetScene = sceneName;
                let itemId = null;

                try {
                    const res = await sendRequest("GetSceneItemId", { sceneName: targetScene, sourceName });
                    itemId = res.sceneItemId;
                } catch(e) {
                    const altScene = targetScene.includes(" | ")
                        ? targetScene.replace(/\s*\|\s*/g, "|")
                        : (targetScene.includes("|") ? targetScene.replace(/\|/g, " | ") : targetScene);
                    const res = await sendRequest("GetSceneItemId", { sceneName: altScene, sourceName });
                    itemId = res.sceneItemId;
                    targetScene = altScene;
                }

                if (itemId !== null) {
                    setItemIdCallback(itemId);
                    const statusRes = await sendRequest("GetSceneItemEnabled", { sceneName: targetScene, sceneItemId: itemId });
                    updateUICallback(statusRes.sceneItemEnabled);
                }
            } catch(e) {}
        }

        async function toggleSceneItemGeneric(sceneName, sourceName, setItemIdCallback, callback) {
            if (!isConnected) return;

            let targetScene = sceneName;
            let itemId = null;

            try {
                const res = await sendRequest("GetSceneItemId", { sceneName: targetScene, sourceName });
                itemId = res.sceneItemId;
            } catch (err) {
                const altScene = targetScene.includes(" | ")
                    ? targetScene.replace(/\s*\|\s*/g, "|")
                    : (targetScene.includes("|") ? targetScene.replace(/\|/g, " | ") : targetScene);

                try {
                    const res = await sendRequest("GetSceneItemId", { sceneName: altScene, sourceName });
                    itemId = res.sceneItemId;
                    targetScene = altScene;
                } catch (err2) {
                    console.error(`Could not locate source "${sourceName}" in "${targetScene}".`);
                    return;
                }
            }

            try {
                setItemIdCallback(itemId);
                const statusRes = await sendRequest("GetSceneItemEnabled", {
                    sceneName: targetScene,
                    sceneItemId: itemId
                });

                const willBeEnabled = !statusRes.sceneItemEnabled;

                await sendRequest("SetSceneItemEnabled", {
                    sceneName: targetScene,
                    sceneItemId: itemId,
                    sceneItemEnabled: willBeEnabled
                });

                if (callback) callback(willBeEnabled);
            } catch (err) {
                console.error("Failed to toggle visibility:", err);
            }
        }

        function handleWebcam2Click() {
            // Correct path: Scene: Musikhjälpen|Gaming Scene, Source: Webcam Scene 2
            toggleSceneItemGeneric(
                "Musikhjälpen|Gaming Scene", 
                "Webcam Scene 2", 
                (id) => webcam2ItemId = id, 
                updateWebcam2ToggleUI
            );
        }

        // ========================================================
        // ✏️ TEXT SOURCE CONTROLLERS (STREAMER 1 & 2)
        // ========================================================
        async function updateTextSource(inputName, newText) {
            if (!isConnected) return;
            try {
                await sendRequest("SetInputSettings", {
                    inputName: inputName,
                    inputSettings: { text: newText },
                    overlay: true
                });
            } catch (err) {
                console.error(`Failed to update text on "${inputName}":`, err);
            }
        }

        async function fetchCurrentText(inputName, elementId) {
            if (!isConnected) return;
            try {
                const res = await sendRequest("GetInputSettings", { inputName });
                if (res && res.inputSettings && typeof res.inputSettings.text === 'string') {
                    const inputEl = document.getElementById(elementId);
                    if (inputEl && document.activeElement !== inputEl) {
                        inputEl.value = res.inputSettings.text;
                    }
                }
            } catch (err) {
                console.warn(`Could not read text from "${inputName}":`, err);
            }
        }

        function submitStreamerName() {
            const inputEl = document.getElementById('streamer-name-input');
            const submitBtn = document.getElementById('streamer-submit-btn');
            if (!inputEl) return;

            const text = inputEl.value.trim();
            updateTextSource(TEXT_SOURCE_NAME, text);

            if (submitBtn) {
                const originalText = submitBtn.innerText;
                submitBtn.innerText = "✓ Sparat!";
                submitBtn.style.color = "#ffffff";
                setTimeout(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.style.color = "#00ff88";
                }, 1200);
            }
        }

        function submitStreamerName2() {
            const inputEl = document.getElementById('streamer-name-input-2');
            const submitBtn = document.getElementById('streamer-submit-btn-2');
            if (!inputEl) return;

            const text = inputEl.value.trim();
            updateTextSource(TEXT_SOURCE_NAME_2, text);

            if (submitBtn) {
                const originalText = submitBtn.innerText;
                submitBtn.innerText = "✓ Sparat!";
                submitBtn.style.color = "#ffffff";
                setTimeout(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.style.color = "#00ff88";
                }, 1200);
            }
        }

        document.getElementById('streamer-name-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitStreamerName();
        });

        document.getElementById('streamer-name-input-2').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitStreamerName2();
        });

        // ========================================================
        // 🪟 OPEN PROPERTIES DIALOG
        // ========================================================
        async function openSourceProperties(inputName) {
            try {
                await sendRequest("OpenInputPropertiesDialog", { inputName });
            } catch (err) {
                console.error("Could not open properties for:", inputName, err);
            }
        }

        function handleButtonClick(btn) {
            if (btn.actions && Array.isArray(btn.actions)) {
                btn.actions.forEach(action => {
                    sendFilterTrigger(action.source, action.filter);
                });
            } else if (btn.isToggle1) {
                toggleSceneItemGeneric(btn.scene, btn.source, (id) => webcam1ItemId = id, updateWebcamToggleUI);
            } else if (btn.scene && btn.source) {
                toggleSceneItemGeneric(btn.scene, btn.source, () => {}, () => {});
            }
        }

        // ========================================================
        // 🎨 RENDER DECK BUTTONS
        // ========================================================
        function renderDeck() {
            // 1. Webcam 1 Buttons
            const webcamGrid = document.getElementById('webcam-grid');
            webcamGrid.innerHTML = '';
            WEBCAM_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                if (btn.isToggle1) buttonEl.id = 'btn-webcam-toggle';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span class="btn-label">${btn.label}</span>
                `;
                buttonEl.onclick = () => handleButtonClick(btn);
                webcamGrid.appendChild(buttonEl);
            });

            // 2. Scene Buttons
            const sceneGrid = document.getElementById('scene-grid');
            sceneGrid.innerHTML = '';
            SCENE_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span>${btn.label}</span>
                    <span class="btn-sub">${btn.sublabel}</span>
                `;
                buttonEl.onclick = () => switchScene(btn.sceneName);
                sceneGrid.appendChild(buttonEl);
            });

            // 3. Properties Buttons
            const propsGrid = document.getElementById('props-grid');
            propsGrid.innerHTML = '';
            PROPERTIES_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span>${btn.label}</span>
                    <span class="btn-sub">${btn.sublabel}</span>
                `;
                buttonEl.onclick = () => openSourceProperties(btn.source);
                propsGrid.appendChild(buttonEl);
            });
        }

        renderDeck();
        connectOBS();
    </script>
</body>
</html>
