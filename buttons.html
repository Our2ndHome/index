<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Button Deck</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #111114;
            color: #efeff1;
            font-family: 'Inter', sans-serif;
            padding: 10px;
            overflow-y: auto;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #eb0400;
        }

        .dot.connected {
            background-color: #00ff88;
            box-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
        }

        .section-title {
            font-size: 9px;
            font-weight: 800;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* 🎵 SPOTIFY SKIP BUTTON */
        .btn-spotify-skip {
            width: 100%;
            background: #18181c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            transition: all 0.08s ease;
        }

        .btn-spotify-skip:hover {
            background: #24242c;
            border-color: #1db954;
            color: #1db954;
        }

        .btn-spotify-skip:active, .btn-spotify-skip.flashing {
            transform: translateY(1px);
            background: #1db954 !important;
            color: #000000 !important;
            border-color: #1db954 !important;
        }

        .spotify-left-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spotify-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #1db954;
            box-shadow: 0 0 6px rgba(29, 185, 84, 0.6);
        }

        .btn-spotify-skip.flashing .spotify-dot {
            background-color: #000000;
        }

        .shortcut-badge {
            font-size: 9px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }
        .btn-spotify-skip:hover .shortcut-badge {
            color: #1db954;
            background: rgba(29, 185, 84, 0.15);
        }
        .btn-spotify-skip.flashing .shortcut-badge {
            color: #000000;
            background: rgba(0, 0, 0, 0.2);
        }

        /* 🔄 REFRESH ALL BROWSER SOURCES BUTTON */
        .btn-refresh-sources {
            width: 100%;
            background: #18181c;
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #93c5fd;
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            transition: all 0.12s ease;
        }

        .btn-refresh-sources:hover:not(:disabled) {
            background: #1e293b;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .btn-refresh-sources:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-refresh-sources:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-refresh-sources.success {
            background: #143820 !important;
            border-color: #00ff88 !important;
            color: #00ff88 !important;
        }

        .btn-refresh-sources.error {
            background: #381414 !important;
            border-color: #ff4d4d !important;
            color: #ff4d4d !important;
        }

        .dual-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
            margin-bottom: 8px;
        }

        .dual-row .input-sub-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .deck-input {
            flex: 1;
            background: #18181c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 10px;
            outline: none;
            user-select: auto;
        }

        .deck-input:focus { border-color: #00ff88; }

        .deck-submit-btn {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #00ff88;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            padding: 8px 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .deck-submit-btn:hover { background: #272730; border-color: #00ff88; }
        .deck-submit-btn:active { transform: translateY(1px); }

        .grid { display: grid; gap: 6px; }
        .grid-webcam { grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; }
        .grid-scenes { grid-template-columns: repeat(4, 1fr); margin-bottom: 12px; }
        .grid-props { grid-template-columns: repeat(5, 1fr); margin-bottom: 14px; }

        .deck-btn {
            background: #1c1c22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid #141418;
            border-radius: 6px;
            color: #efeff1;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.12s ease;
            white-space: nowrap;
            overflow: hidden;
        }

        .dual-row .deck-btn {
            width: 115px;
            flex-shrink: 0;
            padding: 6px 4px;
        }

        .deck-btn:hover {
            background: #272730;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .deck-btn:active {
            transform: translateY(1px);
            border-bottom-width: 1px;
        }

        .deck-btn .tag {
            width: 18px;
            height: 3px;
            border-radius: 2px;
        }

        .btn-sub {
            font-size: 8px;
            color: #71717a;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: -2px;
        }

        .deck-btn.active-scene {
            background: #1e2922 !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3) !important;
        }

        .deck-btn.active-scene .btn-sub { color: #00ff88 !important; }
        .deck-btn.webcam-is-hidden { border-color: rgba(0, 255, 136, 0.35); }
    </style>
</head>
<body>

    <div class="status-bar">
        <span>OBS Kontrollpanel</span>
        <div class="status-indicator">
            <span class="dot" id="dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </div>

    <!-- 🎵 SPOTIFY SKIP BUTTON -->
    <div class="section-title">Musik (Spotify)</div>
    <button class="btn-spotify-skip" id="btn-skip-spotify" onclick="remoteSkipSpotify()">
        <div class="spotify-left-box">
            <span class="spotify-dot"></span>
            <span id="spotify-skip-label">⏭️ NÄSTA LÅT (SKIP)</span>
        </div>
        <span class="shortcut-badge">F9</span>
    </button>

    <!-- 📷 ROW 1: WEBCAM 1 CONTROLS -->
    <div class="section-title">Webcam Kontroller</div>
    <div class="grid grid-webcam" id="webcam-grid"></div>

    <!-- 🎬 ROW 2: SCENES -->
    <div class="section-title">Scener</div>
    <div class="grid grid-scenes" id="scene-grid"></div>

    <!-- ⚙️ ROW 3: ÄNDRA DESSA (SOURCE PROPERTIES) -->
    <div class="section-title">Ändra dessa:</div>
    <div class="grid grid-props" id="props-grid"></div>

    <!-- 👥 ROW 4: STREAMER 2 & WEBCAM 2 -->
    <div class="section-title" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
      Streamer 2 & Extra Webcam (Valfri)
    </div>
    <div class="dual-row">
        <div class="input-sub-group">
            <input type="text" id="streamer-name-input-2" class="deck-input" placeholder="Streamer 2 namn..." />
            <button class="deck-submit-btn" id="streamer-submit-btn-2" onclick="submitStreamerName2()">Sätt</button>
        </div>
        <button id="btn-webcam-2-toggle" class="deck-btn" onclick="handleWebcam2Click()">
            <div class="tag" style="background-color: #f2711c"></div>
            <span class="btn-label">Göm Webcam 2</span>
        </button>
    </div>

    <!-- 🔄 ROW 5: REFRESH ALL BROWSER SOURCES -->
    <button id="btn-refresh-sources" class="btn-refresh-sources" onclick="refreshAllBrowserSources()">
        🔄 UPPDATERA ALLA BROWSER-KÄLLOR (RENSA CACHE)
    </button>

    <script>
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
        const WRITE_SECRET = "Our2ndHomeSecret2026!";

        const TEXT_SOURCE_NAME_2 = "Streamer - Name Source 2";
        const CHAT_SOURCE_NAME = "twitchchat.html";
        const HTML_FILES_SCENE = "Html Files";
        const GAMING_SCENE_NAME = "Musikhjälpen|Gaming Scene";

        const SOURCE_WEBCAM = "Webcam Source";
        const SOURCE_WEBCAM_SCENE = "Webcam Scene";

        // 🎯 EXACT SOURCE NAME
        const OBS_HOTKEY_TRIGGER_SOURCE = "Hotkey - Skip Spotify";

        let lastSkipSentTime = 0;
        let isSkipDebouncing = false;

        function remoteSkipSpotify() {
            if (isSkipDebouncing) return;
            isSkipDebouncing = true;

            const btn = document.getElementById('btn-skip-spotify');
            if (btn) {
                btn.classList.add('flashing');
                setTimeout(() => btn.classList.remove('flashing'), 140);
            }

            const now = Date.now();
            lastSkipSentTime = Math.max(now, lastSkipSentTime + 1);

            fetch(`${FIREBASE_DATABASE_URL}/spotify_control.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'skip',
                    timestamp: lastSkipSentTime,
                    secret: WRITE_SECRET
                })
            })
            .then(async (res) => {
                if (!res.ok) {
                    const errText = await res.text().catch(() => res.statusText);
                    throw new Error(`HTTP ${res.status}: ${errText}`);
                }
            })
            .catch(err => console.error("❌ Firebase skip failed:", err));

            setTimeout(() => { isSkipDebouncing = false; }, 350);
        }

        // Local hotkey when browser dock has focus
        window.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
                return;
            }

            if (e.key === 'F9' || (e.shiftKey && (e.key === 'N' || e.key === 'n'))) {
                e.preventDefault();
                remoteSkipSpotify();
            }
        });

        const WEBCAM_BUTTONS = [
            {
                label: "Webcam Vänster",
                color: "#9146FF",
                actions: [
                    { source: "Musikhjälpen|Gaming Scene", filter: "Move Webcam Source Left" },
                    { source: "Html Files", filter: "Move Chat Source Right" }
                ]
            },
            {
                label: "Webcam Höger",
                color: "#00b5ad",
                actions: [
                    { source: "Musikhjälpen|Gaming Scene", filter: "Move Webcam Source Right" },
                    { source: "Html Files", filter: "Move Chat Source Left" }
                ]
            },
            {
                id: "btn-webcam-toggle",
                label: "Göm Webcam 1",
                color: "#f2711c",
                isToggle1: true,
                scene: GAMING_SCENE_NAME,
                source: "Webcam Scene"
            }
        ];

        const SCENE_BUTTONS = [
            { label: "Start", sublabel: "Scene", color: "#eab308", sceneName: "Musikhjälpen|Starting Scene" },
            { label: "Gaming", sublabel: "Scene", color: "#00ff88", sceneName: "Musikhjälpen|Gaming Scene" },
            { label: "Intermission", sublabel: "Scene", color: "#3b82f6", sceneName: "Intermission Scene" },
            { label: "Ending", sublabel: "Scene", color: "#ef4444", sceneName: "Ending Scene" }
        ];

        const PROPERTIES_BUTTONS = [
            { label: "Main Mic", sublabel: "Audio", color: "#ef4444", source: "Main Mic" },
            { label: "Game", sublabel: "Audio", color: "#3b82f6", source: "Game Audio" },
            { label: "Game", sublabel: "Capture", color: "#a855f7", source: "Game Capture" },
            { label: "Display", sublabel: "Capture", color: "#06b6d4", source: "Display Capture" },
            { label: "Webcam", sublabel: "Source", color: "#f97316", source: "Webcam Source" }
        ];

        let ws = null;
        let isConnected = false;
        let obsReconnectTimer = null;
        const pendingRequests = new Map();
        let currentActiveScene = "";
        let lastAutoFilteredScene = "";
        let lastAutoFilterTimer = null;

        let webcam1ItemId = null;
        let webcam2ItemId = null;
        let hotkeySkipItemId = null;

        function scheduleReconnect() {
            if (obsReconnectTimer) return;
            obsReconnectTimer = setTimeout(() => {
                obsReconnectTimer = null;
                connectOBS();
            }, 3000);
        }

        function connectOBS() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                return;
            }

            try {
                ws = new WebSocket('ws://127.0.0.1:4455');
            } catch (e) {
                scheduleReconnect();
                return;
            }

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    if (msg.op === 0) {
                        if (msg.d && msg.d.authentication) {
                            console.error("❌ [OBS WebSocket] Authentication is enabled in OBS, but this deck expects no password.");
                            document.getElementById('status-text').textContent = "Auth Error";
                            return;
                        }
                        ws.send(JSON.stringify({
                            op: 1,
                            d: { rpcVersion: 1, eventSubscriptions: 1023 }
                        }));
                    }

                    if (msg.op === 2) {
                        isConnected = true;
                        document.getElementById('dot').classList.add('connected');
                        document.getElementById('status-text').textContent = "Ready";

                        sendRequest("GetCurrentProgramScene").then(res => {
                            const activeScene = res && (res.sceneName || res.currentProgramSceneName);
                            if (activeScene) {
                                updateActiveSceneUI(activeScene);
                                handleSceneAutoFilters(activeScene);
                            }
                        }).catch(() => {});

                        fetchCurrentText(TEXT_SOURCE_NAME_2, 'streamer-name-input-2');

                        syncWebcamItem(GAMING_SCENE_NAME, "Webcam Scene", (id) => webcam1ItemId = id, updateWebcamToggleUI);
                        syncWebcamItem(GAMING_SCENE_NAME, "Webcam Scene 2", (id) => webcam2ItemId = id, (isEnabled) => {
                            updateWebcam2ToggleUI(isEnabled);
                            setSceneItemState(HTML_FILES_SCENE, TEXT_SOURCE_NAME_2, isEnabled);
                            setSceneItemState(HTML_FILES_SCENE, CHAT_SOURCE_NAME, !isEnabled);
                        });

                        // 🎯 DIRECT LINK: Syncs with "Hotkey - Skip Spotify" inside "Html Files"
                        syncWebcamItem(HTML_FILES_SCENE, OBS_HOTKEY_TRIGGER_SOURCE, (id) => {
                            hotkeySkipItemId = id;
                            console.log(`[Spotify Hotkey] Linked successfully to 'Html Files' (Item ID: ${id})`);
                        }, (isEnabled) => {
                            if (isEnabled) {
                                setSceneItemState(HTML_FILES_SCENE, OBS_HOTKEY_TRIGGER_SOURCE, false);
                            }
                        });
                    }

                    if (msg.op === 5 && msg.d && msg.d.eventType === "CurrentProgramSceneChanged") {
                        const newScene = msg.d.eventData.sceneName;
                        updateActiveSceneUI(newScene);
                        handleSceneAutoFilters(newScene);
                    }

                    if (msg.op === 5 && msg.d && msg.d.eventType === "SceneItemEnableStateChanged") {
                        const { sceneItemId, sceneItemEnabled, sceneName } = msg.d.eventData;

                        // Always check sceneName too—sceneItemId is only unique per scene!
                        if (webcam1ItemId !== null && sceneItemId === webcam1ItemId && isMatchingScene(sceneName, GAMING_SCENE_NAME)) {
                            updateWebcamToggleUI(sceneItemEnabled);
                        } else if (webcam2ItemId !== null && sceneItemId === webcam2ItemId && isMatchingScene(sceneName, GAMING_SCENE_NAME)) {
                            updateWebcam2ToggleUI(sceneItemEnabled);
                            setSceneItemState(HTML_FILES_SCENE, TEXT_SOURCE_NAME_2, sceneItemEnabled);
                            setSceneItemState(HTML_FILES_SCENE, CHAT_SOURCE_NAME, !sceneItemEnabled);
                        } else if (hotkeySkipItemId !== null && sceneItemId === hotkeySkipItemId && isMatchingScene(sceneName, HTML_FILES_SCENE) && sceneItemEnabled) {
                            // 🎯 GLOBAL HOTKEY FIRED VIA OBS!
                            remoteSkipSpotify();
                            setTimeout(() => {
                                setSceneItemState(HTML_FILES_SCENE, OBS_HOTKEY_TRIGGER_SOURCE, false);
                            }, 50);
                        }
                    }

                    if (msg.op === 7) {
                        const { requestId, requestStatus, responseData } = msg.d;
                        if (pendingRequests.has(requestId)) {
                            const { resolve, reject, timer } = pendingRequests.get(requestId);
                            clearTimeout(timer);
                            pendingRequests.delete(requestId);

                            if (requestStatus && requestStatus.result) {
                                resolve(responseData || {});
                            } else {
                                reject(new Error(requestStatus ? requestStatus.comment : "Request failed"));
                            }
                        }
                    }
                } catch (err) {
                    console.error("⚠️ [OBS Deck] Error handling WebSocket message:", err);
                }
            };

            ws.onclose = () => {
                isConnected = false;
                pendingRequests.forEach(({ reject, timer }) => {
                    clearTimeout(timer);
                    reject(new Error("Connection lost"));
                });
                pendingRequests.clear();
                document.getElementById('dot').classList.remove('connected');
                document.getElementById('status-text').textContent = "Offline";
                scheduleReconnect();
            };

            ws.onerror = () => {
                try { ws.close(); } catch (e) {}
            };
        }

        function sendRequest(requestType, requestData = {}) {
            return new Promise((resolve, reject) => {
                if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) {
                    return reject(new Error("Not connected to OBS"));
                }
                const requestId = "req-" + Math.random().toString(36).substring(2, 9);
                const timer = setTimeout(() => {
                    if (pendingRequests.has(requestId)) {
                        pendingRequests.delete(requestId);
                        reject(new Error(`OBS request timeout: ${requestType}`));
                    }
                }, 3000);

                pendingRequests.set(requestId, { resolve, reject, timer });

                try {
                    ws.send(JSON.stringify({
                        op: 6,
                        d: { requestType, requestId, requestData }
                    }));
                } catch (err) {
                    clearTimeout(timer);
                    pendingRequests.delete(requestId);
                    reject(err);
                }
            });
        }

        let refreshBtnTimer = null;
        async function refreshAllBrowserSources() {
            const btn = document.getElementById('btn-refresh-sources');
            const defaultLabel = "🔄 UPPDATERA ALLA BROWSER-KÄLLOR (RENSA CACHE)";
            if (!btn) return;

            clearTimeout(refreshBtnTimer);

            const showResult = (text, stateClass) => {
                btn.disabled = false;
                btn.classList.remove('success', 'error');
                if (stateClass) btn.classList.add(stateClass);
                btn.textContent = text;
                refreshBtnTimer = setTimeout(() => {
                    btn.classList.remove('success', 'error');
                    btn.textContent = defaultLabel;
                }, 2200);
            };

            if (!isConnected) {
                showResult("⚠️ Ej ansluten till OBS WebSocket", "error");
                return;
            }

            btn.disabled = true;
            btn.classList.remove('success', 'error');
            btn.textContent = "🔄 Uppdaterar & rensar cache...";

            try {
                const res = await sendRequest("GetInputList");
                const inputs = Array.isArray(res.inputs) ? res.inputs : [];
                const browserSources = inputs.filter(inp =>
                    inp && (inp.unversionedInputKind === 'browser_source' || inp.inputKind === 'browser_source')
                );

                if (browserSources.length === 0) {
                    showResult("⚠️ Inga browser-källor hittades", "error");
                    return;
                }

                let refreshedCount = 0;
                await Promise.all(browserSources.map(async (src) => {
                    try {
                        await sendRequest("PressInputPropertiesButton", {
                            inputName: src.inputName,
                            propertyName: "refreshnocache"
                        });
                        refreshedCount++;
                    } catch (err) {
                        console.warn(`⚠️ Could not refresh "${src.inputName}":`, err.message);
                    }
                }));

                if (refreshedCount > 0) {
                    showResult(`✓ Uppdaterade ${refreshedCount} browser-källor!`, "success");
                } else {
                    showResult("⚠️ Kunde inte uppdatera browser-källor", "error");
                }
            } catch (err) {
                console.error("❌ Failed to list/refresh browser sources:", err);
                showResult("❌ Fel vid uppdatering av källor", "error");
            }
        }

        function handleSceneAutoFilters(sceneName) {
            if (isMatchingScene(sceneName, lastAutoFilteredScene)) return;
            lastAutoFilteredScene = sceneName;

            if (isMatchingScene(sceneName, "Gaming Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM, "Move Value in");
            } else if (isMatchingScene(sceneName, "Starting Scene") ||
                       isMatchingScene(sceneName, "Ending Scene") ||
                       isMatchingScene(sceneName, "Intermission Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM, "Move Value out");
            }

            if (isMatchingScene(sceneName, "Starting Scene") || isMatchingScene(sceneName, "Ending Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value in");
            } else if (isMatchingScene(sceneName, "Gaming Scene") || isMatchingScene(sceneName, "Intermission Scene")) {
                sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out");
            }

            clearTimeout(lastAutoFilterTimer);
            lastAutoFilterTimer = setTimeout(() => { lastAutoFilteredScene = ""; }, 800);
        }

        async function sendFilterTrigger(sourceName, filterName) {
            if (!isConnected) return;
            try {
                await sendRequest("SetSourceFilterEnabled", {
                    sourceName,
                    filterName,
                    filterEnabled: false
                });
                await delay(25);
                await sendRequest("SetSourceFilterEnabled", {
                    sourceName,
                    filterName,
                    filterEnabled: true
                });
            } catch (err) {
                console.warn(`⚠️ [OBS Filter] "${filterName}" on "${sourceName}" failed:`, err.message);
            }
        }

        function isMatchingScene(currentName, targetName) {
            if (!currentName || !targetName) return false;
            const cleanA = currentName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
            const cleanB = targetName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
            if (cleanA === cleanB) return true;

            const baseA = cleanA.split('|').pop().trim();
            const baseB = cleanB.split('|').pop().trim();
            return baseA === baseB;
        }

        function getSceneNameVariants(sceneName) {
            const baseName = sceneName.split('|').pop().trim();
            return [...new Set([
                sceneName,
                sceneName.replace(/\s*\|\s*/g, "|"),
                sceneName.replace(/\s*\|\s*/g, " | "),
                "Musikhjälpen|" + baseName,
                "Musikhjälpen | " + baseName,
                baseName
            ])];
        }

        async function switchScene(sceneName) {
            if (!isConnected) return;

            handleSceneAutoFilters(sceneName);
            updateActiveSceneUI(sceneName);

            const variants = getSceneNameVariants(sceneName);
            for (const candidate of variants) {
                try {
                    await sendRequest("SetCurrentProgramScene", { sceneName: candidate });
                    return;
                } catch (e) {}
            }
            console.warn(`⚠️ [OBS Scene] Could not switch to "${sceneName}"`);
        }

        function updateActiveSceneUI(activeSceneName) {
            currentActiveScene = activeSceneName;
            const buttons = document.querySelectorAll('#scene-grid .deck-btn');

            buttons.forEach((btnEl, idx) => {
                const sceneBtn = SCENE_BUTTONS[idx];
                if (sceneBtn && isMatchingScene(activeSceneName, sceneBtn.sceneName)) {
                    btnEl.classList.add('active-scene');
                } else {
                    btnEl.classList.remove('active-scene');
                }
            });
        }

        function updateWebcamToggleUI(isVisible) {
            const btnEl = document.getElementById('btn-webcam-toggle');
            if (!btnEl) return;
            const labelEl = btnEl.querySelector('.btn-label');
            const tagEl = btnEl.querySelector('.tag');

            if (isVisible) {
                if (labelEl) labelEl.textContent = "Göm Webcam 1";
                if (tagEl) tagEl.style.backgroundColor = "#f2711c";
                btnEl.classList.remove('webcam-is-hidden');
            } else {
                if (labelEl) labelEl.textContent = "Visa Webcam 1";
                if (tagEl) tagEl.style.backgroundColor = "#00ff88";
                btnEl.classList.add('webcam-is-hidden');
            }
        }

        function updateWebcam2ToggleUI(isVisible) {
            const btnEl = document.getElementById('btn-webcam-2-toggle');
            if (!btnEl) return;
            const labelEl = btnEl.querySelector('.btn-label');
            const tagEl = btnEl.querySelector('.tag');

            if (isVisible) {
                if (labelEl) labelEl.textContent = "Göm Webcam 2";
                if (tagEl) tagEl.style.backgroundColor = "#f2711c";
                btnEl.classList.remove('webcam-is-hidden');
            } else {
                if (labelEl) labelEl.textContent = "Visa Webcam 2";
                if (tagEl) tagEl.style.backgroundColor = "#00ff88";
                btnEl.classList.add('webcam-is-hidden');
            }
        }

        async function resolveSceneItem(sceneName, sourceName) {
            const variants = getSceneNameVariants(sceneName);
            for (const candidate of variants) {
                try {
                    const res = await sendRequest("GetSceneItemId", { sceneName: candidate, sourceName });
                    if (res && res.sceneItemId !== undefined && res.sceneItemId !== null) {
                        return { sceneName: candidate, itemId: res.sceneItemId };
                    }
                } catch (e) {}
            }
            return null;
        }

        async function setSceneItemState(sceneName, sourceName, enabled) {
            if (!isConnected) return;
            const resolved = await resolveSceneItem(sceneName, sourceName);
            if (!resolved) return;

            try {
                await sendRequest("SetSceneItemEnabled", {
                    sceneName: resolved.sceneName,
                    sceneItemId: resolved.itemId,
                    sceneItemEnabled: enabled
                });
            } catch (err) {
                console.warn(`⚠️ [OBS Item] Could not set "${sourceName}" in "${resolved.sceneName}":`, err.message);
            }
        }

        async function syncWebcamItem(sceneName, sourceName, setItemIdCallback, updateUICallback) {
            try {
                const resolved = await resolveSceneItem(sceneName, sourceName);
                if (!resolved) return;

                setItemIdCallback(resolved.itemId);
                const statusRes = await sendRequest("GetSceneItemEnabled", {
                    sceneName: resolved.sceneName,
                    sceneItemId: resolved.itemId
                });
                updateUICallback(statusRes.sceneItemEnabled);
            } catch (e) {}
        }

        async function toggleSceneItemGeneric(sceneName, sourceName, setItemIdCallback, callback) {
            if (!isConnected) return;

            const resolved = await resolveSceneItem(sceneName, sourceName);
            if (!resolved) {
                console.warn(`⚠️ [OBS Item] Could not find "${sourceName}" in "${sceneName}"`);
                return;
            }

            try {
                setItemIdCallback(resolved.itemId);
                const statusRes = await sendRequest("GetSceneItemEnabled", {
                    sceneName: resolved.sceneName,
                    sceneItemId: resolved.itemId
                });

                const willBeEnabled = !statusRes.sceneItemEnabled;

                await sendRequest("SetSceneItemEnabled", {
                    sceneName: resolved.sceneName,
                    sceneItemId: resolved.itemId,
                    sceneItemEnabled: willBeEnabled
                });

                if (callback) callback(willBeEnabled);
            } catch (err) {
                console.warn(`⚠️ [OBS Item] Toggle failed for "${sourceName}":`, err.message);
            }
        }

        function handleWebcam2Click() {
            // SceneItemEnableStateChanged automatically syncs TEXT_SOURCE_NAME_2 & CHAT_SOURCE_NAME
            toggleSceneItemGeneric(
                GAMING_SCENE_NAME,
                "Webcam Scene 2",
                (id) => webcam2ItemId = id,
                updateWebcam2ToggleUI
            );
        }

        async function updateTextSource(inputName, newText) {
            if (!isConnected) return;
            try {
                await sendRequest("SetInputSettings", {
                    inputName: inputName,
                    inputSettings: { text: newText },
                    overlay: true
                });
            } catch (err) {
                console.warn(`⚠️ [OBS Text] Could not update "${inputName}":`, err.message);
            }
        }

        async function fetchCurrentText(inputName, elementId) {
            if (!isConnected) return;
            try {
                const res = await sendRequest("GetInputSettings", { inputName });
                if (res && res.inputSettings && typeof res.inputSettings.text === 'string') {
                    const inputEl = document.getElementById(elementId);
                    if (inputEl && document.activeElement !== inputEl) {
                        inputEl.value = res.inputSettings.text;
                    }
                }
            } catch (err) {}
        }

        function submitStreamerName2() {
            const inputEl = document.getElementById('streamer-name-input-2');
            const submitBtn = document.getElementById('streamer-submit-btn-2');
            if (!inputEl) return;

            const text = inputEl.value.trim();
            updateTextSource(TEXT_SOURCE_NAME_2, text);

            if (submitBtn) {
                const originalText = submitBtn.innerText;
                submitBtn.innerText = "✓ Sparat!";
                submitBtn.style.color = "#ffffff";
                setTimeout(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.style.color = "#00ff88";
                }, 1200);
            }
        }

        const input2 = document.getElementById('streamer-name-input-2');
        if (input2) {
            input2.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitStreamerName2();
            });
        }

        async function openSourceProperties(inputName) {
            try {
                await sendRequest("OpenInputPropertiesDialog", { inputName });
            } catch (err) {
                console.warn(`⚠️ [OBS Properties] Could not open properties for "${inputName}":`, err.message);
            }
        }

        function handleButtonClick(btn) {
            if (btn.actions && Array.isArray(btn.actions)) {
                btn.actions.forEach(action => {
                    sendFilterTrigger(action.source, action.filter);
                });
            } else if (btn.isToggle1) {
                toggleSceneItemGeneric(btn.scene, btn.source, (id) => webcam1ItemId = id, updateWebcamToggleUI);
            } else if (btn.scene && btn.source) {
                toggleSceneItemGeneric(btn.scene, btn.source, () => {}, () => {});
            }
        }

        function renderDeck() {
            const webcamGrid = document.getElementById('webcam-grid');
            webcamGrid.innerHTML = '';
            WEBCAM_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                if (btn.isToggle1) buttonEl.id = 'btn-webcam-toggle';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span class="btn-label">${btn.label}</span>
                `;
                buttonEl.onclick = () => handleButtonClick(btn);
                webcamGrid.appendChild(buttonEl);
            });

            const sceneGrid = document.getElementById('scene-grid');
            sceneGrid.innerHTML = '';
            SCENE_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span>${btn.label}</span>
                    <span class="btn-sub">${btn.sublabel}</span>
                `;
                buttonEl.onclick = () => switchScene(btn.sceneName);
                sceneGrid.appendChild(buttonEl);
            });

            const propsGrid = document.getElementById('props-grid');
            propsGrid.innerHTML = '';
            PROPERTIES_BUTTONS.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'deck-btn';
                buttonEl.innerHTML = `
                    <div class="tag" style="background-color: ${btn.color}"></div>
                    <span>${btn.label}</span>
                    <span class="btn-sub">${btn.sublabel}</span>
                `;
                buttonEl.onclick = () => openSourceProperties(btn.source);
                propsGrid.appendChild(buttonEl);
            });
        }

        renderDeck();
        connectOBS();
    </script>
</body>
</html>
