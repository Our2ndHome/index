<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Utmaning Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      pointer-events: none;
      position: relative;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    .utmaning-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 999999;
      pointer-events: none;
      width: 90%;
      max-width: 900px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .utmaning-title {
      font-size: 56px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 8px 0;
      line-height: 1.1;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .utmaning-text {
      font-size: 32px;
      font-weight: 800;
      color: #ace600;
      text-transform: uppercase;
      line-height: 1.3;
      margin: 0;
      word-break: break-word;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 16px rgba(172, 230, 0, 0.4);
    }

    .anim-in {
      display: flex !important;
      animation: alertInSmooth 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes alertInSmooth {
      0% {
        opacity: 0;
        transform: translate(-50%, -58%) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .anim-out {
      display: flex !important;
      animation: alertOutSmooth 0.4s ease forwards !important;
    }

    @keyframes alertOutSmooth {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -48%) scale(0.92);
      }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <div id="utmaningContainer" class="utmaning-overlay">
    <h1 class="utmaning-title">UTMANING</h1>
    <p id="utmaningDesc" class="utmaning-text"></p>
  </div>

  <script>
    (function() {
      try {
        const isSelfDock = window.location.hash.includes('panel') || window.location.hash.includes('dock');
        let isParentDock = false;
        try {
          if (window.parent && window.parent !== window) {
            isParentDock = window.parent.location.hash.includes('panel') || window.parent.location.hash.includes('dock');
          }
        } catch (e) {}

        if (isSelfDock || isParentDock) return;
      } catch (e) {}

      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // ========================================================
      // 🤖 STREAMER.BOT CHAT BOT CONNECTION (Action: "Send Twitch Message")
      // ========================================================
      const SB_WS_URL = "ws://127.0.0.1:8080/";
      let sbWs = null;
      let isSbConnected = false;
      let sbReconnectTimer = null;
      let sbHelloTimer = null;
      const pendingSbRequests = new Map();

      function scheduleSbReconnect() {
        if (sbReconnectTimer) return;
        sbReconnectTimer = setTimeout(() => {
          sbReconnectTimer = null;
          connectStreamerbot();
        }, 4000);
      }

      function connectStreamerbot() {
        if (sbWs && (sbWs.readyState === WebSocket.CONNECTING || sbWs.readyState === WebSocket.OPEN)) {
          return;
        }

        try {
          sbWs = new WebSocket(SB_WS_URL);
        } catch (e) {
          scheduleSbReconnect();
          return;
        }

        sbWs.onopen = () => {
          clearTimeout(sbHelloTimer);
          sbHelloTimer = setTimeout(() => {
            if (!isSbConnected && sbWs && sbWs.readyState === WebSocket.OPEN) {
              isSbConnected = true;
            }
          }, 500);
        };

        sbWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.request === "Hello") {
              clearTimeout(sbHelloTimer);
              if (msg.authentication) {
                console.error("❌ [Streamer.bot Utmaning] Authentication is enabled, but this script expects no password.");
                return;
              }
              isSbConnected = true;
              return;
            }

            if (msg.id && pendingSbRequests.has(msg.id)) {
              const { resolve, timer } = pendingSbRequests.get(msg.id);
              clearTimeout(timer);
              pendingSbRequests.delete(msg.id);
              resolve(msg);
            }
          } catch (e) {}
        };

        sbWs.onclose = () => {
          clearTimeout(sbHelloTimer);
          isSbConnected = false;
          pendingSbRequests.forEach(({ reject, timer }) => {
            clearTimeout(timer);
            reject(new Error("Connection closed"));
          });
          pendingSbRequests.clear();
          scheduleSbReconnect();
        };

        sbWs.onerror = () => {
          try { sbWs.close(); } catch (e) {}
        };
      }

      async function sendStreamerbotChat(chatMessage) {
        const cleanMsg = String(chatMessage || "").replace(/[\r\n]+/g, " ").trim();
        if (!cleanMsg || !isSbConnected || !sbWs || sbWs.readyState !== WebSocket.OPEN) return;

        const reqId = "utm-act-" + Math.random().toString(36).substring(2, 9);

        try {
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              if (pendingSbRequests.has(reqId)) {
                pendingSbRequests.delete(reqId);
                reject(new Error("Timeout"));
              }
            }, 3000);

            pendingSbRequests.set(reqId, { resolve, reject, timer });

            try {
              sbWs.send(JSON.stringify({
                request: "DoAction",
                action: { name: "Send Twitch Message" },
                args: { message: cleanMsg },
                id: reqId
              }));
            } catch (err) {
              clearTimeout(timer);
              pendingSbRequests.delete(reqId);
              reject(err);
            }
          });
        } catch (err) {
          console.warn("⚠️ [Streamer.bot Utmaning] Chat failed:", err.message);
        }
      }

      connectStreamerbot();

      // ========================================================
      // 🎛️ OBS WEBSOCKET & CAMERA CONTROL CONFIGURATION
      // ========================================================
      const OBS_WS_URL = "ws://127.0.0.1:4455";
      const SCENE_GAMING = "Musikhjälpen|Gaming Scene";
      const SCENE_INTERMISSION = "Musikhjälpen|Intermission Scene";

      const SOURCE_WEBCAM = "Webcam Source";
      const SOURCE_WEBCAM_SCENE = "Webcam Scene";

      // Shared lock keys to coordinate Intermission Scene with alerts.html
      const LOCK_KEY_ALERT = "mh_scene_lock_alert_ts";
      const LOCK_KEY_UTMANING = "mh_scene_lock_utmaning_ts";
      const LOCK_KEY_RETURN_SCENE = "mh_scene_lock_return_scene";

      try {
        localStorage.removeItem(LOCK_KEY_UTMANING);
      } catch (e) {}

      function isLockActive(key, maxAgeMs = 120000) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return false;
          const ts = parseInt(raw, 10);
          return Number.isFinite(ts) && (Date.now() - ts) < maxAgeMs;
        } catch (e) {
          return false;
        }
      }

      let obsWs = null;
      let isObsConnected = false;
      let obsReconnectTimer = null;
      const pendingObsRequests = new Map();

      function scheduleObsReconnect() {
        if (obsReconnectTimer) return;
        obsReconnectTimer = setTimeout(() => {
          obsReconnectTimer = null;
          connectOBS();
        }, 4000);
      }

      function connectOBS() {
        if (obsWs && (obsWs.readyState === WebSocket.CONNECTING || obsWs.readyState === WebSocket.OPEN)) {
          return;
        }

        try {
          obsWs = new WebSocket(OBS_WS_URL);
        } catch (e) {
          scheduleObsReconnect();
          return;
        }

        obsWs.onopen = () => {};

        obsWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.op === 0) {
              if (msg.d && msg.d.authentication) {
                console.error("❌ [OBS WebSocket Utmaning] Authentication is enabled, but this script expects no password.");
                return;
              }
              obsWs.send(JSON.stringify({
                op: 1,
                d: { rpcVersion: 1, eventSubscriptions: 1023 }
              }));
            }
            if (msg.op === 2) {
              isObsConnected = true;
            }
            if (msg.op === 7) {
              const { requestId, requestStatus, responseData } = msg.d;
              if (pendingObsRequests.has(requestId)) {
                const { resolve, reject, timer } = pendingObsRequests.get(requestId);
                clearTimeout(timer);
                pendingObsRequests.delete(requestId);
                if (requestStatus && requestStatus.result) {
                  resolve(responseData || {});
                } else {
                  reject(new Error(requestStatus ? requestStatus.comment : "Request failed"));
                }
              }
            }
          } catch (e) {}
        };

        obsWs.onclose = () => {
          isObsConnected = false;
          pendingObsRequests.forEach(({ reject, timer }) => {
            clearTimeout(timer);
            reject(new Error("OBS Connection closed"));
          });
          pendingObsRequests.clear();
          scheduleObsReconnect();
        };

        obsWs.onerror = () => {
          try { obsWs.close(); } catch (e) {}
        };
      }

      function sendObsRequest(requestType, requestData = {}) {
        return new Promise((resolve, reject) => {
          if (!isObsConnected || !obsWs || obsWs.readyState !== WebSocket.OPEN) {
            return reject(new Error("OBS WebSocket not connected"));
          }
          const requestId = "req-utm-" + Math.random().toString(36).substring(2, 9);
          const timer = setTimeout(() => {
            if (pendingObsRequests.has(requestId)) {
              pendingObsRequests.delete(requestId);
              reject(new Error("OBS request timeout"));
            }
          }, 3000);

          pendingObsRequests.set(requestId, { resolve, reject, timer });

          try {
            obsWs.send(JSON.stringify({
              op: 6,
              d: { requestType, requestId, requestData }
            }));
          } catch (err) {
            clearTimeout(timer);
            pendingObsRequests.delete(requestId);
            reject(err);
          }
        });
      }

      async function sendFilterTrigger(sourceName, filterName) {
        if (!isObsConnected) return;
        try {
          await sendObsRequest("SetSourceFilterEnabled", {
            sourceName,
            filterName,
            filterEnabled: false
          });
          await delay(25);
          await sendObsRequest("SetSourceFilterEnabled", {
            sourceName,
            filterName,
            filterEnabled: true
          });
        } catch (err) {
          console.warn(`⚠️ [OBS Filter] "${filterName}" on "${sourceName}" failed:`, err.message);
        }
      }

      async function triggerWebcamMove(direction) {
        if (direction === "in") {
          await Promise.all([
            sendFilterTrigger(SOURCE_WEBCAM, "Move Value in"),
            sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out")
          ]);
        } else {
          await Promise.all([
            sendFilterTrigger(SOURCE_WEBCAM, "Move Value out"),
            sendFilterTrigger(SOURCE_WEBCAM_SCENE, "Move Value out")
          ]);
        }
      }

      function isMatchingScene(currentName, targetName) {
        if (!currentName || !targetName) return false;
        const cleanA = currentName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        const cleanB = targetName.replace(/\s*\|\s*/g, "|").trim().toLowerCase();
        if (cleanA === cleanB) return true;

        const baseA = cleanA.split('|').pop().trim();
        const baseB = cleanB.split('|').pop().trim();
        return baseA === baseB;
      }

      async function getCurrentObsScene() {
        try {
          const res = await sendObsRequest("GetCurrentProgramScene");
          return res.sceneName || res.currentProgramSceneName || "";
        } catch (e) {
          return "";
        }
      }

      async function setObsScene(targetSceneName) {
        try {
          await sendObsRequest("SetCurrentProgramScene", { sceneName: targetSceneName });
          return true;
        } catch (e) {
          const altName = targetSceneName.includes(" | ")
            ? targetSceneName.replace(/\s*\|\s*/g, "|")
            : targetSceneName.replace(/\|/g, " | ");
          try {
            await sendObsRequest("SetCurrentProgramScene", { sceneName: altName });
            return true;
          } catch (e2) {
            console.warn(`⚠️ [OBS Scene] Could not switch to "${targetSceneName}":`, e2.message);
            return false;
          }
        }
      }

      connectOBS();

      // ========================================================
      // 🎊 CONFETTI CANNON: EMOTES & SPONSORS BLAST
      // ========================================================
      const EMOTES_FOLDER = "emotes";
      const CUSTOM_EMOTE_FILES = [
        "Our2ndHome-EmoteHype-500x500.png",
        "Our2ndHome-EmoteLove-500x500.png",
        "Our2ndHome-EmoteWoop-500x500.png",
        "Our2ndHome-IconLogo-512x512x.png",
        "DisgustingFoodMuseum_Sponsor.png",
        "ElinPK_Sponsor.png",
        "EscapeHouse_Sponsor.png",
        "RandomNerd_Sponsor.png"
      ];

      const EMBEDDED_FALLBACKS = [
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,5 64,35 96,40 73,63 78,95 50,80 22,95 27,63 4,40 36,35" fill="%23ace600"/></svg>',
        'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23ffea00"/></svg>'
      ];

      const loadedImages = [];
      CUSTOM_EMOTE_FILES.forEach((filename, idx) => {
        const img = new Image();
        img.onload = () => loadedImages.push(img);
        img.onerror = () => {
          const fb = new Image();
          fb.onload = () => loadedImages.push(fb);
          fb.src = EMBEDDED_FALLBACKS[idx % EMBEDDED_FALLBACKS.length];
        };
        img.src = `${EMOTES_FOLDER}/${encodeURIComponent(filename)}`;
      });

      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const MAX_PARTICLES = 180;
      let animationFrameId = null;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function triggerEmoteCannon() {
        if (loadedImages.length === 0) return;

        const originX = canvas.width * 0.5;
        const originY = canvas.height - 30;
        const particleCount = 45;

        for (let i = 0; i < particleCount; i++) {
          if (particles.length >= MAX_PARTICLES) particles.shift();

          const img = loadedImages[Math.floor(Math.random() * loadedImages.length)];
          const angle = (Math.PI / 2) + (Math.random() * 1.5 - 0.75);
          const speed = Math.random() * 16 + 18;

          particles.push({
            x: originX + (Math.random() * 160 - 80),
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: -Math.sin(angle) * speed,
            gravity: 0.55,
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 8,
            size: Math.floor(Math.random() * 22) + 36,
            opacity: 1,
            img: img
          });
        }

        if (!animationFrameId) {
          updateCannon();
        }
      }

      function updateCannon() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.99;
          p.rotation += p.rotationSpeed;

          if (p.y > canvas.height * 0.45 && p.vy > 0) {
            p.opacity -= 0.018;
          }

          if (p.opacity <= 0 || p.y > canvas.height + 80) {
            particles.splice(i, 1);
            continue;
          }

          if (p.img && p.img.complete && p.img.naturalWidth > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            try {
              ctx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
            } catch (e) {}
            ctx.restore();
          }
        }

        if (particles.length > 0) {
          animationFrameId = requestAnimationFrame(updateCannon);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          animationFrameId = null;
        }
      }

      // ========================================================
      // 🔊 TRIGGER SOUND IN OVERLAY.HTML
      // ========================================================
      let soundChannel = null;
      try {
        soundChannel = new BroadcastChannel('mh_sound_bus');
      } catch (e) {}

      function playHornSoundViaOverlay() {
        const triggerId = "utm-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7);

        let hasParent = false;
        try {
          hasParent = !!(window.parent && window.parent !== window);
        } catch (e) {
          hasParent = false;
        }

        if (hasParent) {
          window.parent.postMessage({ type: 'PLAY_SOUND', soundType: 'utmaning', triggerId }, '*');
        } else {
          if (soundChannel) {
            try {
              soundChannel.postMessage({ type: 'PLAY_SOUND', soundType: 'utmaning', triggerId });
            } catch (e) {}
          }
          try {
            const audio = new Audio("sounds/mrb_hello_utmaning.mp3");
            audio.volume = 0.95;
            audio.play().catch(() => {});
          } catch (e) {}
        }
      }

      // ========================================================
      // 📡 FIREBASE REALTIME LISTENER WITH 5S AUTO-HIDE
      // ========================================================
      const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
      }
      const dbRef = firebase.database().ref('utmaning');

      const container = document.getElementById('utmaningContainer');
      const descEl = document.getElementById('utmaningDesc');

      let isUtmaningActive = false;
      let isBoxVisible = false;
      let localHoldingIntermission = false;
      let autoHideTimer = null;
      let utmaningSessionToken = 0;
      let isInitialLoad = true;

      async function showUtmaning(text) {
        const challengeContent = String(text || "").trim() || "Streamern har blivit utmanad!";

        if (isUtmaningActive) {
          descEl.textContent = challengeContent;
          return;
        }

        isUtmaningActive = true;
        const myToken = ++utmaningSessionToken;

        try { localStorage.setItem(LOCK_KEY_UTMANING, String(Date.now())); } catch (e) {}

        if (isObsConnected) {
          const currentScene = await getCurrentObsScene();
          if (!isUtmaningActive || myToken !== utmaningSessionToken) return;

          if (isMatchingScene(currentScene, SCENE_GAMING)) {
            await triggerWebcamMove("out");
            if (!isUtmaningActive || myToken !== utmaningSessionToken) return;

            const switched = await setObsScene(SCENE_INTERMISSION);
            if (switched) {
              localHoldingIntermission = true;
              try { localStorage.setItem(LOCK_KEY_RETURN_SCENE, currentScene); } catch (e) {}
              await delay(350);
            }
          } else if (isMatchingScene(currentScene, SCENE_INTERMISSION) && isLockActive(LOCK_KEY_ALERT, 120000)) {
            localHoldingIntermission = true;
          }
        }

        if (!isUtmaningActive || myToken !== utmaningSessionToken) return;

        playHornSoundViaOverlay();
        triggerEmoteCannon();

        descEl.textContent = challengeContent;
        container.className = 'utmaning-overlay anim-in';
        isBoxVisible = true;

        sendStreamerbotChat(`our2ndHomeL UTMANING: ${challengeContent} our2ndHomeR`);

        if (autoHideTimer) clearTimeout(autoHideTimer);
        autoHideTimer = setTimeout(() => {
          if (myToken === utmaningSessionToken) {
            hideBoxOnly();
          }
        }, 5000);
      }

      async function hideBoxOnly() {
        if (!isBoxVisible) return;
        isBoxVisible = false;
        container.className = 'utmaning-overlay anim-out';
        await delay(400);
        if (!isBoxVisible) {
          container.className = 'utmaning-overlay';
        }
      }

      async function hideUtmaning() {
        if (!isUtmaningActive) return;
        isUtmaningActive = false;
        utmaningSessionToken++;

        try { localStorage.removeItem(LOCK_KEY_UTMANING); } catch (e) {}

        if (autoHideTimer) {
          clearTimeout(autoHideTimer);
          autoHideTimer = null;
        }

        if (isBoxVisible) {
          await hideBoxOnly();
        }

        if (localHoldingIntermission) {
          localHoldingIntermission = false;

          if (!isLockActive(LOCK_KEY_ALERT, 120000) && isObsConnected) {
            let returnScene = "";
            try {
              returnScene = localStorage.getItem(LOCK_KEY_RETURN_SCENE) || "";
              localStorage.removeItem(LOCK_KEY_RETURN_SCENE);
            } catch (e) {}

            if (returnScene) {
              const activeScene = await getCurrentObsScene();
              if (isMatchingScene(activeScene, SCENE_INTERMISSION)) {
                await triggerWebcamMove("in");
                await setObsScene(returnScene);
                await delay(500);
              }
            }
          }
        }
      }

      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();

        if (isInitialLoad) {
          isInitialLoad = false;
          return;
        }

        if (!val) return;
        if (val.active) {
          showUtmaning(val.text || val.title);
        } else {
          hideUtmaning();
        }
      }, (err) => {
        console.warn("⚠️ [Firebase Utmaning] Listener error:", err.message);
      });

      try {
        const broadcast = new BroadcastChannel('mh_utmaning_channel');
        broadcast.onmessage = (event) => {
          if (event.data && event.data.active) {
            showUtmaning(event.data.text);
          } else {
            hideUtmaning();
          }
        };
      } catch (e) {}

    })();
  </script>
</body>
</html>
