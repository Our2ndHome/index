<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Giveaway Wheel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --text-white: #ffffff;
      --text-dim: #a1a1aa;
      --dock-bg: #0b0b0d;
      --card-bg: #141418;
      --border: #27272a;
      --primary: #ace600;
      --viewport-height: 280px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-white);
      user-select: none;
    }

    /* 🔀 HASH ROUTER */
    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }
    body.mode-panel #victoryCanvas { display: none !important; }

    body.mode-panel {
      background-color: var(--dock-bg);
      overflow-y: auto;
      padding: 10px;
    }

    /* 🌧️ EMOTE RAIN CANVAS (OVERLAY ONLY) */
    #victoryCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99995;
    }

    /* ========================================================
       📺 1. STREAM OVERLAY: CENTERED STATIONARY ROLLER
       ======================================================== */
    .giveaway-widget {
      position: absolute;
      top: 49%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: var(--viewport-height);
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .giveaway-widget.active {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto;
    }

    .giveaway-title-container {
      position: absolute;
      bottom: 100%;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
      pointer-events: none;
    }

    .giveaway-head-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .giveaway-sub-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 5px;
      margin-bottom: 14px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .giveaway-timer-badge {
      display: block;
      text-align: center;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.8px;
      min-height: 24px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    .timer-val {
      color: var(--primary) !important;
    }

    .winner-response-header {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .winner-response-msg {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-top: 4px;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    /* 🎰 THE 5-SLOT STAGE */
    .reel-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      border: none;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.4) 10%,
        rgba(0, 0, 1) 28%,
        rgba(0, 0, 1) 72%,
        rgba(0, 0, 0, 0.4) 90%,
        rgba(0, 0, 0, 0) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.4) 10%,
        rgba(0, 0, 1) 28%,
        rgba(0, 0, 1) 72%,
        rgba(0, 0, 0, 0.4) 90%,
        rgba(0, 0, 0, 0) 100%
      );
    }

    .reel-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .slot-item {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transform-origin: center center;
      will-change: transform, opacity;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
      transition: color 0.15s ease;
    }

    .giveaway-prize-display {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
    }

    .giveaway-prize-label {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .giveaway-prize-val {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
      white-space: normal;
      line-height: 1.2;
    }

    /* 🎛️ 2. OBS DOCK CONTROLLER */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pill.open {
      background: var(--primary);
      color: #000000;
    }
    .status-pill.closed {
      background: #27272a;
      color: #a1a1aa;
    }

    .status-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #e4e4e7;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .summary-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin: 0 0 10px 2px;
    }
    .summary-text b { color: #ffffff; }

    .card-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    input[type="text"] {
      background: #121215;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .chatter-list-container {
      max-height: 240px;
      overflow-y: auto;
      background: #121215;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chatter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #18181c;
      border-radius: 4px;
      border-left: 3px solid var(--primary);
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
    }

    .chatter-time {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .empty-list {
      padding: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .btn {
      background: #18181c;
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      background: #24242a;
      border-color: #3f3f46;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-toggle-entries {
      background: #18181c;
      border: 1px solid var(--border);
      color: #ffffff;
      font-weight: 800;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .btn-toggle-entries.is-open {
      background: #1e2922;
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(172, 230, 0, 0.25);
    }
    .btn-toggle-entries:hover {
      background: var(--primary);
      color: #000000;
      border-color: var(--primary);
    }

    .btn-primary-action {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 6px;
      transition: opacity 0.15s ease;
    }
    .btn-primary-action:hover:not(:disabled) { opacity: 0.9; }

    .btn-danger {
      background: #18181c;
      border: 1px solid #ff453a;
      color: #ff453a;
    }
    .btn-danger:hover:not(:disabled) {
      background: #ff453a;
      color: #ffffff;
    }

    .btn-cancel-safe {
      background: #1a1a20;
      border: 1px solid #71717a;
      color: #e4e4e7;
    }
    .btn-cancel-safe:hover:not(:disabled) {
      background: #272730;
      color: #ffffff;
      border-color: #ffffff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 📺 1. STREAM OVERLAY VIEW (#overlay) -->
  <div id="overlayRoot">
    <canvas id="victoryCanvas"></canvas>

    <div class="giveaway-widget" id="giveawayWidget">
      <!-- STATIONARY TOP ANCHOR -->
      <div class="giveaway-title-container">
        <div class="giveaway-head-title">GIVEAWAY</div>
        <div class="giveaway-sub-title" id="giveawaySubTitle">0 aktiva chattare</div>
        <div class="giveaway-timer-badge" id="giveawayHeaderTimer"></div>
      </div>
      
      <!-- CENTERED ROLLER VIEWPORT (NEVER MOVES) -->
      <div class="reel-viewport">
        <div class="reel-stage" id="reelStage"></div>
      </div>

      <!-- STATIONARY BOTTOM ANCHOR -->
      <div class="giveaway-prize-display" id="giveawayPrizeDisplay"></div>
    </div>
  </div>

  <!-- 🎛️ 2. OBS DOCK CONTROLLER (#panel) -->
  <div id="panelRoot" class="dock-container">
    <!-- HEADER: CLEANED (NO RELOAD BUTTON) -->
    <div class="header-box">
      <span class="header-title">
        GIVEAWAY KONTROLL 
        <span id="entriesStatusPill" class="status-pill closed">🔒 ANMÄLNINGAR LÅSTA</span>
      </span>
    </div>

    <!-- LIVE STATUS BOX -->
    <div class="status-box" id="dockStatusBox">Ansluter direkt till Twitch IRC...</div>
    <div class="summary-text" id="dockSummaryText"><b>0</b> aktiva chattare i dragningen</div>

    <!-- 🟢/🔒 TOGGLE ENTRIES (DEFAULT: CLOSED) -->
    <button id="btnToggleEntries" class="btn btn-toggle-entries" onclick="toggleEntriesState()">
      🔒 Anmälningar är STÄNGDA (Klicka för att öppna)
    </button>

    <!-- 👥 LISTA: AKTIVA DELTAGARE -->
    <div class="card-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="section-title" style="margin-bottom:0;">👥 Chattdeltagare (1 biljett / person)</span>
        <span id="chatterCountBadge" style="font-size:10px; font-weight:800; color:var(--primary);">0 med</span>
      </div>

      <div style="margin-bottom:6px;">
        <input type="text" id="filterChatterInput" placeholder="Sök bland deltagare..." style="width:100%;" oninput="renderChatterListUI()">
      </div>

      <div class="chatter-list-container" id="chatterListContainer">
        <div class="empty-list">Väntar på att folk skriver i Twitch chatten...</div>
      </div>
    </div>

    <div class="control-row">
      <span class="control-label">VINST / PRIS:</span>
      <input type="text" id="prizeInput" placeholder="T.ex. Signerad tröja" style="width: 60%; text-align: right;">
    </div>

    <button class="btn btn-danger" onclick="resetAllChatters()" style="margin-top: 4px;">
      🧹 Rensa deltagarlistan inför nästa giveaway
    </button>

    <button class="btn-primary-action" id="btnStart" onclick="startDraw(10000)">
      Starta dragning (10s)
    </button>
    <button class="btn" id="btnSkip" onclick="startDraw(5000)">
      Dra ny vinnare (5s)
    </button>
    
    <div class="grid-2" style="margin-top: 4px;">
      <button class="btn btn-danger" id="btnClose" onclick="claimPrizeAndClose()">
        🏆 Avsluta giveaway (Vinst utdelad)
      </button>
      <button class="btn btn-cancel-safe" id="btnCancel" onclick="cancelWithoutTicket()">
        ❌ Avbryt och stäng
      </button>
    </div>
  </div>

  <script>
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    const WRITE_SECRET = "Our2ndHomeSecret2026!";
    const STORAGE_KEY_CHATTERS = "mh_overlay_chatters";
    const STORAGE_KEY_PRIZE = "mh_overlay_prize_text";
    const STORAGE_KEY_ENTRIES_OPEN = "mh_giveaway_entries_open";

    const TWITCH_CHANNEL = "our2ndhome";

    const EMOTES_FOLDER = "emotes";
    const CUSTOM_EMOTE_FILES = [
      "Favicon-very-new.png",
      "Our2ndHome-EmoteHype-500x500.png",
      "Our2ndHome-EmoteLove-500x500.png",
      "Our2ndHome-EmoteWoop-500x500.png",
      "Our2ndHome-IconLogo-512x512x.png",
      "SillySanta.png",
      "dfgdfgd-removebg-preview.png",
      "evighets-removebg-preview.png",
      "nordpuls-storlogo-smaller.png"
    ];

    const bus = ("BroadcastChannel" in window) ? new BroadcastChannel("mh_giveaway_bus") : null;
    const VICTORY_SOUND_SRC = "https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3";

    try {
      localStorage.removeItem("mh_overlay_donor_tickets");
    } catch(e) {}

    let chatterMap = {};
    // DEFAULT IS NOW CLOSED (The streamer must open it manually)
    let areEntriesOpen = false;
    let currentWinner = null;
    let isSpinning = false;
    let isTwitchConnected = false;
    let lastChatMessageSummary = "";
    let winnerHasResponded = false;

    let currentVirtualOffset = 2.0;
    let trackNamesList = [];

    let holdTimeout = null;
    let countdownInterval = null;
    let claimTimerInterval = null;
    let animFrameId = null;

    let lastTickIndex = null;
    let lastTickTime = 0;
    let lastProcessedActionId = 0;
    let isInitialActionLoad = true;

    let loadedEmoteImages = [];
    let celebrationParticles = [];
    let celebrationAnimId = null;

    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    if (isPanel) {
      document.body.classList.add('mode-panel');
    } else {
      document.body.classList.add('mode-overlay');
    }

    const giveawayWidget = document.getElementById('giveawayWidget');
    const giveawaySubTitle = document.getElementById('giveawaySubTitle');
    const giveawayTimerBadge = document.getElementById('giveawayHeaderTimer');
    const giveawayPrizeDisplay = document.getElementById('giveawayPrizeDisplay');
    const prizeInput = document.getElementById('prizeInput');
    const reelStage = document.getElementById('reelStage');
    const victoryCanvas = document.getElementById('victoryCanvas');
    const vCtx = victoryCanvas ? victoryCanvas.getContext('2d') : null;

    const btnStart = document.getElementById('btnStart');
    const btnSkip = document.getElementById('btnSkip');

    function resizeCanvas() {
      if (victoryCanvas && !isPanel) {
        victoryCanvas.width = window.innerWidth;
        victoryCanvas.height = window.innerHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const dbChattersRef = firebase.database().ref('giveaway_chatters');
    const dbActionRef = firebase.database().ref('giveaway_action');

    firebase.database().ref('giveaway_donors').remove().catch(() => {});

    function preloadEmoteImages() {
      loadedEmoteImages = [];
      CUSTOM_EMOTE_FILES.forEach(filename => {
        const img = new Image();
        img.src = `${EMOTES_FOLDER}/${encodeURIComponent(filename)}`;
        img.onload = () => {
          loadedEmoteImages.push(img);
          updateStatsUI();
        };
      });
    }
    preloadEmoteImages();

    // ========================================================
    // 💬 1. NATIVE TWITCH IRC WEBSOCKET
    // ========================================================
    let twitchSocket = null;

    function normalizeUserKey(name) {
      return (name || '').replace(/^@+/, '').trim().toLowerCase();
    }

    function connectNativeTwitchIRC() {
      try {
        if (twitchSocket) {
          try { twitchSocket.close(); } catch(e) {}
        }

        updateDockStatus(`Ansluter till Twitch IRC (#${TWITCH_CHANNEL})...`);

        twitchSocket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        twitchSocket.onopen = () => {
          isTwitchConnected = true;
          twitchSocket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
          twitchSocket.send(`PASS SCHMOOPIIE`);
          twitchSocket.send(`NICK justinfan${Math.floor(Math.random() * 80000 + 1000)}`);
          twitchSocket.send(`JOIN #${TWITCH_CHANNEL.toLowerCase().replace('#', '')}`);

          updateDockStatus(`🟢 Ansluten till Twitch (#${TWITCH_CHANNEL})! Redo att ta emot meddelanden.`);
        };

        twitchSocket.onmessage = (event) => {
          const raw = event.data || '';
          const lines = raw.split('\r\n');

          for (const line of lines) {
            if (!line) continue;

            if (line.startsWith('PING')) {
              twitchSocket.send('PONG :tmi.twitch.tv');
              continue;
            }

            if (line.includes('PRIVMSG')) {
              parseTwitchChatMessage(line);
            }
          }
        };

        twitchSocket.onerror = () => {
          isTwitchConnected = false;
          updateDockStatus(`⚠️ WebSocket fel mot Twitch. Försöker igen...`, true);
        };

        twitchSocket.onclose = () => {
          isTwitchConnected = false;
          updateDockStatus(`⚪ Frånkopplad från Twitch. Återansluter om 3s...`, true);
          setTimeout(connectNativeTwitchIRC, 3000);
        };
      } catch (e) {
        isTwitchConnected = false;
        updateDockStatus(`❌ Chat fel: ${e.message}`, true);
      }
    }

    function parseTwitchChatMessage(line) {
      try {
        let displayName = "";

        const nameMatch = line.match(/[;@]display-name=([^; ]+)/);
        if (nameMatch && nameMatch[1]) {
          displayName = nameMatch[1];
        } else {
          const nickMatch = line.match(/:([^!@ ]+)!/);
          if (nickMatch && nickMatch[1]) displayName = nickMatch[1];
        }

        const privIndex = line.indexOf(' PRIVMSG ');
        if (privIndex === -1) return;

        const colonIndex = line.indexOf(' :', privIndex);
        let messageText = "";
        if (colonIndex !== -1) {
          messageText = line.substring(colonIndex + 2).trim();
        }

        if (displayName) {
          lastChatMessageSummary = `@${displayName}: "${messageText.length > 25 ? messageText.substring(0, 25) + '...' : messageText}"`;
          updateDockStatus(`🟢 Chatt aktiv: ${lastChatMessageSummary}`);

          handleIncomingChatMessage(displayName, messageText);
        }
      } catch (e) {}
    }

    function handleIncomingChatMessage(username, message) {
      const userKey = normalizeUserKey(username);

      if (areEntriesOpen) {
        if (!chatterMap[userKey]) {
          chatterMap[userKey] = {
            displayName: username,
            time: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })
          };
          saveChatters();
          updateStatsUI();
          syncChattersToCloud();
        }
      }

      // ONLY RECORD FIRST MESSAGE AFTER WIN: prevents subsequent spam
      if (currentWinner && normalizeUserKey(currentWinner) === userKey) {
        if (!winnerHasResponded) {
          displayWinnerChatResponse(username, message, true);
        }
      }
    }

    /* UNIFIED WINNER CHAT RESPONSE: CAPPED TO 28 CHARS & ALWAYS INCLUDES CLOSING QUOTE */
    function displayWinnerChatResponse(username, message, broadcast = true) {
      winnerHasResponded = true;

      let rawMsg = (message || '').trim();
      let formattedMsg = "";
      if (rawMsg.length > 28) {
        formattedMsg = `"${rawMsg.substring(0, 28).trim()}..."`;
      } else {
        formattedMsg = `"${rawMsg}"`;
      }

      if (giveawayTimerBadge) {
        giveawayTimerBadge.innerHTML = `
          <div class="winner-response-header"><span class="timer-val">${escapeHTML(username)}</span> har svarat:</div>
          <div class="winner-response-msg">${escapeHTML(formattedMsg)}</div>
        `;
      }

      if (claimTimerInterval) {
        clearInterval(claimTimerInterval);
        claimTimerInterval = null;
      }

      if (broadcast) {
        const actionId = Date.now();
        dbActionRef.set({
          type: 'WINNER_CHATTED',
          winner: username,
          message: rawMsg,
          actionId: actionId,
          secret: WRITE_SECRET
        }).catch(() => {});

        if (bus) {
          bus.postMessage({
            type: 'WINNER_CHATTED',
            payload: { winner: username, message: rawMsg, actionId: actionId }
          });
        }
      }
    }

    function getChattersPool() {
      return Object.values(chatterMap).map(c => c.displayName);
    }

    function saveChatters() {
      try {
        localStorage.setItem(STORAGE_KEY_CHATTERS, JSON.stringify(chatterMap));
      } catch (e) {}
    }

    function loadChatters() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_CHATTERS);
        if (saved) chatterMap = JSON.parse(saved);

        const savedPrize = localStorage.getItem(STORAGE_KEY_PRIZE);
        if (savedPrize !== null) setPrizeText(savedPrize, false);

        // ALWAYS DEFAULT TO CLOSED ON FRESH BOOT
        areEntriesOpen = false;
      } catch (e) {}

      updateEntriesUI();
      updateStatsUI();
      initInitialStage();
    }

    function syncChattersToCloud() {
      dbChattersRef.set({
        map: chatterMap,
        areEntriesOpen: areEntriesOpen,
        secret: WRITE_SECRET,
        timestamp: Date.now()
      }).catch(() => {});
    }

    dbChattersRef.on('value', (snap) => {
      const data = snap.val();
      if (data && data.map && !isSpinning) {
        chatterMap = data.map;
        if (typeof data.areEntriesOpen === 'boolean') areEntriesOpen = data.areEntriesOpen;
        saveChatters();
        updateEntriesUI();
        updateStatsUI();
        if (trackNamesList.length === 0) initInitialStage();
      }
    });

    dbActionRef.on('value', (snap) => {
      const act = snap.val();
      if (!act) return;

      if (isInitialActionLoad) {
        lastProcessedActionId = act.actionId || act.timestamp || 0;
        isInitialActionLoad = false;
        return;
      }

      if (act.type === 'START_SPIN' && act.actionId && act.actionId !== lastProcessedActionId) {
        lastProcessedActionId = act.actionId;
        executeSpin(act.winner, act.delayMs || 10000, act.spinDistance || 75);
      } else if (act.type === 'WINNER_CHATTED' && act.actionId && act.actionId !== lastProcessedActionId) {
        lastProcessedActionId = act.actionId;
        displayWinnerChatResponse(act.winner, act.message, false);
      } else if (act.type === 'CLAIM_CLOSE' && act.actionId && act.actionId !== lastProcessedActionId) {
        lastProcessedActionId = act.actionId;
        finalizeClaimAndHide();
      } else if (act.type === 'CANCEL_CLOSE' && act.actionId && act.actionId !== lastProcessedActionId) {
        lastProcessedActionId = act.actionId;
        finalizeCancelAndHide();
      } else if (act.type === 'RESET') {
        chatterMap = {};
        currentWinner = null;
        winnerHasResponded = false;
        finalizeClaimAndHide();
        updateStatsUI();
      } else if (act.type === 'UPDATE_PRIZE') {
        setPrizeText(act.prize, false);
      } else if (act.type === 'TOGGLE_ENTRIES') {
        areEntriesOpen = act.open;
        updateEntriesUI();
      }
    });

    if (bus) {
      bus.onmessage = (e) => {
        const { type, payload } = e.data || {};
        if (type === 'START_SPIN' && payload.actionId !== lastProcessedActionId) {
          lastProcessedActionId = payload.actionId;
          executeSpin(payload.winner, payload.delayMs, payload.spinDistance);
        }
        if (type === 'WINNER_CHATTED' && payload.actionId !== lastProcessedActionId) {
          lastProcessedActionId = payload.actionId;
          displayWinnerChatResponse(payload.winner, payload.message, false);
        }
        if (type === 'CLAIM_CLOSE' && payload.actionId !== lastProcessedActionId) {
          lastProcessedActionId = payload.actionId;
          finalizeClaimAndHide();
        }
        if (type === 'CANCEL_CLOSE' && payload.actionId !== lastProcessedActionId) {
          lastProcessedActionId = payload.actionId;
          finalizeCancelAndHide();
        }
        if (type === 'RESET') {
          chatterMap = {};
          currentWinner = null;
          winnerHasResponded = false;
          finalizeClaimAndHide();
          updateStatsUI();
        }
        if (type === 'UPDATE_PRIZE') setPrizeText(payload.prize, false);
        if (type === 'TOGGLE_ENTRIES') {
          areEntriesOpen = payload.open;
          updateEntriesUI();
        }
      };
    }

    function toggleEntriesState() {
      areEntriesOpen = !areEntriesOpen;
      try {
        localStorage.setItem(STORAGE_KEY_ENTRIES_OPEN, areEntriesOpen ? 'true' : 'false');
      } catch (e) {}

      updateEntriesUI();
      syncChattersToCloud();

      dbActionRef.set({
        type: 'TOGGLE_ENTRIES',
        open: areEntriesOpen,
        secret: WRITE_SECRET,
        timestamp: Date.now()
      }).catch(() => {});

      if (bus) bus.postMessage({ type: 'TOGGLE_ENTRIES', payload: { open: areEntriesOpen } });
    }

    function updateEntriesUI() {
      const btn = document.getElementById('btnToggleEntries');
      const pill = document.getElementById('entriesStatusPill');

      if (btn) {
        if (areEntriesOpen) {
          btn.innerText = "🟢 Anmälningar är ÖPPNA (Alla som skriver registreras)";
          btn.classList.add('is-open');
        } else {
          btn.innerText = "🔒 Anmälningar är STÄNGDA (Klicka för att öppna)";
          btn.classList.remove('is-open');
        }
      }

      if (pill) {
        if (areEntriesOpen) {
          pill.innerText = "🟢 ANMÄLNINGAR ÖPPNA";
          pill.className = "status-pill open";
        } else {
          pill.innerText = "🔒 ANMÄLNINGAR LÅSTA";
          pill.className = "status-pill closed";
        }
      }
    }

    function renderChatterListUI() {
      const container = document.getElementById('chatterListContainer');
      const countBadge = document.getElementById('chatterCountBadge');
      if (!container) return;

      const filterInput = document.getElementById('filterChatterInput');
      const query = filterInput ? filterInput.value.trim().toLowerCase() : '';

      const list = Object.values(chatterMap);

      if (countBadge) {
        countBadge.innerText = `${list.length} med`;
      }

      const filtered = list.filter(c => {
        if (!query) return true;
        return (c.displayName || '').toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        container.innerHTML = query
          ? `<div class="empty-list">Ingen deltagare matchar "${escapeHTML(query)}"</div>`
          : `<div class="empty-list">Väntar på att folk skriver i Twitch chatten...</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="chatter-row">
          <span>${escapeHTML(c.displayName)}</span>
          <span class="chatter-time">${c.time || 'Aktiv'}</span>
        </div>
      `).join('');
    }

    function setPrizeText(text, broadcast = true) {
      const clean = (text || '').trim();
      if (clean) {
        giveawayPrizeDisplay.innerHTML = `
          <span class="giveaway-prize-label">VINST:</span>
          <span class="giveaway-prize-val">${escapeHTML(clean)}</span>
        `;
      } else {
        giveawayPrizeDisplay.innerHTML = '';
      }

      if (prizeInput) prizeInput.value = clean;
      try {
        localStorage.setItem(STORAGE_KEY_PRIZE, clean);
      } catch (e) {}

      if (broadcast) {
        dbActionRef.set({ type: 'UPDATE_PRIZE', prize: clean, secret: WRITE_SECRET });
        if (bus) bus.postMessage({ type: 'UPDATE_PRIZE', payload: { prize: clean } });
      }
    }

    if (prizeInput) {
      prizeInput.addEventListener('input', () => setPrizeText(prizeInput.value, true));
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWheelClick(speedRatio = 1.0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;

        const pitch = Math.max(0.75, Math.min(1.4, 0.8 + speedRatio * 0.4));
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.016);

        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.016);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.018);
      } catch (e) {}
    }

    function playVictorySound() {
      getAudioContext();
      try {
        const audio = new Audio(VICTORY_SOUND_SRC);
        audio.volume = 0.55;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function getSlotPhysicalMetrics(d) {
      const absD = Math.abs(d);
      const sign = d < 0 ? -1 : 1;

      let yOffset = 0;
      let scale = 1.20;
      let opacity = 1.0;
      let fontWeight = '900';

      if (absD <= 1.0) {
        const t = absD;
        yOffset = sign * (54 * t);
        scale = 1.20 - (1.20 - 0.86) * t;
        opacity = 1.0 - (1.0 - 0.60) * t;
        fontWeight = absD < 0.25 ? '900' : '800';
      } else if (absD <= 2.0) {
        const t = absD - 1.0;
        yOffset = sign * (54 + 46 * t);
        scale = 0.86 - (0.86 - 0.62) * t;
        opacity = 0.60 - (0.60 - 0.22) * t;
        fontWeight = '700';
      } else {
        const t = Math.min(1.0, absD - 2.0);
        yOffset = sign * (100 + 40 * t);
        scale = 0.62 - (0.62 - 0.45) * t;
        opacity = Math.max(0, 0.22 - 0.22 * t);
        fontWeight = '600';
      }

      return {
        top: 140 + yOffset,
        scale: scale,
        opacity: opacity,
        fontWeight: fontWeight
      };
    }

    function renderVirtualSlots(virtualOffset) {
      if (trackNamesList.length === 0) return;

      const centerIndex = Math.round(virtualOffset);
      const minIndex = Math.max(0, centerIndex - 3);
      const maxIndex = Math.min(trackNamesList.length - 1, centerIndex + 3);

      let html = '';
      for (let i = minIndex; i <= maxIndex; i++) {
        const d = i - virtualOffset;
        const m = getSlotPhysicalMetrics(d);

        if (m.opacity > 0.01) {
          const isCenter = Math.abs(d) < 0.35;
          const itemColor = isCenter ? 'var(--primary)' : '#ffffff';
          const transform = `translateY(-50%) scale(${m.scale.toFixed(3)})`;
          const style = `top: ${m.top.toFixed(1)}px; transform: ${transform}; opacity: ${m.opacity.toFixed(3)}; font-weight: ${m.fontWeight}; font-size: 26px; color: ${itemColor}; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);`;
          html += `<div class="slot-item" style="${style}">${escapeHTML(trackNamesList[i])}</div>`;
        }
      }

      reelStage.innerHTML = html;
    }

    function initInitialStage() {
      const names = getChattersPool();
      trackNamesList = [];

      if (names.length === 0) {
        trackNamesList = ["Väntar på chatten...", "Skriv i chatten...", "Väntar på chatten...", "Skriv i chatten...", "Väntar på chatten..."];
      } else {
        for (let i = 0; i < 7; i++) {
          trackNamesList.push(names[i % names.length]);
        }
      }

      currentVirtualOffset = 2.0;
      renderVirtualSlots(currentVirtualOffset);
    }

    function stopTimers() {
      if (holdTimeout) clearTimeout(holdTimeout);
      if (countdownInterval) clearInterval(countdownInterval);
      if (claimTimerInterval) clearInterval(claimTimerInterval);
      if (animFrameId) cancelAnimationFrame(animFrameId);
      holdTimeout = null;
      countdownInterval = null;
      claimTimerInterval = null;
      animFrameId = null;
    }

    function startDraw(holdDelayMs = 10000) {
      const pool = getChattersPool();
      if (pool.length === 0) return alert("Inga aktiva chattare i listan än! Låt folk skriva i chatten först.");

      getAudioContext();
      const winner = pool[Math.floor(Math.random() * pool.length)];
      const spinDistance = (holdDelayMs <= 5000) ? 45 : 75;
      const actionId = Date.now();
      lastProcessedActionId = actionId;

      dbActionRef.set({
        type: 'START_SPIN',
        winner: winner,
        delayMs: holdDelayMs,
        spinDistance: spinDistance,
        actionId: actionId,
        secret: WRITE_SECRET,
        timestamp: actionId
      });

      if (bus) bus.postMessage({ type: 'START_SPIN', payload: { winner, delayMs: holdDelayMs, spinDistance, actionId } });

      executeSpin(winner, holdDelayMs, spinDistance);
    }

    function executeSpin(winnerName, holdDelayMs = 10000, spinDistance = 75) {
      getAudioContext();
      stopTimers();
      clearCelebrationEffects();

      winnerHasResponded = false;
      isSpinning = true;
      currentWinner = winnerName;
      setButtonsLocked(true);

      giveawayWidget.classList.add('active');

      const names = getChattersPool();
      const startOffset = currentVirtualOffset;
      const targetOffset = Math.round(startOffset) + spinDistance;
      const totalTrackNeeded = targetOffset + 6;

      const pickDifferent = (notThis) => {
        if (names.length <= 1) return names[0] || winnerName;
        let chosen;
        do {
          chosen = names[Math.floor(Math.random() * names.length)];
        } while (chosen === notThis);
        return chosen;
      };

      let lastAdded = trackNamesList[trackNamesList.length - 1] || "";
      while (trackNamesList.length < totalTrackNeeded) {
        const nextIdx = trackNamesList.length;
        let name = (nextIdx === targetOffset) ? winnerName : pickDifferent(lastAdded);
        trackNamesList.push(name);
        lastAdded = name;
      }

      const endAt = Date.now() + holdDelayMs;
      const tickBadge = () => {
        const leftSec = Math.ceil(Math.max(0, endAt - Date.now()) / 1000);
        giveawayTimerBadge.innerHTML = leftSec > 0 ? `Startar om <span class="timer-val">${leftSec}s</span>` : "Dragning pågår...";
      };
      tickBadge();

      countdownInterval = setInterval(() => {
        tickBadge();
        if (Date.now() >= endAt) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }, 200);

      holdTimeout = setTimeout(() => {
        giveawayTimerBadge.innerText = "Dragning pågår...";

        const spinDuration = holdDelayMs <= 5000 ? 5500 : 8500;
        const startTime = performance.now();
        lastTickIndex = Math.floor(startOffset);

        function spinStep(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1.0, elapsed / spinDuration);

          const ease = 1 - Math.pow(1 - progress, 4.5);
          currentVirtualOffset = startOffset + (targetOffset - startOffset) * ease;

          renderVirtualSlots(currentVirtualOffset);

          const currentItemIdx = Math.floor(currentVirtualOffset);
          if (currentItemIdx !== lastTickIndex && (now - lastTickTime) > 16) {
            const speed = (1 - progress);
            playWheelClick(speed);
            lastTickIndex = currentItemIdx;
            lastTickTime = now;
          }

          if (progress < 1.0) {
            animFrameId = requestAnimationFrame(spinStep);
          } else {
            currentVirtualOffset = targetOffset;
            renderVirtualSlots(currentVirtualOffset);

            isSpinning = false;
            setButtonsLocked(false);
            stopTimers();

            let claimSec = 60;
            giveawayTimerBadge.innerHTML = `Skriv i chatten för att bekräfta! <span class="timer-val">${claimSec}s</span>`;

            claimTimerInterval = setInterval(() => {
              claimSec--;
              if (claimSec > 0) {
                if (!winnerHasResponded) {
                  giveawayTimerBadge.innerHTML = `Skriv i chatten för att bekräfta! <span class="timer-val">${claimSec}s</span>`;
                }
              } else {
                if (!winnerHasResponded) {
                  giveawayTimerBadge.innerText = "Tiden har gått ut!";
                }
                clearInterval(claimTimerInterval);
                claimTimerInterval = null;
              }
            }, 1000);

            triggerCelebrationBurst();
          }
        }

        animFrameId = requestAnimationFrame(spinStep);
      }, holdDelayMs);
    }

    function claimPrizeAndClose() {
      if (isSpinning) return;
      if (!currentWinner) return alert("Ingen vinnare dragen än!");

      const actionId = Date.now();
      lastProcessedActionId = actionId;

      dbActionRef.set({ type: 'CLAIM_CLOSE', actionId: actionId, secret: WRITE_SECRET, timestamp: actionId });
      if (bus) bus.postMessage({ type: 'CLAIM_CLOSE', payload: { actionId } });

      finalizeClaimAndHide();
    }

    function cancelWithoutTicket() {
      const actionId = Date.now();
      lastProcessedActionId = actionId;

      dbActionRef.set({ type: 'CANCEL_CLOSE', actionId: actionId, secret: WRITE_SECRET, timestamp: actionId });
      if (bus) bus.postMessage({ type: 'CANCEL_CLOSE', payload: { actionId } });

      finalizeCancelAndHide();
    }

    function finalizeClaimAndHide() {
      stopTimers();
      clearCelebrationEffects();
      isSpinning = false;
      setButtonsLocked(false);
      winnerHasResponded = false;

      giveawayWidget.classList.remove('active');

      setTimeout(() => {
        currentWinner = null;
        giveawayTimerBadge.innerHTML = "";
        initInitialStage();
      }, 450);
    }

    function finalizeCancelAndHide() {
      stopTimers();
      clearCelebrationEffects();
      isSpinning = false;
      setButtonsLocked(false);
      winnerHasResponded = false;

      giveawayWidget.classList.remove('active');

      setTimeout(() => {
        currentWinner = null;
        giveawayTimerBadge.innerHTML = "";
        initInitialStage();
      }, 450);
    }

    function triggerCelebrationBurst() {
      if (isPanel) return;
      playVictorySound();
      celebrationParticles = [];

      const FALLBACK_EMOJIS = ['👑', '🎉', '🎁', '✨', '❤️', '🔥', '🏆', '⭐'];
      const W = window.innerWidth;
      const H = window.innerHeight;
      const cX = W / 2;
      const cY = H / 2;

      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 12 + Math.random() * 18;
        const hasImages = loadedEmoteImages.length > 0;
        const imgObj = hasImages ? loadedEmoteImages[Math.floor(Math.random() * loadedEmoteImages.length)] : null;
        const fallbackChar = FALLBACK_EMOJIS[Math.floor(Math.random() * FALLBACK_EMOJIS.length)];

        celebrationParticles.push({
          x: cX, y: cY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          gravity: 0.32,
          drag: 0.94,
          size: 46 + Math.random() * 22,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8,
          opacity: 1.0,
          img: imgObj,
          char: fallbackChar,
          sway: Math.random() * 10,
          swaySpeed: 0.04 + Math.random() * 0.04
        });
      }

      for (let i = 0; i < 75; i++) {
        const hasImages = loadedEmoteImages.length > 0;
        const imgObj = hasImages ? loadedEmoteImages[Math.floor(Math.random() * loadedEmoteImages.length)] : null;
        const fallbackChar = FALLBACK_EMOJIS[Math.floor(Math.random() * FALLBACK_EMOJIS.length)];

        celebrationParticles.push({
          x: Math.random() * W,
          y: -60 - Math.random() * (H * 0.8),
          vx: (Math.random() - 0.5) * 2.2,
          vy: 3.8 + Math.random() * 5.2,
          gravity: 0.12,
          drag: 0.99,
          size: 42 + Math.random() * 20,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 5,
          opacity: 1.0,
          img: imgObj,
          char: fallbackChar,
          sway: Math.random() * 10,
          swaySpeed: 0.03 + Math.random() * 0.03
        });
      }

      if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);
      animateCelebration();
    }

    function animateCelebration() {
      if (isPanel || !vCtx || !victoryCanvas) return;
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
      let aliveCount = 0;

      for (let p of celebrationParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.rotation += p.rotSpeed;

        p.sway += p.swaySpeed;
        p.x += Math.sin(p.sway) * 1.6;

        if (p.y > window.innerHeight * 0.74) {
          p.opacity -= 0.014;
        }

        if (p.opacity > 0.02 && p.y < window.innerHeight + 90) {
          aliveCount++;
          vCtx.save();
          vCtx.translate(p.x, p.y);
          vCtx.rotate((p.rotation * Math.PI) / 180);
          vCtx.globalAlpha = Math.max(0, Math.min(1, p.opacity));

          if (p.img && p.img.complete && p.img.naturalWidth > 0) {
            vCtx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
          } else {
            vCtx.font = `${Math.round(p.size)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            vCtx.textAlign = 'center';
            vCtx.textBaseline = 'middle';
            vCtx.fillText(p.char, 0, 0);
          }

          vCtx.restore();
        }
      }

      if (aliveCount > 0) {
        celebrationAnimId = requestAnimationFrame(animateCelebration);
      } else {
        vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
        celebrationAnimId = null;
      }
    }

    function clearCelebrationEffects() {
      if (celebrationAnimId) {
        cancelAnimationFrame(celebrationAnimId);
        celebrationAnimId = null;
      }
      if (vCtx && victoryCanvas) {
        vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
      }
    }

    // ========================================================
    // 🎛️ DOCK UI
    // ========================================================
    function updateStatsUI() {
      const count = Object.keys(chatterMap).length;

      const summaryText = document.getElementById('dockSummaryText');
      if (summaryText) {
        summaryText.innerHTML = `<b>${count}</b> aktiva chattare i dragningen`;
      }

      if (giveawaySubTitle) {
        giveawaySubTitle.innerText = `${count} aktiva chattare`;
      }

      renderChatterListUI();
    }

    function updateDockStatus(msg, isError = false) {
      const statusBox = document.getElementById('dockStatusBox');
      if (statusBox) {
        statusBox.innerText = msg;
        statusBox.style.color = isError ? "#ff453a" : "#00ff88";
      }
    }

    function setButtonsLocked(locked) {
      if (btnStart) btnStart.disabled = locked;
      if (btnSkip) btnSkip.disabled = locked;
    }

    function resetAllChatters() {
      if (confirm("Är du säker på att du vill rensa deltagarlistan inför nästa giveaway?")) {
        chatterMap = {};
        currentWinner = null;
        winnerHasResponded = false;
        areEntriesOpen = false; // Lock entries on list clear
        updateEntriesUI();
        saveChatters();
        syncChattersToCloud();

        dbActionRef.set({ type: 'RESET', actionId: Date.now(), secret: WRITE_SECRET }).catch(() => {});
        if (bus) bus.postMessage({ type: 'RESET' });

        updateStatsUI();
        initInitialStage();
      }
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, t => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[t] || t));
    }

    loadChatters();
    initInitialStage();
    connectNativeTwitchIRC();
  </script>
