<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Giveaway Wheel Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600;
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --danger-color: #ff0055;
      --text-white: #ffffff;
      --bg-dark: rgba(10, 10, 12, 0.95);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --item-height: 43px;
      --viewport-height: 215px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-white);
      user-select: none;
    }

    /* 🎆 FULLSCREEN VICTORY EFFECTS */
    #victoryCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99992;
    }

    .victory-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99991;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(172, 230, 0, 0.55) 0%, rgba(255, 234, 0, 0.25) 45%, transparent 75%);
    }

    .victory-flash.active {
      animation: victoryPulse 1.4s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes victoryPulse {
      0% { opacity: 0; transform: scale(0.92); }
      20% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      width: 350px;
      font-size: 12px;
      box-shadow: 0 10px 30px var(--shadow-dark);
      backdrop-filter: blur(8px);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: grab;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-panel h4:active { cursor: grabbing; }

    .widget-version-badge {
      font-size: 9px;
      background: var(--secondary-color);
      color: #000;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 900;
    }

    .panel-stats {
      font-size: 11px;
      color: var(--primary-color);
      margin: 6px 0;
    }

    .panel-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .control-row label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
    }

    .control-row input, .control-row textarea, .control-row select {
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    .control-row input:focus, .control-row textarea:focus, .control-row select:focus {
      border-color: var(--secondary-color);
      outline: none;
    }

    .mode-indicator {
      font-size: 10px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 4px;
    }

    .mode-indicator.real-mode {
      background: rgba(0, 255, 136, 0.15);
      color: var(--secondary-color);
      border: 1px solid var(--secondary-color);
    }

    .mode-indicator.test-mode {
      background: rgba(255, 234, 0, 0.15);
      color: var(--giveaway-color);
      border: 1px solid var(--giveaway-color);
    }

    .quick-presets {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn {
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      font-family: inherit;
      transition: opacity 0.2s ease, transform 0.1s ease;
      text-align: center;
    }

    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-lime { background: var(--primary-color); color: #000; }
    .btn-yellow { background: var(--giveaway-color); color: #000; }
    .btn-red { background: var(--danger-color); color: #fff; }
    .btn-green { background: var(--secondary-color); color: #000; }
    .btn-small { padding: 4px 8px; font-size: 9px; }

    /* 🎁 GIVEAWAY REEL WIDGET */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 620px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.4s ease;
    }

    .giveaway-widget.faded-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 12px;
    }

    .giveaway-head-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      text-shadow: 0 2px 12px var(--shadow-dark);
    }

    .giveaway-sub-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      opacity: 0.9;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ✨ CLEAN BORDERLESS COUNTDOWN TEXT */
    .giveaway-timer-badge {
      display: block;
      margin-top: 8px;
      color: var(--primary-color);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(172, 230, 0, 0.8), 0 2px 5px rgba(0, 0, 0, 0.9);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .giveaway-timer-badge.winner-drawn {
      color: var(--giveaway-color);
      text-shadow: 0 0 25px rgba(255, 234, 0, 1), 0 2px 6px rgba(0, 0, 0, 0.9);
      animation: pulseText 0.8s infinite alternate;
    }

    @keyframes pulseText {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .reel-viewport {
      position: relative;
      width: 100%;
      height: var(--viewport-height);
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.5) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.5) 80%,
        rgba(0, 0, 0, 0.05) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.5) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.5) 80%,
        rgba(0, 0, 0, 0.05) 100%
      );
    }

    .reel-viewport::before, 
    .reel-viewport::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary-color) 20%, var(--primary-color) 80%, transparent 100%);
      box-shadow: 0 0 14px rgba(172, 230, 0, 0.8);
      z-index: 10;
    }

    .reel-viewport::before { top: 86px; }  
    .reel-viewport::after  { top: 129px; } 

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      white-space: nowrap;
      color: #ffffff;
      transform-origin: center center;
      will-change: transform, opacity;
      transition: color 0.3s ease;
    }

    .reel-item.is-winner {
      color: var(--giveaway-color) !important;
      text-shadow: 0 0 25px rgba(255, 234, 0, 1) !important;
    }
  </style>
</head>
<body>

  <!-- FULLSCREEN VICTORY EFFECTS -->
  <div class="victory-flash" id="victoryFlash"></div>
  <canvas id="victoryCanvas"></canvas>

  <!-- CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">
      <span>🎁 GIVEAWAY CONTROL <span class="widget-version-badge">v3.7</span></span>
      <span style="font-size: 9px; opacity: 0.7;">DRAG ME</span>
    </h4>
    
    <div id="modeIndicator" class="mode-indicator real-mode">🟢 LÄGE: RIKTIGA BÖSSAN</div>
    <div class="panel-stats" id="giveawayStats">Biljetter: <b>0</b> | Givare: <b>0</b></div>

    <div class="panel-controls">
      <!-- SOUND SETTINGS -->
      <div class="control-row">
        <label for="soundPresetSelect">🔊 Vinnarljud:</label>
        <select id="soundPresetSelect" style="width: 175px;">
          <option value="hype_win">🏆 Level Up / Gold Victory</option>
          <option value="jackpot">🎰 Casino Jackpot Fanfare</option>
          <option value="fanfare">🎺 Stadium Victory Brass</option>
          <option value="custom">📁 Eget ljud (URL / Fil)</option>
        </select>
      </div>
      <div id="customSoundContainer" style="display: none;" class="control-row">
        <input type="text" id="customSoundUrl" placeholder="Filnamn (winner.mp3) eller URL" style="width: 100%;">
      </div>
      <button id="btnTestSound" class="btn btn-green btn-small" style="width: 100%;">▶️ Testa vinnarljud</button>

      <!-- REAL BÖSSA INTEGRATION -->
      <div class="control-row" style="margin-top: 4px;">
        <label for="bossaSlugInput">Bössa ID:</label>
        <input type="text" id="bossaSlugInput" value="our2ndhome" placeholder="our2ndhome" style="width: 140px;">
      </div>
      <button id="btnFetchBossa" class="btn btn-green btn-small" style="width: 100%;">🔄 Hämta från Bössan (Nätverk)</button>

      <button id="btnTogglePaste" class="btn btn-yellow btn-small" style="width: 100%;">📋 Klistra in text från Bössan</button>
      <div id="pasteContainer" style="display: none; flex-direction: column; gap: 4px;">
        <textarea id="pasteTextArea" rows="3" placeholder="Klistra in text här (t.ex: greger gav 400 kr)" style="width: 100%; font-size: 10px;"></textarea>
        <button id="btnImportPaste" class="btn btn-lime btn-small">Importera Text</button>
      </div>

      <div class="control-row" style="margin-top: 4px;">
        <input type="text" id="manualNameInput" placeholder="Namn" style="flex:2;">
        <input type="number" id="manualAmountInput" placeholder="Kr" style="flex:1; width:50px;">
        <button id="btnAddManual" class="btn btn-lime btn-small">+ Lägg till</button>
      </div>

      <div class="control-row" style="margin-top: 4px;">
        <button id="btnSwitchTest" class="btn btn-yellow btn-small" style="width: 100%;">🎲 Växla till Testläge</button>
      </div>

      <div id="testControlsContainer" style="display: none; flex-direction: column; gap: 6px;">
        <div class="control-row">
          <label for="targetTicketCount">Totalt biljetter:</label>
          <input type="number" id="targetTicketCount" value="250" min="1" style="width: 65px;">
        </div>
        <div class="control-row">
          <label for="maxTicketsPerUser">Max per person:</label>
          <input type="number" id="maxTicketsPerUser" value="5" min="1" style="width: 65px;">
        </div>
        <div class="quick-presets">
          <span style="font-size: 9px; color: #aaa; align-self: center;">Sätt:</span>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(50)">50</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(100)">100</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(250)">250</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(500)">500</button>
        </div>
      </div>

      <button id="btnResetZero" class="btn btn-red btn-small" style="margin-top: 4px;">🗑️ Nollställ allt till 0</button>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="panel-actions">
      <button id="btnStart" class="btn btn-lime">▶️ Starta Giveaway (10s)</button>
      <button id="btnSkip" class="btn btn-yellow">⏭️ Skip / Reroll (5s)</button>
      <button id="btnClose" class="btn btn-red">✖️ Claim & Stäng</button>
    </div>
  </div>

  <!-- GIVEAWAY REEL WIDGET -->
  <div class="giveaway-widget faded-out" id="giveawayWidget">
    <div class="giveaway-title-container">
      <div class="giveaway-head-title">🎁 GIVEAWAY</div>
      <div class="giveaway-sub-title" id="giveawaySubTitle">TOTALT 0 BILJETTER</div>
      <div class="giveaway-timer-badge" id="giveawayHeaderTimer">REDO FÖR DRAGNING</div>
    </div>
    <div class="reel-viewport">
      <div class="reel-track" id="reelTrack"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const TICKET_MILESTONE_KR = 200;
    const ITEM_HEIGHT = 43;
    const VIEWPORT_HEIGHT = 215;

    // 🎵 HIGH-QUALITY MODERN AUDIO SAMPLES (Hosted on high-speed CDN)
    const AUDIO_PRESETS = {
      hype_win: "https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3", // Modern Level Up Win with sub-bass punch
      jackpot: "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3", // Casino Gold Jackpot Chime
      fanfare: "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"  // Triumphant Victory Fanfare
    };

    let donorTicketsMap = {};
    let currentDrawnWinner = null;
    let isSpinningReel = false;
    let isTestMode = false;
    let currentVisibleFive = null;

    let giveawayHoldTimeout = null;
    let headerCountdownInterval = null;
    let spinAnimationTimeout = null;
    let animationFrameId = null;

    let lastTrackY = 0;
    let lastTickedIndex = null;
    let lastTickTimestamp = 0;

    let confettiParticles = [];
    let confettiAnimId = null;

    // DOM Elements
    const testPanelEl = document.getElementById('testPanel');
    const panelHeaderEl = document.getElementById('panelDragHeader');
    const giveawayWidgetEl = document.getElementById('giveawayWidget');
    const giveawayStatsEl = document.getElementById('giveawayStats');
    const giveawaySubTitleEl = document.getElementById('giveawaySubTitle');
    const giveawayTimerEl = document.getElementById('giveawayHeaderTimer');
    const reelTrackEl = document.getElementById('reelTrack');
    const bossaSlugInput = document.getElementById('bossaSlugInput');
    const manualNameInput = document.getElementById('manualNameInput');
    const manualAmountInput = document.getElementById('manualAmountInput');
    const targetTicketsInput = document.getElementById('targetTicketCount');
    const maxTicketsInput = document.getElementById('maxTicketsPerUser');
    const modeIndicatorEl = document.getElementById('modeIndicator');
    const testControlsContainer = document.getElementById('testControlsContainer');
    const pasteContainerEl = document.getElementById('pasteContainer');
    const pasteTextAreaEl = document.getElementById('pasteTextArea');
    const btnStart = document.getElementById('btnStart');
    const btnSkip = document.getElementById('btnSkip');
    const btnClose = document.getElementById('btnClose');
    const victoryFlashEl = document.getElementById('victoryFlash');
    const victoryCanvas = document.getElementById('victoryCanvas');
    const soundPresetSelect = document.getElementById('soundPresetSelect');
    const customSoundContainer = document.getElementById('customSoundContainer');
    const customSoundUrl = document.getElementById('customSoundUrl');
    const btnTestSound = document.getElementById('btnTestSound');
    const vCtx = victoryCanvas.getContext('2d');

    function resizeCanvas() {
      victoryCanvas.width = window.innerWidth;
      victoryCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Sound Selector UI Toggle
    soundPresetSelect.addEventListener('change', () => {
      customSoundContainer.style.display = soundPresetSelect.value === 'custom' ? 'flex' : 'none';
    });

    btnTestSound.addEventListener('click', () => {
      playModernVictorySound();
    });

    // 🔊 AUDIO PLAYER
    function playModernVictorySound() {
      let soundSrc = AUDIO_PRESETS[soundPresetSelect.value] || AUDIO_PRESETS.hype_win;
      if (soundPresetSelect.value === 'custom') {
        const customUrl = customSoundUrl.value.trim();
        if (customUrl) soundSrc = customUrl;
      }

      try {
        const audio = new Audio(soundSrc);
        audio.volume = 0.85;
        audio.play().catch(err => {
          console.warn("Ljud kunde inte spelas automatiskt:", err);
        });
      } catch (e) {
        console.error(e);
      }
    }

    // Modern Mechanical Wheel Click Sound
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWheelClick(pitchMultiplier = 1.0) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520 * pitchMultiplier, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.018);

      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.02);
    }

    // 🎉 FULLSCREEN VICTORY CELEBRATION
    function triggerFullscreenVictory() {
      victoryFlashEl.classList.remove('active');
      void victoryFlashEl.offsetWidth;
      victoryFlashEl.classList.add('active');

      // Play modern stream win sound
      playModernVictorySound();

      confettiParticles = [];
      const colors = ['#ace600', '#00ff88', '#ffea00', '#ffffff', '#ff0055'];
      const count = 160;

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2 + (Math.random() * 80 - 40),
          y: window.innerHeight / 2 + (Math.random() * 40 - 20),
          vx: (Math.random() - 0.5) * 26,
          vy: (Math.random() * -18) - 6,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          opacity: 1,
          gravity: 0.45 + Math.random() * 0.25,
          drag: 0.985
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      animateConfetti();
    }

    function animateConfetti() {
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
      let aliveCount = 0;

      for (let p of confettiParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.rotation += p.rotSpeed;

        if (p.y > window.innerHeight * 0.65) {
          p.opacity -= 0.015;
        }

        if (p.opacity > 0 && p.y < window.innerHeight + 50) {
          aliveCount++;
          vCtx.save();
          vCtx.translate(p.x, p.y);
          vCtx.rotate((p.rotation * Math.PI) / 180);
          vCtx.globalAlpha = Math.max(0, p.opacity);
          vCtx.fillStyle = p.color;
          vCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
          vCtx.restore();
        }
      }

      if (aliveCount > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
        confettiAnimId = null;
      }
    }

    function clearVictoryEffects() {
      victoryFlashEl.classList.remove('active');
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
    }

    // Network / Data Fetcher
    async function fetchRealBossaData() {
      getAudioContext();
      const rawSlug = bossaSlugInput.value.trim();
      if (!rawSlug) return alert("Ange ett giltigt Böss-ID eller URL!");

      const slug = rawSlug.replace(/.*bossan\.musikhjalpen\.se\//, '').replace(/\/.*/, '').trim();
      const targetUrl = `https://bossan.musikhjalpen.se/${slug}`;

      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`
      ];

      let success = false;
      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (!res.ok) continue;

          let htmlText = "";
          if (proxy.includes("allorigins")) {
            const data = await res.json();
            htmlText = data.contents;
          } else {
            htmlText = await res.text();
          }

          if (htmlText && htmlText.length > 500) {
            const newMap = parseTextOrHTMLForDonors(htmlText);
            if (Object.keys(newMap).length > 0) {
              donorTicketsMap = newMap;
              saveTicketsToStorage();
              switchToRealMode();
              success = true;
              alert(`Hämtade ${Object.keys(newMap).length} givare från Bössan (${slug})!`);
              break;
            }
          }
        } catch (err) {
          console.warn("Proxy misslyckades:", proxy, err);
        }
      }

      if (!success) {
        alert("Kunde inte hämta automatiskt (CORS-begränsning). Använd 'Klistra in text från Bössan' istället!");
        pasteContainerEl.style.display = "flex";
      }
    }

    function parseTextOrHTMLForDonors(text) {
      const newMap = {};
      const maxCap = parseInt(maxTicketsInput ? maxTicketsInput.value : 5) || 5;
      const regex = /([a-zA-Z0-9_\-åäöÅÄÖ\s]{2,30}?)\s+(?:gav|skänkte|bidrog med)?\s*([\d\s]+)\s*kr/gi;
      let match;

      while ((match = regex.exec(text)) !== null) {
        let rawName = match[1].trim();
        const lines = rawName.split(/\r?\n/);
        let name = lines[lines.length - 1].trim();
        let amount = parseInt(match[2].replace(/\s+/g, '')) || 0;

        const ignoreList = ["en hemlig hjälte", "senaste gåvorna", "musikhjälpen"];
        if (name && !ignoreList.includes(name.toLowerCase()) && amount >= TICKET_MILESTONE_KR) {
          let tickets = Math.min(maxCap, Math.floor(amount / TICKET_MILESTONE_KR));
          if (!newMap[name]) {
            newMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
          } else {
            newMap[name].totalAmount += amount;
            newMap[name].ticketsEarned = Math.min(maxCap, Math.floor(newMap[name].totalAmount / TICKET_MILESTONE_KR));
            newMap[name].ticketsActive = newMap[name].ticketsEarned;
          }
        }
      }
      return newMap;
    }

    function importPastedText() {
      getAudioContext();
      const text = pasteTextAreaEl.value.trim();
      if (!text) return alert("Klistra in texten från din Bössas sida först!");

      const newMap = parseTextOrHTMLForDonors(text);
      const count = Object.keys(newMap).length;

      if (count === 0) {
        return alert("Hittade inga giltiga gåvor (minst 200 kr). Exempel: 'greger gav 400 kr'");
      }

      donorTicketsMap = newMap;
      saveTicketsToStorage();
      switchToRealMode();
      pasteTextAreaEl.value = "";
      pasteContainerEl.style.display = "none";
      alert(`Importerat ${count} givare från texten!`);
    }

    function addManualDonor() {
      getAudioContext();
      const name = manualNameInput.value.trim();
      const amount = parseInt(manualAmountInput.value) || TICKET_MILESTONE_KR;
      const maxCap = parseInt(maxTicketsInput ? maxTicketsInput.value : 5) || 5;

      if (!name) return alert("Ange ett namn!");
      if (amount < TICKET_MILESTONE_KR) return alert(`Beloppet måste vara minst ${TICKET_MILESTONE_KR} kr för 1 biljett.`);

      let tickets = Math.min(maxCap, Math.floor(amount / TICKET_MILESTONE_KR));

      if (!donorTicketsMap[name]) {
        donorTicketsMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
      } else {
        donorTicketsMap[name].totalAmount += amount;
        donorTicketsMap[name].ticketsEarned = Math.min(maxCap, Math.floor(donorTicketsMap[name].totalAmount / TICKET_MILESTONE_KR));
        donorTicketsMap[name].ticketsActive = donorTicketsMap[name].ticketsEarned;
      }

      manualNameInput.value = "";
      manualAmountInput.value = "";
      saveTicketsToStorage();
      switchToRealMode();
    }

    function switchToRealMode() {
      isTestMode = false;
      modeIndicatorEl.className = "mode-indicator real-mode";
      modeIndicatorEl.innerText = "🟢 LÄGE: RIKTIGA BÖSSAN";
      testControlsContainer.style.display = "none";
      updateGiveawayStatsUI();
      initReelTrack();
    }

    function switchToTestMode() {
      getAudioContext();
      isTestMode = true;
      modeIndicatorEl.className = "mode-indicator test-mode";
      modeIndicatorEl.innerText = "🎲 LÄGE: TESTLÄGE (DUMMY-DATA)";
      testControlsContainer.style.display = "flex";
      generateRandomizedDonors(
        parseInt(targetTicketsInput.value) || 250,
        parseInt(maxTicketsInput.value) || 5
      );
      updateGiveawayStatsUI();
      initReelTrack();
    }

    function resetEverythingToZero() {
      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = false;
      donorTicketsMap = {};
      currentDrawnWinner = null;
      currentVisibleFive = null;
      saveTicketsToStorage();
      updateGiveawayStatsUI();
      initReelTrack();
      setButtonLock(false);
      giveawayTimerEl.classList.remove('winner-drawn');
      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
      giveawayWidgetEl.classList.add('faded-out');
    }

    function generateRandomizedDonors(totalTicketsTarget, maxPerUser = 5) {
      const prefixes = ["Kaffe", "Pixel", "Ninja", "Katt", "Zelda", "Gamer", "Dunder", "Bacon", "Norrlands", "Glada"];
      const suffixes = ["Kungen", "Gud", "Bullen", "Loover", "Pappa", "Mamma", "Svensken", "Master", "Viking", "Räven"];

      const namePool = [];
      for (const p of prefixes) {
        for (const s of suffixes) namePool.push(p + s);
      }
      namePool.sort(() => Math.random() - 0.5);

      const newDonorMap = {};
      let remaining = Math.max(1, totalTicketsTarget);
      let idx = 0;

      while (remaining > 0) {
        const tickets = Math.min(remaining, Math.floor(Math.random() * maxPerUser) + 1);
        const name = namePool[idx % namePool.length];
        newDonorMap[name] = { totalAmount: tickets * TICKET_MILESTONE_KR, ticketsEarned: tickets, ticketsActive: tickets };
        remaining -= tickets;
        idx++;
      }

      donorTicketsMap = newDonorMap;
      saveTicketsToStorage();
    }

    function loadTicketsFromStorage() {
      if (isSpinningReel) return;
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) donorTicketsMap = JSON.parse(saved);
      } catch (err) {}
      updateGiveawayStatsUI();
    }

    function saveTicketsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch (err) {}
    }

    function getWeightedTicketPool() {
      const pool = [];
      for (const [name, donor] of Object.entries(donorTicketsMap)) {
        for (let i = 0; i < (donor.ticketsActive || 0); i++) pool.push(name);
      }
      return pool;
    }

    function getUniqueDonorNames() {
      return Object.keys(donorTicketsMap).filter(name => (donorTicketsMap[name].ticketsActive || 0) > 0);
    }

    function setTargetTicketPreset(val) {
      targetTicketsInput.value = val;
      if (isTestMode) {
        generateRandomizedDonors(val, parseInt(maxTicketsInput.value) || 5);
        updateGiveawayStatsUI();
        initReelTrack();
      }
    }

    function updateGiveawayStatsUI() {
      const pool = getWeightedTicketPool();
      const uniqueDonorsCount = getUniqueDonorNames().length;
      giveawayStatsEl.innerHTML = `Biljetter: <b>${pool.length}</b> | Givare: <b>${uniqueDonorsCount}</b>`;
      giveawaySubTitleEl.innerText = `TOTALT ${pool.length} BILJETTER`;
    }

    function setButtonLock(locked) {
      btnStart.disabled = locked;
      btnSkip.disabled = locked;
    }

    function createCleanReelTrack(winnerName, startingFive = null) {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) return { spinList: [winnerName], winnerIndex: 0 };

      const spinList = [];
      let lastAdded = "";

      const getDistinctName = () => {
        if (uniqueNames.length === 1) return uniqueNames[0];
        let candidate;
        let attempts = 0;
        do {
          candidate = uniqueNames[Math.floor(Math.random() * uniqueNames.length)];
          attempts++;
        } while (candidate === lastAdded && attempts < 25);
        return candidate;
      };

      if (startingFive && startingFive.length === 5) {
        for (let i = 0; i < 5; i++) {
          spinList.push(startingFive[i]);
          lastAdded = startingFive[i];
        }
      } else {
        for (let i = 0; i < 5; i++) {
          const name = getDistinctName();
          spinList.push(name);
          lastAdded = name;
        }
      }

      for (let i = spinList.length; i < 75; i++) {
        const name = getDistinctName();
        spinList.push(name);
        lastAdded = name;
      }

      const winnerIndex = 75;
      spinList.push(winnerName);
      lastAdded = winnerName;

      for (let i = 0; i < 5; i++) {
        const name = getDistinctName();
        spinList.push(name);
        lastAdded = name;
      }

      return { spinList, winnerIndex };
    }

    function initReelTrack() {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) {
        reelTrackEl.innerHTML = '<div class="reel-item">INGA BILJETTER</div>';
        return;
      }

      const initialList = [];
      for (let i = 0; i < 5; i++) {
        initialList.push(uniqueNames[i % uniqueNames.length]);
      }
      currentVisibleFive = [...initialList];

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = initialList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      renderItemProximity(0);
    }

    function renderItemProximity(currentY) {
      const viewportCenter = VIEWPORT_HEIGHT / 2;
      const children = reelTrackEl.children;
      const count = children.length;
      if (count === 0) return;

      const centerItemIdx = Math.round((-currentY + viewportCenter - ITEM_HEIGHT / 2) / ITEM_HEIGHT);
      const startIdx = Math.max(0, centerItemIdx - 4);
      const endIdx = Math.min(count - 1, centerItemIdx + 4);

      for (let i = startIdx; i <= endIdx; i++) {
        const item = children[i];
        const itemCenter = (i * ITEM_HEIGHT) + (ITEM_HEIGHT / 2) + currentY;
        const dist = Math.abs(itemCenter - viewportCenter);
        const normDist = Math.min(1, dist / viewportCenter);

        const scale = 0.7 + 0.6 * Math.pow(1 - normDist, 1.6);
        const opacity = 0.25 + 0.75 * Math.pow(1 - normDist, 2);

        item.style.transform = `scale(${scale.toFixed(3)})`;
        item.style.opacity = opacity.toFixed(3);
      }
    }

    function runAnimationLoop() {
      if (!isSpinningReel) return;

      const style = window.getComputedStyle(reelTrackEl);
      const matrix = new DOMMatrix(style.transform);
      const currentY = matrix.m42;
      renderItemProximity(currentY);

      const centerItemIdx = Math.floor((-currentY + (VIEWPORT_HEIGHT / 2)) / ITEM_HEIGHT);
      const now = performance.now();
      
      if (centerItemIdx !== lastTickedIndex && (now - lastTickTimestamp) > 20) {
        const speed = Math.abs(currentY - lastTrackY);
        const pitch = Math.max(0.75, Math.min(1.35, 0.75 + speed * 0.05));
        playWheelClick(pitch);
        lastTickedIndex = centerItemIdx;
        lastTickTimestamp = now;
      }
      lastTrackY = currentY;

      animationFrameId = requestAnimationFrame(runAnimationLoop);
    }

    function stopAllTimers() {
      if (giveawayHoldTimeout) clearTimeout(giveawayHoldTimeout);
      if (spinAnimationTimeout) clearTimeout(spinAnimationTimeout);
      if (headerCountdownInterval) clearInterval(headerCountdownInterval);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      giveawayHoldTimeout = null;
      spinAnimationTimeout = null;
      headerCountdownInterval = null;
      animationFrameId = null;
    }

    function startGiveawaySpin() {
      getAudioContext();
      if (isSpinningReel) return;
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return alert("Inga biljetter i potten ännu!");

      clearVictoryEffects();
      giveawayTimerEl.classList.remove('winner-drawn');
      giveawayWidgetEl.classList.remove('faded-out');
      executeReelSpinAnimation(10000);
    }

    function skipWinner() {
      getAudioContext();
      clearVictoryEffects();
      giveawayTimerEl.classList.remove('winner-drawn');
      giveawayWidgetEl.classList.remove('faded-out');
      stopAllTimers();
      isSpinningReel = false;
      executeReelSpinAnimation(5000);
    }

    function closeAndClaimGiveaway() {
      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = false;
      setButtonLock(false);

      if (currentDrawnWinner && donorTicketsMap[currentDrawnWinner]) {
        if (donorTicketsMap[currentDrawnWinner].ticketsActive > 0) {
          donorTicketsMap[currentDrawnWinner].ticketsActive -= 1;
        }
      }

      currentDrawnWinner = null;
      saveTicketsToStorage();
      updateGiveawayStatsUI();

      giveawayTimerEl.classList.remove('winner-drawn');
      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
      giveawayWidgetEl.classList.add('faded-out');
    }

    function executeReelSpinAnimation(holdDelayMs = 10000) {
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return;

      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = true;
      setButtonLock(true);
      giveawayTimerEl.classList.remove('winner-drawn');

      const winningIndex = Math.floor(Math.random() * ticketPool.length);
      const winnerName = ticketPool[winningIndex];
      currentDrawnWinner = winnerName;

      const { spinList, winnerIndex } = createCleanReelTrack(winnerName, currentVisibleFive);

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = spinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      void reelTrackEl.offsetHeight;

      renderItemProximity(0);
      lastTrackY = 0;
      lastTickedIndex = null;

      // Countdown Timer
      const endTime = Date.now() + holdDelayMs;
      const updateTimerUI = () => {
        const remainingSec = Math.ceil(Math.max(0, endTime - Date.now()) / 1000);
        giveawayTimerEl.innerText = remainingSec > 0 ? `STARTAR OM ${remainingSec}S` : "DRAGNING PÅGÅR...";
      };

      updateTimerUI();
      headerCountdownInterval = setInterval(() => {
        updateTimerUI();
        if (Date.now() >= endTime) {
          clearInterval(headerCountdownInterval);
          headerCountdownInterval = null;
        }
      }, 200);

      // Spin Trigger
      giveawayHoldTimeout = setTimeout(() => {
        giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";
        const targetY = -(winnerIndex * ITEM_HEIGHT - 86);
        const spinDuration = holdDelayMs <= 5000 ? 5500 : 8500;

        reelTrackEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.1, 0.85, 0.15, 1)`;
        reelTrackEl.style.transform = `translateY(${targetY}px)`;

        runAnimationLoop();

        spinAnimationTimeout = setTimeout(() => {
          isSpinningReel = false;
          setButtonLock(false);
          stopAllTimers();

          giveawayTimerEl.classList.add('winner-drawn');
          giveawayTimerEl.innerText = "🎉 VINNARE DRAGEN! 🎉";
          renderItemProximity(targetY);

          const items = reelTrackEl.children;
          if (items[winnerIndex]) {
            items[winnerIndex].classList.add('is-winner');
          }

          // Trigger Modern Victory Celebration
          triggerFullscreenVictory();

          currentVisibleFive = [
            spinList[winnerIndex - 2] || winnerName,
            spinList[winnerIndex - 1] || winnerName,
            spinList[winnerIndex],
            spinList[winnerIndex + 1] || winnerName,
            spinList[winnerIndex + 2] || winnerName
          ];
        }, spinDuration + 50);
      }, holdDelayMs);
    }

    function makePanelDraggable() {
      if (!testPanelEl || !panelHeaderEl) return;
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      const onMouseMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const maxLeft = window.innerWidth - testPanelEl.offsetWidth - 10;
        const maxTop = window.innerHeight - testPanelEl.offsetHeight - 10;

        testPanelEl.style.left = `${Math.max(10, Math.min(maxLeft, initialLeft + dx))}px`;
        testPanelEl.style.top = `${Math.max(10, Math.min(maxTop, initialTop + dy))}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      panelHeaderEl.addEventListener('mousedown', (e) => {
        getAudioContext();
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = testPanelEl.offsetLeft;
        initialTop = testPanelEl.offsetTop;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Event Listeners
    btnStart.addEventListener('click', startGiveawaySpin);
    btnSkip.addEventListener('click', skipWinner);
    btnClose.addEventListener('click', closeAndClaimGiveaway);
    document.getElementById('btnFetchBossa').addEventListener('click', fetchRealBossaData);
    document.getElementById('btnAddManual').addEventListener('click', addManualDonor);
    document.getElementById('btnSwitchTest').addEventListener('click', switchToTestMode);
    document.getElementById('btnResetZero').addEventListener('click', resetEverythingToZero);

    document.getElementById('btnTogglePaste').addEventListener('click', () => {
      pasteContainerEl.style.display = pasteContainerEl.style.display === "none" ? "flex" : "none";
    });
    document.getElementById('btnImportPaste').addEventListener('click', importPastedText);

    // Init
    makePanelDraggable();
    loadTicketsFromStorage();
    initReelTrack();
    setInterval(loadTicketsFromStorage, 4000);
  </script>
</body>
</html>
