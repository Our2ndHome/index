<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Giveaway Wheel Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --danger-color: #ff0055;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.92);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --item-height: 43px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      width: 330px;
      font-size: 12px;
      box-shadow: 0 10px 30px var(--shadow-dark);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .widget-version-badge {
      font-size: 9px;
      background: var(--secondary-color);
      color: #000;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .panel-stats {
      font-size: 11px;
      color: var(--primary-color);
      margin: 6px 0;
    }

    .panel-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .control-row label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
    }

    .control-row input {
      width: 80px;
      background: #111;
      border: 1px solid var(--secondary-color);
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
    }

    .quick-presets {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn {
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      font-family: inherit;
      transition: opacity 0.2s ease, transform 0.1s ease;
      text-align: center;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn-lime { background: var(--primary-color); color: #000; }
    .btn-yellow { background: var(--giveaway-color); color: #000; }
    .btn-red { background: var(--danger-color); color: #fff; }
    .btn-green { background: var(--secondary-color); color: #000; }
    .btn-small { padding: 3px 8px; font-size: 9px; }

    /* 🎁 GIVEAWAY REEL WIDGET */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 370px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Hidden / Closed Widget State */
    .giveaway-widget.faded-out {
      opacity: 0;
      visibility: hidden;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
    }

    .giveaway-head-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      text-shadow: 0 2px 8px var(--shadow-dark);
    }

    .giveaway-sub-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      opacity: 0.9;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .giveaway-timer-badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(172, 230, 0, 0.15);
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      font-size: 11px;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .reel-viewport {
      position: relative;
      width: 100%;
      height: 215px; /* Fits 5 items */
      overflow: hidden;

      /* Smooth mask gradient fading edges */
      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.5) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.5) 80%,
        rgba(0, 0, 0, 0.1) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.5) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.5) 80%,
        rgba(0, 0, 0, 0.1) 100%
      );
    }

    /* Green line indicators */
    .reel-viewport::before, 
    .reel-viewport::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary-color) 20px, var(--primary-color) calc(100% - 20px), transparent 100%);
      box-shadow: 0 0 6px rgba(172, 230, 0, 0.6);
      z-index: 10;
    }

    .reel-viewport::before { top: 86px; }  
    .reel-viewport::after  { top: 129px; } 

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      color: #ffffff;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .reel-item.is-winner {
      color: var(--primary-color) !important;
      text-shadow: 0 0 14px rgba(172, 230, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">
      <span>🎁 GIVEAWAY CONTROL <span class="widget-version-badge">v2.4</span></span>
      <span style="font-size: 9px; opacity: 0.7;">DRAG ME</span>
    </h4>
    
    <div class="panel-stats" id="giveawayStats">Biljetter: <b>0</b> | Givare: <b>0</b></div>

    <!-- TICKET & POOL SETTINGS -->
    <div class="panel-controls">
      <div class="control-row">
        <label for="targetTicketCount">Totalt antal biljetter:</label>
        <input type="number" id="targetTicketCount" value="250" min="1">
      </div>
      <div class="quick-presets">
        <span style="font-size: 9px; color: #888; align-self: center;">Sätt:</span>
        <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(50)">50</button>
        <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(100)">100</button>
        <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(250)">250</button>
        <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(500)">500</button>
      </div>
      <div class="control-row" style="margin-top: 4px;">
        <label for="maxTicketsPerUser">Max per person:</label>
        <input type="number" id="maxTicketsPerUser" value="5" min="1" max="10">
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="panel-actions">
      <button id="btnStart" class="btn btn-lime">▶️ Starta Giveaway</button>
      <button id="btnSkip" class="btn btn-yellow">⏭️ Skip (Reroll 5s)</button>
      <button id="btnClose" class="btn btn-red">✖️ Stäng & Radera Vinnarbiljett</button>
    </div>
  </div>

  <!-- GIVEAWAY REEL WIDGET -->
  <div class="giveaway-widget faded-out" id="giveawayWidget">
    <div class="giveaway-title-container">
      <div class="giveaway-head-title">🎁 GIVEAWAY</div>
      <div class="giveaway-sub-title" id="giveawaySubTitle">TOTALT 0 TICKETS</div>
      <div class="giveaway-timer-badge" id="giveawayHeaderTimer">REDO FÖR DRAGNING</div>
    </div>
    <div class="reel-viewport">
      <div class="reel-track" id="reelTrack"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const ITEM_HEIGHT = 43;

    let donorTicketsMap = {};
    let currentDrawnWinner = null;
    let isSpinningReel = false;

    // Active reel state
    let activeSpinList = [];
    let currentWinnerIndexInList = 2;

    // Timers
    let giveawayHoldTimeout = null;
    let headerCountdownInterval = null;
    let spinAnimationTimeout = null;

    // --- DOM Elements ---
    const testPanelEl = document.getElementById('testPanel');
    const panelHeaderEl = document.getElementById('panelDragHeader');
    const giveawayWidgetEl = document.getElementById('giveawayWidget');
    const giveawayStatsEl = document.getElementById('giveawayStats');
    const giveawaySubTitleEl = document.getElementById('giveawaySubTitle');
    const giveawayTimerEl = document.getElementById('giveawayHeaderTimer');
    const reelTrackEl = document.getElementById('reelTrack');
    const targetTicketsInput = document.getElementById('targetTicketCount');
    const maxTicketsInput = document.getElementById('maxTicketsPerUser');

    // --- Dynamic Donor Generator (Random 1-5 tickets per person) ---
    function generateRandomizedDonors(totalTicketsTarget, maxPerUser = 5) {
      const sampleBaseNames = [
        "GamerGud", "Matilda99", "PixelPappa", "KaffeLoover", "NinjaBullen", 
        "KattKungen", "ZeldaFan88", "MidsommarSvensken", "SpelKatten", "KaffeKungen",
        "RetroRobin", "Bullen88", "CyberMatilda", "PappaBetalar", "TurboTomten"
      ];

      const newDonorMap = {};
      let remainingTickets = Math.max(1, totalTicketsTarget);
      let donorIndex = 1;

      while (remainingTickets > 0) {
        // Randomize tickets between 1 and maxPerUser for each donor
        const ticketsForDonor = Math.min(remainingTickets, Math.floor(Math.random() * maxPerUser) + 1);
        const baseName = sampleBaseNames[(donorIndex - 1) % sampleBaseNames.length];
        const donorName = `${baseName}_${donorIndex}`;

        newDonorMap[donorName] = {
          totalAmount: ticketsForDonor * 200,
          ticketsEarned: ticketsForDonor,
          ticketsActive: ticketsForDonor
        };

        remainingTickets -= ticketsForDonor;
        donorIndex++;
      }

      donorTicketsMap = newDonorMap;
      saveTicketsToStorage();
      updateGiveawayStatsUI();
    }

    // --- Storage Sync ---
    function loadTicketsFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) {
          donorTicketsMap = JSON.parse(saved);
          if (Object.keys(donorTicketsMap).length === 0) {
            generateRandomizedDonors(parseInt(targetTicketsInput.value) || 250, parseInt(maxTicketsInput.value) || 5);
          } else {
            updateGiveawayStatsUI();
          }
        } else {
          generateRandomizedDonors(250, 5);
        }
      } catch (err) {
        console.error("Kunde inte läsa från localStorage", err);
      }
    }

    function saveTicketsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch (err) {
        console.error("Kunde inte spara till localStorage", err);
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY_DONORS) loadTicketsFromStorage();
    });

    // --- Get Active Pool ---
    function getActiveTicketPool() {
      let pool = [];
      for (const [name, donor] of Object.entries(donorTicketsMap)) {
        for (let i = 0; i < donor.ticketsActive; i++) {
          pool.push(name);
        }
      }
      return pool;
    }

    function setTargetTicketPreset(val) {
      targetTicketsInput.value = val;
      const maxPerUser = parseInt(maxTicketsInput.value) || 5;
      generateRandomizedDonors(val, maxPerUser);
      initReelWithRealNames();
    }

    function updateGiveawayStatsUI() {
      const pool = getActiveTicketPool();
      const uniqueDonorsCount = Object.keys(donorTicketsMap).length;
      giveawayStatsEl.innerHTML = `Biljetter: <b>${pool.length}</b> | Givare: <b>${uniqueDonorsCount}</b>`;
      giveawaySubTitleEl.innerText = `TOTALT ${pool.length} TICKETS`;
    }

    // --- Initial Reel Population with Real Donor Names ---
    function initReelWithRealNames() {
      const pool = getActiveTicketPool();
      if (pool.length === 0) return;

      activeSpinList = [
        pool[0 % pool.length],
        pool[1 % pool.length],
        pool[2 % pool.length],
        pool[3 % pool.length],
        pool[4 % pool.length]
      ];
      currentWinnerIndexInList = 2;

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = activeSpinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
    }

    // --- Dynamic 3D Proximity Scaling Loop ---
    function updateItemProximityScaling() {
      if (!reelTrackEl) return;

      const style = window.getComputedStyle(reelTrackEl);
      const matrix = new DOMMatrix(style.transform);
      const currentY = matrix.m42;
      const viewportCenter = 215 / 2; // 107.5px

      const children = reelTrackEl.children;
      for (let i = 0; i < children.length; i++) {
        const item = children[i];
        const itemCenter = (i * ITEM_HEIGHT) + (ITEM_HEIGHT / 2) + currentY;
        const dist = Math.abs(itemCenter - viewportCenter);
        
        // Normalized distance (0 at center line, 1 at edge)
        const normDist = Math.min(1, dist / viewportCenter);

        // Dynamic scale: 1.35x at center, shrinking to 0.75x towards edges
        const scale = 0.75 + 0.6 * Math.pow(1 - normDist, 1.8);
        
        // Dynamic opacity: 1.0 at center, fading down to 0.2 at edges
        const opacity = 0.2 + 0.8 * Math.pow(1 - normDist, 2);

        item.style.transform = `scale(${scale.toFixed(3)})`;
        item.style.opacity = opacity.toFixed(3);
      }

      requestAnimationFrame(updateItemProximityScaling);
    }

    // --- Helper Timer Cleanup ---
    function stopAllTimers() {
      if (giveawayHoldTimeout) { clearTimeout(giveawayHoldTimeout); giveawayHoldTimeout = null; }
      if (spinAnimationTimeout) { clearTimeout(spinAnimationTimeout); spinAnimationTimeout = null; }
      if (headerCountdownInterval) { clearInterval(headerCountdownInterval); headerCountdownInterval = null; }
    }

    // --- 1. START GIVEAWAY ---
    function startGiveawaySpin() {
      if (isSpinningReel) return;
      const ticketPool = getActiveTicketPool();
      if (ticketPool.length === 0) return alert("Inga biljetter i potten ännu!");

      giveawayWidgetEl.classList.remove('faded-out');
      executeReelSpinAnimation(10000); // 10 second countdown
    }

    // --- 2. SKIP (REROLL) ---
    function skipWinner() {
      giveawayWidgetEl.classList.remove('faded-out');
      isSpinningReel = false;
      executeReelSpinAnimation(5000); // 5 second countdown
    }

    // --- 3. CLOSE & CLAIM GIVEAWAY ---
    function closeAndClaimGiveaway() {
      stopAllTimers();
      isSpinningReel = false;

      if (currentDrawnWinner && donorTicketsMap[currentDrawnWinner]) {
        if (donorTicketsMap[currentDrawnWinner].ticketsActive > 0) {
          donorTicketsMap[currentDrawnWinner].ticketsActive -= 1;
        }
      }

      saveTicketsToStorage();
      updateGiveawayStatsUI();

      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
      giveawayWidgetEl.classList.add('faded-out');
    }

    // --- Reel Spin Animation ---
    function executeReelSpinAnimation(holdDelayMs = 10000) {
      const ticketPool = getActiveTicketPool();
      if (ticketPool.length === 0) return;

      stopAllTimers();
      isSpinningReel = true;

      // Determine Winner
      const winningTicketIndex = Math.floor(Math.random() * ticketPool.length);
      const winnerName = ticketPool[winningTicketIndex];
      currentDrawnWinner = winnerName;

      // Continuous Transition Setup:
      const centerIdx = currentWinnerIndexInList;
      const visibleFive = [
        activeSpinList[centerIdx - 2] || ticketPool[0],
        activeSpinList[centerIdx - 1] || ticketPool[0],
        activeSpinList[centerIdx]     || ticketPool[0], // Active visible name
        activeSpinList[centerIdx + 1] || ticketPool[0],
        activeSpinList[centerIdx + 2] || ticketPool[0],
      ];

      // Build new spin list starting seamlessly from current visible names
      const newSpinList = [...visibleFive];
      for (let i = 0; i < 30; i++) {
        newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]);
      }
      newSpinList.push(winnerName); // Main winner target
      newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]); // Padding below
      newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]);

      activeSpinList = newSpinList;
      currentWinnerIndexInList = newSpinList.length - 3;

      // Reset list offset seamlessly
      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = activeSpinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');

      // Force DOM Reflow
      void reelTrackEl.offsetHeight;

      // Countdown timer logic using Date math
      const endTime = Date.now() + holdDelayMs;

      const updateTimerUI = () => {
        const remainingMs = Math.max(0, endTime - Date.now());
        const remainingSec = Math.ceil(remainingMs / 1000);
        if (remainingSec > 0) {
          giveawayTimerEl.innerText = `STARTAR OM ${remainingSec}S`;
        } else {
          giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";
        }
      };

      updateTimerUI();
      headerCountdownInterval = setInterval(() => {
        updateTimerUI();
        if (Date.now() >= endTime) {
          clearInterval(headerCountdownInterval);
          headerCountdownInterval = null;
        }
      }, 100);

      // Trigger Spin Animation
      giveawayHoldTimeout = setTimeout(() => {
        giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";

        const targetY = -(currentWinnerIndexInList - 2) * ITEM_HEIGHT;
        const spinDuration = 11000;

        reelTrackEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.1, 0.75, 0.25, 1)`;
        reelTrackEl.style.transform = `translateY(${targetY}px)`;

        spinAnimationTimeout = setTimeout(() => {
          isSpinningReel = false;
          giveawayTimerEl.innerText = "VINNARE DRAGEN! 🎉";
          
          const items = reelTrackEl.children;
          if (items[currentWinnerIndexInList]) {
            items[currentWinnerIndexInList].classList.add('is-winner');
          }
        }, spinDuration + 100);
      }, holdDelayMs);
    }

    // --- Draggable Panel Logic ---
    function makePanelDraggable() {
      if (!testPanelEl || !panelHeaderEl) return;

      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      const onMouseMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        testPanelEl.style.left = `${initialLeft + dx}px`;
        testPanelEl.style.top = `${initialTop + dy}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      panelHeaderEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = testPanelEl.offsetLeft;
        initialTop = testPanelEl.offsetTop;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // --- Event Listeners ---
    document.getElementById('btnStart').addEventListener('click', startGiveawaySpin);
    document.getElementById('btnSkip').addEventListener('click', skipWinner);
    document.getElementById('btnClose').addEventListener('click', closeAndClaimGiveaway);

    targetTicketsInput.addEventListener('change', () => {
      const val = parseInt(targetTicketsInput.value) || 250;
      const maxPerUser = parseInt(maxTicketsInput.value) || 5;
      generateRandomizedDonors(val, maxPerUser);
      initReelWithRealNames();
    });

    maxTicketsInput.addEventListener('change', () => {
      const val = parseInt(targetTicketsInput.value) || 250;
      const maxPerUser = parseInt(maxTicketsInput.value) || 5;
      generateRandomizedDonors(val, maxPerUser);
      initReelWithRealNames();
    });

    // --- Initialization ---
    makePanelDraggable();
    loadTicketsFromStorage();
    initReelWithRealNames();
    requestAnimationFrame(updateItemProximityScaling);
    setInterval(loadTicketsFromStorage, 2000);
  </script>
</body>
</html>
