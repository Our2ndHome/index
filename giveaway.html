<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Giveaway Wheel Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --danger-color: #ff0055;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.92);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --item-height: 43px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      width: 330px;
      font-size: 12px;
      box-shadow: 0 10px 30px var(--shadow-dark);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .widget-version-badge {
      font-size: 9px;
      background: var(--secondary-color);
      color: #000;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .panel-stats {
      font-size: 11px;
      color: var(--primary-color);
      margin: 6px 0;
    }

    .panel-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .control-row label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
    }

    .control-row input {
      width: 70px;
      background: #111;
      border: 1px solid var(--secondary-color);
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
    }

    .quick-presets {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .btn {
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      font-family: inherit;
      transition: opacity 0.2s ease, transform 0.1s ease;
      flex: 1 1 auto;
      text-align: center;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }

    .btn-lime { background: var(--primary-color); color: #000; }
    .btn-yellow { background: var(--giveaway-color); color: #000; }
    .btn-red { background: var(--danger-color); color: #fff; }
    .btn-green { background: var(--secondary-color); color: #000; }
    .btn-small { padding: 2px 6px; font-size: 9px; flex: initial; }

    /* 🎁 GIVEAWAY REEL WIDGET */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 370px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Fade out state when winner draw finishes */
    .giveaway-widget.faded-out {
      opacity: 0;
      visibility: hidden;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
    }

    .giveaway-head-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      text-shadow: 0 2px 8px var(--shadow-dark);
    }

    .giveaway-sub-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      opacity: 0.9;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .giveaway-timer-badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(172, 230, 0, 0.15);
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      font-size: 11px;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .reel-viewport {
      position: relative;
      width: 100%;
      height: 215px; /* Fits 5 items */
      overflow: hidden;

      /* FADE MASK: Fades out top and bottom items, keeps middle 100% visible */
      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.35) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.35) 80%,
        rgba(0, 0, 0, 0.1) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.35) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.35) 80%,
        rgba(0, 0, 0, 0.1) 100%
      );
    }

    /* Target overlay lines around middle slot */
    .reel-viewport::before, 
    .reel-viewport::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary-color) 20px, var(--primary-color) calc(100% - 20px), transparent 100%);
      box-shadow: 0 0 6px rgba(172, 230, 0, 0.6);
      z-index: 10;
    }

    .reel-viewport::before { top: 86px; }  
    .reel-viewport::after  { top: 129px; } 

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.85);
      transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
    }

    .reel-item.is-winner {
      color: var(--primary-color) !important;
      transform: scale(1.3);
      text-shadow: 0 0 12px rgba(172, 230, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">
      <span>🎁 GIVEAWAY CONTROL <span class="widget-version-badge">v2.2</span></span>
      <span style="font-size: 9px; opacity: 0.7;">DRAG ME</span>
    </h4>
    
    <div class="panel-stats" id="giveawayStats">Biljetter: <b>0</b> | Givare: <b>0</b></div>

    <!-- TICKET & POOL SETTINGS -->
    <div class="panel-controls">
      <div class="control-row">
        <label for="maxTicketsPerUser">Max biljetter/person:</label>
        <input type="number" id="maxTicketsPerUser" value="5" min="1">
      </div>
      <div class="control-row">
        <label for="maxPoolLimit">Max i dragning (Pott):</label>
        <input type="number" id="maxPoolLimit" value="0" min="0" placeholder="Alla (0)">
      </div>
      <div class="quick-presets">
        <span style="font-size: 9px; color: #888; align-self: center;">Pott:</span>
        <button class="btn btn-green btn-small" onclick="setPoolPreset(50)">50</button>
        <button class="btn btn-green btn-small" onclick="setPoolPreset(100)">100</button>
        <button class="btn btn-green btn-small" onclick="setPoolPreset(250)">250</button>
        <button class="btn btn-green btn-small" onclick="setPoolPreset(0)">Alla</button>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="panel-actions">
      <button id="btnSpin" class="btn btn-lime">🎯 Dra Vinnare</button>
      <button id="btnSkip" class="btn btn-yellow">⏭️ Skip (5s)</button>
      <button id="btnClaim" class="btn btn-red">✅ Radera Vinnarbiljett</button>
      <button id="btnLoadTest" class="btn btn-green">🎲 Ladda 250+ Biljetter</button>
    </div>
  </div>

  <!-- GIVEAWAY REEL WIDGET -->
  <div class="giveaway-widget" id="giveawayWidget">
    <div class="giveaway-title-container">
      <div class="giveaway-head-title">🎁 GIVEAWAY</div>
      <div class="giveaway-sub-title" id="giveawaySubTitle">TOTALT 0 TICKETS</div>
      <div class="giveaway-timer-badge" id="giveawayHeaderTimer">REDO FÖR DRAGNING</div>
    </div>
    <div class="reel-viewport">
      <div class="reel-track" id="reelTrack"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const ITEM_HEIGHT = 43;

    let donorTicketsMap = {};
    let currentDrawnWinner = null;
    let isSpinningReel = false;

    // Active reel state
    let activeSpinList = ["REDO", "REDO", "REDO FÖR DRAGNING", "REDO", "REDO"];
    let currentWinnerIndexInList = 2;

    // Timers
    let giveawayHoldTimeout = null;
    let headerCountdownInterval = null;
    let spinAnimationTimeout = null;
    let widgetFadeoutTimeout = null;

    // --- DOM Elements ---
    const testPanelEl = document.getElementById('testPanel');
    const panelHeaderEl = document.getElementById('panelDragHeader');
    const giveawayWidgetEl = document.getElementById('giveawayWidget');
    const giveawayStatsEl = document.getElementById('giveawayStats');
    const giveawaySubTitleEl = document.getElementById('giveawaySubTitle');
    const giveawayTimerEl = document.getElementById('giveawayHeaderTimer');
    const reelTrackEl = document.getElementById('reelTrack');
    const maxTicketsInput = document.getElementById('maxTicketsPerUser');
    const maxPoolInput = document.getElementById('maxPoolLimit');

    // Initial render
    renderReelTrackInitial();

    function renderReelTrackInitial() {
      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = activeSpinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
    }

    // --- Storage Sync ---
    function loadTicketsFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) {
          donorTicketsMap = JSON.parse(saved);
          updateGiveawayStatsUI();
        }
      } catch (err) {
        console.error("Kunde inte läsa från localStorage", err);
      }
    }

    function saveTicketsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch (err) {
        console.error("Kunde inte spara till localStorage", err);
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY_DONORS) loadTicketsFromStorage();
    });

    // --- Ticket & Pool Calculations ---
    function getActiveTicketPool() {
      const maxPerUser = parseInt(maxTicketsInput.value) || 99999;
      const poolCap = parseInt(maxPoolInput.value) || 0;

      let pool = [];
      for (const [name, donor] of Object.entries(donorTicketsMap)) {
        const activeTickets = Math.min(donor.ticketsActive, maxPerUser);
        for (let i = 0; i < activeTickets; i++) {
          pool.push(name);
        }
      }

      // If pool cap is set (> 0), limit total entries
      if (poolCap > 0 && pool.length > poolCap) {
        pool = pool.slice(0, poolCap);
      }

      return pool;
    }

    function setPoolPreset(val) {
      maxPoolInput.value = val;
      updateGiveawayStatsUI();
    }

    function updateGiveawayStatsUI() {
      const pool = getActiveTicketPool();
      const uniqueDonorsCount = Object.keys(donorTicketsMap).length;
      giveawayStatsEl.innerHTML = `Biljetter: <b>${pool.length}</b> | Givare: <b>${uniqueDonorsCount}</b>`;
      giveawaySubTitleEl.innerText = `TOTALT ${pool.length} TICKETS`;
    }

    // --- Helper Timer Cleanup ---
    function stopAllTimers() {
      if (giveawayHoldTimeout) { clearTimeout(giveawayHoldTimeout); giveawayHoldTimeout = null; }
      if (spinAnimationTimeout) { clearTimeout(spinAnimationTimeout); spinAnimationTimeout = null; }
      if (headerCountdownInterval) { clearInterval(headerCountdownInterval); headerCountdownInterval = null; }
      if (widgetFadeoutTimeout) { clearTimeout(widgetFadeoutTimeout); widgetFadeoutTimeout = null; }
    }

    // --- Spin & Continuous Reel Logic ---
    function startGiveawaySpin() {
      if (isSpinningReel) return;
      const ticketPool = getActiveTicketPool();
      if (ticketPool.length === 0) return alert("Inga biljetter i potten ännu!");
      executeReelSpinAnimation(10000);
    }

    function executeReelSpinAnimation(holdDelayMs = 10000) {
      const ticketPool = getActiveTicketPool();
      if (ticketPool.length === 0) return;

      stopAllTimers();

      // Ensure widget is visible on start/spin
      giveawayWidgetEl.classList.remove('faded-out');

      isSpinningReel = true;

      // Determine Winner
      const winningTicketIndex = Math.floor(Math.random() * ticketPool.length);
      const winnerName = ticketPool[winningTicketIndex];
      currentDrawnWinner = winnerName;

      // Continuous Transition Setup:
      const centerIdx = currentWinnerIndexInList;
      const visibleFive = [
        activeSpinList[centerIdx - 2] || ticketPool[0],
        activeSpinList[centerIdx - 1] || ticketPool[0],
        activeSpinList[centerIdx]     || ticketPool[0], // Active visible name
        activeSpinList[centerIdx + 1] || ticketPool[0],
        activeSpinList[centerIdx + 2] || ticketPool[0],
      ];

      // Build new spin list starting seamlessly from visible names
      const newSpinList = [...visibleFive];
      for (let i = 0; i < 30; i++) {
        newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]);
      }
      newSpinList.push(winnerName); // Main winner target
      newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]); // Padding below
      newSpinList.push(ticketPool[Math.floor(Math.random() * ticketPool.length)]);

      activeSpinList = newSpinList;
      currentWinnerIndexInList = newSpinList.length - 3;

      // Reset list offset seamlessly
      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = activeSpinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');

      // Force DOM Reflow
      void reelTrackEl.offsetHeight;

      // Countdown timer logic using precise Date math
      const endTime = Date.now() + holdDelayMs;

      const updateTimerUI = () => {
        const remainingMs = Math.max(0, endTime - Date.now());
        const remainingSec = Math.ceil(remainingMs / 1000);
        if (remainingSec > 0) {
          giveawayTimerEl.innerText = `STARTAR OM ${remainingSec}S`;
        } else {
          giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";
        }
      };

      updateTimerUI();
      headerCountdownInterval = setInterval(() => {
        updateTimerUI();
        if (Date.now() >= endTime) {
          clearInterval(headerCountdownInterval);
          headerCountdownInterval = null;
        }
      }, 100);

      // Trigger Spin Animation
      giveawayHoldTimeout = setTimeout(() => {
        giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";

        const targetY = -(currentWinnerIndexInList - 2) * ITEM_HEIGHT;
        const spinDuration = 11000;

        reelTrackEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.1, 0.75, 0.25, 1)`;
        reelTrackEl.style.transform = `translateY(${targetY}px)`;

        spinAnimationTimeout = setTimeout(() => {
          isSpinningReel = false;
          giveawayTimerEl.innerText = "VINNARE DRAGEN! 🎉";
          
          const items = reelTrackEl.children;
          if (items[currentWinnerIndexInList]) {
            items[currentWinnerIndexInList].classList.add('is-winner');
          }

          // FADE OUT WIDGET 5 SECONDS AFTER WINNER IS DRAWN
          widgetFadeoutTimeout = setTimeout(() => {
            giveawayWidgetEl.classList.add('faded-out');
          }, 5000);

        }, spinDuration + 100);
      }, holdDelayMs);
    }

    function skipWinner() {
      // Fast skip with 5 second timer delay
      isSpinningReel = false;
      executeReelSpinAnimation(5000);
    }

    function claimAndDeleteTicket() {
      if (currentDrawnWinner && donorTicketsMap[currentDrawnWinner]) {
        if (donorTicketsMap[currentDrawnWinner].ticketsActive > 0) {
          donorTicketsMap[currentDrawnWinner].ticketsActive -= 1;
        }
      }
      updateGiveawayStatsUI();
      saveTicketsToStorage();
      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
    }

    function loadFiftyTestNames() {
      const sampleBaseNames = ["GamerGud", "Matilda99", "PixelPappa", "KaffeLoover", "NinjaBullen", "KattKungen", "ZeldaFan88", "MidsommarSvensken"];
      donorTicketsMap = {}; // Reset to clean 250+ tickets

      // Generates 50 donors with 5 active tickets each = 250 Total Tickets
      for (let i = 1; i <= 50; i++) {
        const base = sampleBaseNames[i % sampleBaseNames.length];
        const name = `${base}_${i}`;
        donorTicketsMap[name] = { totalAmount: 1000, ticketsEarned: 5, ticketsActive: 5 };
      }

      saveTicketsToStorage();
      updateGiveawayStatsUI();
      alert("250 biljetter (50 givare x 5 biljetter) inlästa!");
    }

    // --- Draggable Panel Logic ---
    function makePanelDraggable() {
      if (!testPanelEl || !panelHeaderEl) return;

      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      const onMouseMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        testPanelEl.style.left = `${initialLeft + dx}px`;
        testPanelEl.style.top = `${initialTop + dy}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      panelHeaderEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = testPanelEl.offsetLeft;
        initialTop = testPanelEl.offsetTop;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // --- Event Listeners ---
    document.getElementById('btnSpin').addEventListener('click', startGiveawaySpin);
    document.getElementById('btnSkip').addEventListener('click', skipWinner);
    document.getElementById('btnClaim').addEventListener('click', claimAndDeleteTicket);
    document.getElementById('btnLoadTest').addEventListener('click', loadFiftyTestNames);
    
    maxTicketsInput.addEventListener('input', updateGiveawayStatsUI);
    maxPoolInput.addEventListener('input', updateGiveawayStatsUI);

    // --- Initialization ---
    makePanelDraggable();
    loadTicketsFromStorage();
    setInterval(loadTicketsFromStorage, 2000);
  </script>
</body>
</html>
