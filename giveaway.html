<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Giveaway Wheel Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ace600; /* Lime Green */
      --secondary-color: #00ff88;
      --giveaway-color: #ffea00;
      --danger-color: #ff0055;
      --text-white: #ffffff;
      --bg-dark: rgba(0, 0, 0, 0.94);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --item-height: 43px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-white);
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary-color);
      padding: 12px;
      border-radius: 10px;
      color: var(--text-white);
      z-index: 999999;
      width: 340px;
      font-size: 12px;
      box-shadow: 0 10px 30px var(--shadow-dark);
    }

    .test-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--secondary-color);
      text-transform: uppercase;
      cursor: move;
      user-select: none;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .widget-version-badge {
      font-size: 9px;
      background: var(--secondary-color);
      color: #000;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 900;
    }

    .panel-stats {
      font-size: 11px;
      color: var(--primary-color);
      margin: 6px 0;
    }

    .panel-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .control-row label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.8);
    }

    .control-row input {
      background: #111;
      border: 1px solid var(--secondary-color);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    .mode-indicator {
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 4px;
    }

    .mode-indicator.real-mode {
      background: rgba(0, 255, 136, 0.2);
      color: var(--secondary-color);
      border: 1px solid var(--secondary-color);
    }

    .mode-indicator.test-mode {
      background: rgba(255, 234, 0, 0.2);
      color: var(--giveaway-color);
      border: 1px solid var(--giveaway-color);
    }

    .quick-presets {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn {
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      font-family: inherit;
      transition: opacity 0.2s ease, transform 0.1s ease;
      text-align: center;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn-lime { background: var(--primary-color); color: #000; }
    .btn-yellow { background: var(--giveaway-color); color: #000; }
    .btn-red { background: var(--danger-color); color: #fff; }
    .btn-green { background: var(--secondary-color); color: #000; }
    .btn-small { padding: 3px 8px; font-size: 9px; }

    /* 🎁 GIVEAWAY REEL WIDGET */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 370px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .giveaway-widget.faded-out {
      opacity: 0;
      visibility: hidden;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
    }

    .giveaway-head-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      text-shadow: 0 2px 10px var(--shadow-dark);
    }

    .giveaway-sub-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      opacity: 0.9;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .giveaway-timer-badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(172, 230, 0, 0.15);
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .reel-viewport {
      position: relative;
      width: 100%;
      height: 215px;
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.4) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.4) 80%,
        rgba(0, 0, 0, 0.05) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.4) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.4) 80%,
        rgba(0, 0, 0, 0.05) 100%
      );
    }

    .reel-viewport::before, 
    .reel-viewport::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary-color) 25px, var(--primary-color) calc(100% - 25px), transparent 100%);
      box-shadow: 0 0 10px rgba(172, 230, 0, 0.8);
      z-index: 10;
    }

    .reel-viewport::before { top: 86px; }  
    .reel-viewport::after  { top: 129px; } 

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      color: #ffffff;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .reel-item.is-winner {
      color: var(--primary-color) !important;
      text-shadow: 0 0 18px rgba(172, 230, 0, 1) !important;
    }
  </style>
</head>
<body>

  <!-- CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">
      <span>🎁 GIVEAWAY CONTROL <span class="widget-version-badge">v3.2</span></span>
      <span style="font-size: 9px; opacity: 0.7;">DRAG ME</span>
    </h4>
    
    <div id="modeIndicator" class="mode-indicator real-mode">🟢 LÄGE: RIKTIGA BÖSSAN</div>
    <div class="panel-stats" id="giveawayStats">Biljetter: <b>0</b> | Givare: <b>0</b></div>

    <!-- TICKET & POOL SETTINGS -->
    <div class="panel-controls">
      <!-- REAL BÖSSA INTEGRATION -->
      <div class="control-row">
        <label for="bossaSlugInput">Bössa URL/ID:</label>
        <input type="text" id="bossaSlugInput" value="our2ndhome" placeholder="our2ndhome" style="width: 130px;">
      </div>
      <button id="btnFetchBossa" class="btn btn-green btn-small" style="width: 100%; margin-top: 2px;">🔄 Hämta från Bössan</button>

      <!-- MANUAL DONOR INPUT -->
      <div class="control-row" style="margin-top: 6px;">
        <input type="text" id="manualNameInput" placeholder="Namn (t.ex. gregerlukt)" style="flex:2;">
        <input type="number" id="manualAmountInput" placeholder="Kr (400)" style="flex:1; width:50px;">
        <button id="btnAddManual" class="btn btn-lime btn-small">+ Lägg till</button>
      </div>

      <!-- TEST MODE TOGGLES -->
      <div class="control-row" style="margin-top: 6px;">
        <button id="btnSwitchTest" class="btn btn-yellow btn-small" style="width: 100%;">🎲 Växla till Testläge (Dummy-data)</button>
      </div>

      <div id="testControlsContainer" style="display: none; flex-direction: column; gap: 4px; margin-top: 4px;">
        <div class="control-row">
          <label for="targetTicketCount">Totalt biljetter (Test):</label>
          <input type="number" id="targetTicketCount" value="250" min="1" style="width:60px;">
        </div>
        <div class="quick-presets">
          <span style="font-size: 9px; color: #888; align-self: center;">Sätt:</span>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(50)">50</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(100)">100</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(250)">250</button>
          <button class="btn btn-green btn-small" onclick="setTargetTicketPreset(500)">500</button>
        </div>
      </div>

      <button id="btnResetZero" class="btn btn-red btn-small" style="margin-top: 6px;">🗑️ Nollställ allt till 0</button>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="panel-actions">
      <button id="btnStart" class="btn btn-lime">▶️ Starta Giveaway</button>
      <button id="btnSkip" class="btn btn-yellow">⏭️ Skip (Omstart 5s)</button>
      <button id="btnClose" class="btn btn-red">✖️ Stäng & Radera Vinnarbiljett</button>
    </div>
  </div>

  <!-- GIVEAWAY REEL WIDGET -->
  <div class="giveaway-widget faded-out" id="giveawayWidget">
    <div class="giveaway-title-container">
      <div class="giveaway-head-title">🎁 GIVEAWAY</div>
      <div class="giveaway-sub-title" id="giveawaySubTitle">TOTALT 0 TICKETS</div>
      <div class="giveaway-timer-badge" id="giveawayHeaderTimer">REDO FÖR DRAGNING</div>
    </div>
    <div class="reel-viewport">
      <div class="reel-track" id="reelTrack"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const TICKET_MILESTONE_KR = 200; // 1 ticket per 200 kr
    const MAX_TICKETS_PER_USER = 5;
    const ITEM_HEIGHT = 43;

    let donorTicketsMap = {};
    let currentDrawnWinner = null;
    let isSpinningReel = false;
    let isTestMode = false;
    let currentVisibleFive = null; // Stores currently displayed 5 names for zero-jump skip

    let activeSpinList = [];
    let giveawayHoldTimeout = null;
    let headerCountdownInterval = null;
    let spinAnimationTimeout = null;

    // --- DOM Elements ---
    const testPanelEl = document.getElementById('testPanel');
    const panelHeaderEl = document.getElementById('panelDragHeader');
    const giveawayWidgetEl = document.getElementById('giveawayWidget');
    const giveawayStatsEl = document.getElementById('giveawayStats');
    const giveawaySubTitleEl = document.getElementById('giveawaySubTitle');
    const giveawayTimerEl = document.getElementById('giveawayHeaderTimer');
    const reelTrackEl = document.getElementById('reelTrack');
    const bossaSlugInput = document.getElementById('bossaSlugInput');
    const manualNameInput = document.getElementById('manualNameInput');
    const manualAmountInput = document.getElementById('manualAmountInput');
    const targetTicketsInput = document.getElementById('targetTicketCount');
    const maxTicketsInput = document.getElementById('maxTicketsPerUser');
    const modeIndicatorEl = document.getElementById('modeIndicator');
    const testControlsContainer = document.getElementById('testControlsContainer');

    // --- Fetch Real Musikhjälpen Bössa Data ---
    async function fetchRealBossaData() {
      let rawSlug = bossaSlugInput.value.trim();
      if (!rawSlug) return alert("Ange ett giltigt Böss-ID eller URL!");

      // Extract slug from full URL if pasted
      const slug = rawSlug.replace(/.*bossan\.musikhjalpen\.se\//, '').replace(/\/.*/, '').trim();
      const targetUrl = `https://bossan.musikhjalpen.se/${slug}`;

      try {
        // Fetch via CORS Proxy
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();

        if (data && data.contents) {
          parseBossaHTML(data.contents);
          switchToRealMode();
          alert(`Hämtat data från Bössan (${slug})!`);
        } else {
          alert("Kunde inte läsa in Bössan.");
        }
      } catch (err) {
        console.error("Fel vid hämtning av Bössan:", err);
        alert("Kunde inte kontakta Bössan. Använd manuell tilläggning eller testläge.");
      }
    }

    // Parse HTML content from Musikhjälpen Bössa
    function parseBossaHTML(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      
      const newMap = {};

      // Match donation text entries (e.g. "gregerlukt gav 400 kr")
      const regex = /([a-zA-Z0-9_\-åäöÅÄÖ\s]+?)\s+gav\s+([\d\s]+)\s*kr/gi;
      let match;
      
      while ((match = regex.exec(htmlText)) !== null) {
        let name = match[1].trim();
        let amount = parseInt(match[2].replace(/\s+/g, '')) || 0;

        if (name && name.toLowerCase() !== "en hemlig hjälte" && amount > 0) {
          let tickets = Math.min(MAX_TICKETS_PER_USER, Math.max(1, Math.floor(amount / TICKET_MILESTONE_KR)));
          
          if (!newMap[name]) {
            newMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
          } else {
            newMap[name].totalAmount += amount;
            newMap[name].ticketsEarned = Math.min(MAX_TICKETS_PER_USER, Math.floor(newMap[name].totalAmount / TICKET_MILESTONE_KR));
            newMap[name].ticketsActive = newMap[name].ticketsEarned;
          }
        }
      }

      if (Object.keys(newMap).length > 0) {
        donorTicketsMap = newMap;
        saveTicketsToStorage();
        updateGiveawayStatsUI();
        initReelTrack();
      }
    }

    function addManualDonor() {
      const name = manualNameInput.value.trim();
      const amount = parseInt(manualAmountInput.value) || 200;

      if (!name) return alert("Ange ett namn!");

      let tickets = Math.min(MAX_TICKETS_PER_USER, Math.max(1, Math.floor(amount / TICKET_MILESTONE_KR)));

      if (!donorTicketsMap[name]) {
        donorTicketsMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
      } else {
        donorTicketsMap[name].totalAmount += amount;
        donorTicketsMap[name].ticketsEarned = Math.min(MAX_TICKETS_PER_USER, Math.floor(donorTicketsMap[name].totalAmount / TICKET_MILESTONE_KR));
        donorTicketsMap[name].ticketsActive = donorTicketsMap[name].ticketsEarned;
      }

      manualNameInput.value = "";
      manualAmountInput.value = "";

      saveTicketsToStorage();
      updateGiveawayStatsUI();
      initReelTrack();
    }

    // --- Switch Modes ---
    function switchToRealMode() {
      isTestMode = false;
      modeIndicatorEl.className = "mode-indicator real-mode";
      modeIndicatorEl.innerText = "🟢 LÄGE: RIKTIGA BÖSSAN";
      testControlsContainer.style.display = "none";
      loadTicketsFromStorage();
    }

    function switchToTestMode() {
      isTestMode = true;
      modeIndicatorEl.className = "mode-indicator test-mode";
      modeIndicatorEl.innerText = "🎲 LÄGE: TESTLÄGE (DUMMY-DATA)";
      testControlsContainer.style.display = "flex";
      generateRandomizedDonors(parseInt(targetTicketsInput.value) || 250, parseInt(maxTicketsInput.value) || 5);
      updateGiveawayStatsUI();
      initReelTrack();
    }

    function resetEverythingToZero() {
      stopAllTimers();
      isSpinningReel = false;
      donorTicketsMap = {};
      currentDrawnWinner = null;
      currentVisibleFive = null;
      saveTicketsToStorage();
      updateGiveawayStatsUI();
      initReelTrack();
      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
      giveawayWidgetEl.classList.add('faded-out');
    }

    // --- Dynamic Test Generator ---
    function generateRandomizedDonors(totalTicketsTarget, maxPerUser = 5) {
      const prefixes = ["Kaffe", "Pixel", "Ninja", "Katt", "Zelda", "Gamer", "Dunder", "Bacon", "Norrlands", "Glada"];
      const suffixes = ["Kungen", "Gud", "Bullen", "Loover", "Pappa", "Mamma", "Svensken", "Master", "Viking", "Räven"];

      const namePool = [];
      for (const p of prefixes) {
        for (const s of suffixes) namePool.push(p + s);
      }
      for (let i = namePool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [namePool[i], namePool[j]] = [namePool[j], namePool[i]];
      }

      const newDonorMap = {};
      let remainingTickets = Math.max(1, totalTicketsTarget);
      let donorIndex = 0;

      while (remainingTickets > 0) {
        const tickets = Math.min(remainingTickets, Math.floor(Math.random() * maxPerUser) + 1);
        const name = namePool[donorIndex % namePool.length];
        newDonorMap[name] = { totalAmount: tickets * 200, ticketsEarned: tickets, ticketsActive: tickets };
        remainingTickets -= tickets;
        donorIndex++;
      }

      donorTicketsMap = newDonorMap;
      saveTicketsToStorage();
    }

    // --- Storage Sync ---
    function loadTicketsFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) donorTicketsMap = JSON.parse(saved);
      } catch (err) {}
      updateGiveawayStatsUI();
    }

    function saveTicketsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch (err) {}
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY_DONORS) loadTicketsFromStorage();
    });

    function getWeightedTicketPool() {
      const pool = [];
      for (const [name, donor] of Object.entries(donorTicketsMap)) {
        for (let i = 0; i < (donor.ticketsActive || 0); i++) pool.push(name);
      }
      return pool;
    }

    function getUniqueDonorNames() {
      return Object.keys(donorTicketsMap).filter(name => (donorTicketsMap[name].ticketsActive || 0) > 0);
    }

    function setTargetTicketPreset(val) {
      targetTicketsInput.value = val;
      if (isTestMode) {
        generateRandomizedDonors(val, parseInt(maxTicketsInput.value) || 5);
        updateGiveawayStatsUI();
        initReelTrack();
      }
    }

    function updateGiveawayStatsUI() {
      const pool = getWeightedTicketPool();
      const uniqueDonorsCount = getUniqueDonorNames().length;
      giveawayStatsEl.innerHTML = `Biljetter: <b>${pool.length}</b> | Givare: <b>${uniqueDonorsCount}</b>`;
      giveawaySubTitleEl.innerText = `TOTALT ${pool.length} TICKETS`;
    }

    // --- Build Clean Reel Track (Guarantees NO Adjacent Duplicate Names & ZERO Jump on Skip) ---
    function createCleanReelTrack(winnerName, startingFive = null) {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) return { spinList: [winnerName], winnerIndex: 0 };

      const spinList = [];
      let lastAdded = "";

      const getNextDistinctName = () => {
        if (uniqueNames.length === 1) return uniqueNames[0];
        let candidate;
        let attempts = 0;
        do {
          candidate = uniqueNames[Math.floor(Math.random() * uniqueNames.length)];
          attempts++;
        } while (candidate === lastAdded && attempts < 30);
        return candidate;
      };

      // If startingFive is provided (from previous spin end), use them for index 0..4 to eliminate visual jumps!
      if (startingFive && startingFive.length === 5) {
        for (let i = 0; i < 5; i++) {
          spinList.push(startingFive[i]);
          lastAdded = startingFive[i];
        }
      } else {
        for (let i = 0; i < 5; i++) {
          const name = getNextDistinctName();
          spinList.push(name);
          lastAdded = name;
        }
      }

      // Fill up to index 75
      for (let i = spinList.length; i < 75; i++) {
        const name = getNextDistinctName();
        spinList.push(name);
        lastAdded = name;
      }

      // Winner at index 75
      const winnerIndex = 75;
      spinList.push(winnerName);
      lastAdded = winnerName;

      // Padding below winner
      for (let i = 0; i < 4; i++) {
        const name = getNextDistinctName();
        spinList.push(name);
        lastAdded = name;
      }

      return { spinList, winnerIndex };
    }

    // --- Initial Reel Population ---
    function initReelTrack() {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) {
        reelTrackEl.innerHTML = '<div class="reel-item">INGA BILJETTER</div>';
        return;
      }

      activeSpinList = [];
      let lastAdded = "";
      for (let i = 0; i < 5; i++) {
        let name = uniqueNames[i % uniqueNames.length];
        if (name === lastAdded && uniqueNames.length > 1) {
          name = uniqueNames[(i + 1) % uniqueNames.length];
        }
        activeSpinList.push(name);
        lastAdded = name;
      }

      currentVisibleFive = [...activeSpinList];

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = activeSpinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
    }

    // --- Dynamic 2.0X Proximity Scaling Loop ---
    function updateItemProximityScaling() {
      if (!reelTrackEl) return;

      const style = window.getComputedStyle(reelTrackEl);
      const matrix = new DOMMatrix(style.transform);
      const currentY = matrix.m42;
      const viewportCenter = 215 / 2; // 107.5px

      const children = reelTrackEl.children;
      for (let i = 0; i < children.length; i++) {
        const item = children[i];
        const itemCenter = (i * ITEM_HEIGHT) + (ITEM_HEIGHT / 2) + currentY;
        const dist = Math.abs(itemCenter - viewportCenter);
        
        const normDist = Math.min(1, dist / viewportCenter);

        // 2.0X Scale at Center Line
        const scale = 0.65 + 1.35 * Math.pow(1 - normDist, 1.8);
        const opacity = 0.2 + 0.8 * Math.pow(1 - normDist, 2);

        item.style.transform = `scale(${scale.toFixed(3)})`;
        item.style.opacity = opacity.toFixed(3);
      }

      requestAnimationFrame(updateItemProximityScaling);
    }

    // --- Timer Cleanup ---
    function stopAllTimers() {
      if (giveawayHoldTimeout) { clearTimeout(giveawayHoldTimeout); giveawayHoldTimeout = null; }
      if (spinAnimationTimeout) { clearTimeout(spinAnimationTimeout); spinAnimationTimeout = null; }
      if (headerCountdownInterval) { clearInterval(headerCountdownInterval); headerCountdownInterval = null; }
    }

    // --- 1. START GIVEAWAY ---
    function startGiveawaySpin() {
      if (isSpinningReel) return;
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return alert("Inga biljetter i potten ännu!");

      giveawayWidgetEl.classList.remove('faded-out');
      executeReelSpinAnimation(10000);
    }

    // --- 2. SKIP (REROLL) ---
    function skipWinner() {
      giveawayWidgetEl.classList.remove('faded-out');
      isSpinningReel = false;
      executeReelSpinAnimation(5000); // Fast 5s reroll directly from active name
    }

    // --- 3. CLOSE & CLAIM GIVEAWAY ---
    function closeAndClaimGiveaway() {
      stopAllTimers();
      isSpinningReel = false;

      if (currentDrawnWinner && donorTicketsMap[currentDrawnWinner]) {
        if (donorTicketsMap[currentDrawnWinner].ticketsActive > 0) {
          donorTicketsMap[currentDrawnWinner].ticketsActive -= 1;
        }
      }

      saveTicketsToStorage();
      updateGiveawayStatsUI();

      giveawayTimerEl.innerText = "REDO FÖR DRAGNING";
      giveawayWidgetEl.classList.add('faded-out');
    }

    // --- Core Reel Spin Animation ---
    function executeReelSpinAnimation(holdDelayMs = 10000) {
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return;

      stopAllTimers();
      isSpinningReel = true;

      // Pick winning ticket
      const winningIndex = Math.floor(Math.random() * ticketPool.length);
      const winnerName = ticketPool[winningIndex];
      currentDrawnWinner = winnerName;

      // Create clean reel track using currentVisibleFive to prevent visual jumps
      const { spinList, winnerIndex } = createCleanReelTrack(winnerName, currentVisibleFive);
      activeSpinList = spinList;

      // Seamless positioning reset at 0px
      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = spinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');

      void reelTrackEl.offsetHeight; // Force reflow

      // Countdown Timer Math
      const endTime = Date.now() + holdDelayMs;

      const updateTimerUI = () => {
        const remainingMs = Math.max(0, endTime - Date.now());
        const remainingSec = Math.ceil(remainingMs / 1000);
        if (remainingSec > 0) {
          giveawayTimerEl.innerText = `STARTAR OM ${remainingSec}S`;
        } else {
          giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";
        }
      };

      updateTimerUI();
      headerCountdownInterval = setInterval(() => {
        updateTimerUI();
        if (Date.now() >= endTime) {
          clearInterval(headerCountdownInterval);
          headerCountdownInterval = null;
        }
      }, 100);

      // Trigger Spin Animation
      giveawayHoldTimeout = setTimeout(() => {
        giveawayTimerEl.innerText = "DRAGNING PÅGÅR...";

        const targetY = -(winnerIndex * ITEM_HEIGHT - 86);
        const spinDuration = holdDelayMs <= 5000 ? 5000 : 9000;

        reelTrackEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.12, 0.8, 0.15, 1)`;
        reelTrackEl.style.transform = `translateY(${targetY}px)`;

        spinAnimationTimeout = setTimeout(() => {
          isSpinningReel = false;
          giveawayTimerEl.innerText = "VINNARE DRAGEN! 🎉";
          
          const items = reelTrackEl.children;
          if (items[winnerIndex]) {
            items[winnerIndex].classList.add('is-winner');
          }

          // Save the 5 visible items around winner so next spin/skip starts with ZERO jump!
          currentVisibleFive = [
            spinList[winnerIndex - 2] || winnerName,
            spinList[winnerIndex - 1] || winnerName,
            spinList[winnerIndex],
            spinList[winnerIndex + 1] || winnerName,
            spinList[winnerIndex + 2] || winnerName
          ];
        }, spinDuration + 100);
      }, holdDelayMs);
    }

    // --- Draggable Panel ---
    function makePanelDraggable() {
      if (!testPanelEl || !panelHeaderEl) return;

      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      const onMouseMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        testPanelEl.style.left = `${initialLeft + dx}px`;
        testPanelEl.style.top = `${initialTop + dy}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      panelHeaderEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = testPanelEl.offsetLeft;
        initialTop = testPanelEl.offsetTop;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // --- Event Listeners ---
    document.getElementById('btnStart').addEventListener('click', startGiveawaySpin);
    document.getElementById('btnSkip').addEventListener('click', skipWinner);
    document.getElementById('btnClose').addEventListener('click', closeAndClaimGiveaway);
    document.getElementById('btnFetchBossa').addEventListener('click', fetchRealBossaData);
    document.getElementById('btnAddManual').addEventListener('click', addManualDonor);
    document.getElementById('btnSwitchTest').addEventListener('click', switchToTestMode);
    document.getElementById('btnResetZero').addEventListener('click', resetEverythingToZero);

    // --- Initialization ---
    makePanelDraggable();
    loadTicketsFromStorage();
    initReelTrack();
    requestAnimationFrame(updateItemProximityScaling);
    setInterval(loadTicketsFromStorage, 2000);
  </script>
</body>
</html>
