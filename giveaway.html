<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Giveaway Wheel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Realtime Engine -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --text-white: #ffffff;
      --text-dim: #a1a1aa;
      --dock-bg: #0b0b0d;
      --card-bg: #141418;
      --border: #27272a;
      --item-height: 48px;
      --viewport-height: 240px; /* Exactly 5 items visible */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-white);
      user-select: none;
    }

    /* 🔀 HASH ROUTER */
    body.mode-overlay #panelRoot { display: none !important; }
    body.mode-panel #overlayRoot { display: none !important; }

    body.mode-panel {
      background-color: var(--dock-bg);
      overflow-y: auto;
      padding: 10px;
    }

    /* 🎉 CONFETTI CANVAS */
    #victoryCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99992;
    }

    /* 📺 1. STREAM OVERLAY: CLEAN TRANSPARENT (NO BACKGROUND BOX, NO GLOW) */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 680px;
      padding: 10px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
    }

    .giveaway-widget.active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 8px;
    }

    .giveaway-head-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .giveaway-sub-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .giveaway-timer-badge {
      display: block;
      margin-top: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      min-height: 20px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    /* 🎰 REEL VIEWPORT WITH SMOOTH EDGE MASK */
    .reel-viewport {
      position: relative;
      width: 100%;
      height: var(--viewport-height);
      overflow: hidden;
      background: transparent;
      border: none;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.4) 15%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.4) 85%,
        rgba(0, 0, 0, 0) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.4) 15%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.4) 85%,
        rgba(0, 0, 0, 0) 100%
      );
    }

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #ffffff;
      transform-origin: center center;
      will-change: transform, opacity;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    /* CENTER WINNER LOCK (Always prominent) */
    .reel-item.is-winner {
      font-size: 20px !important;
      font-weight: 900 !important;
      color: #ffffff !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95) !important;
    }

    /* PRIZE BANNER (Pure clean white text) */
    .giveaway-prize-display {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
      max-width: 90%;
      min-height: 28px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    /* 🎛️ 2. OBS DOCK CONTROLLER */
    .dock-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111114;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
    }

    .version-badge {
      background: #ffffff;
      color: #000000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
    }

    .status-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #e4e4e7;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin: 0 0 10px 2px;
    }
    .summary-text b { color: #ffffff; }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    input[type="text"], input[type="number"], select {
      background: #121215;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border 0.15s ease;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: #52525b;
    }

    .btn {
      background: #18181c;
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      background: #24242a;
      border-color: #3f3f46;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary-action {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 6px;
      transition: opacity 0.15s ease;
    }
    .btn-primary-action:hover:not(:disabled) { opacity: 0.9; }

    .btn-danger {
      background: #18181c;
      border: 1px solid #ff453a;
      color: #ff453a;
    }
    .btn-danger:hover:not(:disabled) {
      background: #ff453a;
      color: #ffffff;
    }

    .manual-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .manual-row input[name="name"] { flex: 2; }
    .manual-row input[name="amount"] { flex: 1; }
    .manual-row button { flex: 1; margin-bottom: 0; }

    /* 🔍 !biljett Tester Box in Dock */
    .lookup-box {
      background: #121215;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .lookup-output {
      margin-top: 6px;
      font-size: 11px;
      color: #e4e4e7;
      font-weight: 700;
      display: none;
      padding: 6px 8px;
      background: #1a1a20;
      border-radius: 4px;
      border-left: 2px solid #ffffff;
    }
  </style>
</head>
<body>

  <!-- 🎉 CONFETTI CANVAS -->
  <canvas id="victoryCanvas"></canvas>

  <!-- ========================================================
       📺 1. STREAM OVERLAY VIEW (#overlay)
       ======================================================== -->
  <div id="overlayRoot">
    <div class="giveaway-widget" id="giveawayWidget">
      <div class="giveaway-title-container">
        <div class="giveaway-head-title">GIVEAWAY</div>
        <div class="giveaway-sub-title" id="giveawaySubTitle">Totalt 0 biljetter · 0 givare</div>
        <div class="giveaway-timer-badge" id="giveawayHeaderTimer"></div>
      </div>
      
      <div class="reel-viewport">
        <div class="reel-track" id="reelTrack"></div>
      </div>

      <div class="giveaway-prize-display" id="giveawayPrizeDisplay"></div>
    </div>
  </div>

  <!-- ========================================================
       🎛️ 2. OBS CONTROL DOCK (#panel)
       ======================================================== -->
  <div id="panelRoot" class="dock-container">
    <div class="header-box">
      <span class="header-title">GIVEAWAY KONTROLL <span class="version-badge">v7.4</span></span>
      <button class="btn" style="width:auto; margin:0; padding:4px 8px;" onclick="location.reload()">Ladda om</button>
    </div>

    <div class="status-box" id="dockStatusBox">Ansluten till databas...</div>
    <div class="summary-text" id="dockSummaryText"><b>0</b> biljetter fördelade på <b>0</b> givare</div>

    <!-- Prize Input -->
    <div class="control-row">
      <span class="control-label">VINST / PRIS:</span>
      <input type="text" id="prizeInput" placeholder="T.ex. Signerad tröja" style="width: 60%; text-align: right;">
    </div>

    <!-- Sound Preset -->
    <div class="control-row">
      <span class="control-label">VINNARLJUD:</span>
      <select id="soundPresetSelect" style="width: 60%;">
        <option value="hype_win">Level Up / Gold Victory</option>
        <option value="jackpot">Casino Jackpot Fanfare</option>
        <option value="fanfare">Stadium Victory Brass</option>
      </select>
    </div>
    <button class="btn" style="padding:6px; font-size:11px;" onclick="playVictorySound()">Provlyssna vinnarljud</button>

    <!-- 💬 !BILJETT CHAT COMMAND TESTER -->
    <div class="lookup-box">
      <div style="font-size:10px; font-weight:800; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px;">
        🧪 Testa !biljett-kommando (Chat Simulator):
      </div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="searchDonorInput" placeholder="Skriv namn (t.ex. Marcus)..." style="flex:1;">
        <button class="btn" style="width:auto; margin:0; padding:6px 10px;" onclick="testChatCommandSimulator()">Kör</button>
      </div>
      <div id="lookupOutput" class="lookup-output"></div>
    </div>

    <!-- Manual Donor Add (Case-Insensitive) -->
    <div class="manual-row" style="margin-top: 6px;">
      <input type="text" id="manualName" name="name" placeholder="Givarnamn">
      <input type="number" id="manualAmount" name="amount" placeholder="Kr" style="width:65px;" value="200">
      <button class="btn" onclick="addManualDonation()">+ Lägg till</button>
    </div>

    <!-- Actions -->
    <button class="btn" id="btnToggleTest" onclick="toggleTestMode()">Växla till testläge (500 testbiljetter)</button>
    <button class="btn btn-danger" onclick="resetAllTickets()">Nollställ alla biljetter</button>

    <button class="btn-primary-action" id="btnStart" onclick="startDraw(10000)">
      Starta dragning (10s)
    </button>
    <button class="btn" id="btnSkip" onclick="startDraw(5000)">
      Dra ny vinnare (5s)
    </button>
    <button class="btn btn-danger" id="btnClose" onclick="claimPrizeAndClose()">
      Avsluta & dela ut vinst
    </button>
  </div>

  <script>
    const FIREBASE_DATABASE_URL = "https://musikhjalpen-6306e-default-rtdb.europe-west1.firebasedatabase.app";
    const WRITE_SECRET = "Our2ndHomeSecret2026!";
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const STORAGE_KEY_PRIZE = "mh_overlay_prize_text";

    const TICKET_MILESTONE_KR = 200;
    const MAX_TICKETS_PER_USER = 5;
    const ITEM_HEIGHT = 48;
    const VIEWPORT_HEIGHT = 240; // Exactly 5 slots

    const bus = ("BroadcastChannel" in window) ? new BroadcastChannel("mh_giveaway_bus") : null;

    const AUDIO_PRESETS = {
      hype_win: "https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3",
      jackpot: "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3",
      fanfare: "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"
    };

    let donorMap = {};
    let currentWinner = null;
    let isSpinning = false;
    let isTestMode = false;
    let currentVisibleFive = null;

    let holdTimeout = null;
    let countdownInterval = null;
    let claimTimerInterval = null;
    let spinTimeout = null;
    let animFrameId = null;

    let lastTrackY = 0;
    let lastTickedIndex = null;
    let lastTickTime = 0;

    let confettiParticles = [];
    let confettiAnimId = null;

    const hash = window.location.hash.toLowerCase();
    const isPanel = hash.includes('panel') || hash.includes('dock');

    if (isPanel) {
      document.body.classList.add('mode-panel');
    } else {
      document.body.classList.add('mode-overlay');
    }

    const giveawayWidget = document.getElementById('giveawayWidget');
    const giveawaySubTitle = document.getElementById('giveawaySubTitle');
    const giveawayTimerBadge = document.getElementById('giveawayHeaderTimer');
    const giveawayPrizeDisplay = document.getElementById('giveawayPrizeDisplay');
    const prizeInput = document.getElementById('prizeInput');
    const reelTrack = document.getElementById('reelTrack');
    const victoryCanvas = document.getElementById('victoryCanvas');
    const vCtx = victoryCanvas.getContext('2d');
    const soundPresetSelect = document.getElementById('soundPresetSelect');

    const btnStart = document.getElementById('btnStart');
    const btnSkip = document.getElementById('btnSkip');
    const btnClose = document.getElementById('btnClose');

    function resizeCanvas() {
      victoryCanvas.width = window.innerWidth;
      victoryCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    }
    const dbDonorsRef = firebase.database().ref('giveaway_donors');
    const dbActionRef = firebase.database().ref('giveaway_action');
    const dbBossaRef = firebase.database().ref('bossa');

    // ========================================================
    // 🧠 1. CASE-INSENSITIVE CUMULATIVE DONOR ENGINE
    // ========================================================
    function normalizeDonorKey(name) {
      if (!name) return "";
      return name.replace(/^@+/, '').trim().toLowerCase();
    }

    function recordDonation(rawName, amount) {
      if (!rawName || amount < 1) return;
      const cleanName = rawName.replace(/^@+/, '').trim();
      const key = normalizeDonorKey(cleanName);
      if (/anonym|hemlig hjälte/i.test(key)) return;

      if (!donorMap[key]) {
        donorMap[key] = {
          displayName: cleanName,
          totalAmount: 0,
          milestonesClaimed: 0,
          ticketsActive: 0
        };
      }

      const donor = donorMap[key];
      donor.displayName = cleanName;
      donor.totalAmount = (donor.totalAmount || 0) + amount;

      const totalMilestones = Math.floor(donor.totalAmount / TICKET_MILESTONE_KR);
      const newMilestones = totalMilestones - (donor.milestonesClaimed || 0);

      if (newMilestones > 0) {
        donor.ticketsActive = Math.min(MAX_TICKETS_PER_USER, (donor.ticketsActive || 0) + newMilestones);
        donor.milestonesClaimed = totalMilestones;
      }

      saveDonors();
      updateStatsUI();
      syncDonorsToCloud();
    }

    function deductWinnerTicket(winnerKey) {
      if (!winnerKey || !donorMap[winnerKey]) return;
      donorMap[winnerKey].ticketsActive = Math.max(0, (donorMap[winnerKey].ticketsActive || 0) - 1);
      saveDonors();
      updateStatsUI();
      syncDonorsToCloud();
    }

    function getWeightedTicketPool() {
      const pool = [];
      for (const [key, donor] of Object.entries(donorMap)) {
        for (let i = 0; i < (donor.ticketsActive || 0); i++) {
          pool.push(donor.displayName || key);
        }
      }
      return pool;
    }

    function getUniqueDonorNames() {
      return Object.keys(donorMap).filter(k => (donorMap[k].ticketsActive || 0) > 0).map(k => donorMap[k].displayName || k);
    }

    function saveDonors() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorMap));
      } catch (e) {}
    }

    function loadDonors() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) donorMap = JSON.parse(saved);
        const savedPrize = localStorage.getItem(STORAGE_KEY_PRIZE);
        if (savedPrize !== null) setPrizeText(savedPrize, false);
      } catch (e) {}
      updateStatsUI();
      initReelTrack();
    }

    function syncDonorsToCloud() {
      dbDonorsRef.set({
        map: donorMap,
        secret: WRITE_SECRET,
        timestamp: Date.now()
      }).catch(() => {});
    }

    // Auto-bridge from /bossa
    let lastObservedAlertId = 0;
    dbBossaRef.on('value', (snap) => {
      const bData = snap.val();
      if (!bData) return;

      if (bData.alertId && bData.alertId !== lastObservedAlertId) {
        lastObservedAlertId = bData.alertId;

        if (Array.isArray(bData.alerts) && bData.alerts.length > 0) {
          bData.alerts.forEach(item => {
            if (item.donor && item.amount) recordDonation(item.donor, item.amount);
          });
        } else if (bData.donor && bData.diff > 0) {
          recordDonation(bData.donor, bData.diff);
        }
      }
    });

    // Realtime Database Listeners
    dbDonorsRef.on('value', (snap) => {
      const data = snap.val();
      if (data && data.map && !isSpinning) {
        donorMap = data.map;
        saveDonors();
        updateStatsUI();
        initReelTrack();
      }
    });

    dbActionRef.on('value', (snap) => {
      const act = snap.val();
      if (!act) return;

      if (act.type === 'START_SPIN') {
        executeSpin(act.winner, act.delayMs || 10000);
      } else if (act.type === 'CLAIM_CLOSE') {
        finalizeClaimAndHide();
      } else if (act.type === 'UPDATE_PRIZE') {
        setPrizeText(act.prize, false);
      }
    });

    if (bus) {
      bus.onmessage = (e) => {
        const { type, payload } = e.data || {};
        if (type === 'START_SPIN') executeSpin(payload.winner, payload.delayMs);
        if (type === 'CLAIM_CLOSE') finalizeClaimAndHide();
        if (type === 'UPDATE_PRIZE') setPrizeText(payload.prize, false);
      };
    }

    // 💬 TEST !BILJETT SIMULATOR IN DOCK
    function testChatCommandSimulator() {
      const input = document.getElementById('searchDonorInput');
      const box = document.getElementById('lookupOutput');
      if (!input || !box) return;

      const raw = input.value.trim();
      if (!raw) {
        box.style.display = 'block';
        box.innerHTML = `⚠️ Skriv ett namn att testa (t.ex. <code>Marcus</code>)`;
        return;
      }

      const key = normalizeDonorKey(raw);
      const match = donorMap[key];
      box.style.display = 'block';

      if (match) {
        box.innerHTML = `💬 <b>Bot-svar:</b> @${raw} ➔ ${match.displayName} har donerat <b>${match.totalAmount} kr</b> totalt och har <b>${match.ticketsActive}/5</b> aktiva biljetter i giveaway-hjulet! 🎁`;
      } else {
        box.innerHTML = `💬 <b>Bot-svar:</b> @${raw} ➔ Inga biljetter hittades för '${raw}' än. Donera minst 200 kr till bössan för att få din första biljett! 🎟️`;
      }
    }

    // ========================================================
    // 🏷️ PRIZE & SOUNDS
    // ========================================================
    function setPrizeText(text, broadcast = true) {
      const clean = (text || '').trim();
      giveawayPrizeDisplay.innerText = clean ? `Vinst: ${clean}` : '';
      if (prizeInput) prizeInput.value = clean;
      try {
        localStorage.setItem(STORAGE_KEY_PRIZE, clean);
      } catch (e) {}

      if (broadcast) {
        dbActionRef.set({ type: 'UPDATE_PRIZE', prize: clean, secret: WRITE_SECRET });
        if (bus) bus.postMessage({ type: 'UPDATE_PRIZE', payload: { prize: clean } });
      }
    }

    if (prizeInput) {
      prizeInput.addEventListener('input', () => setPrizeText(prizeInput.value, true));
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWheelClick(pitch = 1.0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.016);

        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.016);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.018);
      } catch (e) {}
    }

    function playVictorySound() {
      getAudioContext();
      const preset = soundPresetSelect ? soundPresetSelect.value : 'hype_win';
      const soundSrc = AUDIO_PRESETS[preset] || AUDIO_PRESETS.hype_win;

      try {
        const audio = new Audio(soundSrc);
        audio.volume = 0.55;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    // ========================================================
    // 🎰 SIZING HIERARCHY: Small ➔ Medium ➔ BIG ➔ Medium ➔ Small
    // ========================================================
    function createReelList(winnerName, startingFive = null) {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) return { spinList: [winnerName], winnerIndex: 0 };

      const spinList = [];
      let last = "";

      const pickDifferent = () => {
        if (uniqueNames.length === 1) return uniqueNames[0];
        let chosen;
        let tries = 0;
        do {
          chosen = uniqueNames[Math.floor(Math.random() * uniqueNames.length)];
          tries++;
        } while (chosen === last && tries < 20);
        return chosen;
      };

      // 1. Maintain starting five
      if (startingFive && startingFive.length === 5) {
        for (let i = 0; i < 5; i++) {
          const n = startingFive[i];
          const val = uniqueNames.includes(n) ? n : pickDifferent();
          spinList.push(val);
          last = val;
        }
      }

      // 2. Guarantee EVERY active donor appears multiple times
      const allShuffled = [...uniqueNames].sort(() => Math.random() - 0.5);
      for (const name of allShuffled) {
        if (name !== last) {
          spinList.push(name);
          last = name;
        }
      }

      // 3. Fill the track up to index 110
      const pool = getWeightedTicketPool().sort(() => Math.random() - 0.5);
      let pIdx = 0;

      while (spinList.length < 110) {
        const candidate = pool[pIdx % pool.length] || pickDifferent();
        pIdx++;
        if (candidate !== last || uniqueNames.length === 1) {
          spinList.push(candidate);
          last = candidate;
        }
      }

      // 4. Designate winner index
      const winnerIndex = 110;
      spinList[winnerIndex] = winnerName;
      last = winnerName;

      for (let i = 0; i < 6; i++) {
        spinList.push(pickDifferent());
      }

      return { spinList, winnerIndex };
    }

    function initReelTrack() {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) {
        reelTrack.innerHTML = '<div class="reel-item" style="opacity:0.3;">Väntar på gåvor...</div>';
        return;
      }

      const initial = [];
      for (let i = 0; i < 5; i++) {
        initial.push(uniqueNames[i % uniqueNames.length]);
      }
      currentVisibleFive = [...initial];

      reelTrack.style.transition = 'none';
      reelTrack.style.transform = 'translateY(0px)';
      reelTrack.innerHTML = initial.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      renderProximity(0);
    }

    // 🎯 DYNAMIC 5-TIER CURVE: Small ➔ Medium ➔ BIG ➔ Medium ➔ Small
    function renderProximity(currentY) {
      const viewportCenter = VIEWPORT_HEIGHT / 2; // 120px
      const items = reelTrack.children;
      const count = items.length;
      if (count === 0) return;

      const centerIdx = Math.round((-currentY + viewportCenter - ITEM_HEIGHT / 2) / ITEM_HEIGHT);
      const start = Math.max(0, centerIdx - 3);
      const end = Math.min(count - 1, centerIdx + 3);

      for (let i = 0; i < count; i++) {
        const item = items[i];
        if (i < start || i > end) {
          item.style.opacity = '0.08';
          item.style.transform = 'scale(0.65)';
          continue;
        }

        const itemCenterY = (i * ITEM_HEIGHT) + (ITEM_HEIGHT / 2) + currentY;
        const dist = Math.abs(itemCenterY - viewportCenter);
        const norm = Math.min(1.0, dist / (ITEM_HEIGHT * 2)); // 0.0 at center, 0.5 at medium, 1.0 at small

        // Smooth curve: Center is always scale 1.20, Medium is 0.92, Small is 0.68
        const closeness = Math.max(0, 1.0 - norm);
        const scale = 0.68 + (1.20 - 0.68) * Math.pow(closeness, 1.25);
        const opacity = 0.15 + (1.00 - 0.15) * Math.pow(closeness, 1.4);

        item.style.transform = `scale(${scale.toFixed(3)})`;
        item.style.opacity = opacity.toFixed(3);

        if (norm < 0.15) {
          item.style.fontWeight = '900';
          item.style.color = '#ffffff';
        } else {
          item.style.fontWeight = '700';
          item.style.color = '#ffffff';
        }
      }
    }

    function runAnimationLoop() {
      if (!isSpinning) return;

      const style = window.getComputedStyle(reelTrack);
      const matrix = new DOMMatrix(style.transform);
      const currentY = matrix.m42;
      renderProximity(currentY);

      const centerIdx = Math.floor((-currentY + (VIEWPORT_HEIGHT / 2)) / ITEM_HEIGHT);
      const now = performance.now();

      if (centerIdx !== lastTickedIndex && (now - lastTickTime) > 18) {
        const speed = Math.abs(currentY - lastTrackY);
        const pitch = Math.max(0.75, Math.min(1.35, 0.75 + speed * 0.05));
        playWheelClick(pitch);
        lastTickedIndex = centerIdx;
        lastTickTime = now;
      }
      lastTrackY = currentY;

      animFrameId = requestAnimationFrame(runAnimationLoop);
    }

    function stopTimers() {
      if (holdTimeout) clearTimeout(holdTimeout);
      if (spinTimeout) clearTimeout(spinTimeout);
      if (countdownInterval) clearInterval(countdownInterval);
      if (claimTimerInterval) clearInterval(claimTimerInterval);
      if (animFrameId) cancelAnimationFrame(animFrameId);
      holdTimeout = null;
      spinTimeout = null;
      countdownInterval = null;
      claimTimerInterval = null;
      animFrameId = null;
    }

    // ========================================================
    // 🚀 EXECUTE SPIN & 60-SECOND COUNTDOWN
    // ========================================================
    function startDraw(holdDelayMs = 10000) {
      const pool = getWeightedTicketPool();
      if (pool.length === 0) return alert("Inga biljetter i potten än!");

      getAudioContext();
      const winner = pool[Math.floor(Math.random() * pool.length)];

      dbActionRef.set({
        type: 'START_SPIN',
        winner: winner,
        delayMs: holdDelayMs,
        secret: WRITE_SECRET,
        timestamp: Date.now()
      });
      if (bus) bus.postMessage({ type: 'START_SPIN', payload: { winner, delayMs: holdDelayMs } });

      executeSpin(winner, holdDelayMs);
    }

    function executeSpin(winnerName, holdDelayMs = 10000) {
      getAudioContext();
      stopTimers();
      clearConfetti();

      isSpinning = true;
      currentWinner = winnerName;
      setButtonsLocked(true);

      giveawayWidget.classList.add('active');

      const { spinList, winnerIndex } = createReelList(winnerName, currentVisibleFive);

      reelTrack.style.transition = 'none';
      reelTrack.style.transform = 'translateY(0px)';
      reelTrack.innerHTML = spinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      void reelTrack.offsetHeight;

      renderProximity(0);
      lastTrackY = 0;
      lastTickedIndex = null;

      const endAt = Date.now() + holdDelayMs;
      const tickBadge = () => {
        const leftSec = Math.ceil(Math.max(0, endAt - Date.now()) / 1000);
        giveawayTimerBadge.innerText = leftSec > 0 ? `Startar om ${leftSec}s` : "Dragning pågår...";
      };
      tickBadge();

      countdownInterval = setInterval(() => {
        tickBadge();
        if (Date.now() >= endAt) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }, 200);

      holdTimeout = setTimeout(() => {
        giveawayTimerBadge.innerText = "Dragning pågår...";
        const targetY = -(winnerIndex * ITEM_HEIGHT - 96); // Center on 96px
        const duration = holdDelayMs <= 5000 ? 5500 : 8500;

        reelTrack.style.transition = `transform ${duration}ms cubic-bezier(0.10, 0.85, 0.16, 1)`;
        reelTrack.style.transform = `translateY(${targetY}px)`;

        runAnimationLoop();

        spinTimeout = setTimeout(() => {
          isSpinning = false;
          setButtonsLocked(false);
          stopTimers();

          // ⏱️ 60-SECOND WINNER CLAIM COUNTDOWN
          let claimSec = 60;
          giveawayTimerBadge.innerText = `Vill du behålla eller ge vidare? ${claimSec}s`;

          claimTimerInterval = setInterval(() => {
            claimSec--;
            if (claimSec > 0) {
              giveawayTimerBadge.innerText = `Vill du behålla eller ge vidare? ${claimSec}s`;
            } else {
              giveawayTimerBadge.innerText = "Tiden har gått ut!";
              clearInterval(claimTimerInterval);
              claimTimerInterval = null;
            }
          }, 1000);

          renderProximity(targetY);

          const items = reelTrack.children;
          if (items[winnerIndex]) {
            items[winnerIndex].classList.add('is-winner');
          }

          triggerVictoryEffects();

          currentVisibleFive = [
            spinList[winnerIndex - 2] || winnerName,
            spinList[winnerIndex - 1] || winnerName,
            spinList[winnerIndex],
            spinList[winnerIndex + 1] || winnerName,
            spinList[winnerIndex + 2] || winnerName
          ];
        }, duration + 60);
      }, holdDelayMs);
    }

    function claimPrizeAndClose() {
      if (isSpinning) return;
      if (!currentWinner) return alert("Ingen vinnare dragen än!");

      const winnerKey = normalizeDonorKey(currentWinner);
      deductWinnerTicket(winnerKey);

      dbActionRef.set({ type: 'CLAIM_CLOSE', secret: WRITE_SECRET, timestamp: Date.now() });
      if (bus) bus.postMessage({ type: 'CLAIM_CLOSE' });

      finalizeClaimAndHide();
    }

    function finalizeClaimAndHide() {
      stopTimers();
      clearConfetti();
      isSpinning = false;
      setButtonsLocked(false);

      giveawayWidget.classList.remove('active');

      setTimeout(() => {
        currentWinner = null;
        currentVisibleFive = null;
        initReelTrack();
        giveawayTimerBadge.innerText = "";
      }, 450);
    }

    // ========================================================
    // 🎊 CONFETTI
    // ========================================================
    function triggerVictoryEffects() {
      playVictorySound();
      confettiParticles = [];
      const colors = ['#ffffff', '#e4e4e7', '#a1a1aa'];
      const count = 120;

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2 + (Math.random() * 80 - 40),
          y: window.innerHeight / 2 + (Math.random() * 40 - 20),
          vx: (Math.random() - 0.5) * 22,
          vy: (Math.random() * -16) - 5,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1,
          gravity: 0.42 + Math.random() * 0.2,
          drag: 0.985
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      animateConfetti();
    }

    function animateConfetti() {
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
      let alive = 0;

      for (const p of confettiParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.rotation += p.rotSpeed;

        if (p.y > window.innerHeight * 0.65) p.opacity -= 0.015;

        if (p.opacity > 0 && p.y < window.innerHeight + 50) {
          alive++;
          vCtx.save();
          vCtx.translate(p.x, p.y);
          vCtx.rotate((p.rotation * Math.PI) / 180);
          vCtx.globalAlpha = Math.max(0, p.opacity);
          vCtx.fillStyle = p.color;
          vCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.3);
          vCtx.restore();
        }
      }

      if (alive > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
        confettiAnimId = null;
      }
    }

    function clearConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
    }

    // ========================================================
    // 🎛️ DOCK UI
    // ========================================================
    function updateStatsUI() {
      const pool = getWeightedTicketPool();
      const uniqueCount = getUniqueDonorNames().length;

      const summaryText = document.getElementById('dockSummaryText');
      if (summaryText) {
        summaryText.innerHTML = `<b>${pool.length}</b> biljetter fördelade på <b>${uniqueCount}</b> givare`;
      }

      if (giveawaySubTitle) {
        giveawaySubTitle.innerText = `Totalt ${pool.length} biljetter · ${uniqueCount} givare`;
      }

      const statusBox = document.getElementById('dockStatusBox');
      if (statusBox) {
        statusBox.innerText = isTestMode ? "Testläge aktivt (Simulerade biljetter)" : "Ansluten till databas";
      }
    }

    function setButtonsLocked(locked) {
      if (btnStart) btnStart.disabled = locked;
      if (btnSkip) btnSkip.disabled = locked;
    }

    function addManualDonation() {
      const nameInput = document.getElementById('manualName');
      const amountInput = document.getElementById('manualAmount');

      const name = nameInput.value.trim();
      const amount = parseInt(amountInput.value, 10) || 0;

      if (!name) return alert("Ange ett namn!");
      if (amount <= 0) return alert("Ange ett giltigt belopp!");

      recordDonation(name, amount);

      nameInput.value = "";
      amountInput.value = "200";
    }

    function toggleTestMode() {
      isTestMode = !isTestMode;
      const btn = document.getElementById('btnToggleTest');

      if (isTestMode) {
        btn.innerText = "Avsluta testläge";
        generateTestTickets(500);
      } else {
        btn.innerText = "Växla till testläge (500 testbiljetter)";
        loadDonors();
      }
      updateStatsUI();
      initReelTrack();
    }

    function generateTestTickets(targetTickets = 500) {
      const prefixes = ["Kaffe", "Pixel", "Ninja", "Katt", "Zelda", "Gamer", "Dunder", "Norrlands", "Super", "Mighty", "Cosmic", "Turbo", "Vinter", "Retro", "Hyper", "Cyber"];
      const suffixes = ["Kungen", "Gud", "Bullen", "Loover", "Svensken", "Master", "Viking", "Räven", "Hjälten", "Kompis", "Tiger", "Björn", "Liraren"];

      const testMap = {};
      let remaining = targetTickets;
      let idx = 1;

      while (remaining > 0) {
        const p = prefixes[Math.floor(Math.random() * prefixes.length)];
        const s = suffixes[Math.floor(Math.random() * suffixes.length)];
        const rawName = `${p}${s}_${idx}`;
        const key = normalizeDonorKey(rawName);
        const tickets = Math.min(remaining, Math.floor(Math.random() * MAX_TICKETS_PER_USER) + 1);

        testMap[key] = {
          displayName: rawName,
          totalAmount: tickets * TICKET_MILESTONE_KR,
          milestonesClaimed: tickets,
          ticketsActive: tickets
        };
        remaining -= tickets;
        idx++;
      }

      donorMap = testMap;
      saveDonors();
    }

    function resetAllTickets() {
      if (confirm("Är du säker på att du vill nollställa alla biljetter och givare?")) {
        donorMap = {};
        saveDonors();
        syncDonorsToCloud();
        updateStatsUI();
        initReelTrack();
      }
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, t => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[t] || t));
    }

    loadDonors();
    initReelTrack();
  </script>
