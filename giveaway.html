<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikhjälpen Overlay - Giveaway Wheel Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-white: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.65);
      --bg-panel: rgba(14, 14, 18, 0.97);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --item-height: 44px;
      --viewport-height: 220px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-white);
      user-select: none;
    }

    /* VICTORY CONFETTI CANVAS */
    #victoryCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99992;
    }

    /* 🎛️ CONTROL PANEL */
    .test-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 14px;
      border-radius: 8px;
      color: var(--text-white);
      z-index: 999999;
      width: 350px;
      font-size: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .test-panel.panel-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(-15px) !important;
    }

    /* OBS DOCK MODE */
    body.dock-mode {
      background-color: #0e0e11 !important;
      overflow-y: auto !important;
    }

    body.dock-mode .test-panel {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    body.dock-mode .giveaway-widget,
    body.dock-mode #victoryCanvas {
      display: none !important;
    }

    /* OBS OVERLAY MODE */
    body.overlay-mode .test-panel {
      display: none !important;
    }

    .test-panel h4 {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: var(--text-white);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: grab;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 7px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-panel h4:active { cursor: grabbing; }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #fff;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 800;
      font-family: inherit;
    }

    .icon-btn:hover {
      background: #fff;
      color: #000;
    }

    .widget-version-badge {
      font-size: 9px;
      background: #ffffff;
      color: #000;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 900;
    }

    .panel-stats {
      font-size: 11px;
      color: var(--text-dim);
      margin: 8px 0;
      line-height: 1.4;
    }

    .panel-stats b {
      color: #ffffff;
    }

    .panel-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      padding: 8px;
      border-radius: 6px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .control-row label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .control-row input, .control-row textarea, .control-row select {
      background: #18181b;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    .control-row input:focus, .control-row textarea:focus, .control-row select:focus {
      border-color: #ffffff;
      outline: none;
    }

    .mode-indicator {
      font-size: 10px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .quick-presets {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.3px;
      transition: background 0.15s ease, color 0.15s ease;
      text-align: center;
    }

    .btn:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
    }

    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-white {
      background: #ffffff;
      color: #000000;
      border: none;
    }

    .btn-white:hover:not(:disabled) {
      background: #e4e4e7;
    }

    .btn-danger {
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
    }

    .btn-small { padding: 4px 8px; font-size: 9px; }

    /* 🎁 CLEAN GIVEAWAY REEL WIDGET */
    .giveaway-widget {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 640px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .giveaway-widget.faded-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .giveaway-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
    }

    .giveaway-head-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .giveaway-sub-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .giveaway-timer-badge {
      display: block;
      margin-top: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      min-height: 18px; /* Förhindrar hopp i höjdled när texten dyker upp */
    }

    /* VIEWPORT */
    .reel-viewport {
      position: relative;
      width: 100%;
      height: var(--viewport-height);
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.02) 0%,
        rgba(0, 0, 0, 0.35) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.35) 80%,
        rgba(0, 0, 0, 0.02) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.02) 0%,
        rgba(0, 0, 0, 0.35) 20%,
        rgba(0, 0, 0, 1) 40%,
        rgba(0, 0, 0, 1) 60%,
        rgba(0, 0, 0, 0.35) 80%,
        rgba(0, 0, 0, 0.02) 100%
      );
    }

    .center-focus-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 52px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 5;
    }

    .reel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .reel-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #ffffff;
      transform-origin: center center;
      will-change: transform, opacity;
      transition: font-size 0.3s ease;
    }

    /* STANDOUT WINNER ROW */
    .reel-item.is-winner {
      font-size: 24px !important;
      font-weight: 900 !important;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- VICTORY CONFETTI CANVAS -->
  <canvas id="victoryCanvas"></canvas>

  <!-- CONTROL PANEL -->
  <div class="test-panel" id="testPanel">
    <h4 id="panelDragHeader">
      <span>Kontrollpanel <span class="widget-version-badge">v4.2</span></span>
      <div class="header-icons">
        <button id="btnHidePanel" class="icon-btn" title="Dölj panelen (Tryck 'H')">Göm (H)</button>
      </div>
    </h4>
    
    <div id="modeIndicator" class="mode-indicator">Ansluten till bössan</div>
    <div class="panel-stats" id="giveawayStats">0 biljetter fördelade på 0 givare</div>

    <div class="panel-controls">
      <!-- SOUND SETTINGS -->
      <div class="control-row">
        <label for="soundPresetSelect">Vinnarljud:</label>
        <select id="soundPresetSelect" style="width: 175px;">
          <option value="hype_win">Level Up / Gold Victory</option>
          <option value="jackpot">Casino Jackpot Fanfare</option>
          <option value="fanfare">Stadium Victory Brass</option>
          <option value="custom">Eget ljud (URL / Fil)</option>
        </select>
      </div>
      <div id="customSoundContainer" style="display: none;" class="control-row">
        <input type="text" id="customSoundUrl" placeholder="Filnamn (winner.mp3) eller URL" style="width: 100%;">
      </div>
      <button id="btnTestSound" class="btn btn-small" style="width: 100%;">Provlyssna vinnarljud</button>

      <!-- REAL BÖSSA INTEGRATION -->
      <div class="control-row" style="margin-top: 4px;">
        <label for="bossaSlugInput">Bössa ID:</label>
        <input type="text" id="bossaSlugInput" value="our2ndhome" placeholder="our2ndhome" style="width: 140px;">
      </div>
      <button id="btnFetchBossa" class="btn btn-small" style="width: 100%;">Hämta gåvor från bössan</button>

      <button id="btnTogglePaste" class="btn btn-small" style="width: 100%;">Klistra in gåvor manuellt</button>
      <div id="pasteContainer" style="display: none; flex-direction: column; gap: 4px;">
        <textarea id="pasteTextArea" rows="3" placeholder="Klistra in text här (t.ex: Greger gav 400 kr)" style="width: 100%; font-size: 10px;"></textarea>
        <button id="btnImportPaste" class="btn btn-white btn-small">Importera text</button>
      </div>

      <div class="control-row" style="margin-top: 4px;">
        <input type="text" id="manualNameInput" placeholder="Namn" style="flex:2;">
        <input type="number" id="manualAmountInput" placeholder="Kr" style="flex:1; width:50px;">
        <button id="btnAddManual" class="btn btn-small">+ Lägg till</button>
      </div>

      <div class="control-row" style="margin-top: 4px;">
        <button id="btnSwitchTest" class="btn btn-small" style="width: 100%;">Växla till testläge</button>
      </div>

      <div id="testControlsContainer" style="display: none; flex-direction: column; gap: 6px;">
        <div class="control-row">
          <label for="targetTicketCount">Totalt antal biljetter:</label>
          <input type="number" id="targetTicketCount" value="500" min="1" style="width: 65px;">
        </div>
        <div class="control-row">
          <label for="maxTicketsPerUser">Max per person:</label>
          <input type="number" id="maxTicketsPerUser" value="5" min="1" style="width: 65px;">
        </div>
        <div class="quick-presets">
          <span style="font-size: 9px; color: var(--text-dim); align-self: center;">Snabbval:</span>
          <button class="btn btn-small" onclick="setTargetTicketPreset(50)">50</button>
          <button class="btn btn-small" onclick="setTargetTicketPreset(100)">100</button>
          <button class="btn btn-small" onclick="setTargetTicketPreset(250)">250</button>
          <button class="btn btn-small" onclick="setTargetTicketPreset(500)">500</button>
          <button class="btn btn-small" onclick="setTargetTicketPreset(1000)">1000</button>
        </div>
      </div>

      <button id="btnResetZero" class="btn btn-danger btn-small" style="margin-top: 4px;">Nollställ allt till 0</button>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="panel-actions">
      <button id="btnStart" class="btn btn-white">Starta dragning (10s)</button>
      <button id="btnSkip" class="btn">Dra ny vinnare (5s)</button>
      <button id="btnClose" class="btn btn-danger">Avsluta & dela ut vinst</button>
    </div>
  </div>

  <!-- GIVEAWAY REEL WIDGET -->
  <div class="giveaway-widget faded-out" id="giveawayWidget">
    <div class="giveaway-title-container">
      <div class="giveaway-head-title">GIVEAWAY</div>
      <div class="giveaway-sub-title" id="giveawaySubTitle">Totalt 0 biljetter · 0 givare</div>
      <div class="giveaway-timer-badge" id="giveawayHeaderTimer"></div>
    </div>
    <div class="reel-viewport">
      <div class="center-focus-frame"></div>
      <div class="reel-track" id="reelTrack"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_DONORS = "mh_overlay_donor_tickets";
    const TICKET_MILESTONE_KR = 200;
    const ITEM_HEIGHT = 44;
    const VIEWPORT_HEIGHT = 220;

    const syncChannel = ("BroadcastChannel" in window) ? new BroadcastChannel("mh_giveaway_bus") : null;

    const AUDIO_PRESETS = {
      hype_win: "https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3",
      jackpot: "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3",
      fanfare: "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"
    };

    let donorTicketsMap = {};
    let currentDrawnWinner = null;
    let isSpinningReel = false;
    let isTestMode = false;
    let currentVisibleFive = null;

    let giveawayHoldTimeout = null;
    let headerCountdownInterval = null;
    let spinAnimationTimeout = null;
    let animationFrameId = null;

    let lastTrackY = 0;
    let lastTickedIndex = null;
    let lastTickTimestamp = 0;

    let confettiParticles = [];
    let confettiAnimId = null;

    // DOM Elements
    const testPanelEl = document.getElementById('testPanel');
    const panelHeaderEl = document.getElementById('panelDragHeader');
    const giveawayWidgetEl = document.getElementById('giveawayWidget');
    const giveawayStatsEl = document.getElementById('giveawayStats');
    const giveawaySubTitleEl = document.getElementById('giveawaySubTitle');
    const giveawayTimerEl = document.getElementById('giveawayHeaderTimer');
    const reelTrackEl = document.getElementById('reelTrack');
    const bossaSlugInput = document.getElementById('bossaSlugInput');
    const manualNameInput = document.getElementById('manualNameInput');
    const manualAmountInput = document.getElementById('manualAmountInput');
    const targetTicketsInput = document.getElementById('targetTicketCount');
    const maxTicketsInput = document.getElementById('maxTicketsPerUser');
    const modeIndicatorEl = document.getElementById('modeIndicator');
    const testControlsContainer = document.getElementById('testControlsContainer');
    const pasteContainerEl = document.getElementById('pasteContainer');
    const pasteTextAreaEl = document.getElementById('pasteTextArea');
    const btnStart = document.getElementById('btnStart');
    const btnSkip = document.getElementById('btnSkip');
    const btnClose = document.getElementById('btnClose');
    const victoryCanvas = document.getElementById('victoryCanvas');
    const soundPresetSelect = document.getElementById('soundPresetSelect');
    const customSoundContainer = document.getElementById('customSoundContainer');
    const customSoundUrl = document.getElementById('customSoundUrl');
    const btnTestSound = document.getElementById('btnTestSound');
    const btnHidePanel = document.getElementById('btnHidePanel');
    const vCtx = victoryCanvas.getContext('2d');

    // View Modes (#overlay or #panel)
    function applyViewMode() {
      const hash = window.location.hash.toLowerCase();
      const params = new URLSearchParams(window.location.search);
      const isOverlay = hash.includes('overlay') || params.has('overlay');
      const isDock = hash.includes('panel') || hash.includes('dock') || params.has('panel');

      if (isOverlay) {
        document.body.classList.add('overlay-mode');
      } else if (isDock) {
        document.body.classList.add('dock-mode');
      }
    }
    applyViewMode();

    function togglePanelVisibility() {
      testPanelEl.classList.toggle('panel-hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'h' || e.key === 'H') {
        togglePanelVisibility();
      }
    });
    btnHidePanel.addEventListener('click', togglePanelVisibility);

    function resizeCanvas() {
      victoryCanvas.width = window.innerWidth;
      victoryCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    soundPresetSelect.addEventListener('change', () => {
      customSoundContainer.style.display = soundPresetSelect.value === 'custom' ? 'flex' : 'none';
    });

    btnTestSound.addEventListener('click', () => {
      playModernVictorySound();
    });

    function playModernVictorySound() {
      let soundSrc = AUDIO_PRESETS[soundPresetSelect.value] || AUDIO_PRESETS.hype_win;
      if (soundPresetSelect.value === 'custom') {
        const customUrl = customSoundUrl.value.trim();
        if (customUrl) soundSrc = customUrl;
      }

      try {
        const audio = new Audio(soundSrc);
        audio.volume = 0.85;
        audio.play().catch(err => console.warn("Ljudfel:", err));
      } catch (e) {
        console.error(e);
      }
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWheelClick(pitchMultiplier = 1.0) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520 * pitchMultiplier, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.018);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.02);
    }

    function triggerCleanVictory() {
      playModernVictorySound();

      confettiParticles = [];
      const colors = ['#ffffff', '#e4e4e7', '#a1a1aa'];
      const count = 120;

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2 + (Math.random() * 80 - 40),
          y: window.innerHeight / 2 + (Math.random() * 40 - 20),
          vx: (Math.random() - 0.5) * 22,
          vy: (Math.random() * -16) - 5,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1,
          gravity: 0.42 + Math.random() * 0.2,
          drag: 0.985
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      animateConfetti();
    }

    function animateConfetti() {
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
      let aliveCount = 0;

      for (let p of confettiParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.rotation += p.rotSpeed;

        if (p.y > window.innerHeight * 0.65) {
          p.opacity -= 0.015;
        }

        if (p.opacity > 0 && p.y < window.innerHeight + 50) {
          aliveCount++;
          vCtx.save();
          vCtx.translate(p.x, p.y);
          vCtx.rotate((p.rotation * Math.PI) / 180);
          vCtx.globalAlpha = Math.max(0, p.opacity);
          vCtx.fillStyle = p.color;
          vCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.3);
          vCtx.restore();
        }
      }

      if (aliveCount > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
        confettiAnimId = null;
      }
    }

    function clearVictoryEffects() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      vCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
    }

    // Broadcast Sync
    if (syncChannel) {
      syncChannel.onmessage = (event) => {
        const { type, payload } = event.data;
        if (type === 'START_SPIN') {
          handleStartGiveaway(false);
        } else if (type === 'SKIP_SPIN') {
          handleSkipWinner(false);
        } else if (type === 'CLOSE_CLAIM') {
          handleCloseGiveaway(false);
        } else if (type === 'UPDATE_DONORS') {
          donorTicketsMap = payload.map;
          updateGiveawayStatsUI();
          initReelTrack();
        } else if (type === 'RESET') {
          handleResetEverything(false);
        }
      };
    }

    function broadcastEvent(type, payload = {}) {
      if (syncChannel) syncChannel.postMessage({ type, payload });
    }

    async function fetchRealBossaData() {
      getAudioContext();
      const rawSlug = bossaSlugInput.value.trim();
      if (!rawSlug) return alert("Ange ett giltigt Böss-ID eller URL!");

      const slug = rawSlug.replace(/.*bossan\.musikhjalpen\.se\//, '').replace(/\/.*/, '').trim();
      const targetUrl = `https://bossan.musikhjalpen.se/${slug}`;

      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`
      ];

      let success = false;
      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (!res.ok) continue;

          let htmlText = "";
          if (proxy.includes("allorigins")) {
            const data = await res.json();
            htmlText = data.contents;
          } else {
            htmlText = await res.text();
          }

          if (htmlText && htmlText.length > 500) {
            const newMap = parseTextOrHTMLForDonors(htmlText);
            if (Object.keys(newMap).length > 0) {
              donorTicketsMap = newMap;
              saveTicketsToStorage();
              broadcastEvent('UPDATE_DONORS', { map: donorTicketsMap });
              switchToRealMode();
              success = true;
              alert(`Hämtade ${Object.keys(newMap).length} gåvor från Bössan (${slug})!`);
              break;
            }
          }
        } catch (err) {
          console.warn("Proxy misslyckades:", proxy, err);
        }
      }

      if (!success) {
        alert("Kunde inte hämta automatiskt (CORS-begränsning). Använd 'Klistra in gåvor manuellt'!");
        pasteContainerEl.style.display = "flex";
      }
    }

    function parseTextOrHTMLForDonors(text) {
      const newMap = {};
      const maxCap = parseInt(maxTicketsInput ? maxTicketsInput.value : 5) || 5;
      const regex = /([a-zA-Z0-9_\-åäöÅÄÖ\s]{2,30}?)\s+(?:gav|skänkte|bidrog med)?\s*([\d\s]+)\s*kr/gi;
      let match;

      while ((match = regex.exec(text)) !== null) {
        let rawName = match[1].trim();
        const lines = rawName.split(/\r?\n/);
        let name = lines[lines.length - 1].trim();
        let amount = parseInt(match[2].replace(/\s+/g, '')) || 0;

        const ignoreList = ["en hemlig hjälte", "senaste gåvorna", "musikhjälpen"];
        if (name && !ignoreList.includes(name.toLowerCase()) && amount >= TICKET_MILESTONE_KR) {
          let tickets = Math.min(maxCap, Math.floor(amount / TICKET_MILESTONE_KR));
          if (!newMap[name]) {
            newMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
          } else {
            newMap[name].totalAmount += amount;
            newMap[name].ticketsEarned = Math.min(maxCap, Math.floor(newMap[name].totalAmount / TICKET_MILESTONE_KR));
            newMap[name].ticketsActive = newMap[name].ticketsEarned;
          }
        }
      }
      return newMap;
    }

    function importPastedText() {
      getAudioContext();
      const text = pasteTextAreaEl.value.trim();
      if (!text) return alert("Klistra in texten från din Bössas sida först!");

      const newMap = parseTextOrHTMLForDonors(text);
      const count = Object.keys(newMap).length;

      if (count === 0) {
        return alert("Hittade inga giltiga gåvor (minst 200 kr). Exempel: 'Greger gav 400 kr'");
      }

      donorTicketsMap = newMap;
      saveTicketsToStorage();
      broadcastEvent('UPDATE_DONORS', { map: donorTicketsMap });
      switchToRealMode();
      pasteTextAreaEl.value = "";
      pasteContainerEl.style.display = "none";
      alert(`Importerade ${count} givare!`);
    }

    function addManualDonor() {
      getAudioContext();
      const name = manualNameInput.value.trim();
      const amount = parseInt(manualAmountInput.value) || TICKET_MILESTONE_KR;
      const maxCap = parseInt(maxTicketsInput ? maxTicketsInput.value : 5) || 5;

      if (!name) return alert("Ange ett namn!");
      if (amount < TICKET_MILESTONE_KR) return alert(`Beloppet måste vara minst ${TICKET_MILESTONE_KR} kr för 1 biljett.`);

      let tickets = Math.min(maxCap, Math.floor(amount / TICKET_MILESTONE_KR));

      if (!donorTicketsMap[name]) {
        donorTicketsMap[name] = { totalAmount: amount, ticketsEarned: tickets, ticketsActive: tickets };
      } else {
        donorTicketsMap[name].totalAmount += amount;
        donorTicketsMap[name].ticketsEarned = Math.min(maxCap, Math.floor(donorTicketsMap[name].totalAmount / TICKET_MILESTONE_KR));
        donorTicketsMap[name].ticketsActive = donorTicketsMap[name].ticketsEarned;
      }

      manualNameInput.value = "";
      manualAmountInput.value = "";
      saveTicketsToStorage();
      broadcastEvent('UPDATE_DONORS', { map: donorTicketsMap });
      switchToRealMode();
    }

    function switchToRealMode() {
      isTestMode = false;
      modeIndicatorEl.innerText = "Ansluten till bössan";
      testControlsContainer.style.display = "none";
      updateGiveawayStatsUI();
      initReelTrack();
    }

    function switchToTestMode() {
      getAudioContext();
      isTestMode = true;
      modeIndicatorEl.innerText = "Testläge aktivt";
      testControlsContainer.style.display = "flex";
      generateRandomizedDonors(
        parseInt(targetTicketsInput.value) || 500,
        parseInt(maxTicketsInput.value) || 5
      );
      updateGiveawayStatsUI();
      initReelTrack();
      broadcastEvent('UPDATE_DONORS', { map: donorTicketsMap });
    }

    function handleResetEverything(shouldBroadcast = true) {
      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = false;
      donorTicketsMap = {};
      currentDrawnWinner = null;
      currentVisibleFive = null;
      saveTicketsToStorage();
      updateGiveawayStatsUI();
      initReelTrack();
      setButtonLock(false);
      giveawayTimerEl.innerText = ""; // Ingen redo-text
      giveawayWidgetEl.classList.add('faded-out');
      if (shouldBroadcast) broadcastEvent('RESET');
    }

    // Dynamisk slumpgenerator utan tak
    function generateRandomizedDonors(totalTicketsTarget, maxPerUser = 5) {
      const prefixes = ["Kaffe", "Pixel", "Ninja", "Katt", "Zelda", "Gamer", "Dunder", "Bacon", "Norrlands", "Glada", "Super", "Mighty", "Cosmic", "Turbo", "Vinter", "Retro", "Hyper", "Snabb", "Mystic", "Cyber"];
      const suffixes = ["Kungen", "Gud", "Bullen", "Loover", "Pappa", "Mamma", "Svensken", "Master", "Viking", "Räven", "Hjälten", "Kompis", "Vännen", "Tiger", "Björn", "Stjärnan", "Bonden", "Riddarn", "Tomten", "Liraren"];

      const newDonorMap = {};
      let remaining = Math.max(1, totalTicketsTarget);
      let donorIndex = 1;

      while (remaining > 0) {
        const p = prefixes[Math.floor(Math.random() * prefixes.length)];
        const s = suffixes[Math.floor(Math.random() * suffixes.length)];
        
        let name = `${p}${s}`;
        if (newDonorMap[name]) {
          name = `${p}${s}_${donorIndex}`;
        }

        const tickets = Math.min(remaining, Math.floor(Math.random() * maxPerUser) + 1);
        newDonorMap[name] = {
          totalAmount: tickets * TICKET_MILESTONE_KR,
          ticketsEarned: tickets,
          ticketsActive: tickets
        };
        remaining -= tickets;
        donorIndex++;
      }

      donorTicketsMap = newDonorMap;
      saveTicketsToStorage();
    }

    function loadTicketsFromStorage() {
      if (isSpinningReel) return;
      try {
        const saved = localStorage.getItem(STORAGE_KEY_DONORS);
        if (saved) donorTicketsMap = JSON.parse(saved);
      } catch (err) {}
      updateGiveawayStatsUI();
    }

    function saveTicketsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_DONORS, JSON.stringify(donorTicketsMap));
      } catch (err) {}
    }

    function getWeightedTicketPool() {
      const pool = [];
      for (const [name, donor] of Object.entries(donorTicketsMap)) {
        for (let i = 0; i < (donor.ticketsActive || 0); i++) pool.push(name);
      }
      return pool;
    }

    function getUniqueDonorNames() {
      return Object.keys(donorTicketsMap).filter(name => (donorTicketsMap[name].ticketsActive || 0) > 0);
    }

    function setTargetTicketPreset(val) {
      targetTicketsInput.value = val;
      if (isTestMode) {
        generateRandomizedDonors(val, parseInt(maxTicketsInput.value) || 5);
        updateGiveawayStatsUI();
        initReelTrack();
        broadcastEvent('UPDATE_DONORS', { map: donorTicketsMap });
      }
    }

    // Uppdaterad till: Totalt X biljetter · Y givare
    function updateGiveawayStatsUI() {
      const pool = getWeightedTicketPool();
      const uniqueDonorsCount = getUniqueDonorNames().length;
      
      giveawayStatsEl.innerHTML = `<b>${pool.length}</b> biljetter fördelade på <b>${uniqueDonorsCount}</b> givare`;
      giveawaySubTitleEl.innerText = `Totalt ${pool.length} biljetter · ${uniqueDonorsCount} givare`;
    }

    function setButtonLock(locked) {
      btnStart.disabled = locked;
      btnSkip.disabled = locked;
    }

    // Bygger rullen så att 100% av givarna syns
    function createCleanReelTrack(winnerName, startingFive = null) {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) return { spinList: [winnerName], winnerIndex: 0 };

      const spinList = [];
      let lastAdded = "";

      if (startingFive && startingFive.length === 5) {
        for (let i = 0; i < 5; i++) {
          spinList.push(startingFive[i]);
          lastAdded = startingFive[i];
        }
      }

      // Alla unika givare garanteras att vara med i rullen
      const allDonorsShuffled = [...uniqueNames].sort(() => Math.random() - 0.5);
      for (const name of allDonorsShuffled) {
        if (name !== lastAdded) {
          spinList.push(name);
          lastAdded = name;
        }
      }

      // Fyll på med viktade biljetter upp till index 115
      const weightedPool = getWeightedTicketPool().sort(() => Math.random() - 0.5);
      let poolIdx = 0;

      while (spinList.length < 115) {
        const candidate = weightedPool[poolIdx % weightedPool.length] || uniqueNames[Math.floor(Math.random() * uniqueNames.length)];
        poolIdx++;
        if (candidate !== lastAdded || uniqueNames.length === 1) {
          spinList.push(candidate);
          lastAdded = candidate;
        }
      }

      const winnerIndex = 115;
      spinList[winnerIndex] = winnerName;
      lastAdded = winnerName;

      for (let i = 0; i < 5; i++) {
        const next = uniqueNames[Math.floor(Math.random() * uniqueNames.length)];
        spinList.push(next);
      }

      return { spinList, winnerIndex };
    }

    function initReelTrack() {
      const uniqueNames = getUniqueDonorNames();
      if (uniqueNames.length === 0) {
        reelTrackEl.innerHTML = '<div class="reel-item">Väntar på gåvor...</div>';
        return;
      }

      const initialList = [];
      for (let i = 0; i < 5; i++) {
        initialList.push(uniqueNames[i % uniqueNames.length]);
      }
      currentVisibleFive = [...initialList];

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = initialList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      renderItemProximity(0);
    }

    function renderItemProximity(currentY) {
      const viewportCenter = VIEWPORT_HEIGHT / 2;
      const children = reelTrackEl.children;
      const count = children.length;
      if (count === 0) return;

      const centerItemIdx = Math.round((-currentY + viewportCenter - ITEM_HEIGHT / 2) / ITEM_HEIGHT);
      const startIdx = Math.max(0, centerItemIdx - 4);
      const endIdx = Math.min(count - 1, centerItemIdx + 4);

      for (let i = startIdx; i <= endIdx; i++) {
        const item = children[i];
        const itemCenter = (i * ITEM_HEIGHT) + (ITEM_HEIGHT / 2) + currentY;
        const dist = Math.abs(itemCenter - viewportCenter);
        const normDist = Math.min(1, dist / viewportCenter);

        const scale = 0.75 + 0.95 * Math.pow(1 - normDist, 1.5);
        const opacity = 0.22 + 0.78 * Math.pow(1 - normDist, 1.8);

        item.style.transform = `scale(${scale.toFixed(3)})`;
        item.style.opacity = opacity.toFixed(3);
      }
    }

    function runAnimationLoop() {
      if (!isSpinningReel) return;

      const style = window.getComputedStyle(reelTrackEl);
      const matrix = new DOMMatrix(style.transform);
      const currentY = matrix.m42;
      renderItemProximity(currentY);

      const centerItemIdx = Math.floor((-currentY + (VIEWPORT_HEIGHT / 2)) / ITEM_HEIGHT);
      const now = performance.now();
      
      if (centerItemIdx !== lastTickedIndex && (now - lastTickTimestamp) > 18) {
        const speed = Math.abs(currentY - lastTrackY);
        const pitch = Math.max(0.75, Math.min(1.35, 0.75 + speed * 0.05));
        playWheelClick(pitch);
        lastTickedIndex = centerItemIdx;
        lastTickTimestamp = now;
      }
      lastTrackY = currentY;

      animationFrameId = requestAnimationFrame(runAnimationLoop);
    }

    function stopAllTimers() {
      if (giveawayHoldTimeout) clearTimeout(giveawayHoldTimeout);
      if (spinAnimationTimeout) clearTimeout(spinAnimationTimeout);
      if (headerCountdownInterval) clearInterval(headerCountdownInterval);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      giveawayHoldTimeout = null;
      spinAnimationTimeout = null;
      headerCountdownInterval = null;
      animationFrameId = null;
    }

    function handleStartGiveaway(shouldBroadcast = true) {
      getAudioContext();
      if (isSpinningReel) return;
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return alert("Inga biljetter i potten än!");

      clearVictoryEffects();
      giveawayWidgetEl.classList.remove('faded-out');
      executeReelSpinAnimation(10000);

      if (shouldBroadcast) broadcastEvent('START_SPIN');
    }

    function handleSkipWinner(shouldBroadcast = true) {
      getAudioContext();
      clearVictoryEffects();
      giveawayWidgetEl.classList.remove('faded-out');
      stopAllTimers();
      isSpinningReel = false;
      executeReelSpinAnimation(5000);

      if (shouldBroadcast) broadcastEvent('SKIP_SPIN');
    }

    function handleCloseGiveaway(shouldBroadcast = true) {
      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = false;
      setButtonLock(false);

      if (currentDrawnWinner && donorTicketsMap[currentDrawnWinner]) {
        if (donorTicketsMap[currentDrawnWinner].ticketsActive > 0) {
          donorTicketsMap[currentDrawnWinner].ticketsActive -= 1;
        }
      }

      currentDrawnWinner = null;
      saveTicketsToStorage();
      updateGiveawayStatsUI();

      giveawayTimerEl.innerText = ""; // Ingen redo-text
      giveawayWidgetEl.classList.add('faded-out');

      if (shouldBroadcast) broadcastEvent('CLOSE_CLAIM');
    }

    function executeReelSpinAnimation(holdDelayMs = 10000) {
      const ticketPool = getWeightedTicketPool();
      if (ticketPool.length === 0) return;

      stopAllTimers();
      clearVictoryEffects();
      isSpinningReel = true;
      setButtonLock(true);

      const winningIndex = Math.floor(Math.random() * ticketPool.length);
      const winnerName = ticketPool[winningIndex];
      currentDrawnWinner = winnerName;

      const { spinList, winnerIndex } = createCleanReelTrack(winnerName, currentVisibleFive);

      reelTrackEl.style.transition = 'none';
      reelTrackEl.style.transform = 'translateY(0px)';
      reelTrackEl.innerHTML = spinList.map(name => `<div class="reel-item">${escapeHTML(name)}</div>`).join('');
      void reelTrackEl.offsetHeight;

      renderItemProximity(0);
      lastTrackY = 0;
      lastTickedIndex = null;

      // Nedräkningstext: Startar om Xs
      const endTime = Date.now() + holdDelayMs;
      const updateTimerUI = () => {
        const remainingSec = Math.ceil(Math.max(0, endTime - Date.now()) / 1000);
        giveawayTimerEl.innerText = remainingSec > 0 ? `Startar om ${remainingSec}s` : "Dragning pågår...";
      };

      updateTimerUI();
      headerCountdownInterval = setInterval(() => {
        updateTimerUI();
        if (Date.now() >= endTime) {
          clearInterval(headerCountdownInterval);
          headerCountdownInterval = null;
        }
      }, 200);

      // Startar dragningen: Dragning pågår...
      giveawayHoldTimeout = setTimeout(() => {
        giveawayTimerEl.innerText = "Dragning pågår...";
        const targetY = -(winnerIndex * ITEM_HEIGHT - 88);
        const spinDuration = holdDelayMs <= 5000 ? 5500 : 8500;

        reelTrackEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.08, 0.85, 0.15, 1)`;
        reelTrackEl.style.transform = `translateY(${targetY}px)`;

        runAnimationLoop();

        spinAnimationTimeout = setTimeout(() => {
          isSpinningReel = false;
          setButtonLock(false);
          stopAllTimers();

          // Vinnartext: Vill du behålla eller ge vidare?
          giveawayTimerEl.innerText = "Vill du behålla eller ge vidare?";
          renderItemProximity(targetY);

          const items = reelTrackEl.children;
          if (items[winnerIndex]) {
            items[winnerIndex].classList.add('is-winner');
          }

          triggerCleanVictory();

          currentVisibleFive = [
            spinList[winnerIndex - 2] || winnerName,
            spinList[winnerIndex - 1] || winnerName,
            spinList[winnerIndex],
            spinList[winnerIndex + 1] || winnerName,
            spinList[winnerIndex + 2] || winnerName
          ];
        }, spinDuration + 50);
      }, holdDelayMs);
    }

    function makePanelDraggable() {
      if (!testPanelEl || !panelHeaderEl) return;
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      const onMouseMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const maxLeft = window.innerWidth - testPanelEl.offsetWidth - 10;
        const maxTop = window.innerHeight - testPanelEl.offsetHeight - 10;

        testPanelEl.style.left = `${Math.max(10, Math.min(maxLeft, initialLeft + dx))}px`;
        testPanelEl.style.top = `${Math.max(10, Math.min(maxTop, initialTop + dy))}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      panelHeaderEl.addEventListener('mousedown', (e) => {
        if (document.body.classList.contains('dock-mode')) return;
        getAudioContext();
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = testPanelEl.offsetLeft;
        initialTop = testPanelEl.offsetTop;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Event Listeners
    btnStart.addEventListener('click', () => handleStartGiveaway(true));
    btnSkip.addEventListener('click', () => handleSkipWinner(true));
    btnClose.addEventListener('click', () => handleCloseGiveaway(true));
    document.getElementById('btnFetchBossa').addEventListener('click', fetchRealBossaData);
    document.getElementById('btnAddManual').addEventListener('click', addManualDonor);
    document.getElementById('btnSwitchTest').addEventListener('click', switchToTestMode);
    document.getElementById('btnResetZero').addEventListener('click', () => handleResetEverything(true));

    document.getElementById('btnTogglePaste').addEventListener('click', () => {
      pasteContainerEl.style.display = pasteContainerEl.style.display === "none" ? "flex" : "none";
    });
    document.getElementById('btnImportPaste').addEventListener('click', importPastedText);

    // Init
    makePanelDraggable();
    loadTicketsFromStorage();
    initReelTrack();
    setInterval(loadTicketsFromStorage, 4000);
  </script>
</body>
</html>
