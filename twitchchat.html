<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Chat Widget</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', "Roobert", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }

        .chat-card {
            display: inline-block;
            width: fit-content;
            height: auto;
            max-width: min(1200px, calc(100% - 40px));
            max-height: 200px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.90);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 18px;
            line-height: 1.5;
            color: #efeff1;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .chat-badges { display: inline; }

        .chat-badge {
            display: inline-block;
            vertical-align: -3px;
            height: 18px;
            width: 18px;
            margin-right: 4px;
            border-radius: 2px;
        }

        .chat-username {
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .chat-colon {
            color: #efeff1;
            font-weight: 700;
            margin-right: 6px;
        }

        .chat-message {
            display: inline;
            font-weight: 400;
            color: #efeff1;
        }

        .chat-message.is-action {
            font-style: italic;
        }

        .chat-message img.emote {
            vertical-align: middle;
            height: 28px;
            margin: -4px 2px;
        }

        .animate-in { animation: popIn 0.30s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-out { animation: slideOut 0.30s cubic-bezier(0.7, 0, 0.84, 0) forwards; }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-12px) scale(0.98); }
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script>
        const BASE_DISPLAY_TIME = 3000;
        const FAST_DISPLAY_TIME = 1500;
        const ANIMATION_DURATION = 300;
        const PAUSE_BETWEEN_MSGS = 200;
        const MAX_QUEUE_LIMIT = 15;

        const IGNORED_BOTS = new Set([
            'nightbot',
            'streamelements',
            'streamlabs',
            'moobot',
            'fossabot',
            'wizebot',
            'o2ndh'
        ]);

        const BADGE_MAP = {
            'broadcaster': 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
            'moderator': 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
            'vip': 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
            'founder': 'https://static-cdn.jtvnw.net/badges/v1/511b78a9-ab37-472f-9569-457753bbe7d3/1',
            'partner': 'https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/1',
            'premium': 'https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a598-423e-86d0-f9fb98ca1933/1',
            'turbo': 'https://static-cdn.jtvnw.net/badges/v1/bd444ec6-8f34-4bf9-91f4-af1e3428d80f/1',
            'staff': 'https://static-cdn.jtvnw.net/badges/v1/d97c37bd-a6f5-4c38-8f57-4e4bef88af34/1',
            'artist-badge': 'https://static-cdn.jtvnw.net/badges/v1/4300a897-03dc-4e83-8c0e-c332fee7057f/1',
            'subscriber': 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4adfae661/1'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const channel = (urlParams.get('channel') || 'our2ndhome').toLowerCase().trim();

        const messageQueue = [];
        let isDisplaying = false;
        let ws = null;
        let reconnectTimer = null;

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectToTwitch();
            }, 3000);
        }

        function connectToTwitch() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                return;
            }

            try {
                ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
            } catch (e) {
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                const randomId = Math.floor(10000 + Math.random() * 90000);
                ws.send('PASS SCHMOOPIIE');
                ws.send(`NICK justinfan${randomId}`);
                ws.send(`JOIN #${channel}`);
            };

            ws.onmessage = (event) => {
                const lines = (event.data || '').split('\r\n');
                for (const line of lines) {
                    if (!line) continue;
                    if (line.startsWith('PING')) {
                        ws.send('PONG :tmi.twitch.tv');
                        continue;
                    }
                    if (line.includes(` PRIVMSG #${channel} `)) {
                        parseTwitchMessage(line);
                    }
                }
            };

            ws.onclose = () => scheduleReconnect();
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        function ensureReadableColor(hex) {
            if (!/^#[0-9a-fA-F]{6}$/.test(hex || '') || hex.toLowerCase() === '#000000') {
                return '#a970ff';
            }
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;

            if (luminance < 75) {
                const mix = 0.45;
                const lr = Math.min(255, Math.round(r + (255 - r) * mix));
                const lg = Math.min(255, Math.round(g + (255 - g) * mix));
                const lb = Math.min(255, Math.round(b + (255 - b) * mix));
                return `rgb(${lr}, ${lg}, ${lb})`;
            }
            return hex;
        }

        function unescapeIrcTag(val) {
            return String(val || '')
                .replace(/\\s/g, ' ')
                .replace(/\\:/g, ';')
                .replace(/\\\\/g, '\\');
        }

        function parseTwitchMessage(raw) {
            if (!raw || !raw.startsWith('@')) return;
            const spaceIdx = raw.indexOf(' ');
            if (spaceIdx === -1) return;

            const rawTags = raw.slice(1, spaceIdx);
            const rest = raw.slice(spaceIdx + 1);

            const tags = {};
            rawTags.split(';').forEach(tag => {
                const eq = tag.indexOf('=');
                if (eq !== -1) tags[tag.slice(0, eq)] = unescapeIrcTag(tag.slice(eq + 1));
            });

            const marker = `PRIVMSG #${channel} :`;
            const msgIdx = rest.indexOf(marker);
            if (msgIdx === -1) return;

            let text = rest.slice(msgIdx + marker.length);
            if (text.startsWith('!')) return;

            // Skip automated alert/utmaning announcements echoed by your bot
            if (text.includes('our2ndHomeL') && text.includes('our2ndHomeR')) return;

            const nickMatch = rest.match(/^:([^!@ ]+)!/);
            const loginNick = nickMatch ? nickMatch[1] : '';
            const username = (tags['display-name'] || loginNick || 'User').trim();

            if (IGNORED_BOTS.has((loginNick || username).toLowerCase())) return;

            let isAction = false;
            const actionMatch = text.match(/^\x01ACTION (.*)\x01$/);
            if (actionMatch) {
                isAction = true;
                text = actionMatch[1];
            }

            const color = ensureReadableColor(tags['color']);
            const badgesHtml = parseBadges(tags['badges']);
            const messageHtml = parseEmotes(text, tags['emotes']);

            messageQueue.push({
                name: username,
                color: color,
                badges: badgesHtml,
                html: messageHtml,
                isAction: isAction
            });

            if (messageQueue.length > MAX_QUEUE_LIMIT) {
                messageQueue.shift();
            }

            if (!isDisplaying) {
                showNextMessage();
            }
        }

        function parseBadges(badgesTag) {
            if (!badgesTag) return '';
            let badgesHtml = '';
            const items = badgesTag.split(',');
            for (const item of items) {
                const badgeName = item.split('/')[0];
                if (BADGE_MAP[badgeName]) {
                    badgesHtml += `<img class="chat-badge" src="${BADGE_MAP[badgeName]}" alt="" onerror="this.remove()">`;
                }
            }
            return badgesHtml;
        }

        // Slices by Unicode code points (Array.from) to match Twitch IRC emote offsets with emojis
        function parseEmotes(text, emotesTag) {
            if (!emotesTag) return escapeHtml(text);

            const chars = Array.from(text);
            const emoteRanges = [];

            emotesTag.split('/').forEach(item => {
                const [id, ranges] = item.split(':');
                if (!id || !ranges) return;
                ranges.split(',').forEach(range => {
                    const [start, end] = range.split('-').map(Number);
                    if (!Number.isNaN(start) && !Number.isNaN(end) && start >= 0 && end >= start) {
                        emoteRanges.push({ id, start, end });
                    }
                });
            });

            emoteRanges.sort((a, b) => a.start - b.start);

            let result = '';
            let lastIndex = 0;

            for (const { id, start, end } of emoteRanges) {
                if (start < lastIndex || start >= chars.length) continue;

                result += escapeHtml(chars.slice(lastIndex, start).join(''));
                const safeEnd = Math.min(end, chars.length - 1);
                const emoteName = chars.slice(start, safeEnd + 1).join('');
                const safeId = encodeURIComponent(id);
                const emoteUrl = `https://static-cdn.jtvnw.net/emoticons/v2/${safeId}/default/dark/2.0`;

                result += `<img class="emote" src="${emoteUrl}" alt="${escapeHtml(emoteName)}" onerror="this.replaceWith(document.createTextNode(this.alt || ''))">`;
                lastIndex = safeEnd + 1;
            }

            result += escapeHtml(chars.slice(lastIndex).join(''));
            return result;
        }

        function showNextMessage() {
            if (messageQueue.length === 0) {
                isDisplaying = false;
                return;
            }

            isDisplaying = true;
            const msg = messageQueue.shift();
            const currentDuration = messageQueue.length > 2 ? FAST_DISPLAY_TIME : BASE_DISPLAY_TIME;
            const container = document.getElementById('chat-container');

            container.innerHTML = `
                <div class="chat-card animate-in">
                    <span class="chat-badges">${msg.badges}</span>
                    <span class="chat-username" style="color: ${msg.color}">${escapeHtml(msg.name)}</span>${msg.isAction ? ' ' : '<span class="chat-colon">:</span>'}
                    <span class="chat-message ${msg.isAction ? 'is-action' : ''}">${msg.html}</span>
                </div>
            `;

            setTimeout(() => {
                const card = container.querySelector('.chat-card');
                if (card) {
                    card.classList.remove('animate-in');
                    card.classList.add('animate-out');
                }

                setTimeout(() => {
                    container.innerHTML = '';
                    setTimeout(showNextMessage, PAUSE_BETWEEN_MSGS);
                }, ANIMATION_DURATION);

            }, currentDuration);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        connectToTwitch();
    </script>
</body>
</html>
